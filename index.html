.note,.bar{display:none}[contenteditable]:hover,[contenteditable]:focus{background:none}.page{margin:0;box-shadow:none;width:auto;min-height:auto;padding:10mm 12mm}.memo{min-height:20mm}.memo .lines{height:10mm}h2{margin:10px 0 6px}.kpis{margin:10px 0}.page{zoom:.94}@page{size:A4;margin:0}}
@media screen and (max-width:820px){.page{width:auto;min-height:auto;margin:12px 16px;padding:16px}.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;background:#1f2430;color:#fff;font-size:13px}.bar button{border:0;background:#2f5bea;color:#fff;border-radius:8px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}[contenteditable]{outline:none;border-radius:4px}[contenteditable]:hover{background:#fffbe8}[contenteditable]:focus{background:#fff8d6}
.note{margin:16px}.kpis{grid-template-columns:repeat(2,1fr)}.two,.weak{grid-template-columns:1fr}}
</head>`;
function openCounselReport(name, stu, rows, RS){
  const L=rows[rows.length-1], P=rows.length>1?rows[rows.length-2]:null;
  const to100=o=>o.tp?o.r.score/o.tp*100:o.r.score, f1=v=>(Math.round(v*10)/10).toString();
  const br=L.r.branch, teacher=teacherOf(L.r,rosterSync(br,roundKey(L.ex)))||'', cls=stu?stu.class_name:L.r.class_name;
  const g=engGrade(L.r.score,L.ex), pg=P?engGrade(P.r.score,P.ex):null;
  const dScore=P?to100(L)-to100(P):null, dAvg=to100(L)-(L.tp?L.avgBr/L.tp*100:L.avgBr);
  const arrow=(d,unit,inv)=>d==null?'':(Math.abs(d)<0.05?`<span>변화 없음</span>`:`<span class="${(inv?-d:d)>0?'up':'down'}">${d>0?'▲':'▼'} ${f1(Math.abs(d))}${unit}</span>`);
  const topPct=L.nBr?Math.max(1,Math.round(L.rankBr/L.nBr*100)):0;
  // 점수 변화 (최근 6회)
  const T=rows.slice(-6), n=T.length, X=i=>n===1?212:60+i*(310/(n-1)), Y=v=>146-(v-40)/60*126;
  const clampY=v=>Y(Math.max(40,Math.min(100,v)));
  const my=T.map(to100), av=T.map(o=>o.tp?o.avgBr/o.tp*100:o.avgBr);
  const chart=`<svg viewBox="0 0 400 170" style="width:100%"><g stroke="#eef0f3">${[100,80,60,40].map(v=>`<line x1="34" x2="390" y1="${Y(v)}" y2="${Y(v)}"/>`).join('')}</g>
    <g font-size="10" fill="#6b7280" text-anchor="end">${[100,80,60,40].map(v=>`<text x="28" y="${Y(v)+3}">${v}</text>`).join('')}</g>
    ${n>1?`<polyline fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4" points="${av.map((v,i)=>X(i)+','+clampY(v)).join(' ')}"/><polyline fill="none" stroke="#2f5bea" stroke-width="2.5" points="${my.map((v,i)=>X(i)+','+clampY(v)).join(' ')}"/>`:''}
    ${my.map((v,i)=>`<circle cx="${X(i)}" cy="${clampY(v)}" r="4" fill="#2f5bea"/><text x="${X(i)}" y="${clampY(v)-9}" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2430">${Math.round(v)}</text>`).join('')}
    ${T.map((o,i)=>`<text x="${X(i)}" y="164" font-size="10" fill="#6b7280" text-anchor="middle">${esc(fmtYM(o.date).slice(2)||'-')}</text>`).join('')}</svg>`;
  // 영역별 정답률 (누적) + 분원 평균
  const me={}, bb={};
  rows.forEach(o=>{ Object.entries(o.cs).forEach(([c,v])=>{ me[c]=me[c]||{ok:0,n:0}; me[c].ok+=v.ok; me[c].n+=v.n; });
    o.all.filter(x=>x.branch===o.r.branch).forEach(x=>Object.entries(catScores(o.ex,x.answers)).forEach(([c,v])=>{ bb[c]=bb[c]||{ok:0,n:0}; bb[c].ok+=v.ok; bb[c].n+=v.n; })); });
  const cats=Object.keys(me).sort((a,b)=>CATS.indexOf(a)-CATS.indexOf(b));
  const minCat=cats.slice().sort((a,b)=>pct(me[a].ok,me[a].n)-pct(me[b].ok,me[b].n))[0];
  const bars=cats.map(c=>{ const v=pct(me[c].ok,me[c].n), a=bb[c]?pct(bb[c].ok,bb[c].n):null;
    return `<div class="row"><span class="name">${esc(c)}</span><div class="track"><div class="fill" style="width:${v}%;background:${CAT_COLORS[c]||'#94a3b8'}"></div>${a!=null?`<i class="avg" style="left:${a}%"></i>`:''}</div><span class="pct"${c===minCat?' style="color:#c0262d"':''}>${v}%</span></div>`; }).join('');
  // 약한 세부 유형 TOP3 (2문항 이상 본 유형 중 정답률 낮은 순)
  const agg={};
  rows.forEach(o=>o.ex.items.forEach((it,i)=>{ const k=(it.cat||'미지정')+'|'+(it.sub||it.cat||''); const a=agg[k]=agg[k]||{cat:it.cat||'미지정',sub:it.sub||it.cat||'',ok:0,n:0}; a.n++; if(isOk(o.r.answers[i],it)) a.ok++; }));
  let weak=Object.values(agg).filter(a=>a.n>=2&&a.ok<a.n).sort((a,b)=>pct(a.ok,a.n)-pct(b.ok,b.n)||b.n-a.n).slice(0,3);
  if(!weak.length) weak=Object.values(agg).filter(a=>a.ok<a.n).sort((a,b)=>pct(a.ok,a.n)-pct(b.ok,b.n)).slice(0,3);
  const wk=weak.map((a,i)=>`<div class="wk"><div class="rank">${i+1}순위</div><div class="t">${esc(a.sub)}</div><div class="s">${esc(a.cat)} · 누적 정답률 ${pct(a.ok,a.n)}% · ${a.n}문항 중 ${a.ok}개</div><div class="tip" contenteditable="true">${esc(COUNSEL_TIPS[a.cat]||'틀린 문제를 다시 풀며 근거를 찾는 연습을 하고 있어요.')}</div></div>`).join('');
  // 최근 시험 기록 (최근 3회)
  const recent=rows.slice(-3).reverse().map(o=>{ const wrong=o.ex.items.filter((it,i)=>!isOk(o.r.answers[i],it)).map(it=>it.no);
    return `<tr><td class="l">${esc(o.ex.name)}</td><td><b>${o.r.score}</b><span style="color:#6b7280">/${o.tp}</span></td><td>${engGrade(o.r.score,o.ex)}</td><td>${f1(o.avgBr)}</td><td>${o.rankBr} / ${o.nBr}</td><td class="l">${wrong.length?wrong.join(', '):'없음'}</td></tr>`; }).join('');
  const goal=Math.min(L.tp||100, Math.ceil((L.r.score+5)/5)*5);
  const today=new Date(), ymd=`${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
  const html=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(name)} 상담 리포트</title><style>${COUNSEL_CSS}</style></head><body>
  <div class="bar">노란색으로 바뀌는 글은 눌러서 고칠 수 있어요 <button onclick="window.print()">인쇄 / PDF 저장</button></div>
  <div class="page">
    <div class="top"><div><h1>모의고사 성적 상담 리포트</h1>
      <div class="who"><b style="color:#1f2430;font-size:15px">${esc(name)}</b> · ${esc(gradeLabel(stu)||normGrade(L.ex.grade)||'')}${cls?' · '+esc(cls):''}${teacher?' · 담임 '+esc(teacher):''}</div></div>
      <div class="acad"><b>${esc(br)} 정상어학원</b>기준 시험: ${esc(L.ex.name)} · 출력 ${ymd}</div></div>
    <div class="kpis">
      <div class="kpi main"><div class="l">이번 점수</div><div class="v">${L.r.score}<small> / ${L.tp}</small></div><div class="d">${P?`${arrow(L.tp===P.tp?L.r.score-P.r.score:dScore,'점')} 지난 시험 ${P.r.score}점`:'첫 시험'}</div></div>
      <div class="kpi"><div class="l">이번 등급</div><div class="v">${g}<small>등급</small></div><div class="d">${P?`${arrow(pg-g,'등급')} 지난 시험 ${pg}등급`:'&nbsp;'}</div></div>
      <div class="kpi"><div class="l">분원 평균과 비교</div><div class="v">${dAvg>=0?'+':''}${f1(dAvg)}<small>점</small></div><div class="d">분원 평균 ${f1(L.avgBr)}점</div></div>
      <div class="kpi"><div class="l">분원 석차</div><div class="v">${L.rankBr}<small> / ${L.nBr}명</small></div><div class="d">상위 ${topPct}%</div></div>
    </div>
    <div class="two">
      <div><h2>점수 변화</h2><div class="box">${chart}<div class="legend">— ${esc(name)} · - - 분원 평균 (100점 기준)</div></div></div>
      <div><h2>영역별 정답률 <span style="font-weight:400;font-size:11px;color:#6b7280">(누적, │ = 분원 평균)</span></h2><div class="box bars">${bars}</div></div>
    </div>
    ${wk?`<h2>집중해서 보완할 유형 TOP ${weak.length}</h2><div class="weak">${wk}</div>`:''}
    <h2>최근 시험 기록</h2>
    <table><thead><tr><th>시험</th><th>점수</th><th>등급</th><th>분원 평균</th><th>분원 석차</th><th>틀린 문항</th></tr></thead><tbody>${recent}</tbody></table>
    <h2>다음 시험까지 할 것</h2>
    <ol class="plan box" style="padding-left:28px;margin:0" contenteditable="true">
      ${weak[0]?`<li>${esc(weak[0].sub)} 대비 문제지 (지난 시험 오답 + 비슷한 문제) 풀기</li>`:''}
      <li>${RS&&RS.tried?`오답 다시 풀기: 지금까지 ${RS.tried}문항 중 <b>${RS.ok}개 다시 맞힘 (${pct(RS.ok,RS.tried)}%)</b>${RS.left?` · 남은 오답 ${RS.left}개 이어서 풀기`:''}`:'틀린 문제 다시 풀기 → 다음 상담 때 다시 맞힌 비율 확인'}</li>
      <li>목표: 다음 시험 <b>${goal}점 이상</b></li>
    </ol>
    <h2>선생님 의견</h2>
    <div class="memo"><div contenteditable="true" style="min-height:8mm;color:#6b7280;font-size:12px">상담 때 손으로 적거나, 여기를 눌러 입력한 뒤 인쇄하세요.</div><div class="lines"></div></div>
    <div class="foot"><span>${esc(br)} 정상어학원 · 모의고사 채점 프로그램</span><span>${teacher?'담임 '+esc(teacher)+' ☐ 확인 &nbsp; ':''}학부모 ☐ 확인</span></div>
  </div></body></html>`;
  const w=window.open('','_blank'); if(!w) return alert('팝업이 막혀 있어요. 브라우저 주소창 옆에서 팝업을 허용해 주세요.');
  w.document.open(); w.document.write(html); w.document.close();
}

/* ===================== 5. 관리자 분석 ===================== */
const GRADE_COLS=['1등급','2등급','3등급','4등급','5등급 이하'];
const ADM_GRADES=['고1','고2','고3'];
// 수능 영어 절대평가: 90↑ 1등급, 80↑ 2등급 … (100점 환산)
function engGrade(score, ex){ const t=totalPoints(ex)||100, v=score/t*100; return v>=90?1:v>=80?2:v>=70?3:v>=60?4:v>=50?5:v>=40?6:v>=30?7:v>=20?8:9; }
const bucketOf = g => Math.min(g,5)-1;   // 0..4 (5 = 5등급 이하)
const ADM_ALL='전 분원';   // 관리자 분석 분원 드롭다운: 전 분원 = 분원 비교·추이·자유 분석(전체) / 분원 = 그 분원 상세 + 자유 분석(그 분원 안)
let admRound=null, admPick={}, admGrade='고1', admBranch=null, admCmp={a:'',b:''};   // 전체 분원 추이: 비교할 두 회차 (a 기준 → b)

// 회차: 시행일 기준 — 2월 1회, 5월 2회, 8월 3회, 11월 4회 (1~3월→1회, 4~6월→2회, 7~9월→3회, 10~12월→4회)
const ROUND_MONTH=[2,5,8,11];
function roundKey(ex){ const d=ex&&ex.exam_date; if(!d) return ''; const y=+d.slice(0,4), m=+d.slice(5,7); if(!y||!m) return ''; return `${y}-${Math.ceil(m/3)}`; }
function roundLabel(k){ if(!k) return '시행 연·월 없음'; const [y,r]=k.split('-'); return `${y}년 ${r}회차 (${ROUND_MONTH[r-1]}월)`; }
const allRounds = () => [...new Set(EXAMS.map(roundKey))].sort((a,b)=>koCmp(b,a));   // 최신 회차 먼저
function admExamsOf(g, rk){ return EXAMS.filter(e=>normGrade(e.grade)===g && roundKey(e)===rk).sort((a,b)=>koCmp(examDateKey(b),examDateKey(a))); }
function gradeCounts(list, ex){ const c=[0,0,0,0,0]; list.forEach(r=>c[bucketOf(engGrade(r.score,ex))]++); return c; }
// 행 하나: 응시 + 등급별 (인원 | %)
function gradeRow(label, cnt, n, strong){
  return `<tr${strong?' style="font-weight:700;background:#fafbfc"':''}><td>${label}</td><td>${n||'-'}</td>${cnt.map(v=>`<td class="gc-n">${n?v:'-'}</td><td class="gc-p">${n?pct(v,n)+'%':'-'}</td>`).join('')}</tr>`;
}
const gradeHead = first => `<thead><tr><th rowspan="2">${first}</th><th rowspan="2">응시</th>${GRADE_COLS.map(c=>`<th colspan="2" style="text-align:center">${c}</th>`).join('')}</tr>
  <tr>${GRADE_COLS.map(()=>'<th class="gc-n">인원</th><th class="gc-p">%</th>').join('')}</tr></thead>`;

// 응답 → 현재 명단(반·담임) 연결
function rosterOf(r, roster){
  return roster.find(s=>r.member_code && s.member_code===r.member_code) || roster.find(s=>s.student_name===r.student_name && s.class_name===r.class_name) || null;
}
// 담임: 답안에 기록된 그때 담임 → 없으면 현재 명단
const teacherOf = (r, roster) => r.teacher || ((rosterOf(r,roster||[])||{}).teacher) || '';
const stuIdOf = r => r.member_code || ('n:'+r.branch+'|'+r.student_name);

async function renderAdminTab(){
  PVDATA=null;   // 자유 분석 데이터는 화면을 다시 그릴 때마다 새로 모음 (새로 입력한 답안 반영)
  if(!admBranch) admBranch=prefs.branch;
  const isTeacher=!!(ME&&ME.role==='teacher'); if(isTeacher&&admBranch===ADM_ALL) admBranch=prefs.branch;
  const allMode=admBranch===ADM_ALL;
  const rounds=allRounds();
  if(!admRound || !rounds.includes(admRound)) admRound=rounds[0]||'';
  const rosters={}; await pmap(BRANCHES, async b=>{ rosters[b]=await getStudents(b); });
  await pmap(EXAMS, e=>getResponses(e.id));   // 아래에서 쓰는 응답을 한 번에 미리
  const data={};   // 학년 → {ex, all, choices}
  for(const g of ADM_GRADES){
    const choices=admExamsOf(g, admRound);
    let ex=choices.find(e=>e.id===admPick[admRound+'|'+g])||null;
    if(!ex){ // 같은 회차에 같은 학년 시험이 여럿이면 응시자가 많은 시험
      let best=null, bn=-1; for(const e of choices){ const n=(await getResponses(e.id)).length; if(n>bn){ best=e; bn=n; } } ex=best;
    }
    data[g]={ex, all:ex?await getResponses(ex.id):[], sum:ex?await getExamSummary(ex.id):[], choices};
  }
  const to100=(sc,e)=>{ const t=totalPoints(e); return t?sc/t*100:sc; };
  const diffTag=d=>`<b class="${d>0?'mark-o':d<0?'mark-x':''}">${d>0?'▲':d<0?'▼':''}${Math.abs(d).toFixed(1)}</b>`;

  // ① 분원별 등급 분석 (행: 학년)
  const t1=ADM_GRADES.map(g=>{ const {ex,sum}=data[g]; const l=ex?sum.filter(r=>r.branch===admBranch):[]; return {g,cnt:ex?gradeCounts(l,ex):[0,0,0,0,0],n:l.length}; });
  const t1sum=t1.reduce((a,x)=>({cnt:a.cnt.map((v,i)=>v+x.cnt[i]),n:a.n+x.n}),{cnt:[0,0,0,0,0],n:0});

  // ② 전체 분원 등급 분석 (행: 분원, 선택 학년)
  const G=data[admGrade];
  const t2=ALL_BRANCHES.map(b=>{ const l=G.ex?G.sum.filter(r=>r.branch===b):[]; return {b,cnt:G.ex?gradeCounts(l,G.ex):[0,0,0,0,0],n:l.length}; });
  const t2sum={cnt:G.ex?gradeCounts(G.sum,G.ex):[0,0,0,0,0], n:G.sum.length};

  // ③ 오답률 TOP5 (선택 학년, 분원별 + 전체)
  const top3=list=>{ if(!G.ex||!list.length) return []; const wr=wrongRates(G.ex,list); return G.ex.items.map((it,i)=>({it,w:wr[i]})).sort((a,b)=>b.w-a.w||a.it.no-b.it.no).slice(0,5); };
  const topCell=(t,ri)=>t?`<span class="ws-prev" data-topq="${ri}|${t.it.no}" title="눌러서 문제 보기"><b>${t.it.no}번</b> ${pill(t.it.cat)} <span class="muted">${esc(t.it.sub||'')}</span> <b class="mark-x">${t.w}%</b></span>`:'<span class="muted">-</span>';
  const topRows=[...ALL_BRANCHES.map(b=>({label:b,l:G.sum.filter(r=>r.branch===b)})),{label:'전체',l:G.sum,strong:true}].filter(x=>x.l.length||x.strong);

  // ④ 반별 성적 (선택 분원·학년) — 반 최고점 파랑, 최저점 빨강
  const mine=G.ex?G.all.filter(r=>r.branch===admBranch):[];
  const prevEx=G.ex?(()=>{ const id=defaultCmp(G.ex); return id?examById(id):null; })():null;
  const prevAll=prevEx?await getResponses(prevEx.id):[];
  const rowsWithT=mine.map(r=>({r, cls:r.class_name, teacher:teacherOf(r,rosterSync(admBranch,roundKey(G.ex))), prev:prevAll.find(p=>sameResp(p,r))}));
  const byCls={}; rowsWithT.forEach(x=>(byCls[x.cls||'-']=byCls[x.cls||'-']||[]).push(x));

  // ⑤ 담임별 성과 (이번 회차, 선택 분원 / 본사 전 분원) — 담임은 그 시험 때 기록된 담임
  // 전 분원: 본사 계정만 담임 표를 봄 (분원 강사 정보는 그 분원 관리자·본사만). 같은 이름이 다른 분원에 있을 수 있어 '분원|담임'으로 묶음
  const hqAll=allMode&&isHq(), tBrs=allMode?(hqAll?[...BRANCHES]:[]):[admBranch];
  const tKey=(b,t)=>allMode?b+'|'+t:t, tName=k=>allMode?k.slice(k.indexOf('|')+1):k, tBr=k=>allMode?k.slice(0,k.indexOf('|')):admBranch;
  // 최근 명단에 반이 없는 담임(퇴사 등) → 표 아래쪽으로. 명단 회차마다 담임 이름을 모아 마지막으로 나온 회차를 봄
  const tLast={}, brLatest={};
  tBrs.forEach(b=>{ brLatest[b]=rosterRounds(b).find(Boolean)||''; (STU[b]||[]).forEach(s=>{ if(!s.teacher) return; const k=tKey(b,s.teacher), rk=s.exam_round||''; if(!tLast[k]||koCmp(rk,tLast[k])>0) tLast[k]=rk; }); });
  const brHasT=b=>(STU[b]||[]).some(s=>s.teacher);
  const tGone=k=>{ const t=tName(k), b=tBr(k); if(t.startsWith('(')||!brHasT(b)||!brLatest[b]) return false; return (tLast[k]||'')!==brLatest[b]; };
  const goneTag=k=>{ if(!tGone(k)) return ''; const l=tLast[k]; return ` <span class="muted" style="font-weight:400;font-size:12px">· 최근 명단에 반 없음${l?` (마지막 ${roundLabel(l).replace(/ \(.*\)$/,'')})`:''}</span>`; };
  const brIdx=b=>{ const i=BRANCHES.indexOf(b); return i<0?99:i; };
  const tStat={};
  for(const g of ADM_GRADES){
    const {ex,all}=data[g]; if(!ex) continue;
    const pEx=(()=>{ const id=defaultCmp(ex); return id?examById(id):null; })(); const pAll=pEx?await getResponses(pEx.id):[];
    all.filter(r=>tBrs.includes(r.branch)).forEach(r=>{
      const t=tKey(r.branch, teacherOf(r,rosterSync(r.branch,roundKey(ex)))||'(담임 미지정)');
      const o=tStat[t]=tStat[t]||{n:0,sum:0,g1:0,g2:0,grow:0,gn:0,cls:new Set(),by:{}};
      const ck=r.class_name||'(반 없음)', c=o.by[ck]=o.by[ck]||{n:0,sum:0,g1:0,g2:0,grow:0,gn:0,gc:{}};   // 반 이름으로 묶음 (한 반이 학년을 나눠 응시해도 한 반)
      c.gc[g]=(c.gc[g]||0)+1; c.gs=c.gs||{}; const gz=c.gs[g]=c.gs[g]||{n:0,sum:0,g1:0,g2:0,grow:0,gn:0};   // 한 반 안의 응시 학년별
      const gr=engGrade(r.score,ex), p=pAll.find(x=>sameResp(x,r));
      [o,c,gz].forEach(z=>{ z.n++; z.sum+=to100(r.score,ex); if(gr===1) z.g1++; if(gr<=2) z.g2++; if(p){ z.grow+=to100(r.score,ex)-to100(p.score,pEx); z.gn++; } });
      o.cls.add(ck);
    });
  }

  // ⑥ 담임 × 회차 (선택 분원, 전체 회차) + 담당 기간 성장
  const allResp=[];   // {r, ex, rk, t}
  for(const ex of EXAMS){ const rk=roundKey(ex); for(const r of (await getResponses(ex.id)).filter(r=>tBrs.includes(r.branch))) allResp.push({r,ex,rk,t:tKey(r.branch,teacherOf(r,rosterSync(r.branch,rk))||'(담임 미지정)')}); }
  const roundCols=[...new Set(allResp.map(x=>x.rk))].sort(koCmp);
  const tr={};   // 담임 → 회차 → {n,sum,g1}
  allResp.forEach(x=>{ const o=((tr[x.t]=tr[x.t]||{})[x.rk]=tr[x.t][x.rk]||{n:0,sum:0,g1:0}); o.n++; o.sum+=to100(x.r.score,x.ex); if(engGrade(x.r.score,x.ex)===1) o.g1++; });
  // 학생별 시간순 → 연속한 두 시험의 점수 변화를 '뒤 시험 때 담임'의 몫으로
  const byStu={}; allResp.forEach(x=>(byStu[stuIdOf(x.r)]=byStu[stuIdOf(x.r)]||[]).push(x));
  const tg={};   // 담임 → {sum,n,stu:Set}
  Object.values(byStu).forEach(list=>{ list.sort((a,b)=>koCmp(examDateKey(a.ex),examDateKey(b.ex)));
    for(let i=1;i<list.length;i++){ const a=list[i-1], b=list[i]; if(examDateKey(a.ex)===examDateKey(b.ex)) continue;
      const o=tg[b.t]=tg[b.t]||{sum:0,n:0,stu:new Set()}; o.sum+=to100(b.r.score,b.ex)-to100(a.r.score,a.ex); o.n++; o.stu.add(stuIdOf(b.r)); } });
  // 정렬: 현재 담임 먼저 → (전 분원이면 분원 순) → 이름. 최근 명단에 반이 없는 담임·담임 미지정은 맨 아래
  const teachers=[...new Set([...Object.keys(tr),...Object.keys(tg)])].sort((a,b)=>tGone(a)-tGone(b)||tName(a).startsWith('(')-tName(b).startsWith('(')||brIdx(tBr(a))-brIdx(tBr(b))||koCmp(tName(a),tName(b)));
  const tStatList=Object.entries(tStat).sort((a,b)=>tGone(a[0])-tGone(b[0])||tName(a[0]).startsWith('(')-tName(b[0]).startsWith('(')||brIdx(tBr(a[0]))-brIdx(tBr(b[0]))||b[1].n-a[1].n);
  const noTeacher=tBrs.length>0 && !tBrs.some(b=>(rosters[b]||[]).some(s=>s.teacher)) && !allResp.some(x=>x.r.teacher);
  const teacherView=!!(ME&&ME.role==='teacher');   // 담임: 등급 분석·전체 분원 비교·오답률 TOP5만

  // ⑦ 전체 분원 추이 — 분원 × 학년 × 회차: 응시 인원 · 1등급 · 평균(100점 환산)
  const trExams=EXAMS.filter(e=>roundKey(e));
  const trSums=await pmap(trExams, e=>getExamSummary(e.id));
  const trd={};   // 분원 → 학년(…, '계') → 회차 → {n,sum,g1}
  trExams.forEach((e,i)=>{ const rk=roundKey(e), g=normGrade(e.grade)||'학년 없음'; (trSums[i]||[]).forEach(r=>{ for(const b of [r.branch,'전체']) for(const gg of [g,'계']){
    const o=(((trd[b]=trd[b]||{})[gg]=trd[b][gg]||{})[rk]=trd[b][gg][rk]||{n:0,sum:0,g1:0}); o.n++; o.sum+=to100(r.score,e); if(engGrade(r.score,e)===1) o.g1++; } }); });
  const trRounds=[...new Set(trExams.map(roundKey))].sort(koCmp);
  const trBranches=[...ALL_BRANCHES, ...Object.keys(trd).filter(b=>b!=='전체'&&!ALL_BRANCHES.includes(b)).sort(koCmp), '전체'];
  const trGrades=[...[...new Set(trExams.map(e=>normGrade(e.grade)||'학년 없음'))].sort(koCmp), '계'];
  admCmp.b=trRounds.includes(admRound)?admRound:(trRounds[trRounds.length-1]||'');   // 비교 기준 = 위에서 고른 회차
  if(!trRounds.includes(admCmp.a)||admCmp.a===admCmp.b){ const k=trRounds.indexOf(admCmp.b); admCmp.a=k>0?trRounds[k-1]:(trRounds.find(x=>x!==admCmp.b)||''); }
  const trCell=(b,g,k)=>trd[b]&&trd[b][g]&&trd[b][g][k];
  const trDiff=(b,g)=>{ const a=trCell(b,g,admCmp.a), c=trCell(b,g,admCmp.b); return a&&c?{dn:c.n-a.n, dg:pct(c.g1,c.n)-pct(a.g1,a.n), da:c.sum/c.n-a.sum/a.n}:null; };
  const shortRound=k=>{ const [y,r]=k.split('-'); return `${String(y).slice(2)}년 ${r}회차 (${ROUND_MONTH[r-1]}월)`; };

  $('#tab-admin').innerHTML=`
  <div class="card">
    <div class="row">
      <label class="f" style="min-width:220px">회차<select id="admRound">${rounds.map(k=>`<option value="${k}" ${k===admRound?'selected':''}>${roundLabel(k)}</option>`).join('')||'<option>시험 없음</option>'}</select></label>
      <label class="f">분원<select id="admBranch">${(isTeacher?BRANCHES:[ADM_ALL,...BRANCHES]).map(b=>`<option ${b===admBranch?'selected':''}>${b}</option>`).join('')}</select></label>
      <button class="btn" id="admXlsx" style="align-self:flex-end">엑셀 다운로드</button>
      <button class="btn" id="admPrint" style="align-self:flex-end">인쇄</button>
      ${ADM_GRADES.filter(g=>data[g].choices.length>1).map(g=>`<label class="f" style="min-width:220px">${g} 시험 (이 회차에 ${data[g].choices.length}개)<select data-admpick="${g}">${data[g].choices.map(e=>`<option value="${e.id}" ${data[g].ex&&e.id===data[g].ex.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label>`).join('')}
    </div>
    <p class="muted" style="margin-top:6px">${ADM_GRADES.map(g=>`${g}: ${data[g].ex?esc(data[g].ex.name):'<span class="muted">없음</span>'}`).join(' · ')}<br>
      회차는 시행 연·월로 정해요 (2월 1회 · 5월 2회 · 8월 3회 · 11월 4회). 등급은 수능 영어 절대평가 기준(90점↑ 1등급, 80점↑ 2등급 …)입니다.</p>
  </div>


  <div class="card" style="margin-top:14px" ${allMode?'hidden':''}>
    <h2>등급 분석 · ${esc(admBranch)} · ${roundLabel(admRound)}</h2>
    <div style="overflow:auto"><table class="adm">${gradeHead('학년')}<tbody>
      ${t1.map(x=>gradeRow(x.g+(data[x.g].ex?'':' <span class="muted">(시험 없음)</span>'),x.cnt,x.n)).join('')}
      ${gradeRow('합계',t1sum.cnt,t1sum.n,true)}
    </tbody></table></div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">전체 분원 비교</h2>
      <div class="subtabs" style="margin:0">${ADM_GRADES.map(g=>`<button data-admg="${g}" class="${g===admGrade?'active':''}">${g}</button>`).join('')}</div></div>
    ${G.ex?`<p class="muted" style="margin:6px 0 10px">${esc(G.ex.name)}</p>`:`<p class="muted">이 회차에 ${admGrade} 시험이 없어요.</p>`}
    <div style="overflow:auto"><table class="adm">${gradeHead('분원')}<tbody>
      ${t2.map(x=>gradeRow(x.b+(x.b===admBranch?' ★':''),x.cnt,x.n)).join('')}
      ${gradeRow('전체',t2sum.cnt,t2sum.n,true)}
    </tbody></table></div>

    <h3 style="margin-top:22px">오답률 TOP 5 · ${admGrade}</h3>
    <div style="overflow:auto"><table><thead><tr><th>분원</th><th>응시</th><th>1위</th><th>2위</th><th>3위</th><th>4위</th><th>5위</th></tr></thead><tbody>
      ${topRows.map((x,ri)=>{ const t=top3(x.l); return `<tr${x.strong?' style="font-weight:700;background:#fafbfc"':''}><td>${esc(x.label)}</td><td>${x.l.length}</td>${[0,1,2,3,4].map(i=>`<td>${topCell(t[i],ri)}</td>`).join('')}</tr>`; }).join('')}
    </tbody></table></div>
  </div>

  <div class="card" style="margin-top:14px" ${!teacherView&&!allMode?'hidden':''}>
    <div class="row" style="justify-content:space-between;align-items:flex-end"><div><h2 style="margin:0">전체 분원 추이 · 전체 회차</h2>
      <p class="muted" style="margin:6px 0 0">회차마다 <b>응시</b> = 응시 인원 · <b>1등급</b> = 1등급 인원(비율) · <b>평균</b> = 평균 점수. 학년별 줄 아래 <b>계</b>는 고1~고3 합산이에요.</p></div>

          ${d?`<td class="rsep">${d.dn>0?'+':''}${d.dn}명</td><td>${diffTag(d.dg)}%p</td><td>${diffTag(d.da)}</td>`:'<td class="rsep muted">-</td><td class="muted">-</td><td class="muted">-</td>'}</tr>`; }).join(''); }).join('')}

        ...tStatList.flatMap(([t,o])=>{ const kl=k=>{ const gs=Object.keys(o.by[k].gc).sort(koCmp); return `${k} (${gs.join('·')})`; };
          const gr=k=>{ const c=o.by[k], gs=Object.keys(c.gc).sort(koCmp); return gs.length>1?gs.map(g=>tRow(t,`  └ ${k} · ${g} 응시`,c.gs[g])):[]; };

      sh.push(['담임누적',[[`${admBranch} · 전체 회차`],[],[...BH,'담임','회차','학생 수','평균','1등급(%)'],

      ['분원','학년',...trRounds.flatMap(k=>[shortRound(k)+' 응시',shortRound(k)+' 1등급',shortRound(k)+' 1등급(%)',shortRound(k)+' 평균']),`${admCmp.b&&shortRound(admCmp.b)} 변화(${admCmp.a&&shortRound(admCmp.a)} 대비) 응시`,'비교 1등급(%p)','비교 평균'],
      ...trB2.flatMap(b=>trGrades.filter(g=>trd[b][g]).map(g=>{ const d=trDiff(b,g); return [b,g,...trRounds.flatMap(k=>{ const o=trCell(b,g,k); return o?[o.n,o.g1,pct(o.g1,o.n),r1(o.sum/o.n)]:['','','','']; }),...(d?[d.dn,d.dg,r1(d.da)]:['','',''])]; }))]]);
    if(showAll) sh.push(['전체분원추이_목록',[['전체 분원 추이 (한 줄에 하나 — 피벗·그래프용)'],[],['분원','학년','회차','응시 인원','1등급 인원','1등급(%)','평균'],
      ...trB2.flatMap(b=>trGrades.filter(g=>trd[b][g]).flatMap(g=>trRounds.filter(k=>trCell(b,g,k)).map(k=>{ const o=trCell(b,g,k); return [b,g,shortRound(k),o.n,o.g1,pct(o.g1,o.n),r1(o.sum/o.n)]; })))]]);

// 표 머리글 눌러 정렬 (모든 열). 숫자(33%, ▲11.1, 80 (88.9), 2등급 …)는 숫자로, 나머지는 가나다순. '-'·빈칸은 항상 아래.
// state={i,d}를 넘기면 다시 그려도 정렬 유지. tr.pvtot(합계)·tr.pv-sub(펼친 줄)는 정렬에서 빠짐
function sortVal(td){
  if(!td) return null; if(td.dataset.sv!=null&&td.dataset.sv!=='') return +td.dataset.sv;
  const t=td.textContent.replace(/\s+/g,' ').trim(); if(!t||t==='-') return null;
  const m=t.replace(/,/g,'').match(/^([▲▼+\-]?)\s*(\d+(?:\.\d+)?)\s*(%|%p|점|명|등급|번|문항|회|개)?(?=\s|$|\(|\/)/);
  if(m){ let v=parseFloat(m[2]); if(m[1]==='▼'||m[1]==='-') v=-v; return v; }
  return t;
}
function sortableTable(tbl, state={}){

  $('#pvVal').onchange=e=>{ PV.val=e.target.value; re(); };
  box.querySelectorAll('[data-pvf]').forEach(b=>b.onclick=()=>{ PV.open=PV.open===b.dataset.pvf?'':b.dataset.pvf; re(); });
  const pc=$('#pvClear'); if(pc) pc.onclick=()=>{ PV.f={}; PV.open=''; re(); };
  if(PV.open){ const k=PV.open, vs=fVals(k);
    box.querySelectorAll('[data-pvfv]').forEach(c=>c.onchange=()=>{ const s=PV.f[k]?new Set(PV.f[k]):new Set(vs); c.checked?s.add(c.dataset.pvfv):s.delete(c.dataset.pvfv); if(s.size===vs.length) delete PV.f[k]; else PV.f[k]=s; re(); });
    $('#pvFAll').onclick=()=>{ delete PV.f[k]; re(); }; $('#pvFNone').onclick=()=>{ PV.f[k]=new Set(); re(); }; $('#pvFClose').onclick=()=>{ PV.open=''; re(); }; }
  if($('#pvXlsx')) $('#pvXlsx').onclick=()=>{ if(!window.XLSX) return alert('엑셀 도구를 불러오지 못했어요.');
    const txt=(o,r)=>!o?'':share?pct(o.v,rowTot[r]?rowTot[r].v:0):PV.val==='avg'||PV.val==='grow'?Math.round(o.v*10)/10:o.v;
    const aoa=[[`자유 분석 · ${dimName(PV.rows)}${PV.cols?' × '+dimName(PV.cols):''} · ${share?'응시 인원 행 비율(%)':valName}`],[Object.keys(PV.f).length?'필터: '+Object.entries(PV.f).map(([k,s])=>`${dimName(k)}=${[...s].join(',')}`).join(' / '):'필터 없음'],[],
      [dimName(PV.rows),...C.map(c=>PV.cols?lbl(PV.cols,c):c),...(PV.cols?['전체']:[])], ...R.map(r=>[lbl(PV.rows,r),...C.map(c=>txt(cell[key(r,c)],r)),...(PV.cols?[share?(rowTot[r]?rowTot[r].v:''):txt(rowTot[r],r)]:[])]),
      [], ['계산에 쓰인 학생 수'], [dimName(PV.rows),...C.map(c=>PV.cols?lbl(PV.cols,c):c)], ...R.map(r=>[lbl(PV.rows,r),...C.map(c=>{ const o=cell[key(r,c)]; return o?o.n:''; })])];

/* ===================== 데이터 점검 =====================
   잘못된 시험(회차·학년)에 들어간 답안, 시험 이름과 시행 연·월이 다른 시험, 같은 학생 중복, 같은 답안이 두 시험에 들어간 경우를 찾아요 */
let chkBranch=null;
async function moveResponses(list, to){
  const have=await getResponses(to.id,true); let n=0; const skip=[];
  for(const r of list){
    if(have.some(x=>sameResp(x,r))){ skip.push(r.student_name); continue; }
    const answers=(r.answers+'0'.repeat(to.q_count)).slice(0,to.q_count);
    await DB.saveResponse({...r, exam_id:to.id, answers, score:gradeAnswers(to,answers).score}); n++;
  }
  return {n, skip};
}
async function renderCheckTab(){
  const el=$('#tab-check');
  if(!EXAMS.length){ el.innerHTML='<div class="card"><p class="muted">등록된 시험이 없어요.</p></div>'; return; }
  el.innerHTML='<div class="card"><p class="muted">모든 시험의 답안을 점검하는 중이에요…</p></div>';
  const brs=isHq()?['전체',...BRANCHES]:[...BRANCHES];
  if(!chkBranch||!brs.includes(chkBranch)) chkBranch=brs[0];
  const R={}; await pmap(EXAMS, async e=>{ R[e.id]=await getResponses(e.id,true); });
  await pmap(BRANCHES, b=>loadStudents(b));
  const inB=r=>chkBranch==='전체'||r.branch===chkBranch;
  const issues=[];   // {lvl:'bad'|'warn', kind, html, act}
  const who=r=>`${esc(r.student_name)}${r.class_name?` <span class="muted">(${esc(r.class_name)})</span>`:''}`;
  const exLbl=e=>`<b>${esc(e.name)}</b> <span class="muted">${esc(roundLabel(roundKey(e)))} · ${esc(normGrade(e.grade)||'학년 없음')}</span>`;
  const delBtn=r=>`<button class="btn" data-ckdel="${r.exam_id}|${r.id}" style="padding:2px 8px;font-size:12px">이 답안 지우기</button>`;
  const fixNote=canExam()?'시험 관리에서 고쳐 주세요 (답안은 그대로 따라가요).':'시험 등록 담당자에게 알려 주세요.';

  // ① 시험 정보: 이름의 월·학년 ↔ 등록된 시행 연·월·학년
  EXAMS.forEach(e=>{
    if(chkBranch!=='전체' && !R[e.id].some(inB)) return;
    const m=String(e.name).match(/(\d{1,2})\s*월/), dm=+(e.exam_date||'').slice(5,7), gm=String(e.name).match(/고\s*([123])/);
    if(!e.exam_date) issues.push({lvl:'warn',kind:'시험 정보',html:`${exLbl(e)} — 시행 연·월이 비어 있어 회차 분석에서 빠져요. ${fixNote}`});
    else if(m && +m[1]!==dm) issues.push({lvl:'bad',kind:'시험 정보',html:`${exLbl(e)} — 이름은 <b>${+m[1]}월</b>인데 시행 연·월은 <b>${esc(fmtYM(e.exam_date))}</b>로 등록돼 있어요. ${fixNote}`});
    if(gm && normGrade(e.grade) && normGrade(e.grade)!=='고'+gm[1]) issues.push({lvl:'bad',kind:'시험 정보',html:`${exLbl(e)} — 이름은 <b>고${gm[1]}</b>인데 학년은 <b>${esc(e.grade)}</b>로 등록돼 있어요. ${fixNote}`});
  });
  // ② 같은 회차·학년 시험이 여러 개 → 분원마다 다른 시험에 넣었을 수 있음
  const byRG={}; EXAMS.forEach(e=>{ const k=roundKey(e)+'|'+normGrade(e.grade); (byRG[k]=byRG[k]||[]).push(e); });
  Object.values(byRG).filter(l=>l.length>1 && roundKey(l[0])).forEach(l=>{
    const used=l.filter(e=>R[e.id].some(inB)); if(used.length<2) return;
    issues.push({lvl:'warn',kind:'같은 회차·학년',html:`${esc(roundLabel(roundKey(l[0])))} ${esc(normGrade(l[0].grade))} 시험이 ${l.length}개예요. 일부러 두 시험을 본 게 아니라면 한쪽에 잘못 들어갔을 수 있어요.<br>${used.map(e=>{ const c={}; R[e.id].filter(inB).forEach(r=>c[r.branch]=(c[r.branch]||0)+1); return `· <b>${esc(e.name)}</b> (${esc(fmtYM(e.exam_date))}) — ${Object.entries(c).map(([b,n])=>`${esc(b)} ${n}명`).join(', ')}`; }).join('<br>')}`});
  });
  // ③ 답안이 다른 시험 정답과 더 잘 맞음 (분원 묶음 → 학생 한 명씩)
  EXAMS.forEach(e=>{
    const byBr={}; R[e.id].filter(inB).forEach(r=>(byBr[r.branch]=byBr[r.branch]||[]).push(r));
    Object.entries(byBr).forEach(([b,list])=>{
      const fc=fitCheck(e, list.map(r=>r.answers));
      if(fc&&fc.better){ issues.push({lvl:'bad',kind:'다른 시험 답안',html:`${exLbl(e)} · <b>${esc(b)}</b> ${list.length}명 — 답안이 이 시험 정답과 평균 <b>${Math.round(fc.own)}%</b>만 맞고, <b>${esc(fc.better.e.name)}</b> (${esc(roundLabel(roundKey(fc.better.e)))}) 정답과는 <b>${Math.round(fc.better.f)}%</b> 맞아요.`,
        act:{ids:list.map(r=>r.id), from:e.id, to:fc.better.e.id}}); return; }
      list.forEach(r=>{ const f=fitCheck(e,[r.answers]); if(f&&f.better&&f.better.f>=f.own+25&&f.better.f>=55)
        issues.push({lvl:'bad',kind:'다른 시험 답안',html:`${exLbl(e)} · ${esc(b)} ${who(r)} — 이 시험 정답과 ${Math.round(f.own)}% 맞고, <b>${esc(f.better.e.name)}</b> 정답과는 <b>${Math.round(f.better.f)}%</b> 맞아요.`, act:{ids:[r.id], from:e.id, to:f.better.e.id}}); });
    });
  });
  // ④ 같은 시험에 같은 학생이 두 번
  EXAMS.forEach(e=>{ const g={}; R[e.id].filter(inB).forEach(r=>(g[stuIdOf(r)]=g[stuIdOf(r)]||[]).push(r));
    Object.values(g).filter(l=>l.length>1).forEach(l=>issues.push({lvl:'bad',kind:'중복',html:`${exLbl(e)} — ${who(l[0])} 답안이 ${l.length}개 있어요.<br>${l.map(r=>`· ${esc(r.branch)} ${who(r)} ${r.score}점 ${delBtn(r)}`).join('<br>')}`})); });
  // ⑤ 같은 학생의 똑같은 답안이 두 시험에 (한 파일을 두 번 올린 경우)
  const byStu={}; EXAMS.forEach(e=>R[e.id].filter(inB).forEach(r=>{ if((r.answers.match(/[1-5ox]/g)||[]).length>=30) (byStu[stuIdOf(r)]=byStu[stuIdOf(r)]||[]).push({r,e}); }));
  Object.values(byStu).forEach(l=>{ for(let i=0;i<l.length;i++) for(let j=i+1;j<l.length;j++){ const a=l[i], c=l[j];
    if(a.e.id!==c.e.id && a.r.answers===c.r.answers) issues.push({lvl:'bad',kind:'같은 답안 두 번',html:`${who(a.r)} (${esc(a.r.branch)}) — 똑같은 답안이 두 시험에 들어 있어요. 한쪽은 잘못 들어간 거예요.<br>· ${exLbl(a.e)} ${a.r.score}점 ${delBtn(a.r)}<br>· ${exLbl(c.e)} ${c.r.score}점 ${delBtn(c.r)}`}); } });
  // ⑥ 명단 학년 ↔ 시험 학년
  EXAMS.forEach(e=>{ const eg=normGrade(e.grade); if(!eg) return; const byBr={};
    R[e.id].filter(inB).forEach(r=>{ const s=rosterOf(r, rosterSync(r.branch, roundKey(e))); if(s&&s.grade&&normGrade(s.grade)!==eg) (byBr[r.branch]=byBr[r.branch]||[]).push({r,g:normGrade(s.grade)}); });
    Object.entries(byBr).forEach(([b,l])=>issues.push({lvl:'warn',kind:'학년 다름',html:`${exLbl(e)} · ${esc(b)} — 명단 학년이 다른 학생 ${l.length}명: ${l.map(x=>`${who(x.r)} <b>${esc(x.g)}</b>`).join(', ')}`})); });

  const KO=['시험 정보','다른 시험 답안','같은 답안 두 번','중복','같은 회차·학년','학년 다름'];
  issues.sort((a,b)=>(a.lvl==='bad'?0:1)-(b.lvl==='bad'?0:1) || KO.indexOf(a.kind)-KO.indexOf(b.kind) || (b.act?b.act.ids.length:0)-(a.act?a.act.ids.length:0));
  const bad=issues.filter(i=>i.lvl==='bad').length, warn=issues.length-bad, nResp=EXAMS.reduce((s,e)=>s+R[e.id].filter(inB).length,0);
  const opts=sel=>EXAMS.slice().sort((a,b)=>koCmp(roundKey(b),roundKey(a))||koCmp(gradeKey(a),gradeKey(b))).map(e=>`<option value="${e.id}" ${e.id===sel?'selected':''}>${esc(roundLabel(roundKey(e)))} · ${esc(e.name)}</option>`).join('');
  el.innerHTML=`<div class="card">
    <div class="row" style="align-items:flex-end;gap:14px">
      <label class="f">분원<select id="ckBranch">${brs.map(b=>`<option ${b===chkBranch?'selected':''}>${esc(b)}</option>`).join('')}</select></label>
      <button class="btn" id="ckRe">다시 점검</button>
      <span class="muted">시험 ${EXAMS.length}개 · 답안 ${nResp}개를 살펴봤어요.</span>
    </div>
    <div class="stats" style="margin-top:12px"><div class="stat ${bad?'':'hl'}"><span class="muted">꼭 확인</span><b class="${bad?'mark-x':''}">${bad}건</b></div><div class="stat"><span class="muted">확인해 보세요</span><b>${warn}건</b></div></div>
    <p class="muted" style="margin:4px 0 0">학생이 고른 번호(1~5)로 들어간 답안은 <b>어느 시험 정답과 가장 잘 맞는지</b>를 비교해서 다른 회차·학년 시험에 잘못 들어간 답안을 찾아요. 본사 정오표(O/X)로 들어간 시험은 이 비교가 안 되고, 시험 이름·날짜·중복만 점검해요.</p>
  </div>
  ${issues.length?issues.map((it,i)=>`<div class="card ck-item ${it.lvl}" style="margin-top:10px"><span class="ck-tag">${it.lvl==='bad'?'꼭 확인':'확인해 보세요'} · ${esc(it.kind)}</span><div style="margin-top:6px;line-height:1.8">${it.html}</div>
    ${it.act?`<div class="row" style="margin-top:8px;gap:8px;align-items:center"><span class="muted">${it.act.ids.length}명 답안을</span><select data-ckto="${i}" style="max-width:420px">${opts(it.act.to)}</select><button class="btn primary" data-ckmv="${i}" style="padding:4px 12px">이 시험으로 옮기기</button></div>`:''}</div>`).join('')
    :`<div class="card" style="margin-top:10px"><p class="mark-o" style="margin:0"><b>✓ 이상한 데이터를 찾지 못했어요.</b></p></div>`}`;
  $('#ckBranch').onchange=e=>{ chkBranch=e.target.value; renderCheckTab(); };
  $('#ckRe').onclick=()=>renderCheckTab();
  document.querySelectorAll('[data-ckdel]').forEach(b=>b.onclick=async()=>{ const [eid,id]=b.dataset.ckdel.split('|'); const r=R[eid].find(x=>x.id===id); if(!r) return;
    if(!confirm(`${examById(eid).name}\n${r.student_name} (${r.score}점) 답안을 지울까요? 되돌릴 수 없어요.`)) return;
    try{ await DB.deleteResponse(id); delete SUMCACHE[eid]; renderCheckTab(); }catch(err){ alert('지우지 못했어요: '+err.message); } });
  document.querySelectorAll('[data-ckmv]').forEach(b=>b.onclick=async()=>{ const it=issues[+b.dataset.ckmv], to=examById($(`[data-ckto="${b.dataset.ckmv}"]`).value), from=examById(it.act.from);
    if(!to||to.id===from.id) return alert('옮길 시험을 골라 주세요.');
    if(!confirm(`${it.act.ids.length}명 답안을 옮길까요?\n\n${from.name} (${fmtYM(from.exam_date)})\n→ ${to.name} (${fmtYM(to.exam_date)})\n\n점수는 옮긴 시험 정답으로 다시 채점돼요. 옮길 시험에 이미 답안이 있는 학생은 건너뛰어요.`)) return;
    b.disabled=true; b.textContent='옮기는 중…';
    try{ const res=await moveResponses(R[from.id].filter(r=>it.act.ids.includes(r.id)), to); delete SUMCACHE[from.id]; delete SUMCACHE[to.id];
      alert(`${res.n}명 옮겼어요.${res.skip.length?`\n이미 답안이 있어 건너뛴 학생 ${res.skip.length}명: ${res.skip.join(', ')}\n(이 학생들은 원래 시험에 남아 있어요. 필요하면 지워 주세요.)`:''}`); renderCheckTab(); }
    catch(err){ alert('옮기지 못했어요: '+err.message); b.disabled=false; b.textContent='이 시험으로 옮기기'; } });
}

/* ===================== 6. 문항 은행 (시험지 워드) · 오답 보기 · 문제지 만들기 ===================== */
const W_NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const R_NS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const QSRC_PREFIX='qsrc_';
const QCACHE={};   // examId → {zip, doc, els, q, grp, rels} | null

// --- 저장: Supabase는 exam-papers 버킷(파일 이름 qsrc_…), 로컬은 브라우저 저장 ---
const b64 = buf => { let s='', b=new Uint8Array(buf); for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); };
const unb64 = s => { const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u.buffer; };
async function qsrcFile(examId){
  if(!sb) return null;
  const fs=await DB.files(examId); return fs.filter(f=>f.path.split('/').pop().startsWith(QSRC_PREFIX)).pop()||null;
}
async function saveQsrc(examId, file){
  const buf=await file.arrayBuffer();
  if(sb){
    const old=await qsrcFile(examId); if(old) await DB.deleteFile(old);
    const path=`${examId}/${QSRC_PREFIX}${Date.now()}.docx`;
    const up=await sb.storage.from(FILE_BUCKET).upload(path,new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}));
    if(up.error) throw up.error;
    const {error}=await sb.from('mx_exam_files').insert({exam_id:examId,file_name:file.name,path}); ALLFILES=null; if(error) throw error;
  } else {
    try{ localStorage.setItem('mx_qsrc_'+examId, JSON.stringify({name:file.name,data:b64(buf)})); }
    catch(e){ throw new Error('브라우저 저장공간이 부족해요. Supabase에 연결하면 용량 걱정 없이 저장돼요.'); }
  }
  delete QCACHE[examId];
}
async function qsrcInfo(examId){
  if(sb){ const f=await qsrcFile(examId); return f?{name:f.file_name}:null; }
  try{ const v=JSON.parse(localStorage.getItem('mx_qsrc_'+examId)||'null'); return v?{name:v.name}:null; }catch(e){ return null; }
}
async function loadQsrcBuf(examId){
  if(sb){ const f=await qsrcFile(examId); if(!f) return null; const url=DB.fileUrl(f);
    // 브라우저에 보관해 두고 다음부터는 바로 (파일 이름에 올린 시각이 들어가 있어 바뀌면 새 파일로 받음)
    let cache=null; try{ cache=await caches.open('mx-qsrc-v1'); const hit=await cache.match(url); if(hit) return await hit.arrayBuffer(); }catch(e){ cache=null; }
    const res=await fetch(url); if(!res.ok) throw new Error('시험지 워드를 내려받지 못했어요.');
    if(cache){ try{ await cache.put(url, res.clone()); }catch(e){} }
    return await res.arrayBuffer(); }
  try{ const v=JSON.parse(localStorage.getItem('mx_qsrc_'+examId)||'null'); return v?unb64(v.data):null; }catch(e){ return null; }
}

// --- 워드 해석: 문항 시작("21."), 묶음 머리말("[31~34]"), 끝("확인 사항"/"정답") ---
const wEls=(node,name)=>[...node.getElementsByTagNameNS(W_NS,name)];
const wText=e=>wEls(e,'t').map(t=>t.textContent).join('');
const GROUP_RE=/^\[(\d{1,2})\s*[~∼～-]\s*(\d{1,2})[^\]]*\]/;   // [31~34], [41~42 단일 장문]
const groupMatch=t=>t.match(GROUP_RE) || t.match(/^\[(\d{2})(\d{2})(?!\d)[^\]]*\]/);   // "[4345] 복합 장문"처럼 ~가 빠진 경우
async function parseDocx(buf){
  if(!window.JSZip) throw new Error('워드 처리 도구를 불러오지 못했어요. 인터넷 연결을 확인하세요.');
  const zip=await JSZip.loadAsync(buf);
  const xml=await zip.file('word/document.xml').async('string');
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const body=wEls(doc,'body')[0]; const els=[...body.children];
  const starts={}, groups=[]; let end=els.length-1;
  for(let i=0;i<els.length;i++){
    const e=els[i]; const t=wText(e).trim();
    if(e.localName==='p'){
      const m=t.match(/^(\d{1,2})\s*\./); if(m){ const n=+m[1]; if(n>=1&&n<=45&&!(n in starts)) starts[n]=i; }
      const g=groupMatch(t); if(g) groups.push([+g[1],+g[2],i]);
    }
    if(starts[45]!=null && i>starts[45] && (t.includes('확인 사항') || /정답$/.test(t) || /^정답\s*(및|과)?\s*해설/.test(t))){ end=i; break; }
    if(e.localName==='sectPr'){ end=i; break; }
  }
  const marks=[...new Set([...Object.values(starts),...groups.map(g=>g[2]),end])].sort((a,b)=>a-b);
  const nxt=i=>marks.find(m=>m>i)??end;
  const q={}; Object.entries(starts).forEach(([n,s])=>q[n]=[s,nxt(s)]);
  const grp=groups.map(([a,b,h])=>{ const first=starts[a]; const he=first!=null&&first>h?first:nxt(h); return {a,b,h,he}; });
  // 해설 구역: 문제 끝 이후 다시 "1." "2." … 로 시작하는 부분 (해석·어휘·해설)
  const hs={}, hg=[]; let last=0, docEnd=els.length;
  for(let i=end+1;i<els.length;i++){
    const e=els[i]; if(e.localName==='sectPr'){ docEnd=i; break; }
    if(e.localName!=='p') continue;
    const t=wText(e).trim();
    const m=t.match(/^(\d{1,2})\s*\./); if(m && +m[1]>last && +m[1]<=45){ hs[+m[1]]=i; last=+m[1]; continue; }
    const g=groupMatch(t); if(g) hg.push([+g[1],+g[2],i]);
  }
  const hmarks=[...new Set([...Object.values(hs),...hg.map(g=>g[2]),docEnd])].sort((a,b)=>a-b);
  const hnxt=i=>hmarks.find(m=>m>i)??docEnd;
  const hq={}; Object.entries(hs).forEach(([n,s])=>hq[n]=[s,hnxt(s)]);
  const hgrp=hg.map(([a,b,h])=>{ const first=hs[a]; const he=first!=null&&first>h?first:hnxt(h); return {a,b,h,he}; });
  const relsXml=await zip.file('word/_rels/document.xml.rels').async('string');
  const rels=new DOMParser().parseFromString(relsXml,'application/xml');
  return {zip, doc, els, q, grp, hq, hgrp, rels};
}
const QLOADING={};   // 같은 시험지를 동시에 두 번 받지 않도록
async function getQbank(examId){
  if(!(examId in QCACHE)){
    if(!QLOADING[examId]) QLOADING[examId]=(async()=>{
      try{ const buf=await loadQsrcBuf(examId); QCACHE[examId]=buf?await parseDocx(buf):null; }
      catch(e){ console.warn(e); QCACHE[examId]=null; }
      delete QLOADING[examId];
    })();
    await QLOADING[examId];
  }
  return QCACHE[examId];
}
// 해설 하나(+묶음 해석) 요소 인덱스
function hIndexes(Q, n){
  if(!Q||!Q.hq||!Q.hq[n]) return [];
  const out=[]; Q.hgrp.filter(g=>g.a<=n&&n<=g.b).forEach(g=>{ for(let i=g.h;i<g.he;i++) out.push(i); });
  const [s,e]=Q.hq[n]; for(let i=s;i<e;i++) out.push(i);
  return out;
}
// 문항 하나(+묶음 머리말·공통 지문) 요소 인덱스
function qIndexes(Q, n, withGroup=true){
  if(!Q||!Q.q[n]) return [];
  const out=[];
  if(withGroup) Q.grp.filter(g=>g.a<=n&&n<=g.b).forEach(g=>{ for(let i=g.h;i<g.he;i++) out.push(i); });
  const [s,e]=Q.q[n]; for(let i=s;i<e;i++) out.push(i);
  return out;
}

// --- 화면용 미리보기 (학생이 고른 번호 빨강, 정답 초록) ---
function runsHtml(p){
  return [...p.childNodes].map(function walk(n){
    if(n.nodeType!==1) return '';
    if(n.localName==='r'){
      const pr=wEls(n,'rPr')[0];
      const has=k=>pr&&wEls(pr,k).some(x=>x.getAttributeNS(W_NS,'val')!=='0'&&x.getAttributeNS(W_NS,'val')!=='none'&&x.getAttributeNS(W_NS,'val')!=='false');
      let t=[...n.childNodes].map(c=>c.localName==='t'?esc(c.textContent):c.localName==='tab'?'&emsp;':c.localName==='br'?'<br>':c.localName==='drawing'||c.localName==='pict'?'<span class="muted">[그림]</span>':'').join('');
      if(!t) return '';
      if(has('b')) t=`<b>${t}</b>`; if(has('i')) t=`<i>${t}</i>`; if(has('u')) t=`<u>${t}</u>`;
      return t;
    }
    if(n.localName==='hyperlink'||n.localName==='smartTag'||n.localName==='ins') return [...n.childNodes].map(walk).join('');
    return '';
  }).join('');
}
function chunkHtml(Q, idx, pick, ans){
  const mark=html=>{ const s=html.replace(/<[^>]+>/g,'').trim(); const k='①②③④⑤'.indexOf(s[0])+1;
    return k&&k===pick&&k!==ans?`<span class="q-pick">${html}</span>`:k&&k===ans?`<span class="q-ans">${html}</span>`:html; };
  // 한 줄에 보기가 여러 개("③ endurance   ④ unpopularity")면 보기마다 나눠서 표시
  // 지문 속 번호(밑줄 어휘·무관한 문장·문장 삽입 위치 등): 번호 글자와 이어진 밑줄 부분만 색칠
  const inlineMark=h=>{
    if((!pick&&!ans) || !/[①②③④⑤]/.test(h)) return h;
    const box=document.createElement('div'); box.innerHTML=h;
    const tw=document.createTreeWalker(box,NodeFilter.SHOW_TEXT), hits=[]; let n; while((n=tw.nextNode())) if(/[①②③④⑤]/.test(n.nodeValue)) hits.push(n);
    hits.forEach(t=>{ const frag=document.createDocumentFragment(), parts=t.nodeValue.split(/([①②③④⑤])/);
      for(let j=0;j<parts.length;j++){ const x=parts[j], k=x.length===1?'①②③④⑤'.indexOf(x)+1:0, cls=k?(k===ans?'q-ans':k===pick?'q-pick':''):'';
        if(!cls){ if(x) frag.appendChild(document.createTextNode(x)); continue; }
        const sp=document.createElement('span'); sp.className=cls+' q-mk'; sp.textContent=x;
        // 무관한 문장처럼 번호가 문장 맨 앞이면(앞은 문장 끝, 뒤는 대문자) 다음 번호 전까지 그 문장 전체를 색칠
        const pre=j>0?parts[j-1]:'', nxt=parts[j+1]||'';
        if((/[.?!"”’]\s*$/.test(pre) || (j===1&&!pre.trim()&&t===hits[0]&&!t.previousSibling)) && /^\s+["“‘']?[A-Z]/.test(nxt)){ sp.textContent=x+nxt; sp.classList.remove('q-mk'); sp.classList.add('q-sent'); j++; }
        frag.appendChild(sp); }
      t.replaceWith(frag); });
    box.querySelectorAll('.q-mk').forEach(sp=>{ const cls=sp.classList.contains('q-ans')?'q-ans':'q-pick';
      const u=sp.closest('u'); if(u){ u.classList.add(cls); return; }
      let cur=sp, nx=null; while(cur&&cur!==box){ nx=cur.nextSibling; while(nx&&nx.nodeType===3&&!nx.nodeValue.trim()) nx=nx.nextSibling; if(nx) break; cur=cur.parentNode; }
      if(nx&&nx.nodeType===1&&!nx.classList.contains('q-mk')){ const uu=nx.localName==='u'?nx:nx.querySelector('u');   // 번호 바로 뒤 밑줄 어휘
        if(uu && nx.textContent.trim().startsWith(uu.textContent.trim())) uu.classList.add(cls); } });
    return box.innerHTML; };
  const markSeg=h=>{ const t=h.replace(/<[^>]+>/g,'');
    if(!/^\s*[①②③④⑤]/.test(t)) return inlineMark(h);
    if((t.match(/(^|\s)[①②③④⑤]/g)||[]).length<2) return mark(h);
    return h.split(/(?=[①②③④⑤])/).map(seg=>seg.replace(/<[^>]+>/g,'').trim()?mark(seg):seg).join(''); };
  const markLines=h=>h.split('<br>').map(markSeg).join('<br>');   // 한 문단 안에 줄바꿈으로 보기가 여러 개인 경우
  return idx.map(i=>{ const e=Q.els[i];
    if(e.localName==='p'){ const h=runsHtml(e); return h?`<p>${markLines(h)}</p>`:''; }
    if(e.localName==='tbl'){ const bd=wEls(e,'tblBorders')[0]; const plain=bd&&[...bd.children].every(c=>/^(nil|none)$/.test(c.getAttributeNS(W_NS,'val')||''));   // 테두리 없는 표 = 보기 배치용
      return `<table class="q-tbl${plain?' q-plain':''}">${wEls(e,'tr').map(tr=>`<tr>${[...tr.children].filter(c=>c.localName==='tc').map(tc=>`<td>${wEls(tc,'p').map(p=>markLines(runsHtml(p))).join('<br>')}</td>`).join('')}</tr>`).join('')}</table>`; }
    return '';
  }).join('');
}

function yearRange(exs){

// 시행 월 골라보기 (예: 3월·6월·9월·10월) — 연도와 상관없이 같은 달 시험끼리 (3월은 쉬운 편, 9월은 수능과 비슷 등)

const yrOf=e=>(e.exam_date||'').slice(0,4);

const HP_ONLY=true;

async function openHpWorksheet(name, code, rows, onSaved){
  $('#modal').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(name)} 학평 유형 문제지</h2><button class="btn" id="closeM">닫기</button></div><div id="wsBody"><p class="muted">학평 시험지 불러오는 중…</p></div>`;

  const keyOf=it=>(it.cat||'미지정')+'|'+(it.sub||'');
  const taken=rows.slice().sort((a,b)=>koCmp(examDateKey(b.ex),examDateKey(a.ex)));   // 최신 응시 먼저
  const bank=[]; for(const ex of BANK){ const Q=QCACHE[ex.id]; if(!Q) continue; ex.items.forEach(it=>{ if(it.cat!=='듣기' && Q.q[it.no]) bank.push({ex,it,key:keyOf(it)}); }); }
  const myGrade=taken[0]?normGrade(taken[0].ex.grade):'';
  const grades=[...new Set(bank.map(x=>normGrade(x.ex.grade)))].sort(koCmp);
  const yrs=[...new Set(bank.map(x=>yrOf(x.ex)).filter(Boolean))].sort().reverse(), mons=[...new Set(bank.map(x=>monOf(x.ex)).filter(Boolean))].sort((a,b)=>a-b);
  // 이 학생이 전에 받은 문제지 → 이미 받은 문항 (추천에서 빼기)

  const given={}; (past||[]).forEach(w=>(w.items||[]).forEach(x=>{ const k=x.exam_id+'|'+x.no; if(!given[k]) given[k]=localDay(w.created_at); }));
  const gk=x=>x.ex.id+'|'+x.it.no;
  const st={skipGiven:true, recent:Math.min(3,taken.length)||0, th:30, n:15, grades:new Set(grades.includes(myGrade)?[myGrade]:grades), yrs:new Set(yrs), mons:new Set(mons), open:new Set()};
  let sel=new Set();   // bank 인덱스
  const ymS=e=>{ const d=e.exam_date||''; return d?`${d.slice(2,4)}.${d.slice(5,7)}`:'?'; };
  // 학생 약점: 최근 N회 응시 기록에서 세부 유형별 오답률
  const weak=()=>{ const m={}; (st.recent?taken.slice(0,st.recent):taken).forEach(o=>o.ex.items.forEach((it,i)=>{ if(it.cat==='듣기') return; const k=keyOf(it), z=m[k]=m[k]||{w:0,n:0}; z.n++; if(!isOk(o.r.answers[i],it)) z.w++; }));
    return Object.entries(m).map(([k,z])=>({k,...z,rate:pct(z.w,z.n)})).filter(z=>z.w>0 && z.rate>=st.th).sort((a,b)=>b.rate-a.rate||b.w-a.w); };
  const cand=(k)=>bank.map((x,j)=>[x,j]).filter(([x])=>x.key===k && st.grades.has(normGrade(x.ex.grade)) && (!yrs.length||st.yrs.has(yrOf(x.ex))) && (!mons.length||st.mons.has(monOf(x.ex))));

  const autopick=W=>{ sel=new Set(); const candA=k=>cand(k).filter(([x])=>!st.skipGiven||!given[gk(x)]);   // 이미 받은 문항은 추천에서 뺌

    const q={}; ks.forEach(z=>q[z.k]=0); let left=st.n;
    for(const z of ks){ if(left<=0) break; q[z.k]=1; left--; }   // 약한 유형부터 최소 1문항씩
    while(left>0){ let best=null, bv=-1; for(const z of ks){ if(q[z.k]>=candA(z.k).length) continue; const v=z.rate/(q[z.k]+1); if(v>bv){ bv=v; best=z; } } if(!best) break; q[best.k]++; left--; }   // 남은 문항은 오답률 비례
    ks.forEach(z=>{ const byEx={}; candA(z.k).forEach(([x,j])=>(byEx[x.ex.id]=byEx[x.ex.id]||[]).push(j));
      const order=Object.keys(byEx).sort((a,b)=>koCmp(examDateKey(examById(b)),examDateKey(examById(a)))); let got=0, r=0;
      while(got<q[z.k] && order.some(id=>byEx[id].length>r)){ for(const id of order){ if(got>=q[z.k]) break; const j=byEx[id][r]; if(j!=null){ sel.add(j); got++; } } r++; } }); };
  const render=(repick)=>{
    const W=weak(); if(repick) autopick(W);
    const recentLbl=n=>{ const l=(n?taken.slice(0,n):taken).map(o=>ymS(o.ex)); return l.join(' · '); };
    const quick=k=>{ const ys=k==='all'?yrs:yrs.slice(0,k); return yrs.length===st.yrs.size&&k==='all' || (k!=='all'&&st.yrs.size===ys.length&&ys.every(y=>st.yrs.has(y))&&st.mons.size===mons.length); };
    $('#wsBody').innerHTML=`
    <label class="f" style="margin:10px 0">문제지 제목<input id="wsTitle" value="${esc($('#wsTitle')?$('#wsTitle').value:name+' 학평 유형 문제지')}"></label>
    <div class="ws-cond">
      <div class="ws-cond-h">① 학생 약점 기준</div>

        <label class="f">분석할 응시 기록<select id="hpRecent">${[3,5].filter(n=>n<taken.length).map(n=>`<option value="${n}" ${st.recent===n?'selected':''}>최근 ${n}회 (${recentLbl(n)})</option>`).join('')}<option value="0" ${!st.recent||st.recent>=taken.length?'selected':''}>전체 ${taken.length}회 (${recentLbl(0)})</option></select></label>

        <span class="muted" style="align-self:flex-end;padding-bottom:8px">낮출수록 많은 유형이 들어가요 · 0 = 한 번이라도 틀린 유형 전부</span>

      </div>
      <details style="margin-top:6px" ${st.yrs.size!==yrs.length||st.mons.size!==mons.length?'open':''}><summary class="muted" style="cursor:pointer">연도·월 직접 선택 (예: 24년 3월만)</summary><div class="row" style="gap:16px;margin-top:6px">${yrBoxes(yrs,st.yrs,'data-hpy')}${monBoxes(mons,st.mons,'data-hpm')}</div></details>

        <div ${op?'':'hidden'}>${cs.map(([x,j])=>`<div class="ws-item" style="padding-left:24px"><input type="checkbox" data-hpi="${j}" data-hpk="${esc(k)}" ${sel.has(j)?'checked':''}> <span class="ws-prev" data-prev="${j}" title="눌러서 문제 미리 보기"><span class="muted">${esc(x.ex.name)} · ${x.it.no}번 ▾</span></span>${given[gk(x)]?` <span class="pill" style="background:#f1f5f9;color:#64748b;font-size:11px">받음 ${esc(given[gk(x)].slice(5).replace('-','/'))}</span>`:''}</div><div class="ws-pv" id="pv-${j}" hidden></div>`).join('')}</div></div>`; }).join('') || `<p class="muted">${W.length?'고른 학년·시기에 같은 유형의 학평 문제가 없어요.':''}</p>`}</div>
    <p class="muted">유형 이름을 누르면 후보 문제가 펼쳐져요. 듣기는 빠져 있고, 묶음 문제는 공통 지문이 같이 들어가요. 조건을 바꾸면 추천을 새로 뽑아요.</p>
    <div class="row" style="margin-top:10px"><label class="ws-item" style="cursor:pointer"><input type="checkbox" id="wsHae" checked> 맨 뒤에 해설 붙이기 (해석·어휘·해설)</label></div>
    <div class="row" style="margin-top:6px"><button class="btn primary" id="wsGo">워드로 만들기</button></div>`;
    const cnt=()=>{ const l=[...sel].map(j=>bank[j]); const h=l.filter(x=>{ const Q=QCACHE[x.ex.id]; return Q&&Q.hq&&Q.hq[x.it.no]; }).length;
      $('#wsCnt').textContent=`${l.length}문항 선택 · 해설 있는 문항 ${h}개`;
      document.querySelectorAll('[data-hpgk]').forEach(b=>{ const cs=[...document.querySelectorAll(`[data-hpk="${CSS.escape(b.dataset.hpgk)}"]`)], k=cs.filter(c=>c.checked).length;
        b.checked=cs.length>0&&k===cs.length; b.indeterminate=k>0&&k<cs.length; const gc=document.querySelector(`[data-hpgc="${CSS.escape(b.dataset.hpgk)}"]`); if(gc){ gc.textContent=`${k}개 선택`; gc.style.color=k?'var(--main)':'var(--sub)'; } }); };
    document.querySelectorAll('[data-hpi]').forEach(c=>c.onchange=()=>{ c.checked?sel.add(+c.dataset.hpi):sel.delete(+c.dataset.hpi); cnt(); });
    document.querySelectorAll('[data-hpgk]').forEach(b=>b.onchange=()=>{ document.querySelectorAll(`[data-hpk="${CSS.escape(b.dataset.hpgk)}"]`).forEach(c=>{ c.checked=b.checked; b.checked?sel.add(+c.dataset.hpi):sel.delete(+c.dataset.hpi); }); cnt(); });
    document.querySelectorAll('[data-hpopen]').forEach(h=>h.onclick=()=>{ const k=h.dataset.hpopen, box=h.parentElement.nextElementSibling; box.hidden=!box.hidden; box.hidden?st.open.delete(k):st.open.add(k); h.firstChild.textContent=box.hidden?'▸ ':'▾ '; });
    document.querySelectorAll('#hpList [data-prev]').forEach(el=>el.onclick=()=>{ const j=+el.dataset.prev, box=$('#pv-'+j), x=bank[j];
      if(!box.hidden){ box.hidden=true; return; }
      if(!box.innerHTML){ const Q=QCACHE[x.ex.id]; box.innerHTML=Q?`<div class="q-body" style="margin:0">${chunkHtml(Q,qIndexes(Q,x.it.no),0,+x.it.answer||0)}</div>`:'<span class="muted">문제를 불러오지 못했어요.</span>'; }
      box.hidden=false; });
    const re=()=>render(true);
    $('#hpRecent').onchange=e=>{ st.recent=+e.target.value; re(); };
    $('#hpTh').onchange=e=>{ st.th=Math.max(0,Math.min(100,Math.round(+e.target.value||0))); re(); };
    $('#hpN').onchange=e=>{ st.n=Math.max(1,Math.min(100,Math.round(+e.target.value||15))); re(); };
    $('#hpRe').onclick=re;
    const sk=$('#hpSkip'); if(sk) sk.onchange=()=>{ st.skipGiven=sk.checked; re(); };
    document.querySelectorAll('[data-hpg]').forEach(c=>c.onchange=()=>{ c.checked?st.grades.add(c.dataset.hpg):st.grades.delete(c.dataset.hpg); re(); });
    document.querySelectorAll('[data-hpq]').forEach(b=>b.onclick=()=>{ const k=b.dataset.hpq; st.yrs=new Set(k==='all'?yrs:yrs.slice(0,+k)); st.mons=new Set(mons); re(); });
    document.querySelectorAll('[data-hpy]').forEach(c=>c.onchange=()=>{ c.checked?st.yrs.add(c.dataset.hpy):st.yrs.delete(c.dataset.hpy); re(); });
    document.querySelectorAll('[data-hpm]').forEach(c=>c.onchange=()=>{ c.checked?st.mons.add(+c.dataset.hpm):st.mons.delete(+c.dataset.hpm); re(); });
    $('#wsGo').onclick=async()=>{ const list=[...sel].map(j=>bank[j]); if(!list.length) return alert('문제를 하나 이상 골라주세요.');
      const b=$('#wsGo'); b.disabled=true; b.textContent='만드는 중…';
      const title=$('#wsTitle').value.trim()||'학평 유형 문제지', hae=$('#wsHae').checked;
      let made=false; try{ await buildWorksheet(title, list, hae); made=true; }
      catch(err){ alert('문제지를 만들지 못했어요: '+err.message); }
      if(made && code){   // 만든 문제지 기록 (다시 인쇄·다음 추천에서 빼기)
        const last=taken[0]&&taken[0].r||{};
        try{ await DB.addWorksheet({branch:last.branch||prefs.branch||'', member_code:code, student_name:name, class_name:last.class_name||'', title, with_hae:hae,
              items:list.map(x=>({exam_id:x.ex.id, no:x.it.no})), created_by_name:ME?(ME.display_name||ME.teacher_name||ME.username||''):''});
          list.forEach(x=>{ if(!given[gk(x)]) given[gk(x)]=localDay(new Date()); }); if(past) past.unshift({items:list.map(x=>({exam_id:x.ex.id,no:x.it.no}))});
          if(onSaved) onSaved(); }
        catch(err){ alert('문제지는 만들었지만 기록은 저장하지 못했어요.\nSupabase SQL Editor에서 \'문제지_기록_표.sql\'을 먼저 실행해 주세요.\n('+err.message+')'); }
      }
