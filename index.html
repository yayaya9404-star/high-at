/* ===================== 2. OMR 입력 ===================== */
async function renderOmrTab(){
  if(!EXAMS.length){ $('#tab-omr').innerHTML='<div class="card"><p class="muted">먼저 시험을 등록하세요.</p></div>'; return; }
  if(!omrExamId || !examById(omrExamId)) omrExamId=[...EXAMS].sort((x,y)=>koCmp(roundKey(y),roundKey(x)) || koCmp(gradeKey(x),gradeKey(y)) || koCmp(examDateKey(y),examDateKey(x)))[0].id;   // 처음엔 가장 최신 회차 시험 (예전엔 마지막에 등록한 시험이라 옛 회차가 열릴 수 있었음)
  const ex=examById(omrExamId);
  const rs=await getResponses(ex.id);

  // 명단: 이 분원 학생 중 시험 학년과 응시 학년이 같은 학생 (응시 학년이 비어 있으면 포함)
  const eg=normGrade(ex.grade);
  const branchAll=await getRoster(prefs.branch, roundKey(ex));
  const roster=branchAll.filter(s=>!eg || !s.grade || normGrade(s.grade)===eg);
  const classes=[...new Set(roster.map(s=>s.class_name))].sort(koCmp);
  let cls=prefs.omrClass;
  if(cls!=='__manual' && !classes.includes(cls)) cls = classes.length ? classes[0] : '__manual';
  const manual = cls==='__manual';
  const respOf = s => rs.find(r=>sameStudent(r,s));

  let stuList=[], cur=null, curIdx=-1;
  if(!manual){
    stuList=roster.filter(s=>s.class_name===cls);
    cur=stuList.find(s=>stuKey(s)===omrCur) || stuList.find(s=>!respOf(s)) || stuList[0];
    curIdx=stuList.indexOf(cur); omrCur=cur?stuKey(cur):null;
    editingResp = cur ? (respOf(cur)||null) : null;
  }
  const er=editingResp;
  const doneCnt=stuList.filter(respOf).length;
  const allDone=!manual && stuList.length>0 && doneCnt===stuList.length;
  const list = manual
    ? rs.filter(r=>r.branch===prefs.branch).sort((a,b)=>koCmp(a.class_name,b.class_name)||koCmp(a.student_name,b.student_name))
    : [];
  const rosterHint = manual
    ? (branchAll.length && !roster.length ? `<div class="hint">${esc(prefs.branch)} 명단에 ${esc(eg)} 응시 학생이 없어요. 명단의 응시 학년이나 시험의 학년을 확인하세요.</div>`
       : !branchAll.length ? `<div class="hint">학생 명단 탭에서 명단을 올리면, 반을 고르고 학생별로 이어서 입력할 수 있어요.</div>` : '')
    : '';

  $('#tab-omr').innerHTML=`
  <div class="grid2" style="grid-template-columns:1fr 340px">
    <div class="card">
      <div class="row">
        ${examPicker('omrP',ex.id)}
        <label class="f">분원<select id="omrBranch">${BRANCHES.map(b=>`<option ${b===prefs.branch?'selected':''}>${b}</option>`).join('')}</select></label>
        ${classes.length?`<label class="f">반<select id="omrClsSel">${classes.map(c=>`<option value="${esc(c)}" ${c===cls?'selected':''}>${esc(c)}</option>`).join('')}<option value="__manual" ${manual?'selected':''}>직접 입력</option></select></label>`:''}
        ${manual?`<label class="f">반<input id="omrClass" value="${esc(er?er.class_name:(prefs.lastClass||''))}" style="width:110px"></label>
        <label class="f">이름<input id="omrName" value="${esc(er?er.student_name:'')}" style="width:130px"></label>
        <label class="f">회원코드 (선택)<input id="omrCode" value="${esc(er?er.member_code||'':'')}" style="width:120px"></label>`
        :`<input type="hidden" id="omrClass" value="${esc(cls)}"><input type="hidden" id="omrName" value="${esc(cur?cur.student_name:'')}"><input type="hidden" id="omrCode" value="${esc(cur?cur.member_code||'':'')}">`}
      </div>
      ${rosterHint}
      ${!manual&&cur?`<div class="row" style="margin-top:14px;justify-content:space-between">
        <div><span class="cur-name">${esc(cur.student_name)}</span>
          <span class="muted"> ${curIdx+1}/${stuList.length}번째 · ${er?'입력됨 (다시 저장하면 수정)':'미입력'}</span></div>
        <button class="btn sm" id="omrSkip">건너뛰기 (결시)</button></div>`:''}
      <div class="muted" style="margin-top:12px">답안 (${ex.q_count}칸 · 숫자 1~5, 무응답은 0) — 치면 다음 칸으로 넘어가요. 틀린 칸은 눌러서 고치고, Enter로 저장${manual?'':' 후 다음 학생'}</div>
      <input type="hidden" id="omrAns" value="${er?esc(er.answers):''}">
      <div class="row" style="margin-top:10px;justify-content:space-between">
        <div><span class="score-big" id="omrScore">0</span><span class="muted"> 점 · <span id="omrCnt">0</span>/${ex.q_count} 입력</span></div>
        <div class="row">${manual&&er?'<span class="muted">수정 중: '+esc(er.student_name)+'</span>':''}
          <button class="btn" id="omrXl">엑셀로 한 번에 입력</button>${manual?'<button class="btn" id="omrReset">비우기</button>':''}<button class="btn primary" id="omrSave">저장</button></div>
      </div>
      ${allDone?`<div class="done-box">${esc(cls)} ${stuList.length}명 입력을 모두 마쳤어요. 학생을 눌러 수정하거나 다른 반을 고르세요.</div>`:''}
      <div class="omr-grid" id="omrGrid">${ex.items.map((it,i)=>`<div class="omr-cell" title="${esc(it.cat+' '+it.sub)}"><div class="n">${it.no}</div><input data-q="${i}" inputmode="numeric" autocomplete="off" aria-label="${it.no}번"></div>`).join('')}</div>
    </div>
    <div class="card">
      ${manual?`
      <h2>${esc(prefs.branch)} 입력 현황 (${list.length}명)</h2>
      <div style="max-height:640px;overflow:auto">
      <table><thead><tr><th>반</th><th>이름</th><th>점수</th><th></th></tr></thead><tbody>
      ${list.map(r=>`<tr class="click" data-edit="${r.id}"><td>${esc(r.class_name)}</td><td>${esc(r.student_name)}</td><td><b>${r.score}</b>${r.answers.length<ex.q_count?' <span class="muted">('+r.answers.length+')</span>':''}</td>
        <td><button class="btn sm danger" data-rdel="${r.id}">삭제</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">아직 없습니다.</td></tr>'}
      </tbody></table></div>`
      :`
      <h2>${esc(cls)} (${doneCnt}/${stuList.length} 입력)</h2>
      <div style="max-height:640px;overflow:auto">
      <table><thead><tr><th>#</th><th>이름</th><th>점수</th><th></th></tr></thead><tbody>
      ${stuList.map((s,i)=>{ const r=respOf(s); return `<tr class="click stu-row ${s===cur?'cur':''} ${r?'done':''}" data-stu="${esc(stuKey(s))}"><td>${i+1}</td><td>${esc(s.student_name)}</td>
        <td>${r?`<b>${r.score}</b>${r.answers.length<ex.q_count?' <span class="muted">('+r.answers.length+')</span>':''}`:'<span class="muted">미입력</span>'}</td>
        <td>${r?`<button class="btn sm danger" data-rdel="${r.id}">삭제</button>`:''}</td></tr>`; }).join('')}
      </tbody></table></div>`}
    </div>
  </div>`;

  bindExamPicker('omrP', ex.id, id=>{ omrExamId=id; editingResp=null; omrCur=null; renderOmrTab(); });
  $('#omrBranch').onchange=e=>{ prefs.branch=e.target.value; savePrefs(); editingResp=null; omrCur=null; renderOmrTab(); };
  const cs=$('#omrClsSel'); if(cs) cs.onchange=e=>{ prefs.omrClass=e.target.value; savePrefs(); editingResp=null; omrCur=null; renderOmrTab(); };
  const ans=$('#omrAns');
  const cells=[...document.querySelectorAll('#omrGrid input')];
  // 칸 → 숨은 답안 문자열 (마지막 입력 칸까지, 중간 빈칸은 0=무응답)
  const update=()=>{
    let last=-1; cells.forEach((c,i)=>{ if(c.value) last=i; });
    const v=cells.slice(0,last+1).map(c=>c.value||'0').join('');
    ans.value=v; ans.dataset.gaps=cells.slice(0,last+1).map((c,i)=>c.value?'':i+1).filter(Boolean).join(',');
    const g=gradeAnswers(ex,v); $('#omrScore').textContent=g.score; $('#omrCnt').textContent=cells.filter(c=>c.value).length;
    cells.forEach((c,i)=>{ c.parentNode.classList.toggle('o',!!c.value&&isOk(c.value,ex.items[i])); c.parentNode.classList.toggle('x',!!c.value&&!isOk(c.value,ex.items[i])); });
  };
  const go=i=>{ const c=cells[Math.max(0,Math.min(cells.length-1,i))]; c.focus(); c.select(); };
  const init=(ans.value||'').replace(/[^0-5ox]/g,'');
  cells.forEach((c,i)=>{ const ch=init[i]; c.value = ch===undefined?'':ch==='o'?'':ch==='x'?'':ch; });
  cells.forEach((c,i)=>{
    c.oninput=()=>{
      const d=c.value.replace(/[^0-5]/g,'');
      if(d.length<=1){ c.value=d; update(); if(d) go(i+1); return; }
      [...d].forEach((ch,k)=>{ if(cells[i+k]) cells[i+k].value=ch; });   // 여러 개 붙여넣기 → 이어서 채움
      update(); go(i+d.length);
    };
    c.onkeydown=e=>{
      if(e.key==='Enter'){ e.preventDefault(); saveOmr(ex,onSaved); }
      else if(e.key==='Backspace' && !c.value){ e.preventDefault(); if(i>0){ cells[i-1].value=''; update(); go(i-1); } }
      else if(e.key==='ArrowLeft'){ e.preventDefault(); go(i-1); }
      else if(e.key==='ArrowRight'){ e.preventDefault(); go(i+1); }
      else if(/^[0-5]$/.test(e.key) && c.value){ e.preventDefault(); c.value=e.key; update(); go(i+1); }   // 채워진 칸은 덮어쓰기
    };
    c.onfocus=()=>c.select();
  });
  ans.focus=()=>{ const f=cells.findIndex(c=>!c.value); go(f<0?cells.length-1:f); };
  update();

  // 명단 모드: 저장 후 같은 반에서 아직 입력하지 않은 다음 학생으로
  const nextStudent=(fromIdx, onlyUndone)=>{
    if(!stuList.length) return null;
    const rs2=resCache[ex.id]||[];
    const done=s=>rs2.some(r=>sameStudent(r,s));
    const order=[...stuList.slice(fromIdx+1),...stuList.slice(0,fromIdx+1)];
    return (onlyUndone ? order.find(s=>!done(s)) : null) || stuList[Math.min(fromIdx+1,stuList.length-1)];
  };
  const onSaved = manual ? null : ()=>{ const n=nextStudent(curIdx,true); omrCur=n?stuKey(n):omrCur; };

  if(manual){
    $('#omrName').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); ans.focus(); } };
    $('#omrClass').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#omrName').focus(); } };
    $('#omrReset').onclick=()=>{ editingResp=null; renderOmrTab(); };
  }
  $('#omrSave').onclick=()=>saveOmr(ex,onSaved);
  $('#omrXl').onclick=()=>openAnswerImport(ex);
  const sk=$('#omrSkip'); if(sk) sk.onclick=()=>{ const n=nextStudent(curIdx,false); omrCur=n?stuKey(n):omrCur; renderOmrTab(); };

  document.querySelectorAll('[data-edit]').forEach(tr=>tr.onclick=e=>{
    if(e.target.dataset.rdel) return;
    editingResp=rs.find(r=>r.id===tr.dataset.edit); renderOmrTab(); $('#omrAns').focus();
  });
  document.querySelectorAll('[data-stu]').forEach(tr=>tr.onclick=e=>{
    if(e.target.dataset.rdel) return;
    omrCur=tr.dataset.stu; renderOmrTab();
  });
  document.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation(); const r=rs.find(x=>x.id===b.dataset.rdel);
    if(!confirm(`${r.student_name} 학생의 답안을 삭제할까요?`)) return;
    try{ await DB.deleteResponse(r.id); await getResponses(ex.id,true); if(editingResp&&editingResp.id===r.id) editingResp=null; renderOmrTab(); }
    catch(err){ alert('삭제 실패: '+err.message); }
  });
  if(manual) (er? ans : $('#omrName')).focus();
  else ans.focus();
}

let omrSaving=false;
async function saveOmr(ex, onSaved){
  if(omrSaving) return;
  const code=($('#omrCode')?$('#omrCode').value.trim():'');
  const name=$('#omrName').value.trim(), cls=$('#omrClass').value.trim(), answers=$('#omrAns').value.replace(/[^0-5]/g,'');
  if(!name){ alert('이름을 입력하세요.'); $('#omrName').focus(); return; }
  if(!answers.length){ alert('답안을 입력하세요.'); return; }
  const gaps=$('#omrAns').dataset.gaps||'';
  if(gaps && !confirm(`${gaps}번 칸이 비어 있어요. 무응답(0)으로 저장할까요?`)) return;
  if(answers.length<ex.q_count && !confirm(`${answers.length}문항만 입력됐습니다. 나머지는 무응답으로 저장할까요?`)) return;
  const rs=await getResponses(ex.id);
  let id = editingResp ? editingResp.id : null;
  const dup = rs.find(r=>r.id!==id && (code ? r.member_code===code : (!r.member_code && r.branch===prefs.branch && r.student_name===name && r.class_name===cls)));
  if(dup){
    if(!confirm(`${prefs.branch} ${cls} ${name} 학생 답안이 이미 있습니다. 덮어쓸까요?`)) return;
    id=dup.id;
  }
  const prevRec=id?rs.find(r=>r.id===id):null;
  const rosterNow=await getRoster(prefs.branch, roundKey(ex));
  const teacher=(prevRec&&prevRec.teacher) || ((rosterOf({member_code:code,student_name:name,class_name:cls},rosterNow)||{}).teacher) || '';   // 입력 시점 담임 기록
  const rec={id:id||uid(), exam_id:ex.id, branch:prefs.branch, class_name:cls, student_name:name, member_code:code||null, teacher, answers, score:gradeAnswers(ex,answers).score};
  if(!sb) rec.created_at=nowIso();
  omrSaving=true;
  try{
    await DB.saveResponse(rec); await getResponses(ex.id,true);
    if(onSaved) onSaved();
    prefs.lastClass=cls; savePrefs(); editingResp=null; renderOmrTab();
  }catch(err){ alert('저장 실패: '+err.message); }
  finally{ omrSaving=false; }
}

/* ===================== 3. 결과·분석 ===================== */
let resSort={k:'score',d:-1};   // 학생 성적 표 정렬: 머리글 클릭 (k: br 분원 / cls 반 / name 이름 / score 총점 / prev 지난 시험 / chg 변화, d: 1 오름 · -1 내림)
let resSub='students', resBranch='전체', resCmp={}, resCls='', resClsTh=40;   // resCmp[시험id] = 비교할 시험 id ('' = 비교 안 함)
const examDateKey = e => (e.exam_date||String(e.created_at||'').slice(0,10)||'');
function cmpCandidates(ex){ const g=normGrade(ex.grade); return EXAMS.filter(e=>e.id!==ex.id && (!g || normGrade(e.grade)===g)).sort((a,b)=>koCmp(examDateKey(b),examDateKey(a))); }
function defaultCmp(ex){ const k=examDateKey(ex); const c=cmpCandidates(ex).find(e=>examDateKey(e)<k); return c?c.id:''; }
const sameResp = (a,b) => (a.member_code && b.member_code) ? a.member_code===b.member_code : (a.branch===b.branch && a.student_name===b.student_name);
// 문항 클릭 → 시험지 문제 + 오답률·선지별 선택 비율
async function openQuestionView(ex, no, rs, label){
  const i=ex.items.findIndex(it=>it.no===no), it=ex.items[i]; if(!it) return;
  const wr=rs.length?Math.round(rs.filter(r=>!isOk(r.answers[i],it)).length/rs.length*100):null;
  const cnt=[0,0,0,0,0,0]; rs.forEach(r=>cnt[+r.answers[i]||0]++);
  const noDist=oxOnly(ex)||rs.some(r=>/[ox]/.test(r.answers));
  $('#modal').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(ex.name)} · ${no}번</h2><button class="btn" id="closeM">닫기</button></div>
    <p style="margin:8px 0">${pill(it.cat)} <b>${esc(it.sub||'')}</b> · 정답 ${circled(+it.answer)} · ${it.points}점 · ${esc(label||'')} 응시 ${rs.length}명 · 오답률 <b class="mark-x">${wr==null?'-':wr+'%'}</b></p>
    ${noDist||!rs.length?'':`<div class="row" style="gap:6px;margin-bottom:8px">${[1,2,3,4,5].map(n=>`<span class="pill" style="${n===+it.answer?'background:#dcfce7;color:#166534':'background:#f1f5f9;color:#334155'}">${'①②③④⑤'[n-1]} ${pct(cnt[n],rs.length)}% (${cnt[n]}명)</span>`).join('')}<span class="pill" style="background:#f1f5f9;color:#334155">무응답 ${pct(cnt[0],rs.length)}%</span></div>`}
    <div id="qvBody"><p class="muted">시험지 불러오는 중…</p></div>`;
  $('#closeM').onclick=()=>$('#modalBg').classList.remove('show');
  $('#modalBg').classList.add('show');
  try{ const Q=await getQbank(ex.id);
    $('#qvBody').innerHTML=Q&&Q.q[no]?`<div class="q-body" style="margin:0">${chunkHtml(Q,qIndexes(Q,no),0,+it.answer||0)}</div>`:'<p class="muted">이 시험은 시험지 워드가 등록되지 않아 문제를 보여줄 수 없어요. (시험 관리에서 워드를 올리면 보여요)</p>';
  }catch(err){ $('#qvBody').innerHTML=`<p class="muted">문제를 불러오지 못했어요: ${esc(err.message)}</p>`; }
}
function wrongRates(ex, rs){
  return ex.items.map((it,i)=>{
    const n=rs.length; if(!n) return null;
    const w=rs.filter(r=>!isOk(r.answers[i],it)).length;
    return Math.round(w/n*100);
  });
}
function catScores(ex, answers){
  const m={};
  ex.items.forEach((it,i)=>{ const c=it.cat||'미지정'; m[c]=m[c]||{got:0,max:0,ok:0,n:0}; m[c].max+=+it.points; m[c].n++; if(isOk(answers[i],it)){ m[c].got+=+it.points; m[c].ok++; } });
  return m;
}
const catsOf = ex => [...new Set(ex.items.map(i=>i.cat||'미지정'))].sort((a,b)=>CATS.indexOf(a)-CATS.indexOf(b));

async function renderResultTab(){
  if(!EXAMS.length){ $('#tab-result').innerHTML='<div class="card"><p class="muted">먼저 시험을 등록하세요.</p></div>'; return; }
  if(!resExamId || !examById(resExamId)){   // 처음 열면 가장 최신 회차 시험부터 (같은 회차면 고1부터) — 회차·학년은 드롭다운으로 바꾸기
    const latest=[...EXAMS].sort((x,y)=>koCmp(roundKey(y),roundKey(x)) || koCmp(gradeKey(x),gradeKey(y)) || koCmp(examDateKey(y),examDateKey(x)))[0];
    resExamId=latest.id; }
  const ex=examById(resExamId);
  const all=await getResponses(ex.id,true);
  // 담임 계정: 기본은 내 담당 학생만 (담임 = 입력 때 기록된 담임, 없으면 그 회차 명단의 담임)
  const mineT=myTeacher();   // 담임 계정은 서버에서 내 담당 학생 답안만 내려줌
  const rs = resBranch==='전체' ? all : all.filter(r=>r.branch===resBranch);
  const scores=rs.map(r=>r.score);
  const avg = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : '-';
  const cats=catsOf(ex);
  const sorted=[...rs].sort((a,b)=>b.score-a.score);
  const rankOf = s => sorted.findIndex(r=>r.score===s)+1;
  const wr=wrongRates(ex,rs);
  // 지난 시험 비교 (같은 학년)
  if(!(ex.id in resCmp)) resCmp[ex.id]=defaultCmp(ex);
  const cmpEx=resCmp[ex.id]?examById(resCmp[ex.id]):null;
  const cmpAll=cmpEx?await getResponses(cmpEx.id):[];
  const cmpRs=resBranch==='전체'?cmpAll:cmpAll.filter(r=>r.branch===resBranch);
  const to100=(sc,e)=>{ const t=totalPoints(e); return t?sc/t*100:sc; };
  const prevOf=r=>cmpRs.find(p=>sameResp(p,r));
  const cmpAvg=cmpRs.length?cmpRs.reduce((a,r)=>a+r.score,0)/cmpRs.length:null;
  const diffTag=d=>d==null?'<span class="muted">-</span>':`<b class="${d>0?'mark-o':d<0?'mark-x':''}">${d>0?'▲':d<0?'▼':''}${Math.abs(Math.round(d))}</b>`;
  const catRate=(e,list)=>{ const m={}; list.forEach(r=>{ const cs=catScores(e,r.answers); Object.entries(cs).forEach(([c,v])=>{ m[c]=m[c]||{ok:0,n:0}; m[c].ok+=v.ok; m[c].n+=v.n; }); }); return m; };
  const curCat=catRate(ex,rs), prevCat=cmpEx?catRate(cmpEx,cmpRs):{};
  // 상승순/하락순 (지난 시험 비교할 때만) — 비교 기록 없는 학생은 맨 아래
  const chgOf=r=>{ const pv=cmpEx&&prevOf(r); return pv?to100(r.score,ex)-to100(pv.score,cmpEx):null; };
  if((resSort.k==='chg'||resSort.k==='prev') && !cmpEx) resSort={k:'score',d:-1};
  const sKey={br:r=>r.branch, cls:r=>r.class_name||'', name:r=>r.student_name||'', score:r=>r.score, prev:r=>{ const pv=cmpEx&&prevOf(r); return pv?pv.score:null; }, chg:chgOf}[resSort.k];
  const view=[...sorted].sort((a,b)=>{ const x=sKey(a), y=sKey(b);
    if(x==null||y==null) return (x==null)-(y==null);   // 비교 기록 없는 학생은 항상 아래
    const c=typeof x==='number'?x-y:koCmp(String(x),String(y));
    return c*resSort.d || b.score-a.score || koCmp(a.student_name||'',b.student_name||''); });
  const sth=(k,label)=>`<th class="srt ${resSort.k===k?(resSort.d>0?'asc':'desc'):''}" data-rsort="${k}" title="눌러서 정렬">${label}</th>`;

  // 반별 분석: 반을 고르면 그 반 오답률 높은 순 (해설할 문항 고르기용)
  const clsKey=r=>(resBranch==='전체'?r.branch+' · ':'')+(r.class_name||'(반 없음)');
  const clsList=[...new Set(rs.map(clsKey))].sort(koCmp);
  if(!clsList.includes(resCls)) resCls=clsList[0]||'';
  const hideL=LS.get('mx_hideListen',false);
  const cRs=rs.filter(r=>clsKey(r)===resCls);
  const cWr=wrongRates(ex,cRs);
  const noDist=oxOnly(ex)||rs.some(r=>/[ox]/.test(r.answers));
  const cItems=ex.items.map((it,i)=>({it,i,w:cWr[i]})).filter(o=>o.w!=null && o.w>=resClsTh && !(hideL&&o.it.cat==='듣기')).sort((a,b)=>b.w-a.w||a.it.no-b.it.no);
  const cAvg=cRs.length?(cRs.reduce((a,r)=>a+r.score,0)/cRs.length).toFixed(1):'-';
  const clsHtml=`
    <div class="row" style="gap:14px;align-items:flex-end;margin:6px 0 10px">
      <label class="f">반<select id="clsSel">${clsList.map(c=>`<option ${c===resCls?'selected':''}>${esc(c)}</option>`).join('')||'<option>응답 없음</option>'}</select></label>
      <label class="f">오답률 기준<select id="clsTh">${[20,30,40,50,60,70].map(n=>`<option value="${n}" ${n===resClsTh?'selected':''}>${n}% 이상</option>`).join('')}</select></label>
      <label class="ws-item" style="cursor:pointer"><input type="checkbox" id="clsHideL" ${hideL?'checked':''}> 듣기 빼기</label>
      <span class="muted">${cRs.length}명 · 반 평균 ${cAvg}점 · 해설할 문항 <b>${cItems.length}</b>개</span>
    </div>
    ${cItems.length?`<table><thead><tr><th>번호</th><th>유형</th><th>반 오답률</th><th>${resBranch==='전체'?'전체':esc(resBranch)} 오답률</th><th>많이 고른 오답</th><th>틀린 학생</th></tr></thead><tbody>
      ${cItems.map(({it,i,w})=>{ const wrongRs=cRs.filter(r=>!isOk(r.answers[i],it)); const cnt=[0,0,0,0,0,0]; wrongRs.forEach(r=>cnt[+r.answers[i]||0]++);
        const top=[1,2,3,4,5].filter(n=>n!==+it.answer&&cnt[n]).sort((a,b)=>cnt[b]-cnt[a])[0];
        return `<tr class="click" data-resq="${it.no}" title="눌러서 문제 보기"><td><span class="qno x">${it.no}</span> <span class="muted">▾</span></td><td>${pill(it.cat)} <span class="muted">${esc(it.sub||'')}</span></td>
          <td><b class="mark-x">${w}%</b> <span class="muted">(${wrongRs.length}/${cRs.length})</span></td><td>${wr[i]==null?'-':wr[i]+'%'}</td>
          <td>${noDist?'<span class="muted">-</span>':top?`${circled(top)} <span class="muted">${cnt[top]}명</span> · 정답 ${circled(+it.answer)}`:`<span class="muted">무응답</span>`}</td>
          <td style="line-height:1.9">${wrongRs.map(r=>`<span style="white-space:nowrap">${esc(r.student_name)}${noDist?'':` <b class="pick-badge">${(+r.answers[i])?(+r.answers[i])+'번':'무응답'}</b>`}</span>`).join(', ')}</td></tr>
          <tr class="qpv-row" data-pvfor="${it.no}" hidden><td colspan="6"></td></tr>`; }).join('')}
      </tbody></table>
      <p class="muted">문항을 누르면 아래에 시험지 문제가 펼쳐져요. 틀린 학생 이름 옆 빨간 칸은 그 학생이 고른 번호예요.</p>
      <div class="row" style="margin-top:8px;gap:10px"><button class="btn primary" id="clsWs">이 문항들로 해설용 문제지 만들기 (워드)</button><label class="ws-item" style="cursor:pointer"><input type="checkbox" id="clsHae" checked> 맨 뒤에 해설 붙이기</label></div>`
    : `<p class="muted">${cRs.length?`오답률 ${resClsTh}% 이상인 문항이 없어요. 기준을 낮춰 보세요.`:'이 반 응답이 없어요.'}</p>`}`;

  $('#tab-result').innerHTML=`
  <div class="card">
    <div class="row" style="margin-bottom:14px">
      ${examPicker('resP',ex.id)}
      <label class="f">분원<select id="resBranch">${['전체',...BRANCHES].map(b=>`<option ${b===resBranch?'selected':''}>${b}</option>`).join('')}</select></label>
      ${mineT?`<span class="muted" style="align-self:flex-end;padding-bottom:8px">담임 계정 · <b>${esc(mineT)}</b> 선생님 담당 학생만 보여요</span>`:''}
      <label class="f">반 (반별 분석)<select id="resClsTop"><option value="">반 선택</option>${clsList.map(c=>`<option ${resSub==='cls'&&c===resCls?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
      <label class="f">취약 기준 (분원 오답률 미만)<input id="resTh" type="number" min="0" max="100" value="${prefs.threshold}" style="width:90px"></label>
      <label class="f">지난 시험과 비교<select id="resCmp"><option value="">비교 안 함</option>${cmpCandidates(ex).map(e=>`<option value="${e.id}" ${cmpEx&&e.id===cmpEx.id?'selected':''}>${roundLabel(roundKey(e))} · ${esc(e.name)}</option>`).join('')}</select></label>
      <button class="btn" id="csvBtn" style="align-self:flex-end">엑셀 다운로드</button>
      <button class="btn" id="csvRoundBtn" style="align-self:flex-end" title="같은 회차 고1·고2·고3을 한 파일에 (학년별 시트)">이 회차 전 학년 엑셀</button>
    </div>
    <div class="stats">
      <div class="stat"><span class="muted">응시자</span><b>${rs.length}명</b></div>
      <div class="stat hl"><span class="muted">이번 시험 평균</span><b>${avg}</b></div>
      <div class="stat"><span class="muted">최고</span><b>${scores.length?Math.max(...scores):'-'}</b></div>
      <div class="stat"><span class="muted">최저</span><b>${scores.length?Math.min(...scores):'-'}</b></div>
      ${cmpEx?`<div class="stat"><span class="muted">지난 시험 평균 (${cmpRs.length}명)</span><b>${cmpAvg==null?'-':cmpAvg.toFixed(1)}</b></div>
      <div class="stat"><span class="muted">평균 변화</span><b>${cmpAvg==null||!scores.length?'-':diffTag(to100(+avg,ex)-to100(cmpAvg,cmpEx))}</b></div>`:''}
    </div>
    ${cmpEx?`<div class="cat-bars" style="margin-top:0">${catsOf(ex).map(c=>{ const a=curCat[c], b=prevCat[c]; const cur=a?pct(a.ok,a.n):0, prev=b?pct(b.ok,b.n):null; return `
      <div class="cat-bar"><div class="row" style="justify-content:space-between">${pill(c)}<span>${prev==null?'':`${prev}% → `}<b>${cur}%</b> ${prev==null?'':diffTag(cur-prev)}</span></div>
        <div class="bar"><i style="width:${cur}%;background:${CAT_COLORS[c]||'#94a3b8'}"></i></div>
        ${prev==null?'':`<div class="bar" style="margin-top:3px;height:5px"><i style="width:${prev}%;background:#cbd5e1"></i></div>`}</div>`; }).join('')}</div>
      <p class="muted" style="margin:-8px 0 12px">유형별 정답률: 진한 막대 = 이번 시험, 회색 막대 = ${esc(cmpEx.name)}</p>`:''}
    <div class="subtabs"><button data-sub="students" class="${resSub==='students'?'active':''}">학생 성적</button><button data-sub="items" class="${resSub==='items'?'active':''}">문항 분석</button><button data-sub="cls" class="${resSub==='cls'?'active':''}">반별 분석 · 해설할 문항</button></div>
    <div style="overflow:auto">
    ${resSub==='cls' ? clsHtml : resSub==='students' ? `
      <table><thead><tr><th>순위</th>${sth('br','분원')}${sth('cls','반')}${sth('name','이름')}${sth('score','총점')}${cmpEx?sth('prev','지난 시험')+sth('chg','변화'):''}${cats.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
      ${view.map(r=>{ const cs=catScores(ex,r.answers); return `<tr class="click" data-rep="${r.id}"><td>${rankOf(r.score)}</td><td>${esc(r.branch)}</td><td>${esc(r.class_name)}</td><td><b>${esc(r.student_name)}</b></td><td><b>${r.score}</b></td>
        ${cmpEx?(()=>{ const pv=prevOf(r); return pv?`<td>${pv.score}</td><td>${diffTag(to100(r.score,ex)-to100(pv.score,cmpEx))}</td>`:'<td class="muted">-</td><td class="muted">-</td>'; })():''}
        ${cats.map(c=>`<td>${cs[c].got}/${cs[c].max}</td>`).join('')}</tr>`; }).join('') || `<tr><td colspan="${5+cats.length+(cmpEx?2:0)}" class="muted">응답이 없습니다.</td></tr>`}
      </tbody></table><p class="muted">학생을 클릭하면 개인 리포트가 열립니다. 분원·반·이름·총점${cmpEx?'·지난 시험·변화':''} 머리글을 누르면 정렬돼요 (한 번 더 누르면 반대로).</p>`
    : `
      <table><thead><tr><th>번호</th><th>유형</th><th>세부</th><th>정답</th><th>배점</th><th>오답률</th><th>선지별 선택 비율 (①~⑤ / 무응답)</th></tr></thead><tbody>
      ${ex.items.map((it,i)=>{
        const cnt=[0,0,0,0,0,0]; rs.forEach(r=>{ const a=+r.answers[i]||0; cnt[a]++; });
        return `<tr class="click" data-resq="${it.no}" title="눌러서 문제 보기"><td><span class="qno ${wr[i]!=null&&wr[i]>=50?'x':''}">${it.no}</span> <span class="muted">▾</span></td><td>${pill(it.cat)}</td><td>${esc(it.sub)}</td><td>${circled(+it.answer)}</td><td>${it.points}</td>
          <td><b>${wr[i]==null?'-':wr[i]+'%'}</b></td>
          <td>${oxOnly(ex)||rs.some(r=>/[ox]/.test(r.answers))?'<span class="muted">정오표만 있어 선지 정보 없음</span>':`<div class="dist">${[1,2,3,4,5].map(n=>`<span class="${n===+it.answer?'c':''}">${pct(cnt[n],rs.length)}%</span>`).join('')}<span>${pct(cnt[0],rs.length)}%</span></div>`}</td></tr><tr class="qpv-row" data-pvfor="${it.no}" hidden><td colspan="7"></td></tr>`;
      }).join('')}
      </tbody></table><p class="muted">문항을 누르면 바로 아래에 시험지 문제가 펼쳐져요 (정답 초록색). 시험지 워드를 올린 시험만 보여요.</p>`}
    </div>
  </div>`;
  bindExamPicker('resP', ex.id, id=>{ resExamId=id; renderResultTab(); });
  $('#resBranch').onchange=e=>{ resBranch=e.target.value; renderResultTab(); };
  $('#resCmp').onchange=e=>{ resCmp[ex.id]=e.target.value; renderResultTab(); };
  $('#resTh').onchange=e=>{ prefs.threshold=+e.target.value||30; savePrefs(); };
  document.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>{ resSub=b.dataset.sub; renderResultTab(); });
  document.querySelectorAll('[data-rep]').forEach(tr=>tr.onclick=()=>openReport(ex, all.find(r=>r.id===tr.dataset.rep), all));
  $('#csvBtn').onclick=()=>exportCsv(ex, sorted, cats);
  $('#csvRoundBtn').onclick=async e=>{ const b=e.target; b.disabled=true; b.textContent='만드는 중…';
    try{ await exportRoundXlsx(ex); }catch(err){ alert('엑셀을 만들지 못했어요: '+err.message); }
    b.disabled=false; b.textContent='이 회차 전 학년 엑셀'; };
  document.querySelectorAll('[data-rsort]').forEach(b=>b.onclick=()=>{ const k=b.dataset.rsort;
    resSort = resSort.k===k ? {k, d:-resSort.d} : {k, d:(k==='score'||k==='prev'||k==='chg')?-1:1}; renderResultTab(); });
  // 문항 줄 클릭 → 바로 아래에 시험지 문제 펼치기
  document.querySelectorAll('[data-resq]').forEach(el=>el.onclick=async()=>{
    const no=+el.dataset.resq, row=document.querySelector(`[data-pvfor="${no}"]`); if(!row) return;
    if(!row.hidden){ row.hidden=true; return; }
    const td=row.firstElementChild; row.hidden=false;
    if(!td.innerHTML){ td.innerHTML='<span class="muted">시험지 불러오는 중…</span>';
      try{ const Q=await getQbank(ex.id); const it=ex.items.find(x=>x.no===no);
        td.innerHTML=Q&&Q.q[no]?`<div class="q-body" style="margin:0">${chunkHtml(Q,qIndexes(Q,no),0,+it.answer||0)}</div>`:'<span class="muted">이 시험은 시험지 워드가 등록되지 않았어요. 시험 관리에서 워드를 올리면 문제가 보여요.</span>';
      }catch(err){ td.innerHTML=`<span class="muted">문제를 불러오지 못했어요: ${esc(err.message)}</span>`; } }
  });
  $('#resClsTop').onchange=e=>{ if(!e.target.value) return; resCls=e.target.value; resSub='cls'; renderResultTab(); };
  const cs=$('#clsSel'); if(cs) cs.onchange=e=>{ resCls=e.target.value; renderResultTab(); };
  const ct=$('#clsTh'); if(ct) ct.onchange=e=>{ resClsTh=+e.target.value; renderResultTab(); };
  const ch=$('#clsHideL'); if(ch) ch.onchange=e=>{ LS.set('mx_hideListen',e.target.checked); renderResultTab(); };
  const cw=$('#clsWs'); if(cw) cw.onclick=async()=>{
    const Q=await getQbank(ex.id).catch(()=>null);
    if(!Q) return alert('이 시험은 시험지 워드가 등록되지 않아 문제지를 만들 수 없어요. 시험 관리에서 워드를 먼저 올려주세요.');
    const list=cItems.filter(o=>Q.q[o.it.no]).map(o=>({ex,it:o.it})); if(!list.length) return alert('시험지에서 찾은 문항이 없어요.');
    cw.disabled=true; cw.textContent='만드는 중…';
    try{ await buildWorksheet(`${resCls} · ${ex.name} 해설 문항`, list, $('#clsHae').checked); }
    catch(err){ alert('문제지를 만들지 못했어요: '+err.message); }
    cw.disabled=false; cw.textContent='이 문항들로 해설용 문제지 만들기 (워드)';
  };
}

function openReport(ex, r, all){
  const branchRs=all.filter(x=>x.branch===r.branch);
  const wrAll=wrongRates(ex,all), wrBr=wrongRates(ex,branchRs);
  const th=prefs.threshold;
  const rankAll=[...all].sort((a,b)=>b.score-a.score).findIndex(x=>x.score===r.score)+1;
  const rankBr=[...branchRs].sort((a,b)=>b.score-a.score).findIndex(x=>x.score===r.score)+1;
  const cs=catScores(ex,r.answers);
  const brCat={}; catsOf(ex).forEach(c=>{ let ok=0,n=0; branchRs.forEach(x=>{ const s=catScores(ex,x.answers)[c]; ok+=s.ok; n+=s.n; }); brCat[c]=pct(ok,n); });
  let hideListen = LS.get('mx_hideListen',false);

  const render=()=>{
    const items=ex.items.map((it,i)=>({it,i})).filter(o=>!(hideListen && o.it.cat==='듣기'));
    const half=Math.ceil(items.length/2);
    const rowHtml=({it,i})=>{
      const a=+r.answers[i]||0, ok=isOk(r.answers[i],it), ox=r.answers[i]==='x';
      const ev= ok ? '<span class="tag ok">양호</span>' : (wrBr[i]!=null && wrBr[i]<th ? '<span class="tag bad">취약</span>' : '<span class="tag warn">주의</span>');
      return `<tr class="click" data-rq="${i}" title="눌러서 문제·해설 보기"><td><span class="qno ${ok?'':'x'}">${it.no}</span> <span class="muted noprint">▾</span></td><td>${pill(it.cat)}</td><td>${wrAll[i]}%</td><td>${wrBr[i]}%</td>
        <td>${ok?'<span class="mark-o">○ 정답</span>':`<span class="mark-x">✕ 오답</span>${ox?'':` <span class="pick-big">${a?a+'번':'무응답'}</span>`}`}</td><td>${ev}</td></tr>
        <tr class="qpv-row" data-rqfor="${i}" hidden><td colspan="6" style="text-align:left;white-space:normal"></td></tr>`;
    };
    const tbl=(arr)=>`<table><thead><tr><th>문항 (${arr.length?arr[0].it.no:''}–${arr.length?arr[arr.length-1].it.no:''})</th><th>유형</th><th>전체 오답률</th><th>분원 오답률</th><th>내 응답</th><th>평가</th></tr></thead><tbody>${arr.map(rowHtml).join('')}</tbody></table>`;
    $('#modal').innerHTML=`
      <div class="row" style="justify-content:space-between">
        <div><h2 style="margin:0">${esc(r.student_name)} <span class="muted">${esc(r.branch)} ${esc(r.class_name)}</span></h2><span class="muted">${esc(ex.name)}</span></div>
        <div class="row noprint"><label class="muted"><input type="checkbox" id="hideL" ${hideListen?'checked':''}> 듣기 제외</label>
          ${r.member_code?'<button class="btn" id="toHist">누적 기록</button>':''}<button class="btn" onclick="window.print()">인쇄</button><button class="btn" id="closeM">닫기</button></div>
      </div>
      <div class="stats" style="margin-top:14px">
        <div class="stat"><span class="muted">총점</span><b>${r.score} / ${totalPoints(ex)}</b></div>
        <div class="stat"><span class="muted">분원 석차</span><b>${rankBr} / ${branchRs.length}</b></div>
        <div class="stat"><span class="muted">전체 석차</span><b>${rankAll} / ${all.length}</b></div>
      </div>
      <div class="cat-bars">${catsOf(ex).filter(c=>!(hideListen&&c==='듣기')).map(c=>{ const s=cs[c], my=pct(s.ok,s.n); return `
        <div class="cat-bar"><div class="row" style="justify-content:space-between">${pill(c)}<span><b>${s.ok}/${s.n}</b> <span class="muted">(${s.got}/${s.max}점)</span></span></div>
          <div class="bar"><i style="width:${my}%;background:${CAT_COLORS[c]||'#94a3b8'}"></i></div>
          <div class="muted" style="margin-top:4px">내 정답률 ${my}% · 분원 평균 ${brCat[c]}%</div></div>`; }).join('')}</div>
      <div class="report-cols"><div>${tbl(items.slice(0,half))}</div><div>${tbl(items.slice(half))}</div></div>
      <p class="muted" style="margin-top:10px">문항 줄을 누르면 바로 아래에 문제와 해설이 펼쳐져요 (빨강 = 고른 답, 초록 = 정답). 평가: 정답 → 양호 · 오답 중 분원 오답률 ${th}% 미만(대부분 맞힌 문제) → 취약 · 그 외 오답 → 주의</p>`;
    $('#closeM').onclick=()=>$('#modalBg').classList.remove('show');
    const toH=$('#toHist'); if(toH) toH.onclick=()=>{ histCode=r.member_code; $('#modalBg').classList.remove('show'); showTab('hist'); };
    $('#hideL').onchange=e=>{ hideListen=e.target.checked; LS.set('mx_hideListen',hideListen); render(); };
    // 문항 줄 클릭 → 바로 아래에 문제 + 해설 펼치기
    document.querySelectorAll('#modal [data-rq]').forEach(tr=>tr.onclick=async()=>{
      const i=+tr.dataset.rq, row=document.querySelector(`#modal [data-rqfor="${i}"]`); if(!row) return;
      if(!row.hidden){ row.hidden=true; return; }
      row.hidden=false; const td=row.firstElementChild; if(td.innerHTML) return;
      const it=ex.items[i], ch=r.answers[i], pick=+ch||0, ans=+it.answer||0;
      td.innerHTML='<span class="muted">시험지 불러오는 중…</span>';
      try{ const Q=await getQbank(ex.id);
        td.innerHTML=`<div style="margin:2px 0 6px">${pill(it.cat)} <b>${esc(it.sub||'')}</b> · 고른 답 <b class="${isOk(ch,it)?'mark-o':'mark-x'}">${ch==='x'?'오답':ch==='o'?'정답':pick?pick+'번':'무응답'}</b> · 정답 <b class="mark-o">${ans?ans+'번':'-'}</b></div>`
          +(Q&&Q.q[it.no]?`<div class="q-body" style="margin:0">${chunkHtml(Q,qIndexes(Q,it.no),pick,ans)}</div>${Q.hq&&Q.hq[it.no]?`<details style="margin-top:8px"><summary>해설 보기</summary><div class="q-body">${chunkHtml(Q,hIndexes(Q,it.no),0,0)}</div></details>`:''}`
            :'<span class="muted">이 시험은 시험지 워드가 등록되지 않아 문제를 보여줄 수 없어요.</span>');
      }catch(err){ td.innerHTML=`<span class="muted">문제를 불러오지 못했어요: ${esc(err.message)}</span>`; }
    });
  };
  render();
  $('#modalBg').classList.add('show');
}
$('#modalBg').onclick=e=>{ if(e.target.id==='modalBg') e.currentTarget.classList.remove('show'); };

/* 엑셀(.xlsx): 성적 / 답안 / 채점 / 문항분석 4개 시트. 엑셀 도구가 없으면 CSV로 */
// 같은 회차의 모든 학년 시험을 한 파일로 — 학년(시험)마다 시트 하나, 담임·지난 시험 대비 변화 포함
async function exportRoundXlsx(ex){
  if(!window.XLSX) throw new Error('엑셀 도구를 불러오지 못했어요. 인터넷 연결을 확인하세요.');
  const rk=roundKey(ex);
  const list=EXAMS.filter(e=>roundKey(e)===rk).sort((a,b)=>koCmp(gradeKey(a),gradeKey(b))||koCmp(a.name,b.name));
  if(!list.length) throw new Error('이 회차에 등록된 시험이 없어요.');
  const wb=XLSX.utils.book_new(), used=new Set(['요약']), sheets=[];
  const summary=[[roundLabel(rk)+' 전 학년 요약','분원: '+resBranch],[],['학년','시험','응시자','평균','최고','최저','1등급(%)','담임']];
  const t100=(sc,x)=>{ const t=totalPoints(x); return t?sc/t*100:sc; };
  for(const e of list){
    let rows=await getResponses(e.id); if(resBranch!=='전체') rows=rows.filter(r=>r.branch===resBranch);
    for(const b of new Set(rows.map(r=>r.branch))) await loadStudents(b);
    const tOf=r=>teacherOf(r,rosterSync(r.branch,rk))||'';
    rows=[...rows].sort((a,b)=>b.score-a.score);
    const cmpId=defaultCmp(e), ce=cmpId?examById(cmpId):null;
    let prev=ce?await getResponses(ce.id):[]; if(resBranch!=='전체') prev=prev.filter(r=>r.branch===resBranch);
    const cats=catsOf(e), rank=sc=>rows.findIndex(r=>r.score===sc)+1;
    const aoa=[[e.name, normGrade(e.grade)||'', roundLabel(rk), '분원: '+resBranch, ce?'비교: '+ce.name:''],[],
      ['순위','회원코드','분원','반','담임','이름','총점','등급',...(ce?['지난 시험','변화']:[]),...cats.map(c=>c+' 득점')],
      ...rows.map(r=>{ const cs=catScores(e,r.answers), pv=ce&&prev.find(p=>sameResp(p,r));
        return [rank(r.score),r.member_code||'',r.branch,r.class_name,tOf(r),r.student_name,r.score,engGrade(r.score,e),
          ...(ce?[pv?pv.score:'',pv?Math.round((t100(r.score,e)-t100(pv.score,ce))*10)/10:'']:[]),...cats.map(c=>cs[c].got)]; })];
    let nm=(normGrade(e.grade)||e.name).replace(/[\\/?*\[\]:]/g,'_').slice(0,28); while(used.has(nm)) nm+='_'; used.add(nm);
    sheets.push([nm,aoa]);
    const sc=rows.map(r=>r.score), g1=rows.filter(r=>engGrade(r.score,e)===1).length;
    summary.push([normGrade(e.grade)||'',e.name,rows.length,sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length*10)/10:'',sc.length?Math.max(...sc):'',sc.length?Math.min(...sc):'',
      rows.length?pct(g1,rows.length):'',[...new Set(rows.map(tOf).filter(Boolean))].sort(koCmp).join(', ')]);
  }
  [['요약',summary],...sheets].forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n));
  XLSX.writeFile(wb, `${roundLabel(rk)}_전학년_${resBranch}.xlsx`.replace(/[\\/:*?"<>|]/g,'_'));
}
function exportCsv(ex, rows, cats){
  const tOf=r=>teacherOf(r,rosterSync(r.branch,roundKey(ex)))||'';
  if(window.XLSX){
    const info=[ex.name, ex.grade||'', roundLabel(roundKey(ex)), '분원: '+resBranch];
    const rank=s=>rows.findIndex(r=>r.score===s)+1;
    const nums=ex.items.map(i=>i.no+'번');
    const s1=[info,[],['순위','회원코드','분원','반','담임','이름','총점',...cats.map(c=>c+' 득점'),...cats.map(c=>c+' 정답률(%)')],
      ...rows.map(r=>{ const cs=catScores(ex,r.answers); return [rank(r.score),r.member_code||'',r.branch,r.class_name,tOf(r),r.student_name,r.score,...cats.map(c=>cs[c].got),...cats.map(c=>pct(cs[c].ok,cs[c].n))]; })];
    const s2=[info,[],['회원코드','분원','반','이름',...nums],['','','','정답',...ex.items.map(i=>+i.answer||'')],
      ...rows.map(r=>[r.member_code||'',r.branch,r.class_name,r.student_name,...ex.items.map((it,i)=>{ const ch=r.answers[i]; return ch==='o'?'O':ch==='x'?'X':(+ch||''); })])];
    const s3=[info,[],['회원코드','분원','반','이름','총점',...nums],['','','','배점','',...ex.items.map(i=>+i.points)],
      ...rows.map(r=>[r.member_code||'',r.branch,r.class_name,r.student_name,r.score,...ex.items.map((it,i)=>isOk(r.answers[i],it)?'O':'X')])];
    const wr=wrongRates(ex,rows);
    const s4=[info,[],['번호','대분류','세부 유형','정답','배점','오답률(%)','①(%)','②(%)','③(%)','④(%)','⑤(%)','무응답(%)'],
      ...ex.items.map((it,i)=>{ const c=[0,0,0,0,0,0]; rows.forEach(r=>c[+r.answers[i]||0]++); return [it.no,it.cat||'',it.sub||'',+it.answer||'',+it.points,wr[i]==null?'':wr[i],...[1,2,3,4,5,0].map(n=>pct(c[n],rows.length))]; })];
    const wb=XLSX.utils.book_new();
    [['성적',s1],['답안',s2],['채점',s3],['문항분석',s4]].forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n));
    XLSX.writeFile(wb, `${ex.name}_${resBranch}.xlsx`.replace(/[\\/:*?"<>|]/g,'_'));
    return;
  }
  const head=['회원코드','분원','반','담임','이름','총점',...cats.map(c=>c+'(득점)'),...ex.items.map(i=>i.no+'번')];
  const lines=[head, ...rows.map(r=>{ const cs=catScores(ex,r.answers); return [r.member_code||'',r.branch,r.class_name,tOf(r),r.student_name,r.score,...cats.map(c=>cs[c].got),...ex.items.map((it,i)=>{ const a=+r.answers[i]||0; return isOk(r.answers[i],it)?'O':(a||(r.answers[i]==='x'?'X':'-')); })]; })];
  const csv='\uFEFF'+lines.map(l=>l.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`${ex.name}_${resBranch}.csv`; a.click();
}

/* ===================== 4. 학생 기록 (회원코드 기준 누적) ===================== */
let histCode=null, histQ='';
let histActiveOnly=true;   // 학생 기록: 기본은 재원생만 (체크 풀면 퇴원생도)
async function renderHistTab(){
  const br=prefs.branch; await loadStudents(br);
  // 재원생 = 가장 최신 회차 명단에 있는 학생. 퇴원생 = 예전 회차 명단에만 있는 학생 (마지막으로 있던 명단 기준)
  const all=STU[br]||[], latest=rosterRounds(br)[0]||'';
  const list=all.filter(s=>(s.exam_round||'')===latest).map(s=>({...s,_out:false}));
  const seen=new Set(list.map(s=>s.member_code).filter(Boolean)), lastOf=new Map();
  all.forEach(s=>{ if(!s.member_code||seen.has(s.member_code)) return; const p=lastOf.get(s.member_code); if(!p||koCmp(s.exam_round||'',p.exam_round||'')>0) lastOf.set(s.member_code,s); });
  list.push(...[...lastOf.values()].map(s=>({...s,_out:true})).sort((a,b)=>koCmp(a.student_name,b.student_name)));
  const q=histQ.trim();
  const withCode=list.filter(s=>s.member_code);
  const mineT=myTeacher();
  const match=(s,q)=>(!histActiveOnly || !s._out) && (!q || s.student_name.includes(q) || s.member_code.includes(q) || String(s.class_name||'').includes(q));
  const noCode=list.length && !list.some(s=>s.member_code);
  const nOut=withCode.filter(s=>s._out).length;
  $('#tab-hist').innerHTML=`
  <div class="grid2">
    <div class="card">
      <label class="f">분원<select id="hBranch">${BRANCHES.map(b=>`<option ${b===br?'selected':''}>${b}</option>`).join('')}</select></label>
      <button class="btn" id="hCommon" style="width:100%;margin-top:10px">${HP_ONLY?'학년 공통 대비 · 학평 회차 인쇄':'학년 공통 대비 · 회차 인쇄 (듣기 제외)'}</button>
      <input id="hQ" placeholder="이름·회원코드·반 검색 (코드 입력 후 Enter)" value="${esc(histQ)}" style="width:100%;margin:10px 0 6px">
      <label class="ws-item" style="cursor:pointer;margin-bottom:8px"><input type="checkbox" id="hActive" ${histActiveOnly?'checked':''}> 재원생만 보기 <span class="muted">(풀면 퇴원생 ${nOut}명도 검색)</span></label>
      ${mineT?`<p class="muted" style="margin:0 0 8px">담임 계정 · <b>${esc(mineT)}</b> 선생님 담당 학생만 보여요</p>`:''}
      <div style="max-height:620px;overflow:auto">
        ${withCode.map(s=>`<div class="exam-item ${s.member_code===histCode?'sel':''}" data-code="${esc(s.member_code)}" ${match(s,q)?'':'hidden'}><b>${esc(s.student_name)}${s._out?' <span class="pill" style="background:#9ca3af">퇴원</span>':''}</b>
          <span class="muted">${esc(s.class_name)}${gradeLabel(s)?' · '+esc(gradeLabel(s)):''}${s._out?' · 마지막 명단 '+esc(roundLabel(s.exam_round)):''}</span></div>`).join('')}
        <p class="muted" id="hEmpty" ${withCode.some(s=>match(s,q))?'hidden':''}>${noCode?'이 분원 명단에 회원코드가 없어요. 회원코드 열이 있는 명단을 올려주세요.':list.length?'검색 결과가 없어요.':'학생 명단을 먼저 올려주세요.'}</p>
      </div>
    </div>
    <div class="card" id="hBody">${histCode?'<p class="muted">불러오는 중…</p>':'<p class="muted">왼쪽에서 학생을 고르세요.</p>'}</div>
  </div>`;
  $('#hBranch').onchange=e=>{ prefs.branch=e.target.value; savePrefs(); renderHistTab(); };
  $('#hCommon').onclick=()=>openCommonWorksheet({});
  const hq=$('#hQ');
  // 입력 중에는 화면을 다시 그리지 않고 목록만 숨김/표시 (한글 입력이 ㄱㅣㅁ처럼 풀리지 않도록)
  const applyFilter=()=>{ const q=histQ.trim(); let n=0;
    document.querySelectorAll('#tab-hist [data-code]').forEach(el=>{ const st=withCode.find(s=>s.member_code===el.dataset.code); const ok=!!st&&match(st,q); el.hidden=!ok; if(ok) n++; });
    $('#hEmpty').hidden=n>0; };
  $('#hActive').onchange=e=>{ histActiveOnly=e.target.checked; applyFilter(); };
  hq.oninput=()=>{ histQ=hq.value; applyFilter(); };
  hq.onkeydown=e=>{ if(e.key==='Enter' && !e.isComposing && hq.value.trim()){ const v=hq.value.trim(); const found=withCode.filter(s=>match(s,v)); histCode=found.length===1?found[0].member_code:v; renderHistTab(); } };
  document.querySelectorAll('#tab-hist [data-code]').forEach(el=>el.onclick=()=>{ histCode=el.dataset.code; renderHistTab(); });
  if(histCode) renderHistBody(histCode, list);
}

async function renderHistBody(code, list){
  const box=$('#hBody'); if(!box) return;
  let rs; try{ rs=await DB.responsesByMember(code); }catch(e){ box.innerHTML='<p class="muted">기록을 불러오지 못했습니다: '+esc(e.message)+'</p>'; return; }
  const rows=[];
  await pmap([...new Set(rs.map(r=>r.exam_id))].filter(id=>examById(id)), id=>getResponses(id));   // 병렬로 미리
  for(const r of rs){
    const ex=examById(r.exam_id); if(!ex) continue;
    const all=await getResponses(ex.id);
    const brs=all.filter(x=>x.branch===r.branch);
    rows.push({r, ex, all, date:ex.exam_date||String(r.created_at||'').slice(0,10), tp:totalPoints(ex),
      rankBr:[...brs].sort((a,b)=>b.score-a.score).findIndex(x=>x.score===r.score)+1, nBr:brs.length,
      avgBr:brs.reduce((s,x)=>s+x.score,0)/(brs.length||1), cs:catScores(ex,r.answers)});
  }
  rows.sort((a,b)=>koCmp(a.date,b.date));
  const stu=list.find(s=>s.member_code===code), last=rows.length?rows[rows.length-1].r:null;
  const name=stu?stu.student_name:(last?last.student_name:'');
  const head=`<div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${esc(name||'(이름 없음)')}
      <span class="muted">${esc(stu?stu.class_name:(last?last.class_name:''))}${gradeLabel(stu)?' · '+esc(gradeLabel(stu)):''} · 회원코드 ${esc(code)}</span></h2></div>
      ${rows.length?'<div class="row" style="gap:8px"><button class="btn" id="crOpen">상담 리포트 (인쇄용)</button><button class="btn primary" id="wsOpen">'+(HP_ONLY?'학평 유형 문제지 만들기':'모의고사 대비 문제지 만들기')+'</button></div>':''}</div>`;
  if(!rows.length){
    box.innerHTML=head+`<p class="muted" style="margin-top:12px">이 회원코드로 입력된 시험이 아직 없어요. (신입생이면 같은 학년 학생들이 많이 틀린 유형으로 대비 문제지를 만들 수 있어요.)</p>
      <button class="btn primary" id="wsCommon">학년 공통 대비 문제지 만들기</button>`;
    $('#wsCommon').onclick=()=>openCommonWorksheet({name, grade:stu?normGrade(stu.grade):''});
    return; }

  // 점수 추이 (100점 환산) — 내 점수 실선, 분원 평균 점선
  const W=600,H=200,L=40,Rp=20,T=20,B=40, n=rows.length;
  const X=i=> n===1 ? (L+W-Rp)/2 : L+i*(W-L-Rp)/(n-1);
  const Y=v=> T+(1-v/100)*(H-T-B);
  const my=rows.map(o=>o.r.score/o.tp*100), av=rows.map(o=>o.avgBr/o.tp*100);
  const line=(vals,attr)=>`<polyline fill="none" ${attr} points="${vals.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`;
  const chart=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:760px;margin:14px 0 4px">
    ${[0,50,100].map(v=>`<line x1="${L}" x2="${W-Rp}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e6e8ec"/><text x="${L-8}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="#6b7280">${v}</text>`).join('')}
    ${line(av,'stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"')}
    ${line(my,'stroke="var(--main)" stroke-width="2.5"')}
    ${rows.map((o,i)=>`<circle cx="${X(i)}" cy="${Y(my[i])}" r="4" fill="var(--main)"/><text x="${X(i)}" y="${Y(my[i])-9}" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2430">${o.r.score}</text>
      <text x="${X(i)}" y="${H-B+18}" font-size="11" text-anchor="middle" fill="#6b7280">${esc(fmtYM(o.date)||'-')}</text>`).join('')}
  </svg><div class="muted">— 내 점수 · - - 분원 평균</div>`;

  // 시험별 표
  const cats=[...new Set(rows.flatMap(o=>Object.keys(o.cs)))].sort((a,b)=>CATS.indexOf(a)-CATS.indexOf(b));
  const table=`<h3>시험별 기록</h3><div style="overflow:auto"><table><thead><tr><th>시행 연·월</th><th>시험</th><th>담임</th><th>점수</th><th>분원 평균</th><th>분원 석차</th>${cats.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map((o,i)=>[o,i]).reverse().map(([o,i])=>`<tr class="click" data-hrep="${i}"><td>${esc(fmtYM(o.date)||'-')}</td><td>${esc(o.ex.name)}</td><td>${esc(teacherOf(o.r,rosterSync(o.r.branch,roundKey(o.ex)))||'-')}</td><td><b>${o.r.score}</b><span class="muted">/${o.tp}</span></td><td>${o.avgBr.toFixed(1)}</td><td>${o.rankBr}/${o.nBr}</td>
      ${cats.map(c=>o.cs[c]?`<td>${pct(o.cs[c].ok,o.cs[c].n)}%</td>`:'<td class="muted">-</td>').join('')}</tr>`).join('')}
  </tbody></table></div><p class="muted">최신 시험이 위에 있어요. 시험을 누르면 그 시험의 개인 리포트가 열립니다.</p>`;

  // 누적 세부 유형 정답률 (낮은 순) — 카드 = 세부 유형, 독해는 옆에 문항 번호 (예: 어법 29번, 빈칸 31~34번). 듣기는 시험마다 번호가 달라 번호 없이
  const noRange=list=>{ const ns=[...new Set(list)].sort((a,b)=>a-b); if(!ns.length) return ''; const out=[]; let st=ns[0], pv=ns[0];
    for(const n of ns.slice(1).concat([null])){ if(n===pv+1){ pv=n; continue; } out.push(st===pv?`${st}`:`${st}~${pv}`); st=pv=n; } return out.join(', ')+'번'; };
  const agg={};
  rows.forEach((o,oi)=>o.ex.items.forEach((it,i)=>{ const k=(it.cat||'미지정')+'|'+(it.sub||''); const a=agg[k]=agg[k]||{cat:it.cat||'미지정',sub:it.sub||'',ok:0,n:0,qs:[]}; a.n++; const ok=isOk(o.r.answers[i],it); if(ok) a.ok++; a.qs.push({oi,i,ok}); }));
  const subs=Object.values(agg).sort((a,b)=>pct(a.ok,a.n)-pct(b.ok,b.n)||b.n-a.n);
  const weak=`<h3>누적 세부 유형별 정답률 (낮은 순)</h3>
    <div class="cat-bars">${subs.map((a,si)=>{ const v=pct(a.ok,a.n); return `<div class="cat-bar click" data-sub="${si}" title="눌러서 이 유형 문제 보기 (${a.ok<a.n?'틀린 문제 먼저':'모두 맞음'})"><div class="row" style="justify-content:space-between">${pill(a.cat)}<span><b>${a.ok}/${a.n}</b></span></div>
      <div style="margin-top:6px;font-weight:600">${esc(a.sub||'-')}${a.cat==='듣기'?'':` <span class="muted" style="font-weight:400">${noRange(a.qs.map(q=>rows[q.oi].ex.items[q.i].no))}</span>`}</div>
      <div class="bar"><i style="width:${v}%;background:${v<50?'var(--bad)':v<80?'var(--warn)':'var(--ok)'}"></i></div><div class="muted" style="margin-top:4px">${v}%</div></div>`; }).join('')}</div>
    <p class="muted">카드를 누르면 그 유형의 문제가 시험·문항 번호와 함께 열려요. 틀린 문제가 먼저 나오고, 맞은 문제도 같이 볼 수 있어요.</p>`;

  // 오답 다시 풀기 (모의고사 점수와 별도 기록)
  let retries=[]; try{ retries=await DB.retries(rows.map(o=>o.r.id)); }catch(e){ console.warn(e); retries=null; }
  const RS=retries?retryStats(rows,retries):null;
  const retryHtml=`<h3>오답 다시 풀기 <span class="muted" style="font-weight:400;font-size:12px">(모의고사 점수와 따로 기록돼요)</span></h3>
    ${retries===null?'<p class="muted">다시 풀기 기록을 불러오지 못했어요. Supabase에 오답 다시 풀기 표(SQL)를 먼저 만들어 주세요.</p>':`
    <div class="row" style="gap:16px;align-items:center">
      ${RS.tried?`<span>다시 푼 문항 <b>${RS.tried}</b>개 중 <b class="mark-o">${RS.ok}</b>개 맞힘 <b>(${pct(RS.ok,RS.tried)}%)</b></span>${RS.same?`<span class="muted">같은 오답 또 고름 ${RS.same}개</span>`:''}`:'<span class="muted">아직 다시 푼 기록이 없어요.</span>'}
      <span class="muted">남은 오답 ${RS.left}개</span>
      <button class="btn primary" id="rtOpen">오답 다시 풀기 입력</button></div>
    ${RS.still.length?`<p style="margin:8px 0 0;line-height:1.9"><span class="muted">다시 풀어도 틀린 문항:</span> ${RS.still.map(x=>`<span class="pill" style="background:var(--bad-bg);color:var(--bad)">${esc(x.ex.name)} ${x.no}번</span>`).join(' ')}</p>`:''}`}`;
  // 받은 문제지 (만들 때마다 기록 — 다시 인쇄·중복 빼기에 씀)
  let wsHist=[]; try{ wsHist=await DB.worksheets(code); }catch(e){ console.warn(e); wsHist=null; }
  const wsHtml=`<h3>받은 문제지</h3>
    ${wsHist===null?'<p class="muted">문제지 기록을 불러오지 못했어요. Supabase에 문제지 기록 표(SQL)를 먼저 만들어 주세요.</p>'
      :wsHist.length?`<div style="overflow:auto"><table><thead><tr><th>만든 날</th><th>제목</th><th>문항</th><th>해설</th><th>만든 사람</th><th></th></tr></thead><tbody>
        ${wsHist.map((w,wi)=>{ const its=w.items||[]; const exs=[...new Set(its.map(x=>{ const e=examById(x.exam_id)||BANK.find(b=>b.id===x.exam_id); return e?e.name:'(지워진 시험)'; }))];
          return `<tr><td>${esc(localDay(w.created_at))}</td><td>${esc(w.title||'')}<div class="muted" style="font-size:12px">${esc(exs.slice(0,3).join(' · '))}${exs.length>3?` 외 ${exs.length-3}개`:''}</div></td><td>${its.length}</td><td>${w.with_hae?'포함':'-'}</td><td>${esc(w.created_by_name||'')}</td>
            <td style="white-space:nowrap"><button class="btn" data-wsre="${wi}" style="padding:3px 10px;font-size:13px">다시 인쇄</button> <button class="btn" data-wsdel="${wi}" style="padding:3px 10px;font-size:13px">삭제</button></td></tr>`; }).join('')}
      </tbody></table></div><p class="muted">다음 문제지를 만들 때 여기 들어간 문제는 추천에서 빠져요.</p>`
      :'<p class="muted">아직 만든 문제지가 없어요. 문제지를 만들면 여기에 쌓여요.</p>'}`;
  box.innerHTML=head+chart+table+weak+retryHtml+wsHtml;
  box.querySelectorAll('[data-wsre]').forEach(b=>b.onclick=async()=>{ const w=wsHist[+b.dataset.wsre];
    const list=(w.items||[]).map(x=>{ const ex=BANK.find(e=>e.id===x.exam_id)||examById(x.exam_id); const it=ex&&ex.items.find(i=>i.no===x.no); return ex&&it?{ex,it}:null; }).filter(Boolean);
    if(!list.length) return alert('이 문제지에 들어간 시험이 지워져서 다시 만들 수 없어요.');
    if(list.length<(w.items||[]).length && !confirm(`지워진 시험이 있어 ${(w.items||[]).length}문항 중 ${list.length}문항만 다시 만들어요. 계속할까요?`)) return;
    const t=b.textContent; b.disabled=true; b.textContent='만드는 중…';
    try{ await buildWorksheet(w.title||'문제지', list, !!w.with_hae); }catch(err){ alert('문제지를 만들지 못했어요: '+err.message); }
    b.disabled=false; b.textContent=t; });
  box.querySelectorAll('[data-wsdel]').forEach(b=>b.onclick=async()=>{ const w=wsHist[+b.dataset.wsdel];
    if(!confirm(`'${w.title||'문제지'}' 기록을 지울까요?\n지우면 이 문제지에 들어간 문제가 다시 추천될 수 있어요.`)) return;
    try{ await DB.deleteWorksheet(w.id); renderHistBody(code, list); }catch(err){ alert('지우지 못했어요: '+err.message); } });
  const ro=$('#rtOpen'); if(ro) ro.onclick=()=>openRetry(name, rows, retries, ()=>renderHistBody(code, list));
  box.querySelectorAll('[data-hrep]').forEach(tr=>tr.onclick=()=>{ const o=rows[+tr.dataset.hrep]; openReport(o.ex,o.r,o.all); });
  box.querySelectorAll('[data-sub]').forEach(c=>c.onclick=()=>{ const a=subs[+c.dataset.sub]; openWrongList(name, rows, a.cat, a.sub); });
  const wo=$('#wsOpen'); if(wo) wo.onclick=()=>openWorksheet(name, code, rows, ()=>renderHistBody(code, list));
  const co=$('#crOpen'); if(co) co.onclick=()=>openCounselReport(name, stu, rows, RS);
}



// --- 오답 다시 풀기 ---
// 문항별 가장 최근 시도로 판단: 다시 맞힘 / 또 틀림(같은 오답이면 따로 셈)
function retryStats(rows, retries){
  const byKey={}; (retries||[]).forEach(t=>(byKey[t.response_id+'|'+t.item_no]=byKey[t.response_id+'|'+t.item_no]||[]).push(t));
  let tried=0, ok=0, same=0, left=0; const still=[];
  rows.forEach(o=>o.ex.items.forEach((it,i)=>{ if(isOk(o.r.answers[i],it)) return;
    const h=byKey[o.r.id+'|'+it.no]; if(!h||!h.length){ left++; return; }
    const last=h[h.length-1]; tried++;
    if(last.correct) ok++; else { left++; still.push({ex:o.ex,no:it.no}); if(String(last.pick)===String(o.r.answers[i])) same++; } }));
  return {tried, ok, same, left, still, byKey};
}
function openRetry(name, rows, retries, onDone){
  const RS=retryStats(rows, retries);
  const list=[]; [...rows].reverse().forEach(o=>o.ex.items.forEach((it,i)=>{ if(!isOk(o.r.answers[i],it)) list.push({o,it,i,hist:RS.byKey[o.r.id+'|'+it.no]||[]}); }));
  let hideOk=true, exSel='';
  $('#modal').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(name)} · 오답 다시 풀기 입력</h2><button class="btn" id="closeM">닫기</button></div>
    <p class="muted" style="margin:6px 0 10px">학생이 다시 풀어서 고른 번호(1~5)를 칸에 넣고 저장하세요. 숫자를 치면 다음 칸으로 넘어가요. 모의고사 점수는 바뀌지 않아요.</p>
    <div class="row" style="gap:14px;margin-bottom:8px">
      <label class="f">시험<select id="rtEx"><option value="">전체 시험</option>${rows.slice().reverse().map(o=>`<option value="${esc(o.r.id)}">${esc(o.ex.name)}</option>`).join('')}</select></label>
      <label class="ws-item" style="cursor:pointer;align-self:flex-end;padding-bottom:6px"><input type="checkbox" id="rtHide" checked> 다시 맞힌 문항 숨기기</label>
    </div>
    <div id="rtList" style="max-height:470px;overflow:auto;border:1px solid var(--line);border-radius:8px"></div>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="rtSave">저장</button><span class="muted" id="rtCnt"></span></div>`;
  $('#closeM').onclick=()=>$('#modalBg').classList.remove('show');
  $('#modalBg').classList.add('show');
  const mark=t=>`<span class="pill" data-rtdel="${esc(t.id)}" title="눌러서 이 기록 지우기" style="cursor:pointer;${t.correct?'background:var(--ok-bg);color:var(--ok)':'background:var(--bad-bg);color:var(--bad)'}">${(t.created_at||'').slice(5,10).replace('-','/')} ${+t.pick?circled(+t.pick):'무응답'} ${t.correct?'○':'✕'}</span>`;
  const render=()=>{
    const vis=list.filter(x=>(!exSel||x.o.r.id===exSel) && !(hideOk && x.hist.length && x.hist[x.hist.length-1].correct));
    let last='';
    $('#rtList').innerHTML=vis.length?`<table><thead><tr><th>시험</th><th>번호</th><th>유형</th><th>처음 고른 답</th><th>정답</th><th>다시 푼 기록</th><th>이번에 고른 번호</th></tr></thead><tbody>
      ${vis.map(x=>{ const j=list.indexOf(x), first=x.o.r.answers[x.i], head=x.o.ex.name!==last; last=x.o.ex.name;
        return `<tr${head?' style="border-top:2px solid var(--line)"':''}><td>${head?`<b>${esc(x.o.ex.name)}</b>`:''}</td><td><span class="ws-prev" data-rtpv="${j}" title="눌러서 문제 보기"><b>${x.it.no}번</b> ▾</span></td>
          <td>${pill(x.it.cat)} <span class="muted">${esc(x.it.sub||'')}</span></td><td>${+first?circled(+first):'<span class="muted">-</span>'}</td><td>${circled(+x.it.answer)}</td>
          <td style="line-height:1.9">${x.hist.map(mark).join(' ')||'<span class="muted">-</span>'}</td>
          <td><input data-rt="${j}" maxlength="1" inputmode="numeric" style="width:46px;text-align:center;font-weight:700"></td></tr>
          <tr class="qpv-row" data-rtpvrow="${j}" hidden><td colspan="7"></td></tr>`; }).join('')}</tbody></table>`
      :`<p class="muted" style="padding:12px">${list.length?'보여줄 문항이 없어요. (다시 맞힌 문항 숨기기를 풀어 보세요)':'틀린 문항이 없어요.'}</p>`;
    const ins=[...document.querySelectorAll('[data-rt]')];
    const cnt=()=>{ $('#rtCnt').textContent=`${ins.filter(i=>/^[0-5]$/.test(i.value)).length}문항 입력`; };
    ins.forEach((inp,k)=>{ inp.oninput=()=>{ inp.value=inp.value.replace(/[^0-5]/g,''); const j=+inp.dataset.rt, x=list[j];
        inp.style.color=inp.value===''?'':(+inp.value===+x.it.answer?'var(--ok)':'var(--bad)'); cnt(); if(inp.value&&ins[k+1]) ins[k+1].focus(); };
      inp.onkeydown=e=>{ if(e.key==='Backspace'&&!inp.value&&ins[k-1]){ ins[k-1].focus(); } }; });
    cnt();
    document.querySelectorAll('[data-rtpv]').forEach(el=>el.onclick=async()=>{ const j=+el.dataset.rtpv, x=list[j], tr=document.querySelector(`[data-rtpvrow="${j}"]`);
      if(!tr.hidden){ tr.hidden=true; return; } tr.hidden=false; const td=tr.firstElementChild;
      if(!td.innerHTML){ td.innerHTML='<span class="muted">불러오는 중…</span>'; const Q=await getQbank(x.o.ex.id);
        td.innerHTML=Q&&Q.q[x.it.no]?`<div class="q-body" style="margin:0">${chunkHtml(Q,qIndexes(Q,x.it.no),+x.o.r.answers[x.i]||0,+x.it.answer||0)}</div>`:'<span class="muted">시험지 워드가 등록되지 않은 시험이에요.</span>'; } });
    document.querySelectorAll('[data-rtdel]').forEach(el=>el.onclick=async()=>{ if(!confirm('이 다시 풀기 기록을 지울까요?')) return;
      try{ await DB.deleteRetry(el.dataset.rtdel); const id=el.dataset.rtdel; list.forEach(x=>x.hist=x.hist.filter(t=>t.id!==id)); render(); onDone&&onDone(); }catch(err){ alert('지우지 못했어요: '+err.message); } });
  };
  $('#rtEx').onchange=e=>{ exSel=e.target.value; render(); };
  $('#rtHide').onchange=e=>{ hideOk=e.target.checked; render(); };
  render();
  $('#rtSave').onclick=async()=>{
    const todo=[...document.querySelectorAll('[data-rt]')].filter(i=>/^[0-5]$/.test(i.value)).map(i=>{ const x=list[+i.dataset.rt], r=x.o.r;
      return {response_id:String(r.id), exam_id:String(x.o.ex.id), branch:r.branch, member_code:r.member_code||null, student_name:r.student_name, class_name:r.class_name||'',
        item_no:x.it.no, pick:+i.value, correct:+i.value===+x.it.answer}; });
    if(!todo.length) return alert('입력한 번호가 없어요.');
    $('#rtSave').disabled=true; $('#rtSave').textContent='저장 중…';
    try{ await DB.addRetries(todo); $('#modalBg').classList.remove('show');
      alert(`${todo.length}문항 저장했어요. 다시 맞힘 ${todo.filter(t=>t.correct).length}개 · 또 틀림 ${todo.filter(t=>!t.correct).length}개`); onDone&&onDone(); }
    catch(err){ alert('저장하지 못했어요: '+err.message); $('#rtSave').disabled=false; $('#rtSave').textContent='저장'; }
  };
}

// --- 상담용 한 장 리포트 (새 창 · 인쇄하면 A4 한 장) ---
const COUNSEL_TIPS={'듣기':'대화의 마지막 말과 상황 설명을 끝까지 듣고 고르는 연습이 필요해요.','대의파악':'첫 문장과 마지막 문장에서 글쓴이의 주장을 먼저 한 줄로 정리하는 연습을 하고 있어요.',
  '세부정보':'선택지와 본문을 한 줄씩 대조하며 근거에 밑줄 긋는 습관을 들이고 있어요.','어법·어휘':'자주 틀리는 문법 포인트를 정리하고 문장 구조 분석 숙제를 추가할게요.',
  '빈칸추론':'글의 핵심 주장을 먼저 정리한 뒤 빈칸에 대입하는 연습이 필요해요.','간접쓰기':'지시어·연결어 단서를 표시하며 글의 흐름을 잡는 연습을 하고 있어요.','장문독해':'긴 글은 문단별 요지를 한 줄씩 적으며 읽는 연습을 하고 있어요.'};
const COUNSEL_CSS=`:root{--text:#1f2430;--sub:#6b7280;--line:#e6e8ec;--main:#2f5bea;--soft:#eef2ff;--ok:#15803d;--bad:#c0262d;--warn:#b45309}
