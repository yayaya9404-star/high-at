  const byStu={}; allResp.forEach(x=>(byStu[stuIdOf(x.r)]=byStu[stuIdOf(x.r)]||[]).push(x));
  const tg={};   // 담임 → {sum,n,stu:Set}
  Object.values(byStu).forEach(list=>{ list.sort((a,b)=>koCmp(examDateKey(a.ex),examDateKey(b.ex)));
    for(let i=1;i<list.length;i++){ const a=list[i-1], b=list[i]; if(examDateKey(a.ex)===examDateKey(b.ex)) continue;
      const o=tg[b.t]=tg[b.t]||{sum:0,n:0,stu:new Set()}; o.sum+=to100(b.r.score,b.ex)-to100(a.r.score,a.ex); o.n++; o.stu.add(stuIdOf(b.r)); } });
  const teachers=[...new Set([...Object.keys(tr),...Object.keys(tg)])].sort((a,b)=>a.startsWith('(')-b.startsWith('(')||koCmp(a,b));
  const noTeacher=!(rosters[admBranch]||[]).some(s=>s.teacher) && !allResp.some(x=>x.r.teacher);

  $('#tab-admin').innerHTML=`
  <div class="card">
    <div class="row">
      <label class="f" style="min-width:220px">회차<select id="admRound">${rounds.map(k=>`<option value="${k}" ${k===admRound?'selected':''}>${roundLabel(k)}</option>`).join('')||'<option>시험 없음</option>'}</select></label>
      <label class="f">분원<select id="admBranch">${BRANCHES.map(b=>`<option ${b===admBranch?'selected':''}>${b}</option>`).join('')}</select></label>
      ${ADM_GRADES.filter(g=>data[g].choices.length>1).map(g=>`<label class="f" style="min-width:220px">${g} 시험 (이 회차에 ${data[g].choices.length}개)<select data-admpick="${g}">${data[g].choices.map(e=>`<option value="${e.id}" ${data[g].ex&&e.id===data[g].ex.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label>`).join('')}
    </div>
    <p class="muted" style="margin-top:6px">${ADM_GRADES.map(g=>`${g}: ${data[g].ex?esc(data[g].ex.name):'<span class="muted">없음</span>'}`).join(' · ')}<br>
      회차는 시행 연·월로 정해요 (2월 1회 · 5월 2회 · 8월 3회 · 11월 4회). 등급은 수능 영어 절대평가 기준(100점 환산 90점↑ 1등급, 80점↑ 2등급 …)입니다.</p>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>등급 분석 · ${esc(admBranch)} · ${roundLabel(admRound)}</h2>
    <div style="overflow:auto"><table class="adm">${gradeHead('학년')}<tbody>
      ${t1.map(x=>gradeRow(x.g+(data[x.g].ex?'':' <span class="muted">(시험 없음)</span>'),x.cnt,x.n)).join('')}
      ${gradeRow('합계',t1sum.cnt,t1sum.n,true)}
    </tbody></table></div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">전체 분원 비교</h2>
      <div class="subtabs" style="margin:0">${ADM_GRADES.map(g=>`<button data-admg="${g}" class="${g===admGrade?'active':''}">${g}</button>`).join('')}</div></div>
    ${G.ex?`<p class="muted" style="margin:6px 0 10px">${esc(G.ex.name)}</p>`:`<p class="muted">이 회차에 ${admGrade} 시험이 없어요.</p>`}
    <div style="overflow:auto"><table class="adm">${gradeHead('분원')}<tbody>
      ${t2.map(x=>gradeRow(x.b+(x.b===admBranch?' ★':''),x.cnt,x.n)).join('')}
      ${gradeRow('전체',t2sum.cnt,t2sum.n,true)}
    </tbody></table></div>

    <h3 style="margin-top:22px">오답률 TOP 5 · ${admGrade}</h3>
    <div style="overflow:auto"><table><thead><tr><th>분원</th><th>응시</th><th>1위</th><th>2위</th><th>3위</th><th>4위</th><th>5위</th></tr></thead><tbody>
      ${topRows.map((x,ri)=>{ const t=top3(x.l); return `<tr${x.strong?' style="font-weight:700;background:#fafbfc"':''}><td>${esc(x.label)}</td><td>${x.l.length}</td>${[0,1,2,3,4].map(i=>`<td>${topCell(t[i],ri)}</td>`).join('')}</tr>`; }).join('')}
    </tbody></table></div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>반별 성적 · ${esc(admBranch)} ${admGrade}</h2>
    <p class="muted" style="margin:-6px 0 10px">반에서 가장 높은 점수는 <b style="color:#1d4ed8">파란색</b>, 가장 낮은 점수는 <b style="color:var(--bad)">빨간색</b>. 반·담임은 시험 볼 때 기준입니다.${prevEx?` 변화는 ${esc(prevEx.name)} 대비.`:''}</p>
    ${Object.keys(byCls).length?`<div class="grid-cls">${Object.keys(byCls).sort(koCmp).map(c=>{
      const L=byCls[c].sort((a,b)=>b.r.score-a.r.score), mx=L[0].r.score, mn=L[L.length-1].r.score, avg=L.reduce((s,x)=>s+x.r.score,0)/L.length;
      const ts=[...new Set(L.map(x=>x.teacher).filter(Boolean))].join(', ');
      return `<div class="cat-bar"><div class="row" style="justify-content:space-between"><b>${esc(c)}</b><span class="muted">${ts?'담임 '+esc(ts)+' · ':''}${L.length}명 · 평균 ${avg.toFixed(1)}</span></div>
        <table style="margin-top:6px"><tbody>${L.map(x=>{ const col=L.length>1&&mx!==mn?(x.r.score===mx?'#1d4ed8':x.r.score===mn?'var(--bad)':''):''; return `<tr><td>${esc(x.r.student_name)}</td>
          <td style="text-align:right;${col?`color:${col};font-weight:800`:''}">${x.r.score}</td><td class="muted">${engGrade(x.r.score,G.ex)}등급</td>
          <td style="text-align:right">${x.prev?diffTag(to100(x.r.score,G.ex)-to100(x.prev.score,prevEx)):'<span class="muted">-</span>'}</td></tr>`; }).join('')}</tbody></table></div>`; }).join('')}</div>`
      :'<p class="muted">이 분원·학년 응답이 없습니다.</p>'}
  </div>

  <div class="card" style="margin-top:14px">
    <h2>담임별 성과 · ${esc(admBranch)} · ${roundLabel(admRound)}</h2>
    ${noTeacher?'<p class="total bad" style="margin-top:-6px">담임 정보가 없어요. 담임 열을 추가한 명단을 올려주세요.</p>':''}
    <p class="muted" style="margin:-6px 0 10px">이번 회차 고1~고3 합산. 성장은 같은 학생의 직전 시험 대비 평균 점수 변화(100점 환산)이며, 비교 가능한 학생 수를 함께 표시합니다.</p>
    <div style="overflow:auto"><table><thead><tr><th>담임</th><th>담당 반</th><th>학생 수</th><th>평균 점수</th><th>1등급 비율</th><th>2등급 이내</th><th>평균 성장</th></tr></thead><tbody>
      ${Object.entries(tStat).sort((a,b)=>b[1].n-a[1].n).map(([t,o])=>`<tr><td><b>${esc(t)}</b></td><td class="muted">${[...o.cls].sort(koCmp).map(esc).join(', ')}</td><td>${o.n}</td><td>${(o.sum/o.n).toFixed(1)}</td>
        <td><b>${pct(o.g1,o.n)}%</b> <span class="muted">(${o.g1}명)</span></td><td>${pct(o.g2,o.n)}% <span class="muted">(${o.g2}명)</span></td>
        <td>${o.gn?`${diffTag(o.grow/o.gn)} <span class="muted">(${o.gn}명)</span>`:'<span class="muted">지난 기록 없음</span>'}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">응답이 없습니다.</td></tr>'}
    </tbody></table></div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>담임 누적 · ${esc(admBranch)} · 전체 회차</h2>
    <p class="muted" style="margin:-6px 0 10px">칸마다 <b>평균 점수</b> · 1등급 비율 · 학생 수. 담당 기간 성장은 학생이 연달아 본 두 시험의 점수 변화를 <b>뒤 시험 때 담임</b>의 몫으로 모아 평균 낸 값이에요 (담임이 바뀐 학생은 바뀐 뒤부터 새 담임에게).</p>
    <div style="overflow:auto"><table class="adm"><thead><tr><th>담임</th>${roundCols.map(k=>`<th>${roundLabel(k)}</th>`).join('')}<th>담당 기간 성장</th></tr></thead><tbody>
      ${teachers.map(t=>`<tr><td><b>${esc(t)}</b></td>${roundCols.map(k=>{ const o=tr[t]&&tr[t][k]; return o?`<td><b>${(o.sum/o.n).toFixed(1)}</b><br><span class="muted">1등급 ${pct(o.g1,o.n)}% · ${o.n}명</span></td>`:'<td class="muted">-</td>'; }).join('')}
        <td>${tg[t]?`${diffTag(tg[t].sum/tg[t].n)}<br><span class="muted">학생 ${tg[t].stu.size}명 · ${tg[t].n}건</span>`:'<span class="muted">-</span>'}</td></tr>`).join('') || `<tr><td colspan="${roundCols.length+2}" class="muted">응답이 없습니다.</td></tr>`}
    </tbody></table></div>
    <p class="muted" style="margin-top:8px">학생 수가 적은 담임은 한두 명 점수로 숫자가 크게 달라지니 인원과 함께 보세요.</p>
  </div>`;

  $('#admRound').onchange=e=>{ admRound=e.target.value; renderAdminTab(); };
  $('#admBranch').onchange=e=>{ admBranch=e.target.value; renderAdminTab(); };
  document.querySelectorAll('[data-admpick]').forEach(s=>s.onchange=()=>{ admPick[admRound+'|'+s.dataset.admpick]=s.value; renderAdminTab(); });
  document.querySelectorAll('[data-admg]').forEach(b=>b.onclick=()=>{ admGrade=b.dataset.admg; renderAdminTab(); });
  document.querySelectorAll('[data-topq]').forEach(el=>el.onclick=()=>{ const [ri,no]=el.dataset.topq.split('|').map(Number); const x=topRows[ri]; openQuestionView(G.ex,no,x.l,x.label); });
}

/* ===================== 6. 문항 은행 (시험지 워드) · 오답 보기 · 문제지 만들기 ===================== */
const W_NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const R_NS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const QSRC_PREFIX='qsrc_';
const QCACHE={};   // examId → {zip, doc, els, q, grp, rels} | null

// --- 저장: Supabase는 exam-papers 버킷(파일 이름 qsrc_…), 로컬은 브라우저 저장 ---
const b64 = buf => { let s='', b=new Uint8Array(buf); for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); };
const unb64 = s => { const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u.buffer; };
async function qsrcFile(examId){
  if(!sb) return null;
  const fs=await DB.files(examId); return fs.filter(f=>f.path.split('/').pop().startsWith(QSRC_PREFIX)).pop()||null;
}
async function saveQsrc(examId, file){
  const buf=await file.arrayBuffer();
  if(sb){
    const old=await qsrcFile(examId); if(old) await DB.deleteFile(old);
    const path=`${examId}/${QSRC_PREFIX}${Date.now()}.docx`;
    const up=await sb.storage.from(FILE_BUCKET).upload(path,new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}));
    if(up.error) throw up.error;
    const {error}=await sb.from('mx_exam_files').insert({exam_id:examId,file_name:file.name,path}); if(error) throw error;
  } else {
    try{ localStorage.setItem('mx_qsrc_'+examId, JSON.stringify({name:file.name,data:b64(buf)})); }
    catch(e){ throw new Error('브라우저 저장공간이 부족해요. Supabase에 연결하면 용량 걱정 없이 저장돼요.'); }
  }
  delete QCACHE[examId];
}
async function qsrcInfo(examId){
  if(sb){ const f=await qsrcFile(examId); return f?{name:f.file_name}:null; }
  try{ const v=JSON.parse(localStorage.getItem('mx_qsrc_'+examId)||'null'); return v?{name:v.name}:null; }catch(e){ return null; }
}
async function loadQsrcBuf(examId){
  if(sb){ const f=await qsrcFile(examId); if(!f) return null; const res=await fetch(DB.fileUrl(f)); if(!res.ok) throw new Error('시험지 워드를 내려받지 못했어요.'); return await res.arrayBuffer(); }
  try{ const v=JSON.parse(localStorage.getItem('mx_qsrc_'+examId)||'null'); return v?unb64(v.data):null; }catch(e){ return null; }
}

// --- 워드 해석: 문항 시작("21."), 묶음 머리말("[31~34]"), 끝("확인 사항"/"정답") ---
const wEls=(node,name)=>[...node.getElementsByTagNameNS(W_NS,name)];
const wText=e=>wEls(e,'t').map(t=>t.textContent).join('');
const GROUP_RE=/^\[(\d{1,2})\s*[~∼～-]\s*(\d{1,2})[^\]]*\]/;   // [31~34], [41~42 단일 장문]
const groupMatch=t=>t.match(GROUP_RE) || t.match(/^\[(\d{2})(\d{2})(?!\d)[^\]]*\]/);   // "[4345] 복합 장문"처럼 ~가 빠진 경우
async function parseDocx(buf){
  if(!window.JSZip) throw new Error('워드 처리 도구를 불러오지 못했어요. 인터넷 연결을 확인하세요.');
  const zip=await JSZip.loadAsync(buf);
  const xml=await zip.file('word/document.xml').async('string');
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const body=wEls(doc,'body')[0]; const els=[...body.children];
  const starts={}, groups=[]; let end=els.length-1;
  for(let i=0;i<els.length;i++){
    const e=els[i]; const t=wText(e).trim();
    if(e.localName==='p'){
      const m=t.match(/^(\d{1,2})\s*\./); if(m){ const n=+m[1]; if(n>=1&&n<=45&&!(n in starts)) starts[n]=i; }
      const g=groupMatch(t); if(g) groups.push([+g[1],+g[2],i]);
    }
    if(starts[45]!=null && i>starts[45] && (t.includes('확인 사항') || /정답$/.test(t) || /^정답\s*(및|과)?\s*해설/.test(t))){ end=i; break; }
    if(e.localName==='sectPr'){ end=i; break; }
  }
  const marks=[...new Set([...Object.values(starts),...groups.map(g=>g[2]),end])].sort((a,b)=>a-b);
  const nxt=i=>marks.find(m=>m>i)??end;
  const q={}; Object.entries(starts).forEach(([n,s])=>q[n]=[s,nxt(s)]);
  const grp=groups.map(([a,b,h])=>{ const first=starts[a]; const he=first!=null&&first>h?first:nxt(h); return {a,b,h,he}; });
  // 해설 구역: 문제 끝 이후 다시 "1." "2." … 로 시작하는 부분 (해석·어휘·해설)
  const hs={}, hg=[]; let last=0, docEnd=els.length;
  for(let i=end+1;i<els.length;i++){
    const e=els[i]; if(e.localName==='sectPr'){ docEnd=i; break; }
    if(e.localName!=='p') continue;
    const t=wText(e).trim();
    const m=t.match(/^(\d{1,2})\s*\./); if(m && +m[1]>last && +m[1]<=45){ hs[+m[1]]=i; last=+m[1]; continue; }
    const g=groupMatch(t); if(g) hg.push([+g[1],+g[2],i]);
  }
  const hmarks=[...new Set([...Object.values(hs),...hg.map(g=>g[2]),docEnd])].sort((a,b)=>a-b);
  const hnxt=i=>hmarks.find(m=>m>i)??docEnd;
  const hq={}; Object.entries(hs).forEach(([n,s])=>hq[n]=[s,hnxt(s)]);
  const hgrp=hg.map(([a,b,h])=>{ const first=hs[a]; const he=first!=null&&first>h?first:hnxt(h); return {a,b,h,he}; });
  const relsXml=await zip.file('word/_rels/document.xml.rels').async('string');
  const rels=new DOMParser().parseFromString(relsXml,'application/xml');
  return {zip, doc, els, q, grp, hq, hgrp, rels};
}
async function getQbank(examId){
  if(!(examId in QCACHE)){
    try{ const buf=await loadQsrcBuf(examId); QCACHE[examId]=buf?await parseDocx(buf):null; }
    catch(e){ console.warn(e); QCACHE[examId]=null; }
  }
  return QCACHE[examId];
}
// 해설 하나(+묶음 해석) 요소 인덱스
function hIndexes(Q, n){
  if(!Q||!Q.hq||!Q.hq[n]) return [];
  const out=[]; Q.hgrp.filter(g=>g.a<=n&&n<=g.b).forEach(g=>{ for(let i=g.h;i<g.he;i++) out.push(i); });
  const [s,e]=Q.hq[n]; for(let i=s;i<e;i++) out.push(i);
  return out;
}
// 문항 하나(+묶음 머리말·공통 지문) 요소 인덱스
function qIndexes(Q, n, withGroup=true){
  if(!Q||!Q.q[n]) return [];
  const out=[];
  if(withGroup) Q.grp.filter(g=>g.a<=n&&n<=g.b).forEach(g=>{ for(let i=g.h;i<g.he;i++) out.push(i); });
  const [s,e]=Q.q[n]; for(let i=s;i<e;i++) out.push(i);
  return out;
}

// --- 화면용 미리보기 (학생이 고른 번호 빨강, 정답 초록) ---
function runsHtml(p){
  return [...p.childNodes].map(function walk(n){
    if(n.nodeType!==1) return '';
    if(n.localName==='r'){
      const pr=wEls(n,'rPr')[0];
      const has=k=>pr&&wEls(pr,k).some(x=>x.getAttributeNS(W_NS,'val')!=='0'&&x.getAttributeNS(W_NS,'val')!=='none'&&x.getAttributeNS(W_NS,'val')!=='false');
      let t=[...n.childNodes].map(c=>c.localName==='t'?esc(c.textContent):c.localName==='tab'?'&emsp;':c.localName==='br'?'<br>':c.localName==='drawing'||c.localName==='pict'?'<span class="muted">[그림]</span>':'').join('');
      if(!t) return '';
      if(has('b')) t=`<b>${t}</b>`; if(has('i')) t=`<i>${t}</i>`; if(has('u')) t=`<u>${t}</u>`;
      return t;
    }
    if(n.localName==='hyperlink'||n.localName==='smartTag'||n.localName==='ins') return [...n.childNodes].map(walk).join('');
    return '';
  }).join('');
}
function chunkHtml(Q, idx, pick, ans){
  const mark=html=>{ const s=html.replace(/<[^>]+>/g,'').trim(); const k='①②③④⑤'.indexOf(s[0])+1;
    return k&&k===pick&&k!==ans?`<span class="q-pick">${html}</span>`:k&&k===ans?`<span class="q-ans">${html}</span>`:html; };
  const markLines=h=>h.split('<br>').map(mark).join('<br>');   // 한 문단 안에 줄바꿈으로 보기가 여러 개인 경우
  return idx.map(i=>{ const e=Q.els[i];
    if(e.localName==='p'){ const h=runsHtml(e); return h?`<p>${markLines(h)}</p>`:''; }
    if(e.localName==='tbl') return `<table class="q-tbl">${wEls(e,'tr').map(tr=>`<tr>${[...tr.children].filter(c=>c.localName==='tc').map(tc=>`<td>${wEls(tc,'p').map(p=>markLines(runsHtml(p))).join('<br>')}</td>`).join('')}</tr>`).join('')}</table>`;
    return '';
  }).join('');
}

// --- 학생 오답 목록 (세부 유형 카드 클릭) ---
async function openWrongList(name, rows, cat, sub){

  rows.forEach(o=>o.ex.items.forEach((it,i)=>{ if((it.cat||'미지정')===cat && (it.sub||'')===sub && !isOk(o.r.answers[i],it)) items.push({o,it,i}); }));
  $('#modal').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(name)} · ${esc(cat)} ${esc(sub||'')} 오답 ${items.length}문항</h2><button class="btn" id="closeM">닫기</button></div>
    <p class="muted">빨간색 = 학생이 고른 답, 초록색 = 정답. 시험지 워드를 등록한 시험만 문제가 보여요.</p><div id="wrongBody"><p class="muted">불러오는 중…</p></div>`;
  $('#closeM').onclick=()=>$('#modalBg').classList.remove('show');
  $('#modalBg').classList.add('show');
  const parts=[];
  for(const {o,it,i} of items){
    const Q=await getQbank(o.ex.id); const ch=o.r.answers[i]; const pick=+ch||0, ans=+it.answer||0;
    parts.push(`<div class="q-card"><div class="row" style="justify-content:space-between"><b>${esc(o.ex.name)} · ${it.no}번</b>
      <span>고른 답 <b class="mark-x">${ch==='x'?'오답(선택 기록 없음)':pick?circled(pick):'무응답'}</b> · 정답 <b class="mark-o">${ans?circled(ans):'-'}</b></span></div>
      ${Q&&Q.q[it.no]?`<details><summary>문제 보기</summary><div class="q-body">${chunkHtml(Q,qIndexes(Q,it.no),pick,ans)}</div></details>`:'<p class="muted" style="margin:4px 0 0">시험지 워드 미등록</p>'}
      ${Q&&Q.hq&&Q.hq[it.no]?`<details><summary>해설 보기</summary><div class="q-body">${chunkHtml(Q,hIndexes(Q,it.no),0,0)}</div></details>`:''}</div>`);
  }
  $('#wrongBody').innerHTML=parts.join('')||'<p class="muted">틀린 문제가 없어요.</p>';
}

// --- 모의고사 대비 문제지 만들기 ---
async function openWorksheet(name, code, rows){
  $('#modal').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(name)} 모의고사 대비 문제지</h2><button class="btn" id="closeM">닫기</button></div><div id="wsBody"><p class="muted">시험지 불러오는 중…</p></div>`;
  $('#closeM').onclick=()=>$('#modalBg').classList.remove('show');
  $('#modalBg').classList.add('show');
  // 1) 학생이 틀린 문제 (시험지 워드 등록된 시험)
  const wrong=[], weakSubs={};
  for(const o of rows){
    const Q=await getQbank(o.ex.id);
    o.ex.items.forEach((it,i)=>{ if(isOk(o.r.answers[i],it)) return;
      const k=(it.cat||'미지정')+'|'+(it.sub||''); weakSubs[k]=(weakSubs[k]||0)+1;
      if(Q&&Q.q[it.no]) wrong.push({ex:o.ex,it,key:k,pick:+o.r.answers[i]||0}); });
  }
  // 2) 이 학생이 안 본 시험에서 같은 세부 유형
  const taken=new Set(rows.map(o=>o.ex.id)), similar=[];
  for(const ex of EXAMS){
    if(taken.has(ex.id)) continue;
    const Q=await getQbank(ex.id); if(!Q) continue;
    ex.items.forEach(it=>{ const k=(it.cat||'미지정')+'|'+(it.sub||''); if(weakSubs[k] && Q.q[it.no]) similar.push({ex,it,key:k}); });
  }
  const keyOrder=Object.keys(weakSubs).sort((a,b)=>weakSubs[b]-weakSubs[a]);
  const listen=k=>k.startsWith('듣기|');
  const all={w:wrong,s:similar};
  const sel=new Set(); wrong.forEach((x,j)=>{ if(!listen(x.key)) sel.add('w'+j); });   // 기본: 틀린 문제(듣기 제외)
  // 필터: 회차(최근 N회차) · 비슷한 문제 학년
  const roundsDesc=[...new Set(EXAMS.map(roundKey))].sort((a,b)=>koCmp(b,a));
  const lastEx=rows.slice().sort((a,b)=>koCmp(examDateKey(b.ex),examDateKey(a.ex)))[0];
  const myGrade=lastEx?normGrade(lastEx.ex.grade):'';
  const simGrades=[...new Set(similar.map(x=>normGrade(x.ex.grade)))].sort(koCmp);
  const gradeSel=new Set(simGrades.includes(myGrade)?[myGrade]:simGrades);
  let recentN=0;   // 0 = 전체 회차
  const passRound=x=>!recentN || roundsDesc.slice(0,recentN).includes(roundKey(x.ex));
  const visible=(pre,x)=>passRound(x) && (pre!=='s' || gradeSel.has(normGrade(x.ex.grade)));
  const row=(x,j,pre)=>`<div class="ws-item"><input type="checkbox" data-ws="${pre}${j}" ${sel.has(pre+j)?'checked':''}> <span class="ws-prev" data-prev="${pre}${j}" title="눌러서 문제 미리 보기">${pill(x.it.cat)} <b>${esc(x.it.sub||'-')}</b> <span class="muted">${esc(x.ex.name)} · ${x.it.no}번 ▾</span></span></div><div class="ws-pv" id="pv-${pre}${j}" hidden></div>`;
  const section=(list,pre)=>keyOrder.filter(k=>list.some((x,j)=>x.key===k && visible(pre,x))).map(k=>`<div class="ws-grp"><div class="muted" style="font-weight:700">${esc(k.replace('|',' · '))} <span>(누적 오답 ${weakSubs[k]})</span></div>${list.map((x,j)=>x.key===k&&visible(pre,x)?row(x,j,pre):'').join('')}</div>`).join('');
  const allBox=(pre)=>`<label class="ws-item" style="cursor:pointer;font-weight:700"><input type="checkbox" data-wsall="${pre}"> 전체 선택</label>`;
  $('#wsBody').innerHTML=`
    <label class="f" style="margin:10px 0">문제지 제목<input id="wsTitle" value="${esc(name)} 모의고사 대비 오답 문제지"></label>
    <div class="row" style="gap:16px;align-items:flex-end;margin-bottom:6px">
      <label class="f">회차 범위<select id="wsRecent"><option value="0">전체 회차</option>${[1,2,3,4,5,6,8].filter(n=>n<roundsDesc.length).map(n=>`<option value="${n}">최근 ${n}회차</option>`).join('')}</select></label>
      ${simGrades.length?`<div class="f"><span>비슷한 문제 학년</span><div class="row" style="gap:10px">${simGrades.map(g=>`<label class="ws-item" style="cursor:pointer"><input type="checkbox" data-wsg="${g}" ${gradeSel.has(g)?'checked':''}> ${g}</label>`).join('')}</div></div>`:''}
    </div>
    <div class="row" style="align-items:flex-start;gap:16px">
      <div style="flex:1;min-width:300px"><h3 id="wsHw"></h3><div id="wsListW"></div></div>
      <div style="flex:1;min-width:300px"><h3 id="wsHs"></h3><div id="wsListS"></div></div>
    </div>
    <p class="muted">듣기 문항은 기본으로 빠져 있어요. 묶음 문제는 공통 지문이 자동으로 같이 들어가고, 마지막 장에 정답이 붙어요. 받은 워드 파일에서 자유롭게 고쳐서 인쇄하세요.</p>
    <div class="row" style="margin-top:10px"><label class="ws-item" style="cursor:pointer"><input type="checkbox" id="wsHae" checked> 맨 뒤에 해설 붙이기 (해석·어휘·해설)</label></div>
    <div class="row" style="margin-top:6px"><button class="btn primary" id="wsGo">워드로 만들기</button><span class="muted" id="wsCnt"></span></div>`;
  // 선택은 화면에 보이는(필터 통과한) 문항만 문제지에 들어감
  const picked=()=>[...document.querySelectorAll('[data-ws]:checked')].map(c=>all[c.dataset.ws[0]][+c.dataset.ws.slice(1)]);
  const cnt=()=>{ const l=picked(); const h=l.filter(x=>{ const Q=QCACHE[x.ex.id]; return Q&&Q.hq&&Q.hq[x.it.no]; }).length;
    $('#wsCnt').textContent=`${l.length}문항 선택 · 해설 있는 문항 ${h}개`;
    ['w','s'].forEach(pre=>{ const b=document.querySelector(`[data-wsall="${pre}"]`); if(!b) return; const cs=[...document.querySelectorAll(`[data-ws^="${pre}"]`)];
      b.checked=cs.length>0&&cs.every(c=>c.checked); b.indeterminate=!b.checked&&cs.some(c=>c.checked); }); };
  const renderLists=()=>{
    const nw=wrong.filter(x=>visible('w',x)).length, ns=similar.filter(x=>visible('s',x)).length;
    $('#wsHw').textContent=`틀렸던 문제 (${nw})`; $('#wsHs').textContent=`안 본 시험의 비슷한 문제 (${ns})`;
    $('#wsListW').innerHTML=nw?allBox('w')+section(wrong,'w'):`<p class="muted">${wrong.length?'이 범위에 틀린 문제가 없어요.':'시험지 워드가 등록된 시험에서 틀린 문제가 없어요.'}</p>`;
    $('#wsListS').innerHTML=ns?allBox('s')+section(similar,'s'):`<p class="muted">${similar.length?'선택한 학년·회차에 비슷한 문제가 없어요.':'같은 유형이 있는, 이 학생이 안 본 시험(워드 등록)이 없어요.'}</p>`;
    document.querySelectorAll('[data-ws]').forEach(c=>c.onchange=()=>{ c.checked?sel.add(c.dataset.ws):sel.delete(c.dataset.ws); cnt(); });
    document.querySelectorAll('[data-wsall]').forEach(b=>b.onchange=()=>{ document.querySelectorAll(`[data-ws^="${b.dataset.wsall}"]`).forEach(c=>{ c.checked=b.checked; b.checked?sel.add(c.dataset.ws):sel.delete(c.dataset.ws); }); cnt(); });
    bindPrev(); cnt();
  };
  $('#wsRecent').onchange=e=>{ recentN=+e.target.value; renderLists(); };
  document.querySelectorAll('[data-wsg]').forEach(c=>c.onchange=()=>{ c.checked?gradeSel.add(c.dataset.wsg):gradeSel.delete(c.dataset.wsg); renderLists(); });
  // 문제 제목 클릭 → 미리 보기 (틀린 문제는 학생이 고른 답 빨강, 정답 초록)
  function bindPrev(){ document.querySelectorAll('[data-prev]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.prev, box=$('#pv-'+id), x=all[id[0]][+id.slice(1)];
    if(!box.hidden){ box.hidden=true; return; }
    if(!box.innerHTML){ const Q=QCACHE[x.ex.id]; box.innerHTML=Q?`<div class="q-body" style="margin:0">${chunkHtml(Q,qIndexes(Q,x.it.no),x.pick||0,+x.it.answer||0)}</div>`:'<span class="muted">문제를 불러오지 못했어요.</span>'; }
    box.hidden=false;
  }); }
  renderLists();
  $('#wsGo').onclick=async()=>{
    const list=picked(); if(!list.length) return alert('문제를 하나 이상 골라주세요.');
    $('#wsGo').disabled=true; $('#wsGo').textContent='만드는 중…';
    try{ await buildWorksheet($('#wsTitle').value.trim()||'오답 문제지', list, $('#wsHae').checked); }
    catch(err){ alert('문제지를 만들지 못했어요: '+err.message); }
    $('#wsGo').disabled=false; $('#wsGo').textContent='워드로 만들기';
  };
}

// --- 학년 공통 대비 문제지 / 회차 통째로 인쇄 (학생 기록이 없어도 사용) ---
async function openCommonWorksheet({name='', grade=''}={}){
  $('#modal').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${name?esc(name)+' · ':''}대비 문제지</h2><button class="btn" id="closeM">닫기</button></div>
    <div class="row" style="gap:8px;margin:12px 0"><button class="btn primary" data-cmode="common">학년 공통 대비</button><button class="btn" data-cmode="round">회차 통째로 인쇄 (듣기 제외)</button></div>
    <div id="cwBody"></div>`;
  $('#closeM').onclick=()=>$('#modalBg').classList.remove('show');
  $('#modalBg').classList.add('show');
  const grades=[...new Set([...ADM_GRADES, ...EXAMS.map(e=>normGrade(e.grade)).filter(Boolean)])].sort(koCmp);
  const st={mode:'common', grade:grades.includes(grade)?grade:(grades[0]||''), recentN:0, scope:'all', th:40, listen:false};
  const go=async(btn,title,list,withHae,keepNo)=>{
    if(!list.length) return alert('문제를 하나 이상 골라주세요.');
    btn.disabled=true; const t=btn.textContent; btn.textContent='만드는 중…';
    try{ await buildWorksheet(title,list,withHae,keepNo); }catch(err){ alert('문제지를 만들지 못했어요: '+err.message); }
    btn.disabled=false; btn.textContent=t;
  };
  const pvBind=(arr)=>document.querySelectorAll('#cwBody [data-prev]').forEach(el=>el.onclick=()=>{
    const j=+el.dataset.prev, box=$('#cpv-'+j), x=arr[j];
    if(!box.hidden){ box.hidden=true; return; }
    if(!box.innerHTML){ const Q=QCACHE[x.ex.id]; box.innerHTML=Q?`<div class="q-body" style="margin:0">${chunkHtml(Q,qIndexes(Q,x.it.no),0,+x.it.answer||0)}</div>`:'<span class="muted">문제를 불러오지 못했어요.</span>'; }
    box.hidden=false; });

  // 1) 학년 공통: 같은 학년 시험에서 학생들이 많이 틀린 문항
  async function renderCommon(){
    const body=$('#cwBody'); body.innerHTML='<p class="muted">시험지·응답 불러오는 중…</p>';
    const exs=EXAMS.filter(e=>normGrade(e.grade)===st.grade);
    const roundsDesc=[...new Set(exs.map(roundKey))].sort((a,b)=>koCmp(b,a));
    const items=[];
    for(const ex of exs){
      if(st.recentN && !roundsDesc.slice(0,st.recentN).includes(roundKey(ex))) continue;
      const Q=await getQbank(ex.id); if(!Q) continue;
      const rs=(await getResponses(ex.id)).filter(r=>st.scope==='all'||r.branch===prefs.branch); if(!rs.length) continue;
      const wr=wrongRates(ex,rs);
      ex.items.forEach((it,i)=>{ if(!Q.q[it.no]) return; if(!st.listen && it.cat==='듣기') return;
        if(wr[i]!=null && wr[i]>=st.th) items.push({ex,it,rate:wr[i],n:rs.length}); });
    }
    items.sort((a,b)=>b.rate-a.rate || koCmp(examDateKey(b.ex),examDateKey(a.ex)) || a.it.no-b.it.no);
    body.innerHTML=`
      <label class="f" style="margin:4px 0 10px">문제지 제목<input id="cwTitle" value="${esc((name?name+' ':'')+st.grade+' 공통 모의고사 대비 문제지')}"></label>
      <div class="row" style="gap:16px;align-items:flex-end;margin-bottom:8px">
        <label class="f">학년<select id="cwGrade">${grades.map(g=>`<option ${g===st.grade?'selected':''}>${esc(g)}</option>`).join('')}</select></label>
        <label class="f">회차 범위<select id="cwRecent"><option value="0">전체 회차</option>${[1,2,3,4,5,6,8].filter(n=>n<roundsDesc.length).map(n=>`<option value="${n}" ${n===st.recentN?'selected':''}>최근 ${n}회차</option>`).join('')}</select></label>
        <label class="f">오답률 기준<select id="cwTh">${[30,40,50,60,70].map(v=>`<option value="${v}" ${v===st.th?'selected':''}>${v}% 이상</option>`).join('')}</select></label>
        <label class="f">학생 범위<select id="cwScope"><option value="all" ${st.scope==='all'?'selected':''}>전체 분원 학생</option><option value="br" ${st.scope==='br'?'selected':''}>${esc(prefs.branch)} 학생만</option></select></label>
        <label class="ws-item" style="cursor:pointer"><input type="checkbox" id="cwListen" ${st.listen?'checked':''}> 듣기 포함</label>
      </div>
      <p class="muted" style="margin:0 0 6px">${esc(st.grade)} 시험(시험지 워드 등록된 것)에서 오답률이 높은 문항 순서예요. 문항을 누르면 미리 볼 수 있어요.</p>
      ${items.length?`<label class="ws-item" style="cursor:pointer;font-weight:700"><input type="checkbox" id="cwAll" checked> 전체 선택</label>
      <div class="ws-grp" style="max-height:420px;overflow:auto">${items.map((x,j)=>`<div class="ws-item"><input type="checkbox" data-cw="${j}" checked> <span class="ws-prev" data-prev="${j}" title="눌러서 문제 미리 보기">${pill(x.it.cat)} <b>${esc(x.it.sub||'-')}</b> <span class="muted">${esc(x.ex.name)} · ${x.it.no}번 ▾</span></span> <span style="margin-left:auto;font-weight:700;color:var(--bad)">${x.rate}%</span><span class="muted">(${x.n}명)</span></div><div class="ws-pv" id="cpv-${j}" hidden></div>`).join('')}</div>`
      :`<p class="muted">${exs.length?'조건에 맞는 문항이 없어요. 오답률 기준을 낮추거나 회차 범위를 넓혀 보세요.':'이 학년 시험이 아직 없어요.'}</p>`}
      <div class="row" style="margin-top:10px"><label class="ws-item" style="cursor:pointer"><input type="checkbox" id="cwHae" checked> 맨 뒤에 해설 붙이기 (해석·어휘·해설)</label></div>
      <div class="row" style="margin-top:6px"><button class="btn primary" id="cwGo">워드로 만들기</button><span class="muted" id="cwCnt"></span></div>`;
    const picked=()=>[...document.querySelectorAll('[data-cw]:checked')].map(c=>items[+c.dataset.cw]);
    const cnt=()=>{ const l=picked(); $('#cwCnt').textContent=`${l.length}문항 선택`; const a=$('#cwAll'); if(a){ const cs=[...document.querySelectorAll('[data-cw]')]; a.checked=cs.every(c=>c.checked); a.indeterminate=!a.checked&&cs.some(c=>c.checked); } };
    document.querySelectorAll('[data-cw]').forEach(c=>c.onchange=cnt);
    const a=$('#cwAll'); if(a) a.onchange=()=>{ document.querySelectorAll('[data-cw]').forEach(c=>c.checked=a.checked); cnt(); };
    $('#cwGrade').onchange=e=>{ st.grade=e.target.value; st.recentN=0; renderCommon(); };
    $('#cwRecent').onchange=e=>{ st.recentN=+e.target.value; renderCommon(); };
    $('#cwTh').onchange=e=>{ st.th=+e.target.value; renderCommon(); };
    $('#cwScope').onchange=e=>{ st.scope=e.target.value; renderCommon(); };
    $('#cwListen').onchange=e=>{ st.listen=e.target.checked; renderCommon(); };
    pvBind(items); cnt();
    $('#cwGo').onclick=()=>go($('#cwGo'), $('#cwTitle').value.trim()||'모의고사 대비 문제지', picked(), $('#cwHae').checked, false);
  }

  // 2) 회차 통째로: 시험 하나의 독해 문항 전부 (원래 번호 그대로)
  let roundEx='';
  async function renderRound(){
    const body=$('#cwBody');
    const exs=EXAMS.filter(e=>!st.grade||normGrade(e.grade)===st.grade).sort((a,b)=>koCmp(examDateKey(b),examDateKey(a)));
    if(!exs.some(e=>e.id===roundEx)) roundEx=exs[0]?exs[0].id:'';
    const ex=examById(roundEx);
    body.innerHTML=`<div class="row" style="gap:16px;align-items:flex-end">
        <label class="f">학년<select id="crGrade">${grades.map(g=>`<option ${g===st.grade?'selected':''}>${esc(g)}</option>`).join('')}</select></label>
        <label class="f">시험<select id="crEx">${exs.map(e=>`<option value="${e.id}" ${e.id===roundEx?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label></div>
      <div id="crInfo" style="margin-top:10px"><p class="muted">${ex?'시험지 불러오는 중…':'이 학년 시험이 아직 없어요.'}</p></div>`;
    $('#crGrade').onchange=e=>{ st.grade=e.target.value; renderRound(); };
    $('#crEx').onchange=e=>{ roundEx=e.target.value; renderRound(); };
    if(!ex) return;
    const Q=await getQbank(ex.id); if(roundEx!==ex.id) return;
    const list=Q?ex.items.filter(it=>it.cat!=='듣기' && Q.q[it.no]).map(it=>({ex,it})):[];
    const info=$('#crInfo'); if(!info) return;
    if(!Q){ info.innerHTML='<p class="muted">이 시험은 시험지 워드가 등록되어 있지 않아요. 시험 관리에서 워드를 먼저 올려주세요.</p>'; return; }
    const nos=list.map(x=>x.it.no);
    info.innerHTML=`<p>듣기를 뺀 <b>${list.length}문항</b>${nos.length?` (${nos[0]}~${nos[nos.length-1]}번)`:''}을 원래 번호 그대로 넣고, 마지막에 정답표를 붙여요.</p>
      <label class="f" style="margin:4px 0 10px">문제지 제목<input id="crTitle" value="${esc(ex.name)} (독해)"></label>
      <label class="ws-item" style="cursor:pointer"><input type="checkbox" id="crHae"> 맨 뒤에 해설 붙이기 (해석·어휘·해설)</label>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="crGo">워드로 만들기</button></div>`;
    $('#crGo').onclick=()=>go($('#crGo'), $('#crTitle').value.trim()||ex.name, list, $('#crHae').checked, true);
  }
  const setMode=m=>{ st.mode=m; document.querySelectorAll('[data-cmode]').forEach(b=>b.classList.toggle('primary',b.dataset.cmode===m)); (m==='common'?renderCommon:renderRound)(); };
  document.querySelectorAll('[data-cmode]').forEach(b=>b.onclick=()=>setMode(b.dataset.cmode));
  setMode('common');
}

async function buildWorksheet(title, list, withHae=false, keepNo=false){   // keepNo: 회차 통째 인쇄 — 원래 번호 그대로, 출처 표시 없음
  // 시험별로 묶고, 시험 안에서는 번호 순
  const byEx=[]; list.forEach(x=>{ let g=byEx.find(b=>b.ex.id===x.ex.id); if(!g) byEx.push(g={ex:x.ex,nums:[]}); if(!g.nums.includes(x.it.no)) g.nums.push(x.it.no); });
  byEx.forEach(g=>g.nums.sort((a,b)=>a-b));
  const base=await getQbank(byEx[0].ex.id);
  // 기준 문서 사본 (원본 캐시를 건드리지 않도록 새로 읽음)
  const zip=await JSZip.loadAsync(await base.zip.generateAsync({type:'arraybuffer'}));
  const doc=new DOMParser().parseFromString(await zip.file('word/document.xml').async('string'),'application/xml');
  const rels=new DOMParser().parseFromString(await zip.file('word/_rels/document.xml.rels').async('string'),'application/xml');
  const body=wEls(doc,'body')[0]; const sect=[...body.children].find(e=>e.localName==='sectPr');
  if(sect){   // 문제지는 항상 2단 (원본 마지막 구역이 해설용 3단일 수 있음)
    wEls(sect,'cols').forEach(c=>c.parentNode.removeChild(c));
    ['headerReference','footerReference','titlePg'].forEach(n=>wEls(sect,n).forEach(c=>c.parentNode.removeChild(c)));   // 원본 머리말(예: "정답 및 해설") 제거
    const cols=doc.createElementNS(W_NS,'w:cols'); cols.setAttributeNS(W_NS,'w:num','2'); cols.setAttributeNS(W_NS,'w:sep','1'); cols.setAttributeNS(W_NS,'w:space','420');
    const after=['pgSz','pgMar','paperSrc','pgBorders','lnNumType','pgNumType'].map(n=>wEls(sect,n)[0]).filter(Boolean).pop();
    after ? sect.insertBefore(cols, after.nextSibling) : sect.insertBefore(cols, sect.firstChild);
  }
  [...body.children].forEach(e=>{ if(e!==sect) body.removeChild(e); });
  const put=node=>body.insertBefore(node,sect||null);
  const para=(text,{bold=false,size=0,pageBreak=false}={})=>{
    // 줄 간격을 '자동'으로 — 원본 문서의 '고정 줄 간격'을 물려받으면 큰 제목 윗부분이 잘림
    const x=`<w:p xmlns:w="${W_NS}"><w:pPr><w:spacing w:before="${size?120:0}" w:after="${size?100:40}" w:line="264" w:lineRule="auto"/></w:pPr>${pageBreak?'<w:r><w:br w:type="page"/></w:r>':''}<w:r><w:rPr>${bold?'<w:b/>':''}${size?`<w:sz w:val="${size}"/><w:szCs w:val="${size}"/>`:''}</w:rPr><w:t xml:space="preserve">${esc(text)}</w:t></w:r></w:p>`;
    return doc.importNode(new DOMParser().parseFromString(x,'application/xml').documentElement,true);
  };
  put(para(title,{bold:true,size:32}));
  let imgN=0; const relRoot=rels.documentElement;
  // 단 너비(twip) — 표가 단 밖으로 밀리지 않게 맞출 때 사용
  const colW=(()=>{ const sz=sect&&wEls(sect,'pgSz')[0], mg=sect&&wEls(sect,'pgMar')[0];
    const w=sz?+sz.getAttributeNS(W_NS,'w'):11906, l=mg?+mg.getAttributeNS(W_NS,'left'):1134, r=mg?+mg.getAttributeNS(W_NS,'right'):1134;
    return Math.max(3000,Math.floor((w-l-r-420)/2)); })();
  const wEl=(name,attrs={})=>{ const e=doc.createElementNS(W_NS,'w:'+name); Object.entries(attrs).forEach(([k,v])=>e.setAttributeNS(W_NS,'w:'+k,String(v))); return e; };
  const pPrOf=pEl=>{ let pr=[...pEl.children].find(c=>c.localName==='pPr'); if(!pr){ pr=wEl('pPr'); pEl.insertBefore(pr,pEl.firstChild); } return pr; };
  const setFlag=(pEl,name)=>{ const pr=pPrOf(pEl); if(![...pr.children].some(c=>c.localName===name)) pr.insertBefore(wEl(name),pr.firstChild); };
  // 표: 단 너비에 맞추기 (원본의 고정 너비·들여쓰기 제거)
  const fitTable=tbl=>{
    const pr=[...tbl.children].find(c=>c.localName==='tblPr');
    if(pr){ [...pr.children].filter(c=>['tblW','tblInd','tblLayout','tblpPr'].includes(c.localName)).forEach(c=>pr.removeChild(c));
      pr.appendChild(wEl('tblW',{w:5000,type:'pct'})); pr.appendChild(wEl('tblLayout',{type:'autofit'})); }
    const grid=[...tbl.children].find(c=>c.localName==='tblGrid');
    if(grid){ const gc=[...grid.children].filter(c=>c.localName==='gridCol'); const sum=gc.reduce((t,c)=>t+(+c.getAttributeNS(W_NS,'w')||0),0);
      if(sum>colW) gc.forEach(c=>c.setAttributeNS(W_NS,'w:w',String(Math.floor((+c.getAttributeNS(W_NS,'w')||0)*colW/sum)))); }
    wEls(tbl,'tcW').forEach(c=>{ c.setAttributeNS(W_NS,'w:type','auto'); c.setAttributeNS(W_NS,'w:w','0'); });
  };
  // 맨 앞 글자 바꾸기 (예: "24." → "3.", "[41~42" → "[7~8") — 여러 run에 나뉘어 있어도 처리
  const replaceLead=(node,re,rep)=>{
    const ts=wEls(node,'t'); const full=ts.map(t=>t.textContent).join(''); const m=full.match(re); if(!m) return false;
    let left=m[0].length, first=null;
    for(const t of ts){ if(!left) break; const tx=t.textContent; if(first===null&&tx.length) first=t; const k=Math.min(left,tx.length); t.textContent=tx.slice(k); left-=k; }
    const r=typeof rep==='function'?rep(m):rep;
    (first||ts[0]).textContent=r+(first||ts[0]).textContent; (first||ts[0]).setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve'); return true;
  };
  // 출처: 회색 작은 글씨로 문단 끝에
  const addSrc=(pEl,text)=>{ if(pEl.localName!=='p') return;
    const r=wEl('r'), rp=wEl('rPr'); rp.appendChild(wEl('color',{val:'9A9A9A'})); rp.appendChild(wEl('sz',{val:16})); rp.appendChild(wEl('szCs',{val:16})); r.appendChild(rp);
    const t=wEl('t'); t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve'); t.textContent=`  (${text})`; r.appendChild(t); pEl.appendChild(r); };
  const blank=()=>put(para(''));
  const imp=async(Q,i)=>{
        const node=doc.importNode(Q.els[i],true);
        [...node.getElementsByTagNameNS(W_NS,'sectPr')].forEach(s=>s.parentNode.removeChild(s));
        if(Q!==base){   // 다른 시험지의 그림은 파일과 연결을 새로 만듦
          for(const el of [...node.getElementsByTagName('*')]){
            for(const attr of ['embed','id','link']){
              const rid=el.getAttributeNS(R_NS,attr); if(!rid) continue;
              const rel=[...Q.rels.documentElement.children].find(r=>r.getAttribute('Id')===rid); if(!rel||!/image/.test(rel.getAttribute('Type'))) continue;
              const target=rel.getAttribute('Target'); const f=Q.zip.file('word/'+target.replace(/^\/?word\//,'')); if(!f) continue;
              const nm=`media/ws${++imgN}_${target.split('/').pop()}`, nid=`rIdWs${imgN}`;
              zip.file('word/'+nm, await f.async('uint8array'));
              const r=rels.createElementNS(relRoot.namespaceURI,'Relationship'); r.setAttribute('Id',nid); r.setAttribute('Type',rel.getAttribute('Type')); r.setAttribute('Target',nm); relRoot.appendChild(r);
              el.setAttributeNS(R_NS,'r:'+attr,nid);
            }
          }
        }
        if(node.localName==='tbl') fitTable(node); wEls(node,'tbl').forEach(fitTable);
        return node;
  };
  // 새 번호: 1번부터 차례로 (출처는 회색 글씨로)
  const newNo=new Map(); let k=0; byEx.forEach(g=>g.nums.forEach(n=>newNo.set(g.ex.id+'|'+n,keepNo?n:++k)));
  const NO_RE=/^\s*\d{1,2}\s*\./, GRP_RE=/^\s*\[\s*(?:\d{1,2}\s*[~∼～-]\s*\d{1,2}|\d{4}(?!\d))([^\]]*)\]\s*/;
  // 묶음 머리말 번호도 새 번호로. 문항이 하나만 뽑혔으면 문제지에서는 [ ]를 빼고, 해설에서는 [7번 단일 장문]처럼
  const rangeOf=(g,grp,isHae)=>m=>{ const ns=g.nums.filter(n=>grp.a<=n&&n<=grp.b).map(n=>newNo.get(g.ex.id+'|'+n)), lab=m[1]||'';
    if(ns.length>1) return `[${ns[0]}~${ns[ns.length-1]}${lab}] `;
    return isHae?`[${ns[0]}번${lab}] `:''; };
  const isEmptyP=n=>n.localName==='p'&&!wText(n).trim()&&![...n.getElementsByTagName('*')].some(e=>['drawing','pict','object'].includes(e.localName));
  // 문항 하나를 통째로: 같은 단(쪽)에 붙어 있도록 '다음 단락과 함께' 설정
  const putChunk=nodes=>{
    nodes.forEach((n,j)=>{ if(j===nodes.length-1&&n.localName==='p') return;
      const ps=n.localName==='p'?[n]:wEls(n,'p'); ps.forEach(pp=>{ setFlag(pp,'keepLines'); setFlag(pp,'keepNext'); });
      if(n.localName==='tbl') wEls(n,'tr').forEach(tr=>{ let trPr=[...tr.children].find(c=>c.localName==='trPr'); if(!trPr){ trPr=wEl('trPr'); tr.insertBefore(trPr,tr.firstChild); } trPr.appendChild(wEl('cantSplit')); }); });
    nodes.forEach(put);
  };
  const answers=[]; let firstQ=true;
  for(const g of byEx){
    const Q=await getQbank(g.ex.id); if(!Q) continue;
    const used=new Set();
    for(const n of g.nums){
      const no=newNo.get(g.ex.id+'|'+n), src=`${g.ex.name} ${n}번`, nodes=[];
      for(const i of qIndexes(Q,n)){ if(used.has(i)) continue; used.add(i);
        const node=await imp(Q,i);
        const grp=Q.grp.find(x=>x.h===i); if(grp) replaceLead(node,GRP_RE,rangeOf(g,grp,false));
        if(i===Q.q[n][0]){ replaceLead(node,NO_RE,`${no}.`); if(!keepNo) addSrc(node,src); }
        nodes.push(node); }
      while(nodes.length&&isEmptyP(nodes[0])) nodes.shift(); while(nodes.length&&isEmptyP(nodes[nodes.length-1])) nodes.pop();   // 앞뒤 빈 줄 정리
      if(!firstQ){ blank(); blank(); blank(); } firstQ=false;   // 문항 사이 3줄
      putChunk(nodes);
      const it=g.ex.items[n-1]; answers.push({no, ans:+it.answer?circled(+it.answer):'-'});
    }
  }
  // 정답: 쪽을 넘기지 않고 작은 표로 (번호·정답 5쌍씩)
  blank(); put(para('정답',{bold:true,size:24}));
  const PER=5; let rows='';
  for(let i=0;i<answers.length;i+=PER){
    rows+='<w:tr><w:trPr><w:cantSplit/></w:trPr>'+Array.from({length:PER},(_,j)=>{ const a=answers[i+j];
      const cell=(txt,shade)=>`<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/>${shade?'<w:shd w:val="clear" w:color="auto" w:fill="F1F3F5"/>':''}</w:tcPr><w:p><w:pPr><w:spacing w:before="20" w:after="20" w:line="240" w:lineRule="auto"/><w:jc w:val="center"/></w:pPr><w:r><w:rPr>${shade?'<w:b/>':''}<w:sz w:val="18"/><w:szCs w:val="18"/></w:rPr><w:t xml:space="preserve">${esc(txt)}</w:t></w:r></w:p></w:tc>`;
      return a?cell(String(a.no),true)+cell(a.ans,false):cell('',true)+cell('',false); }).join('')+'</w:tr>';
  }
  const bd='<w:top w:val="single" w:sz="4" w:color="BFBFBF"/><w:left w:val="single" w:sz="4" w:color="BFBFBF"/><w:bottom w:val="single" w:sz="4" w:color="BFBFBF"/><w:right w:val="single" w:sz="4" w:color="BFBFBF"/><w:insideH w:val="single" w:sz="4" w:color="BFBFBF"/><w:insideV w:val="single" w:sz="4" w:color="BFBFBF"/>';
  if(answers.length) put(doc.importNode(new DOMParser().parseFromString(`<w:tbl xmlns:w="${W_NS}"><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${bd}</w:tblBorders><w:tblLayout w:type="autofit"/></w:tblPr><w:tblGrid>${'<w:gridCol w:w="400"/>'.repeat(PER*2)}</w:tblGrid>${rows}</w:tbl>`,'application/xml').documentElement,true));
  // 해설 (해석·어휘·해설) — 쪽 넘김 없이 이어서, 번호도 새 번호로
  if(withHae){
    let first=true;
    for(const g of byEx){
      const Q=await getQbank(g.ex.id); if(!Q||!Q.hq) continue;
      const nums=g.nums.filter(n=>Q.hq[n]); if(!nums.length) continue;
      if(first){ blank(); put(para('해설',{bold:true,size:24})); first=false; }
      const used=new Set();
      for(const n of nums){
        const no=newNo.get(g.ex.id+'|'+n); let added=false;
        for(const i of hIndexes(Q,n)){ if(used.has(i)) continue; used.add(i);
          const node=await imp(Q,i);
          const grp=Q.hgrp.find(x=>x.h===i); if(grp) replaceLead(node,GRP_RE,rangeOf(g,grp,true));
          if(i===Q.hq[n][0]){ replaceLead(node,NO_RE,`${no}.`); if(!keepNo) addSrc(node,`${g.ex.name} ${n}번`); }
          if(!added){ blank(); added=true; }
          put(node); }
      }
    }
  }
  // 이미지 확장자 등록
  let ct=await zip.file('[Content_Types].xml').async('string');
  ['png','jpeg','jpg','gif','emf','wmf'].forEach(ext=>{ if(!new RegExp(`Extension="${ext}"`,'i').test(ct)) ct=ct.replace('</Types>',`<Default Extension="${ext}" ContentType="image/${ext==='jpg'?'jpeg':ext==='emf'?'x-emf':ext==='wmf'?'x-wmf':ext}"/></Types>`); });
  zip.file('[Content_Types].xml',ct);
  const ser=x=>{ const s=new XMLSerializer().serializeToString(x); return s.startsWith('<?xml')?s:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+s; };
  zip.file('word/document.xml',ser(doc)); zip.file('word/_rels/document.xml.rels',ser(rels));
  const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=title.replace(/[\\/:*?"<>|]/g,'_')+'.docx'; a.click();
}

// --- 시험 관리: 시험지 워드 등록 칸 ---

  const box=$('#qsrcBox'); if(!box||!editing) return;
  if(editing._new){ box.innerHTML='<p class="muted">시험을 먼저 저장하면 등록할 수 있어요.</p>'; return; }
  const info=await qsrcInfo(editing.id); const Q=info?await getQbank(editing.id):null;
  box.innerHTML=`${info?`<p>등록됨: <b>${esc(info.name)}</b> · ${Q?`${Object.keys(Q.q).length}문항 인식 · 묶음 ${Q.grp.length}개`:'<span class="mark-x">읽기 실패</span>'}</p>`:'<p class="muted">아직 없어요. 문제가 줄 맨 앞 "21." 형식으로 시작하는 워드 파일을 올려주세요.</p>'}
    <div class="row"><input type="file" id="qsrcIn" accept=".docx"><button class="btn sm" id="qsrcUp">${info?'다시 등록':'등록'}</button></div>`;
  $('#qsrcUp').onclick=async()=>{
    const f=$('#qsrcIn').files[0]; if(!f) return;
    try{
      const Q=await parseDocx(await f.arrayBuffer()); const n=Object.keys(Q.q).length;
      const miss=editing.items.map(i=>i.no).filter(no=>!Q.q[no]);
      if(miss.length && !confirm(`${n}문항만 인식됐어요. 못 찾은 번호: ${miss.join(', ')}\n그래도 등록할까요?`)) return;
      await saveQsrc(editing.id,f); renderQsrcBox(); if(sb) renderFiles();
    }catch(err){ alert('등록 실패: '+err.message); }
  };
}

/* ===================== 답안 엑셀 한 번에 입력 ===================== */
// 형식: 첫 줄 = 머리글(이름 열 + 1~45 번호 열, 회원코드 열은 있으면 사용), 그 아래 학생마다 한 줄
async function readAnswerSheet(file, ex){
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});
  const hi=aoa.findIndex(r=>r.filter(c=>/^\s*\d{1,2}\s*(번)?\s*$/.test(String(c))).length>=Math.min(10,ex.q_count));
  if(hi<0) throw new Error('1, 2, 3 … 처럼 문항 번호가 적힌 머리글 줄을 찾지 못했어요.');
  const head=aoa[hi].map(c=>String(c).trim());
  const qcol={}; head.forEach((h,i)=>{ const m=h.match(/^(\d{1,2})\s*(번)?$/); if(m && +m[1]>=1 && +m[1]<=ex.q_count && !(+m[1] in qcol)) qcol[+m[1]]=i; });
  let ncol=head.findIndex(h=>/이름|성명/.test(h)); if(ncol<0) ncol=head.findIndex((h,i)=>!Object.values(qcol).includes(i));
  const ccol=head.findIndex(h=>/회원\s*코드|코드/.test(h));
  const toCh=v=>{ const s=String(v??'').trim().replace(/[①②③④⑤]/,c=>'①②③④⑤'.indexOf(c)+1); return /^[1-5]$/.test(s)?s:'0'; };
  return aoa.slice(hi+1).map(r=>({
    name:String(r[ncol]??'').trim(), code:ccol>=0?String(r[ccol]??'').trim():'',
    answers:Array.from({length:ex.q_count},(_,i)=>qcol[i+1]!=null?toCh(r[qcol[i+1]]):'0').join('')
  })).filter(x=>x.name);
}

async function openAnswerImport(ex){
  $('#modal').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">답안 엑셀로 한 번에 입력 · ${esc(ex.name)}</h2><button class="btn" id="closeM">닫기</button></div>
    <p class="muted">첫 줄에 이름과 1~45 번호, 아래로 학생별 고른 번호가 있는 엑셀. 분원: <b>${esc(prefs.branch)}</b> (OMR 입력 화면에서 고른 분원)</p>
    <input type="file" id="xaFile" accept=".xlsx,.xls,.csv"><div id="xaBody"></div>`;
  $('#closeM').onclick=()=>$('#modalBg').classList.remove('show');
  $('#modalBg').classList.add('show');
  $('#xaFile').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      if(!window.XLSX) throw new Error('엑셀 읽기 도구를 불러오지 못했어요.');
      const rows=await readAnswerSheet(f,ex);
      const keyMissing=ex.items.filter(it=>!+it.answer).map(it=>it.no);
      const roster=await getRoster(prefs.branch, roundKey(ex)), eg=normGrade(ex.grade);
      const existing=(await getResponses(ex.id,true)).filter(r=>r.branch===prefs.branch);
      const used=new Set();
      // 같은 이름이 여럿이면 기존 기록과 정오가 가장 많이 겹치는 쪽으로 연결
      const agree=(a,r)=>ex.items.reduce((s,it,i)=>s+(isOk(a[i],it)===isOk(r.answers[i],it)?1:0),0);
      const plan=rows.map(x=>{
        if(!/[1-5]/.test(x.answers)) return {...x, kind:'skip'};
        let cand=existing.filter(r=>!used.has(r.id) && (x.code ? r.member_code===x.code : r.student_name===x.name));
        let old=cand.sort((a,b)=>agree(x.answers,b)-agree(x.answers,a))[0]||null;
        if(old){ used.add(old.id); }
        let st=null;
        if(!old){ let c=roster.filter(s=>x.code ? s.member_code===x.code : s.student_name===x.name); if(c.length>1) c=c.filter(s=>!s.grade||normGrade(s.grade)===eg); if(c.length===1) st=c[0]; }
        const score=gradeAnswers(ex,x.answers).score;
        return {...x, old, st, score, kind: old?'replace':st?'new':'nomatch'};
      });
      const cnt=k=>plan.filter(p=>p.kind===k).length;
      const diff=plan.filter(p=>p.old && p.old.score!==p.score);
      $('#xaBody').innerHTML=`
        ${keyMissing.length?`<p class="total bad">정답이 비어 있는 문항: ${keyMissing.join(', ')}번 — 이 문항은 모두 오답 처리돼요. 시험 관리에서 정답을 먼저 넣는 걸 권해요.</p>`:''}
        <p style="margin-top:10px">기존 답안 교체 <b>${cnt('replace')}</b> · 명단 연결 새로 입력 <b>${cnt('new')}</b> · 명단에 없음(회원코드 없이 입력) <b>${cnt('nomatch')}</b> · 빈 답안(결시) 제외 <b>${cnt('skip')}</b></p>
        ${diff.length?`<p class="total bad">기존 점수와 달라지는 학생 ${diff.length}명 — OMR 카드와 엑셀을 한번 확인해 주세요.</p>`:''}
        <div style="max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px"><table><thead><tr><th>이름</th><th>처리</th><th>반</th><th>점수</th><th>기존 점수</th></tr></thead><tbody>
          ${plan.map(p=>`<tr><td>${esc(p.name)}</td><td>${{replace:'기존 교체',new:'새로 입력',nomatch:'<span class="mark-x">명단에 없음</span>',skip:'<span class="muted">결시 제외</span>'}[p.kind]}</td>
            <td>${esc(p.old?p.old.class_name:p.st?p.st.class_name:'')}</td><td>${p.kind==='skip'?'':`<b>${p.score}</b>`}</td>
            <td>${p.old?(p.old.score!==p.score?`<b class="mark-x">${p.old.score}</b>`:p.old.score):''}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="row" style="margin-top:12px"><button class="btn primary" id="xaGo">입력하기</button></div>`;
      $('#xaGo').onclick=async()=>{
        const todo=plan.filter(p=>p.kind!=='skip');
        if(!confirm(`${todo.length}명의 답안을 저장할까요?${cnt('replace')?`\n(기존 ${cnt('replace')}명 답안은 엑셀 내용으로 바뀝니다)`:''}`)) return;
        $('#xaGo').disabled=true; $('#xaGo').textContent='저장 중…';
        try{
          for(const p of todo){
            const rec={id:p.old?p.old.id:uid(), exam_id:ex.id, branch:prefs.branch,
              class_name:p.old?p.old.class_name:(p.st?p.st.class_name:''), student_name:p.old?p.old.student_name:(p.st?p.st.student_name:p.name),
              member_code:p.old?p.old.member_code:(p.st&&p.st.member_code||p.code||null),
              teacher:(p.old&&p.old.teacher) || (p.st&&p.st.teacher) || ((p.old&&rosterOf(p.old,roster))||{}).teacher || '', answers:p.answers, score:p.score};
            if(!sb) rec.created_at=(p.old&&p.old.created_at)||nowIso();
            await DB.saveResponse(rec);
          }
          await getResponses(ex.id,true); $('#modalBg').classList.remove('show'); renderOmrTab();
          alert(`${todo.length}명 입력했어요.`);
        }catch(err){ alert('저장 실패: '+err.message); $('#xaGo').disabled=false; $('#xaGo').textContent='입력하기'; }
      };
    }catch(err){ $('#xaBody').innerHTML=`<p class="total bad">${esc(err.message)}</p>`; }
  };
}
