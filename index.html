  };
  if(!bank.length){ $('#wsBody').innerHTML='<p class="muted">등록된 학평(문제은행) 시험지가 없어요. 시험 관리에서 학평을 문제은행으로 등록해 주세요.</p>'; return; }
  render(true);
}
async function openWorksheet(name, code, rows, onSaved){
  if(HP_ONLY) return openHpWorksheet(name, code, rows, onSaved);   // 지금은 학평 유형 문제지 (정상 모의고사 문제는 가림)
  $('#modal').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(name)} ${HP_ONLY?'학평 유형 문제지':'모의고사 대비 문제지'}</h2><button class="btn" id="closeM">닫기</button></div><div id="wsBody"><p class="muted">시험지 불러오는 중…</p></div>`;
  $('#closeM').onclick=()=>$('#modalBg').classList.remove('show');
  $('#modalBg').classList.add('show');
  // 필요한 시험지 워드를 한꺼번에(병렬로) 미리 받아 둠
  const need=[...new Set([...rows.map(o=>o.ex.id), ...[...EXAMS,...BANK].map(e=>e.id)])]; let done=0;
  await pmap(need, async id=>{ await getQbank(id); done++; const b=$('#wsBody'); if(b) b.innerHTML=`<p class="muted">시험지 불러오는 중… (${done}/${need.length})</p>`; });
  // 1) 학생이 틀린 문제 (시험지 워드 등록된 시험)
  const wrong=[], weakSubs={};
  for(const o of rows){
    const Q=await getQbank(o.ex.id);
    o.ex.items.forEach((it,i)=>{ if(isOk(o.r.answers[i],it)) return;
      const k=(it.cat||'미지정')+'|'+(it.sub||''); weakSubs[k]=(weakSubs[k]||0)+1;
      if(Q&&Q.q[it.no]&&it.cat!=='듣기') wrong.push({ex:o.ex,it,key:k,pick:+o.r.answers[i]||0}); });   // 듣기는 문제지 목록에서 아예 뺌
  }
  // 2) 이 학생이 안 본 시험에서 같은 세부 유형
  // 오답 다시 풀기에서 (가장 최근에) 다시 맞힌 문항 → 기본으로 문제지에서 뺌
  let RS=null; try{ RS=retryStats(rows, await DB.retries(rows.map(o=>o.r.id))); }catch(e){ console.warn(e); }
  const retryOk=x=>{ if(!RS) return false; const o=rows.find(o=>o.ex.id===x.ex.id); const h=o&&RS.byKey[o.r.id+'|'+x.it.no]; return !!(h&&h.length&&h[h.length-1].correct); };
  wrong.forEach(x=>x.reOk=retryOk(x));
  let hideReOk=true;
  const taken=new Set(rows.map(o=>o.ex.id)), similar=[];
  for(const ex of [...EXAMS,...BANK]){
    if(taken.has(ex.id)) continue;
    const Q=await getQbank(ex.id); if(!Q) continue;
    if(HP_ONLY && !ex.is_bank) continue;   // 학평(문제은행)만
    ex.items.forEach(it=>{ const k=(it.cat||'미지정')+'|'+(it.sub||''); if(weakSubs[k] && Q.q[it.no] && it.cat!=='듣기') similar.push({ex,it,key:k}); });
  }
  const keyOrder=Object.keys(weakSubs).sort((a,b)=>weakSubs[b]-weakSubs[a]);
  const listen=k=>k.startsWith('듣기|');
  const all={w:wrong,s:similar};
  const sel=new Set(); if(!HP_ONLY) wrong.forEach((x,j)=>{ if(!listen(x.key) && !x.reOk) sel.add('w'+j); });   // 기본: 틀린 문제(듣기 제외, 다시 맞힌 문항 제외)
  // 필터: 회차(최근 N회차) · 비슷한 문제 학년
  const roundsDesc=[...new Set([...EXAMS,...BANK].map(roundKey))].sort((a,b)=>koCmp(b,a));
  const lastEx=rows.slice().sort((a,b)=>koCmp(examDateKey(b.ex),examDateKey(a.ex)))[0];
  const myGrade=lastEx?normGrade(lastEx.ex.grade):'';
  const simGrades=[...new Set(similar.map(x=>normGrade(x.ex.grade)))].sort(koCmp);
  const gradeSel=new Set(simGrades.includes(myGrade)?[myGrade]:simGrades);
  // 시험(시행 연·월) 고르기 — 목록에 실제 시험 월이 다 보이게 (예전 '최근 N회차' 드롭다운 대신)
  const ymOf=e=>(e.exam_date||'').slice(0,7);
  const ymLabel=ym=>ym?`${ym.slice(2,4)}년 ${+ym.slice(5,7)}월`:'날짜 없음';
  const pool=[...new Set([...(HP_ONLY?[]:wrong),...similar].map(x=>x.ex))];
  const yrs=[...new Set(pool.map(yrOf).filter(Boolean))].sort().reverse(), yrSel=new Set(yrs);   // 연도·월을 각각 골라서 조합 (예: 24년 + 3월)
  const mons=[...new Set(pool.map(monOf).filter(Boolean))].sort((a,b)=>a-b), monSel=new Set(mons);
  const passRound=x=>(!yrs.length || yrSel.has(yrOf(x.ex))) && (!mons.length || monSel.has(monOf(x.ex)));
  const openG=new Set();   // 펼친 유형 묶음 (처음엔 모두 접힘)
  let srcSel='all';   // 비슷한 문제 출처: 전체 / 정상 모의고사 / 학평(문제은행)
  const passSrc=x=>srcSel==='all' || (srcSel==='bank')===!!x.ex.is_bank;
  const visible=(pre,x)=>passRound(x) && (pre!=='s' || (gradeSel.has(normGrade(x.ex.grade)) && passSrc(x))) && !(pre==='w' && hideReOk && x.reOk);
  const gk=(pre,k)=>pre+'|'+encodeURIComponent(k);
  const row=(x,j,pre)=>`<div class="ws-item" style="padding-left:24px"><input type="checkbox" data-ws="${pre}${j}" data-wsk="${gk(pre,x.key)}" ${sel.has(pre+j)?'checked':''}> <span class="ws-prev" data-prev="${pre}${j}" title="눌러서 문제 미리 보기">${pill(x.it.cat)} <b>${esc(x.it.sub||'-')}</b> <span class="muted">${esc(x.ex.name)} · ${x.it.no}번 ▾</span></span>${x.reOk?' <span class="pill" style="background:var(--ok-bg);color:var(--ok)">다시 맞힘</span>':''}</div><div class="ws-pv" id="pv-${pre}${j}" hidden></div>`;
  const section=(list,pre)=>keyOrder.filter(k=>list.some((x,j)=>x.key===k && visible(pre,x))).map(k=>{ const g=gk(pre,k), n=list.filter(x=>x.key===k&&visible(pre,x)).length, op=openG.has(g);
    return `<div class="ws-grp"><div style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-wsgk="${g}" title="이 유형 전체 선택">
      <span data-wsopen="${g}" style="cursor:pointer;font-weight:700;flex:1" title="눌러서 문제 목록 펼치기">${op?'▾':'▸'} ${esc(k.replace('|',' · '))} <span class="muted" style="font-weight:400">${n}문항 · 누적 오답 ${weakSubs[k]} · <span data-wsgc="${g}"></span></span></span></div>
      <div ${op?'':'hidden'}>${list.map((x,j)=>x.key===k&&visible(pre,x)?row(x,j,pre):'').join('')}</div></div>`; }).join('');
  const allBox=(pre)=>`<label class="ws-item" style="cursor:pointer;font-weight:700"><input type="checkbox" data-wsall="${pre}"> 전체 선택</label>`;
  $('#wsBody').innerHTML=`
    <label class="f" style="margin:10px 0">문제지 제목<input id="wsTitle" value="${esc(name)} ${HP_ONLY?'학평 유형 문제지':'모의고사 대비 오답 문제지'}"></label>
    <div class="row" style="gap:16px;align-items:flex-end;margin-bottom:6px">
      ${yrBoxes(yrs,yrSel,'data-wsyr')}
      ${monBoxes(mons,monSel,'data-wsmon')}
      ${HP_ONLY?`<p class="muted" style="align-self:flex-end;margin:0 0 8px">이 학생이 모의고사에서 틀린 유형과 같은 유형의 <b>학평</b> 문제예요.</p>`:''}
      ${!HP_ONLY&&wrong.some(x=>x.reOk)?`<label class="ws-item" style="cursor:pointer;align-self:flex-end;padding-bottom:6px"><input type="checkbox" id="wsReOk" checked> 오답 다시 풀기에서 맞힌 문항 빼기 <span class="muted">(${wrong.filter(x=>x.reOk).length}개)</span></label>`:''}
      ${!HP_ONLY&&similar.some(x=>x.ex.is_bank)?`<label class="f">비슷한 문제 출처<select id="wsSrc"><option value="all">전체</option><option value="test">정상 모의고사만</option><option value="bank">학평(문제은행)만</option></select></label>`:''}
      ${simGrades.length?`<div class="f"><span>비슷한 문제 학년</span><div class="row" style="gap:10px">${simGrades.map(g=>`<label class="ws-item" style="cursor:pointer"><input type="checkbox" data-wsg="${g}" ${gradeSel.has(g)?'checked':''}> ${g}</label>`).join('')}</div></div>`:''}
    </div>
    <div class="row" style="align-items:flex-start;gap:16px">
      <div style="flex:1;min-width:300px" ${HP_ONLY?'hidden':''}><h3 id="wsHw"></h3><div id="wsListW"></div></div>
      <div style="flex:1;min-width:300px"><h3 id="wsHs"></h3><div id="wsListS"></div></div>
    </div>
    <p class="muted">유형 이름을 누르면 문제 목록이 펼쳐지고, 왼쪽 체크로 그 유형 문제를 한 번에 넣을 수 있어요. 듣기 문항은 목록에서 빠져 있어요. 묶음 문제는 공통 지문이 자동으로 같이 들어가고, 마지막 장에 정답이 붙어요. 받은 워드 파일에서 자유롭게 고쳐서 인쇄하세요.</p>
    <div class="row" style="margin-top:10px"><label class="ws-item" style="cursor:pointer"><input type="checkbox" id="wsHae" checked> 맨 뒤에 해설 붙이기 (해석·어휘·해설)</label></div>
    <div class="row" style="margin-top:6px"><button class="btn primary" id="wsGo">워드로 만들기</button><span class="muted" id="wsCnt"></span></div>`;
  // 선택은 화면에 보이는(필터 통과한) 문항만 문제지에 들어감
  const picked=()=>[...document.querySelectorAll('[data-ws]:checked')].map(c=>all[c.dataset.ws[0]][+c.dataset.ws.slice(1)]);
  const cnt=()=>{ const l=picked(); const h=l.filter(x=>{ const Q=QCACHE[x.ex.id]; return Q&&Q.hq&&Q.hq[x.it.no]; }).length;
    $('#wsCnt').textContent=`${l.length}문항 선택 · 해설 있는 문항 ${h}개`;
    ['w','s'].forEach(pre=>{ const b=document.querySelector(`[data-wsall="${pre}"]`); if(!b) return; const cs=[...document.querySelectorAll(`[data-ws^="${pre}"]`)];
      b.checked=cs.length>0&&cs.every(c=>c.checked); b.indeterminate=!b.checked&&cs.some(c=>c.checked); });
    document.querySelectorAll('[data-wsgk]').forEach(b=>{ const cs=[...document.querySelectorAll(`[data-wsk="${b.dataset.wsgk}"]`)];
      b.checked=cs.length>0&&cs.every(c=>c.checked); b.indeterminate=!b.checked&&cs.some(c=>c.checked);
      const gc=document.querySelector(`[data-wsgc="${b.dataset.wsgk}"]`); if(gc){ const k=cs.filter(c=>c.checked).length; gc.textContent=k?`${k}개 선택`:'선택 없음'; gc.style.color=k?'var(--main)':''; } }); };
  const renderLists=()=>{
    const nw=wrong.filter(x=>visible('w',x)).length, ns=similar.filter(x=>visible('s',x)).length;
    $('#wsHw').textContent=`틀렸던 문제 (${nw})`; $('#wsHs').textContent=HP_ONLY?`같은 유형의 학평 문제 (${ns})`:`안 본 시험의 비슷한 문제 (${ns})`;
    $('#wsListW').innerHTML=nw?allBox('w')+section(wrong,'w'):`<p class="muted">${wrong.length?'이 범위에 틀린 문제가 없어요.':'시험지 워드가 등록된 시험에서 틀린 문제가 없어요.'}</p>`;
    $('#wsListS').innerHTML=ns?allBox('s')+section(similar,'s'):`<p class="muted">${similar.length?'선택한 학년·회차에 비슷한 문제가 없어요.':HP_ONLY?'같은 유형의 학평 문제(문제은행 워드 등록)가 없어요.':'같은 유형이 있는, 이 학생이 안 본 시험(워드 등록)이 없어요.'}</p>`;
    document.querySelectorAll('[data-ws]').forEach(c=>c.onchange=()=>{ c.checked?sel.add(c.dataset.ws):sel.delete(c.dataset.ws); cnt(); });
    document.querySelectorAll('[data-wsgk]').forEach(b=>b.onchange=()=>{ document.querySelectorAll(`[data-wsk="${b.dataset.wsgk}"]`).forEach(c=>{ c.checked=b.checked; b.checked?sel.add(c.dataset.ws):sel.delete(c.dataset.ws); }); cnt(); });
    document.querySelectorAll('[data-wsall]').forEach(b=>b.onchange=()=>{ document.querySelectorAll(`[data-ws^="${b.dataset.wsall}"]`).forEach(c=>{ c.checked=b.checked; b.checked?sel.add(c.dataset.ws):sel.delete(c.dataset.ws); }); cnt(); });
    document.querySelectorAll('[data-wsopen]').forEach(h=>h.onclick=()=>{ const g=h.dataset.wsopen; openG.has(g)?openG.delete(g):openG.add(g); renderLists(); });
    bindPrev(); cnt();
  };
  document.querySelectorAll('[data-wsyr]').forEach(c=>c.onchange=()=>{ c.checked?yrSel.add(c.dataset.wsyr):yrSel.delete(c.dataset.wsyr); renderLists(); });
  document.querySelectorAll('[data-wsmon]').forEach(c=>c.onchange=()=>{ c.checked?monSel.add(+c.dataset.wsmon):monSel.delete(+c.dataset.wsmon); renderLists(); });
  const wr=$('#wsReOk'); if(wr) wr.onchange=e=>{ hideReOk=e.target.checked; renderLists(); };
  const wsrc=$('#wsSrc'); if(wsrc) wsrc.onchange=e=>{ srcSel=e.target.value; renderLists(); };
  document.querySelectorAll('[data-wsg]').forEach(c=>c.onchange=()=>{ c.checked?gradeSel.add(c.dataset.wsg):gradeSel.delete(c.dataset.wsg); renderLists(); });
  // 문제 제목 클릭 → 미리 보기 (틀린 문제는 학생이 고른 답 빨강, 정답 초록)
  function bindPrev(){ document.querySelectorAll('[data-prev]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.prev, box=$('#pv-'+id), x=all[id[0]][+id.slice(1)];
    if(!box.hidden){ box.hidden=true; return; }
    if(!box.innerHTML){ const Q=QCACHE[x.ex.id]; box.innerHTML=Q?`<div class="q-body" style="margin:0">${chunkHtml(Q,qIndexes(Q,x.it.no),x.pick||0,+x.it.answer||0)}</div>`:'<span class="muted">문제를 불러오지 못했어요.</span>'; }
    box.hidden=false;
  }); }
  renderLists();
  $('#wsGo').onclick=async()=>{
    const list=picked(); if(!list.length) return alert('문제를 하나 이상 골라주세요.');
    $('#wsGo').disabled=true; $('#wsGo').textContent='만드는 중…';
    try{ await buildWorksheet($('#wsTitle').value.trim()||'오답 문제지', list, $('#wsHae').checked); }
    catch(err){ alert('문제지를 만들지 못했어요: '+err.message); }
    $('#wsGo').disabled=false; $('#wsGo').textContent='워드로 만들기';
  };
}

// --- 학년 공통 대비 문제지 / 회차 통째로 인쇄 (학생 기록이 없어도 사용) ---
async function openCommonWorksheet({name='', grade=''}={}){
  $('#modal').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${name?esc(name)+' · ':''}대비 문제지${HP_ONLY?' (학평)':''}</h2><button class="btn" id="closeM">닫기</button></div>
    <div class="row" style="gap:8px;margin:12px 0"><button class="btn primary" data-cmode="common">학년 공통 대비</button><button class="btn" data-cmode="round">${HP_ONLY?'학평 회차 통째로 인쇄':'회차 통째로 인쇄'} (듣기 제외)</button></div>
    <div id="cwBody"></div>`;
  $('#closeM').onclick=()=>$('#modalBg').classList.remove('show');
  $('#modalBg').classList.add('show');
  const grades=[...new Set([...ADM_GRADES, ...[...EXAMS,...BANK].map(e=>normGrade(e.grade)).filter(Boolean)])].sort(koCmp);
  const st={mode:'common', grade:grades.includes(grade)?grade:(grades[0]||''), years:0, scope:'all', th:40, listen:false};
  const go=async(btn,title,list,withHae,keepNo)=>{
    if(!list.length) return alert('문제를 하나 이상 골라주세요.');
    btn.disabled=true; const t=btn.textContent; btn.textContent='만드는 중…';
    try{ await buildWorksheet(title,list,withHae,keepNo); }catch(err){ alert('문제지를 만들지 못했어요: '+err.message); }
    btn.disabled=false; btn.textContent=t;
  };
  const pvBind=(arr)=>document.querySelectorAll('#cwBody [data-prev]').forEach(el=>el.onclick=()=>{
    const j=+el.dataset.prev, box=$('#cpv-'+j), x=arr[j];
    if(!box.hidden){ box.hidden=true; return; }
    if(!box.innerHTML){ const Q=QCACHE[x.ex.id]; box.innerHTML=Q?`<div class="q-body" style="margin:0">${chunkHtml(Q,qIndexes(Q,x.it.no),0,+x.it.answer||0)}</div>`:'<span class="muted">문제를 불러오지 못했어요.</span>'; }
    box.hidden=false; });

  // 1) 학년 공통: 같은 학년 시험에서 학생들이 많이 틀린 문항
  async function renderCommon(){
    const body=$('#cwBody'); body.innerHTML='<p class="muted">시험지·응답 불러오는 중…</p>';
    const exs=EXAMS.filter(e=>normGrade(e.grade)===st.grade);
    const YRc=yearRange(exs);
    await pmap(exs, async e=>{ if(!HP_ONLY) await getQbank(e.id); await getExamSummary(e.id); });   // 병렬로 미리
    const items=[];
    if(HP_ONLY){   // 정상 모의고사 문제는 쓰지 않고: 이 학년 학생들이 많이 틀린 세부 유형 → 같은 유형의 학평 문제
      const bksAll=BANK.filter(e=>normGrade(e.grade)===st.grade); await pmap(bksAll, e=>getQbank(e.id));
      st.mons=[...new Set(bksAll.map(monOf).filter(Boolean))].sort((a,b)=>a-b); if(!st.monSel) st.monSel=new Set(st.mons);
      st.yrs=[...new Set(bksAll.map(yrOf).filter(Boolean))].sort().reverse(); if(!st.yrSel) st.yrSel=new Set(st.yrs);
      const bks=bksAll.filter(e=>(st.mons.length<2||st.monSel.has(monOf(e))) && (st.yrs.length<2||st.yrSel.has(yrOf(e))));
      const sub={}; let nStu=0;
      for(const ex of exs){
        if(!YRc.pass(ex,st.years)) continue;
        const rs=(await getExamSummary(ex.id)).filter(r=>st.scope==='all'||r.branch===prefs.branch); if(!rs.length) continue; nStu+=rs.length;
        ex.items.forEach((it,i)=>{ if(it.cat==='듣기') return; const k=(it.cat||'미지정')+'|'+(it.sub||''), o=sub[k]=sub[k]||{w:0,n:0};
          rs.forEach(r=>{ o.n++; if(!isOk(r.answers[i],it)) o.w++; }); });
      }
      for(const bk of bks){ const Q=await getQbank(bk.id); if(!Q) continue;
        bk.items.forEach(it=>{ if(it.cat==='듣기'||!Q.q[it.no]) return; const o=sub[(it.cat||'미지정')+'|'+(it.sub||'')]; if(!o||!o.n) return;
          const rate=pct(o.w,o.n); if(rate>=st.th) items.push({ex:bk,it,rate,n:nStu}); }); }
    }
    for(const ex of (HP_ONLY?[]:exs)){
      if(!YRc.pass(ex,st.years)) continue;
      const Q=await getQbank(ex.id); if(!Q) continue;
      const rs=(await getExamSummary(ex.id)).filter(r=>st.scope==='all'||r.branch===prefs.branch); if(!rs.length) continue;
      const wr=wrongRates(ex,rs);
      ex.items.forEach((it,i)=>{ if(!Q.q[it.no]) return; if(it.cat==='듣기') return;   // 듣기는 빼기
        if(wr[i]!=null && wr[i]>=st.th) items.push({ex,it,rate:wr[i],n:rs.length}); });
    }
    items.sort((a,b)=>b.rate-a.rate || koCmp(examDateKey(b.ex),examDateKey(a.ex)) || a.it.no-b.it.no);
    // 유형별로 묶고 처음엔 접어 둠 (한꺼번에 우르르 뜨지 않게)
    const gkey=x=>(x.it.cat||'미지정')+'|'+(x.it.sub||''); const gOrder=[...new Set(items.map(gkey))];
    st.open=st.open||new Set();
    const ymL=e=>{ const d=e.exam_date||''; return d?`${d.slice(2,4)}년 ${+d.slice(5,7)}월`:''; };
    body.innerHTML=`
      <label class="f" style="margin:4px 0 10px">문제지 제목<input id="cwTitle" value="${esc((name?name+' ':'')+st.grade+(HP_ONLY?' 학평 공통 대비 문제지':' 공통 모의고사 대비 문제지'))}"></label>
      <div class="row" style="gap:16px;align-items:flex-end;margin-bottom:8px">
        <label class="f">학년<select id="cwGrade">${grades.map(g=>`<option ${g===st.grade?'selected':''}>${esc(g)}</option>`).join('')}</select></label>
        <label class="f">${HP_ONLY?'기준 모의고사 기간':'기간'}<select id="cwRecent">${YRc.options(st.years)}</select></label>
        ${HP_ONLY?yrBoxes(st.yrs||[],st.yrSel||new Set(),'data-cwyr','학평 연도'):''}
        ${HP_ONLY?monBoxes(st.mons||[],st.monSel||new Set(),'data-cwmon').replace('<span>시행 월</span>','<span>학평 시행 월</span>'):''}
        <label class="f">오답률 기준<select id="cwTh">${[30,40,50,60,70].map(v=>`<option value="${v}" ${v===st.th?'selected':''}>${v}% 이상</option>`).join('')}</select></label>
        <label class="f">학생 범위<select id="cwScope"><option value="all" ${st.scope==='all'?'selected':''}>전체 분원 학생</option><option value="br" ${st.scope==='br'?'selected':''}>${esc(prefs.branch)} 학생만</option></select></label>
      </div>
      <p class="muted" style="margin:0 0 6px">${HP_ONLY?`${esc(st.grade)} 학생들이 모의고사에서 많이 틀린 <b>세부 유형</b>(오른쪽 % = 그 유형 오답률)과 같은 유형의 <b>학평</b> 문제예요.`:`${esc(st.grade)} 시험(시험지 워드 등록된 것)에서 오답률이 높은 문항 순서예요.`} 문항을 누르면 미리 볼 수 있어요.</p>
      ${items.length?`<label class="ws-item" style="cursor:pointer;font-weight:700"><input type="checkbox" id="cwAll"> 전체 선택</label>
      <div style="max-height:440px;overflow:auto">${gOrder.map((k,gi)=>{ const its=items.map((x,j)=>[x,j]).filter(([x])=>gkey(x)===k), op=st.open.has(k), top=Math.max(...its.map(([x])=>x.rate));
        return `<div class="ws-grp"><div style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-cwg="${gi}" title="이 유형 전체 선택">
          <span data-cwopen="${esc(k)}" style="cursor:pointer;font-weight:700;flex:1">${op?'▾':'▸'} ${pill(its[0][0].it.cat)} ${esc(its[0][0].it.sub||'-')} <span class="muted" style="font-weight:400">${its.length}문항 · <span data-cwgc="${gi}"></span></span></span>
          <span style="font-weight:700;color:var(--bad)">${HP_ONLY?'유형 오답률 ':''}${top}%</span></div>
          <div ${op?'':'hidden'}>${its.map(([x,j])=>`<div class="ws-item" style="padding-left:24px"><input type="checkbox" data-cw="${j}" data-cwgi="${gi}"> <span class="ws-prev" data-prev="${j}" title="눌러서 문제 미리 보기"><span class="muted">${esc(x.ex.name)} · ${x.it.no}번 ▾</span></span>${HP_ONLY?'':` <span style="margin-left:auto;font-weight:700;color:var(--bad)">${x.rate}%</span><span class="muted">(${x.n}명)</span>`}</div><div class="ws-pv" id="cpv-${j}" hidden></div>`).join('')}</div></div>`; }).join('')}</div>`
      :`<p class="muted">${exs.length?'조건에 맞는 문항이 없어요. 오답률 기준을 낮추거나 회차 범위를 넓혀 보세요.':'이 학년 시험이 아직 없어요.'}</p>`}
      <div class="row" style="margin-top:10px"><label class="ws-item" style="cursor:pointer"><input type="checkbox" id="cwHae" checked> 맨 뒤에 해설 붙이기 (해석·어휘·해설)</label></div>
      <div class="row" style="margin-top:6px"><button class="btn primary" id="cwGo">워드로 만들기</button><span class="muted" id="cwCnt"></span></div>`;
    const picked=()=>[...document.querySelectorAll('[data-cw]:checked')].map(c=>items[+c.dataset.cw]);
    const cnt=()=>{ const l=picked(); $('#cwCnt').textContent=`${l.length}문항 선택`; const a=$('#cwAll'); if(a){ const cs=[...document.querySelectorAll('[data-cw]')]; a.checked=cs.length>0&&cs.every(c=>c.checked); a.indeterminate=!a.checked&&cs.some(c=>c.checked); }
      document.querySelectorAll('[data-cwg]').forEach(b=>{ const cs=[...document.querySelectorAll(`[data-cwgi="${b.dataset.cwg}"]`)], k=cs.filter(c=>c.checked).length;
        b.checked=cs.length>0&&k===cs.length; b.indeterminate=k>0&&k<cs.length; const gc=document.querySelector(`[data-cwgc="${b.dataset.cwg}"]`); if(gc){ gc.textContent=k?`${k}개 선택`:'선택 없음'; gc.style.color=k?'var(--main)':''; } }); };
    document.querySelectorAll('[data-cw]').forEach(c=>c.onchange=cnt);
    document.querySelectorAll('[data-cwg]').forEach(b=>b.onchange=()=>{ document.querySelectorAll(`[data-cwgi="${b.dataset.cwg}"]`).forEach(c=>c.checked=b.checked); cnt(); });
    document.querySelectorAll('[data-cwopen]').forEach(h=>h.onclick=()=>{ const k=h.dataset.cwopen, box=h.parentElement.nextElementSibling; box.hidden=!box.hidden; box.hidden?st.open.delete(k):st.open.add(k); h.firstChild.textContent=box.hidden?'▸ ':'▾ '; });
    const a=$('#cwAll'); if(a) a.onchange=()=>{ document.querySelectorAll('[data-cw]').forEach(c=>c.checked=a.checked); cnt(); };
    $('#cwGrade').onchange=e=>{ st.grade=e.target.value; st.years=0; st.monSel=null; st.yrSel=null; renderCommon(); };
    $('#cwRecent').onchange=e=>{ st.years=+e.target.value; renderCommon(); };
    $('#cwTh').onchange=e=>{ st.th=+e.target.value; renderCommon(); };
    document.querySelectorAll('[data-cwyr]').forEach(c=>c.onchange=()=>{ c.checked?st.yrSel.add(c.dataset.cwyr):st.yrSel.delete(c.dataset.cwyr); renderCommon(); });
    document.querySelectorAll('[data-cwmon]').forEach(c=>c.onchange=()=>{ c.checked?st.monSel.add(+c.dataset.cwmon):st.monSel.delete(+c.dataset.cwmon); renderCommon(); });
    $('#cwScope').onchange=e=>{ st.scope=e.target.value; renderCommon(); };
    pvBind(items); cnt();
    $('#cwGo').onclick=()=>go($('#cwGo'), $('#cwTitle').value.trim()||'모의고사 대비 문제지', picked(), $('#cwHae').checked, false);
  }

  // 2) 회차 통째로: 시험 하나의 독해 문항 전부 (원래 번호 그대로)
  let roundEx='';
  async function renderRound(){
    const body=$('#cwBody');
    const exs=(HP_ONLY?BANK:[...EXAMS,...BANK]).filter(e=>!st.grade||normGrade(e.grade)===st.grade).sort((a,b)=>koCmp(examDateKey(b),examDateKey(a)));
    if(!exs.some(e=>e.id===roundEx)) roundEx=exs[0]?exs[0].id:'';
    const ex=examById(roundEx);
    body.innerHTML=`<div class="row" style="gap:16px;align-items:flex-end">
        <label class="f">학년<select id="crGrade">${grades.map(g=>`<option ${g===st.grade?'selected':''}>${esc(g)}</option>`).join('')}</select></label>
        <label class="f">시험<select id="crEx">${exs.map(e=>`<option value="${e.id}" ${e.id===roundEx?'selected':''}>${esc(e.name)}${e.is_bank?' (문제은행)':''}</option>`).join('')}</select></label></div>
      <div id="crInfo" style="margin-top:10px"><p class="muted">${ex?'시험지 불러오는 중…':'이 학년 시험이 아직 없어요.'}</p></div>`;
    $('#crGrade').onchange=e=>{ st.grade=e.target.value; renderRound(); };
    $('#crEx').onchange=e=>{ roundEx=e.target.value; renderRound(); };
    if(!ex) return;
    const Q=await getQbank(ex.id); if(roundEx!==ex.id) return;
    const list=Q?ex.items.filter(it=>it.cat!=='듣기' && Q.q[it.no]).map(it=>({ex,it})):[];
    const info=$('#crInfo'); if(!info) return;
    if(!Q){ info.innerHTML='<p class="muted">이 시험은 시험지 워드가 등록되어 있지 않아요. 시험 관리에서 워드를 먼저 올려주세요.</p>'; return; }
    const nos=list.map(x=>x.it.no);
    info.innerHTML=`<p>듣기를 뺀 <b>${list.length}문항</b>${nos.length?` (${nos[0]}~${nos[nos.length-1]}번)`:''}을 원래 번호 그대로 넣고, 마지막에 정답표를 붙여요.</p>
      <label class="f" style="margin:4px 0 10px">문제지 제목<input id="crTitle" value="${esc(ex.name)} (독해)"></label>
      <label class="ws-item" style="cursor:pointer"><input type="checkbox" id="crHae"> 맨 뒤에 해설 붙이기 (해석·어휘·해설)</label>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="crGo">워드로 만들기</button></div>`;
    $('#crGo').onclick=()=>go($('#crGo'), $('#crTitle').value.trim()||ex.name, list, $('#crHae').checked, true);
  }
  const setMode=m=>{ st.mode=m; document.querySelectorAll('[data-cmode]').forEach(b=>b.classList.toggle('primary',b.dataset.cmode===m)); (m==='common'?renderCommon:renderRound)(); };
  document.querySelectorAll('[data-cmode]').forEach(b=>b.onclick=()=>setMode(b.dataset.cmode));
  setMode('common');
}

async function buildWorksheet(title, list, withHae=false, keepNo=false){   // keepNo: 회차 통째 인쇄 — 원래 번호 그대로, 출처 표시 없음
  // 시험별로 묶고, 시험 안에서는 번호 순
  const byEx=[]; list.forEach(x=>{ let g=byEx.find(b=>b.ex.id===x.ex.id); if(!g) byEx.push(g={ex:x.ex,nums:[]}); if(!g.nums.includes(x.it.no)) g.nums.push(x.it.no); });
  byEx.forEach(g=>g.nums.sort((a,b)=>a-b));
  const base=await getQbank(byEx[0].ex.id);
  // 기준 문서 사본 (원본 캐시를 건드리지 않도록 새로 읽음)
  const zip=await JSZip.loadAsync(await base.zip.generateAsync({type:'arraybuffer'}));
  const doc=new DOMParser().parseFromString(await zip.file('word/document.xml').async('string'),'application/xml');
  const rels=new DOMParser().parseFromString(await zip.file('word/_rels/document.xml.rels').async('string'),'application/xml');
  const body=wEls(doc,'body')[0]; const sect=[...body.children].find(e=>e.localName==='sectPr');
  if(sect){   // 문제지는 항상 2단 (원본 마지막 구역이 해설용 3단일 수 있음)
    wEls(sect,'cols').forEach(c=>c.parentNode.removeChild(c));
    ['headerReference','footerReference','titlePg'].forEach(n=>wEls(sect,n).forEach(c=>c.parentNode.removeChild(c)));   // 원본 머리말(예: "정답 및 해설") 제거
    const cols=doc.createElementNS(W_NS,'w:cols'); cols.setAttributeNS(W_NS,'w:num','2'); cols.setAttributeNS(W_NS,'w:sep','1'); cols.setAttributeNS(W_NS,'w:space','420');
    const after=['pgSz','pgMar','paperSrc','pgBorders','lnNumType','pgNumType'].map(n=>wEls(sect,n)[0]).filter(Boolean).pop();
    after ? sect.insertBefore(cols, after.nextSibling) : sect.insertBefore(cols, sect.firstChild);
  }
  [...body.children].forEach(e=>{ if(e!==sect) body.removeChild(e); });
  const put=node=>body.insertBefore(node,sect||null);
  const para=(text,{bold=false,size=0,pageBreak=false}={})=>{
    // 줄 간격을 '자동'으로 — 원본 문서의 '고정 줄 간격'을 물려받으면 큰 제목 윗부분이 잘림
    const x=`<w:p xmlns:w="${W_NS}"><w:pPr><w:spacing w:before="${size?120:0}" w:after="${size?100:40}" w:line="264" w:lineRule="auto"/></w:pPr>${pageBreak?'<w:r><w:br w:type="page"/></w:r>':''}<w:r><w:rPr>${bold?'<w:b/>':''}${size?`<w:sz w:val="${size}"/><w:szCs w:val="${size}"/>`:''}</w:rPr><w:t xml:space="preserve">${esc(text)}</w:t></w:r></w:p>`;
    return doc.importNode(new DOMParser().parseFromString(x,'application/xml').documentElement,true);
  };
  put(para(title,{bold:true,size:32}));
  let imgN=0; const relRoot=rels.documentElement;
  // 단 너비(twip) — 표가 단 밖으로 밀리지 않게 맞출 때 사용
  const colW=(()=>{ const sz=sect&&wEls(sect,'pgSz')[0], mg=sect&&wEls(sect,'pgMar')[0];
    const w=sz?+sz.getAttributeNS(W_NS,'w'):11906, l=mg?+mg.getAttributeNS(W_NS,'left'):1134, r=mg?+mg.getAttributeNS(W_NS,'right'):1134;
    return Math.max(3000,Math.floor((w-l-r-420)/2)); })();
  const wEl=(name,attrs={})=>{ const e=doc.createElementNS(W_NS,'w:'+name); Object.entries(attrs).forEach(([k,v])=>e.setAttributeNS(W_NS,'w:'+k,String(v))); return e; };
  const pPrOf=pEl=>{ let pr=[...pEl.children].find(c=>c.localName==='pPr'); if(!pr){ pr=wEl('pPr'); pEl.insertBefore(pr,pEl.firstChild); } return pr; };
  const setFlag=(pEl,name)=>{ const pr=pPrOf(pEl); if(![...pr.children].some(c=>c.localName===name)) pr.insertBefore(wEl(name),pr.firstChild); };
  // 표: 단 너비에 맞추기 (원본의 고정 너비·들여쓰기 제거)
  const fitTable=tbl=>{
    const pr=[...tbl.children].find(c=>c.localName==='tblPr');
    if(pr){ [...pr.children].filter(c=>['tblW','tblInd','tblLayout','tblpPr'].includes(c.localName)).forEach(c=>pr.removeChild(c));
      pr.appendChild(wEl('tblW',{w:5000,type:'pct'})); pr.appendChild(wEl('tblLayout',{type:'autofit'})); }
    const grid=[...tbl.children].find(c=>c.localName==='tblGrid');
    if(grid){ const gc=[...grid.children].filter(c=>c.localName==='gridCol'); const sum=gc.reduce((t,c)=>t+(+c.getAttributeNS(W_NS,'w')||0),0);
      if(sum>colW) gc.forEach(c=>c.setAttributeNS(W_NS,'w:w',String(Math.floor((+c.getAttributeNS(W_NS,'w')||0)*colW/sum)))); }
    wEls(tbl,'tcW').forEach(c=>{ c.setAttributeNS(W_NS,'w:type','auto'); c.setAttributeNS(W_NS,'w:w','0'); });
  };
  // 맨 앞 글자 바꾸기 (예: "24." → "3.", "[41~42" → "[7~8") — 여러 run에 나뉘어 있어도 처리
  const replaceLead=(node,re,rep)=>{
    const ts=wEls(node,'t'); const full=ts.map(t=>t.textContent).join(''); const m=full.match(re); if(!m) return false;
    let left=m[0].length, first=null;
    for(const t of ts){ if(!left) break; const tx=t.textContent; if(first===null&&tx.length) first=t; const k=Math.min(left,tx.length); t.textContent=tx.slice(k); left-=k; }
    const r=typeof rep==='function'?rep(m):rep;
    (first||ts[0]).textContent=r+(first||ts[0]).textContent; (first||ts[0]).setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve'); return true;
  };
  // 출처: 회색 작은 글씨로 문단 끝에
  const addSrc=(pEl,text)=>{ if(pEl.localName!=='p') return;
    const r=wEl('r'), rp=wEl('rPr'); rp.appendChild(wEl('color',{val:'9A9A9A'})); rp.appendChild(wEl('sz',{val:16})); rp.appendChild(wEl('szCs',{val:16})); r.appendChild(rp);
    const t=wEl('t'); t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve'); t.textContent=`  (${text})`; r.appendChild(t); pEl.appendChild(r); };
  const blank=()=>put(para(''));
  const imp=async(Q,i)=>{
        const node=doc.importNode(Q.els[i],true);
        [...node.getElementsByTagNameNS(W_NS,'sectPr')].forEach(s=>s.parentNode.removeChild(s));
        if(Q!==base){   // 다른 시험지의 그림은 파일과 연결을 새로 만듦
          for(const el of [...node.getElementsByTagName('*')]){
            for(const attr of ['embed','id','link']){
              const rid=el.getAttributeNS(R_NS,attr); if(!rid) continue;
              const rel=[...Q.rels.documentElement.children].find(r=>r.getAttribute('Id')===rid); if(!rel||!/image/.test(rel.getAttribute('Type'))) continue;
              const target=rel.getAttribute('Target'); const f=Q.zip.file('word/'+target.replace(/^\/?word\//,'')); if(!f) continue;
              const nm=`media/ws${++imgN}_${target.split('/').pop()}`, nid=`rIdWs${imgN}`;
              zip.file('word/'+nm, await f.async('uint8array'));
              const r=rels.createElementNS(relRoot.namespaceURI,'Relationship'); r.setAttribute('Id',nid); r.setAttribute('Type',rel.getAttribute('Type')); r.setAttribute('Target',nm); relRoot.appendChild(r);
              el.setAttributeNS(R_NS,'r:'+attr,nid);
            }
          }
        }
        if(node.localName==='tbl') fitTable(node); wEls(node,'tbl').forEach(fitTable);
        return node;
  };
  // 새 번호: 1번부터 차례로 (출처는 회색 글씨로)
  const newNo=new Map(); let k=0; byEx.forEach(g=>g.nums.forEach(n=>newNo.set(g.ex.id+'|'+n,keepNo?n:++k)));
  const NO_RE=/^\s*\d{1,2}\s*\./, GRP_RE=/^\s*\[\s*(?:\d{1,2}\s*[~∼～-]\s*\d{1,2}|\d{4}(?!\d))([^\]]*)\]\s*/;
  // 묶음 머리말 번호도 새 번호로. 문항이 하나만 뽑혔으면 문제지에서는 [ ]를 빼고, 해설에서는 [7번 단일 장문]처럼
  const rangeOf=(g,grp,isHae)=>m=>{ const ns=g.nums.filter(n=>grp.a<=n&&n<=grp.b).map(n=>newNo.get(g.ex.id+'|'+n)), lab=m[1]||'';
    if(ns.length>1) return `[${ns[0]}~${ns[ns.length-1]}${lab}] `;
    return isHae?`[${ns[0]}번${lab}] `:''; };
  const isEmptyP=n=>n.localName==='p'&&!wText(n).trim()&&![...n.getElementsByTagName('*')].some(e=>['drawing','pict','object'].includes(e.localName));
  // 문항 하나를 통째로: 같은 단(쪽)에 붙어 있도록 '다음 단락과 함께' 설정
  const putChunk=nodes=>{
    nodes.forEach((n,j)=>{ if(j===nodes.length-1&&n.localName==='p') return;
      const ps=n.localName==='p'?[n]:wEls(n,'p'); ps.forEach(pp=>{ setFlag(pp,'keepLines'); setFlag(pp,'keepNext'); });
      if(n.localName==='tbl') wEls(n,'tr').forEach(tr=>{ let trPr=[...tr.children].find(c=>c.localName==='trPr'); if(!trPr){ trPr=wEl('trPr'); tr.insertBefore(trPr,tr.firstChild); } trPr.appendChild(wEl('cantSplit')); }); });
    nodes.forEach(put);
  };
  const answers=[]; let firstQ=true;
  for(const g of byEx){
    const Q=await getQbank(g.ex.id); if(!Q) continue;
    const used=new Set();
    for(const n of g.nums){
      const no=newNo.get(g.ex.id+'|'+n), src=`${g.ex.name} ${n}번`, nodes=[];
      for(const i of qIndexes(Q,n)){ if(used.has(i)) continue; used.add(i);
        const node=await imp(Q,i);
        const grp=Q.grp.find(x=>x.h===i); if(grp) replaceLead(node,GRP_RE,rangeOf(g,grp,false));
        if(i===Q.q[n][0]){ replaceLead(node,NO_RE,`${no}.`); if(!keepNo) addSrc(node,src); }
        nodes.push(node); }
      while(nodes.length&&isEmptyP(nodes[0])) nodes.shift(); while(nodes.length&&isEmptyP(nodes[nodes.length-1])) nodes.pop();   // 앞뒤 빈 줄 정리
      if(!firstQ){ blank(); blank(); blank(); } firstQ=false;   // 문항 사이 3줄
      putChunk(nodes);
      const it=g.ex.items[n-1]; answers.push({no, ans:+it.answer?circled(+it.answer):'-'});
    }
  }
  // 정답: 쪽을 넘기지 않고 작은 표로 (번호·정답 5쌍씩)
  blank(); put(para('정답',{bold:true,size:24}));
  const PER=5; let rows='';
  for(let i=0;i<answers.length;i+=PER){
    rows+='<w:tr><w:trPr><w:cantSplit/></w:trPr>'+Array.from({length:PER},(_,j)=>{ const a=answers[i+j];
      const cell=(txt,shade)=>`<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/>${shade?'<w:shd w:val="clear" w:color="auto" w:fill="F1F3F5"/>':''}</w:tcPr><w:p><w:pPr><w:spacing w:before="20" w:after="20" w:line="240" w:lineRule="auto"/><w:jc w:val="center"/></w:pPr><w:r><w:rPr>${shade?'<w:b/>':''}<w:sz w:val="18"/><w:szCs w:val="18"/></w:rPr><w:t xml:space="preserve">${esc(txt)}</w:t></w:r></w:p></w:tc>`;
      return a?cell(String(a.no),true)+cell(a.ans,false):cell('',true)+cell('',false); }).join('')+'</w:tr>';
  }
  const bd='<w:top w:val="single" w:sz="4" w:color="BFBFBF"/><w:left w:val="single" w:sz="4" w:color="BFBFBF"/><w:bottom w:val="single" w:sz="4" w:color="BFBFBF"/><w:right w:val="single" w:sz="4" w:color="BFBFBF"/><w:insideH w:val="single" w:sz="4" w:color="BFBFBF"/><w:insideV w:val="single" w:sz="4" w:color="BFBFBF"/>';
  if(answers.length) put(doc.importNode(new DOMParser().parseFromString(`<w:tbl xmlns:w="${W_NS}"><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${bd}</w:tblBorders><w:tblLayout w:type="autofit"/></w:tblPr><w:tblGrid>${'<w:gridCol w:w="400"/>'.repeat(PER*2)}</w:tblGrid>${rows}</w:tbl>`,'application/xml').documentElement,true));
  // 해설 (해석·어휘·해설) — 쪽 넘김 없이 이어서, 번호도 새 번호로
  if(withHae){
    let first=true;
    for(const g of byEx){
      const Q=await getQbank(g.ex.id); if(!Q||!Q.hq) continue;
      const nums=g.nums.filter(n=>Q.hq[n]); if(!nums.length) continue;
      if(first){ blank(); put(para('해설',{bold:true,size:24})); first=false; }
      const used=new Set();
      for(const n of nums){
        const no=newNo.get(g.ex.id+'|'+n); let added=false;
        for(const i of hIndexes(Q,n)){ if(used.has(i)) continue; used.add(i);
          const node=await imp(Q,i);
          const grp=Q.hgrp.find(x=>x.h===i); if(grp) replaceLead(node,GRP_RE,rangeOf(g,grp,true));
          if(i===Q.hq[n][0]){ replaceLead(node,NO_RE,`${no}.`); if(!keepNo) addSrc(node,`${g.ex.name} ${n}번`); }
          if(!added){ blank(); added=true; }
          put(node); }
      }
    }
  }
  // 이미지 확장자 등록
  let ct=await zip.file('[Content_Types].xml').async('string');
  ['png','jpeg','jpg','gif','emf','wmf'].forEach(ext=>{ if(!new RegExp(`Extension="${ext}"`,'i').test(ct)) ct=ct.replace('</Types>',`<Default Extension="${ext}" ContentType="image/${ext==='jpg'?'jpeg':ext==='emf'?'x-emf':ext==='wmf'?'x-wmf':ext}"/></Types>`); });
  zip.file('[Content_Types].xml',ct);
  const ser=x=>{ const s=new XMLSerializer().serializeToString(x); return s.startsWith('<?xml')?s:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+s; };
  zip.file('word/document.xml',ser(doc)); zip.file('word/_rels/document.xml.rels',ser(rels));
  const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=title.replace(/[\\/:*?"<>|]/g,'_')+'.docx'; a.click();
}

// --- 시험 관리: 시험지 워드 등록 칸 ---
async function renderQsrcBox(){
  const box=$('#qsrcBox'); if(!box||!editing) return;
  if(editing._new){ box.innerHTML='<p class="muted">시험을 먼저 저장하면 등록할 수 있어요.</p>'; return; }
  const info=await qsrcInfo(editing.id); const Q=info?await getQbank(editing.id):null;
  box.innerHTML=`${info?`<p>등록됨: <b>${esc(info.name)}</b> · ${Q?`${Object.keys(Q.q).length}문항 인식 · 묶음 ${Q.grp.length}개`:'<span class="mark-x">읽기 실패</span>'}</p>`:'<p class="muted">아직 없어요. 문제가 줄 맨 앞 "21." 형식으로 시작하는 워드 파일을 올려주세요.</p>'}
    <div class="row"><input type="file" id="qsrcIn" accept=".docx"><button class="btn sm" id="qsrcUp">${info?'다시 등록':'등록'}</button></div>`;
  $('#qsrcUp').onclick=async()=>{
    const f=$('#qsrcIn').files[0]; if(!f) return;
    try{
      const Q=await parseDocx(await f.arrayBuffer()); const n=Object.keys(Q.q).length;
      const miss=editing.items.map(i=>i.no).filter(no=>!Q.q[no]);
      if(miss.length && !confirm(`${n}문항만 인식됐어요. 못 찾은 번호: ${miss.join(', ')}\n그래도 등록할까요?`)) return;
      await saveQsrc(editing.id,f); renderQsrcBox(); if(sb) renderFiles();
    }catch(err){ alert('등록 실패: '+err.message); }
  };
}

/* ===================== 답안 엑셀 한 번에 입력 ===================== */
// 형식: 첫 줄 = 머리글(이름 열 + 1~45 번호 열, 회원코드 열은 있으면 사용), 그 아래 학생마다 한 줄
async function readAnswerSheet(file, ex){
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  // 머리글 칸 글자에서 문항 번호 읽기: "1", "1번", "01", "1.0", "Q1", "문항1" 모두 인식 (열 위치는 상관없음)
  const qNo=c=>{ const m=String(c??'').replace(/\s/g,'').match(/^(?:Q|문항)?0*(\d{1,2})(?:번|\.0+|\.)?$/i); const n=m?+m[1]:0; return n>=1&&n<=ex.q_count?n:0; };
  const need=Math.min(10,ex.q_count);
  // 모든 시트의 위쪽 30줄에서 문항 번호가 가장 많이 적힌 줄을 머리글로
  let aoa=null, hi=-1, best=0;
  for(const sn of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:false});
    rows.slice(0,30).forEach((r,i)=>{ const k=new Set(r.map(qNo).filter(Boolean)).size; if(k>best){ best=k; aoa=rows; hi=i; } });
    if(best>=ex.q_count) break;
  }
  if(best<need){
    const first=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false})[0]||[];
    throw new Error(`문항 번호(1, 2, 3 …)가 적힌 머리글 줄을 찾지 못했어요. 첫 줄 내용: ${first.slice(0,14).map(c=>'['+String(c).trim()+']').join(' ')||'(비어 있음)'}`);
  }
  const head=aoa[hi].map(c=>String(c).trim());
  const qcol={}; head.forEach((h,i)=>{ const n=qNo(h); if(n && !(n in qcol)) qcol[n]=i; });
  let ncol=head.findIndex(h=>/이름|성명|학생명/.test(h)); if(ncol<0) ncol=head.findIndex((h,i)=>h && !Object.values(qcol).includes(i));
  const ccol=head.findIndex(h=>/회원\s*코드|코드|^ID$/i.test(h));
  // 본사 양식 (시험정보·응시학년·분원·선생님·ID·학생명·현재반…) 열도 있으면 같이 읽음
  const col=re=>head.findIndex(h=>re.test(h));
  const icol=col(/시험\s*(정보|명|이름)/);
  const gcol=col(/응시\s*학년/), bcol=col(/^분원$/), tcol=col(/^(선생님|담임)$/), kcol=col(/^(현재\s*반|반)$/);
  const cell=(r,i)=>i>=0?String(r[i]??'').trim():'';
  const toCh=v=>{ const s=String(v??'').trim().replace(/[①②③④⑤]/,c=>'①②③④⑤'.indexOf(c)+1); return /^[1-5]$/.test(s)?s:'0'; };
  return aoa.slice(hi+1).map(r=>({
    name:String(r[ncol]??'').trim(), code:ccol>=0?String(r[ccol]??'').trim():'',
    grade:cell(r,gcol), branch:cell(r,bcol), teacher:cell(r,tcol), cls:cell(r,kcol), info:cell(r,icol),
    answers:Array.from({length:ex.q_count},(_,i)=>qcol[i+1]!=null?toCh(r[qcol[i+1]]):'0').join('')
  })).filter(x=>x.name);
}

// 엑셀 양식 내려받기 (머리글 + 학생 줄) — 올리는 쪽이 읽는 열 이름 그대로
function downloadSheet(fname, aoa, widths, guide){
  if(!window.XLSX) return alert('엑셀 도구를 불러오지 못했어요. 인터넷 연결을 확인하세요.');
  const wb=XLSX.utils.book_new(), ws=XLSX.utils.aoa_to_sheet(aoa);
  if(widths) ws['!cols']=widths.map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws, '입력');
  if(guide) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(guide.map(t=>[t])), '쓰는 법');
  XLSX.writeFile(wb, fname.replace(/[\\/:*?"<>|]/g,'_'));
}
function downloadOmrTemplate(ex){   // 한 회차 전체(고1~고3 섞어서) — '응시 학년' 열로 학년별 시험에 나눠 들어감

     '· 1~'+n+' 칸에 학생이 고른 번호(1~5)를 적어요. 안 쓴 문항은 비워 두면 무응답이에요.',
     '· 결시한 학생은 줄을 지우거나 답을 모두 비워 두면 빠져요.',

async function openAnswerImport(ex){
  $('#modal').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">답안 엑셀로 한 번에 입력</h2><button class="btn" id="closeM">닫기</button></div>
    <div id="xaTarget"></div>
    <p class="muted">첫 줄에 이름과 1~45 번호, 아래로 학생별 고른 번호가 있는 엑셀. 본사 양식(시험정보·응시학년·분원·선생님·ID·학생명…)도 그대로 올리면 돼요 — 고1~고3이 한 시트에 섞여 있으면 학년별로 이 회차 시험에 나눠 넣어요. 분원: <b>${esc(prefs.branch)}</b> (OMR 입력 화면에서 고른 분원)</p>
    <div class="row" style="gap:10px;align-items:center"><input type="file" id="xaFile" accept=".xlsx,.xls,.csv"><button class="btn" id="xaTpl">OMR 엑셀 양식 받기</button><span class="muted" id="xaTplNote"></span></div><div id="xaBody"></div>`;
  $('#closeM').onclick=()=>$('#modalBg').classList.remove('show');
  $('#modalBg').classList.add('show');
  const target=ex=>{ $('#xaTarget').innerHTML=`<div class="xa-target">넣을 시험 <b>${esc(roundLabel(roundKey(ex)))}</b> · <b>${esc(normGrade(ex.grade)||'')}</b> · ${esc(ex.name)} <span class="muted">(시행 ${esc(fmtYM(ex.exam_date)||'-')})</span></div>`; };
  target(ex);
  { const L=rosterSync(prefs.branch, roundKey(ex)), gs=[...new Set(L.map(st=>normGrade(st.grade)).filter(Boolean))].sort(koCmp);
    $('#xaTplNote').textContent=L.length?`${roundLabel(roundKey(ex))} ${prefs.branch} 명단 ${L.length}명(${gs.join('·')})이 응시 학년과 함께 채워진 양식이에요`:'이 회차 명단이 없어 빈 양식이에요'; }
  $('#xaTpl').onclick=()=>downloadOmrTemplate(ex);
  $('#xaFile').onchange=e=>{ const f=e.target.files[0]; if(f) run(f,ex); };
  const run=async(f,ex)=>{
    target(ex);
    try{
      if(!window.XLSX) throw new Error('엑셀 읽기 도구를 불러오지 못했어요.');
      // 같은 회차 시험들: 한 시트에 고1~고3이 섞여 있으면 학년별로 그 회차 시험에 나눠 넣음
      const rk=roundKey(ex), egx=normGrade(ex.grade);

      // 같은 이름이 여럿이면 기존 기록과 정오가 가장 많이 겹치는 쪽으로 연결
      const agree=(e,a,r)=>e.items.reduce((s,it,i)=>s+(isOk(a[i],it)===isOk(r.answers[i],it)?1:0),0);

        const score=gradeAnswers(e,x.answers).score;
        return {...x, old, st, score, kind: old?'replace':st?'new':'nomatch'};
      });
      const cnt=k=>plan.filter(p=>p.kind===k).length;
      const diff=plan.filter(p=>p.old && p.old.score!==p.score);
      const keyWarn=exs.map(e=>{ const m=e.items.filter(it=>!+it.answer).map(it=>it.no); return m.length?`${esc(e.name)}: ${m.join(', ')}번`:''; }).filter(Boolean);

      const infos=[...new Set(rowsAll.map(x=>x.info).filter(Boolean))];
      infos.slice(0,3).forEach(t=>{ const m=String(t).match(/(\d{1,2})\s*월/); if(!m||!exM) return;
        checks.push(rnd(+m[1])===rnd(exM)?{html:`엑셀 시험정보 "${esc(t)}"와 회차가 맞아요.`}:{bad:true,html:`엑셀 시험정보는 "<b>${esc(t)}</b>"인데, 고른 시험은 <b>${exM}월</b>이에요.`}); });
      exs.forEach(e=>{ const fc=fitCheck(e, plan.filter(p=>p.ex===e&&p.kind!=='skip').map(p=>p.answers)); if(!fc) return;
        checks.push(fc.better?{bad:true,html:`${esc(normGrade(e.grade))} 답안이 고른 시험 정답과 평균 <b>${Math.round(fc.own)}%</b>만 맞고, <b>${esc(fc.better.e.name)}</b> (${esc(roundLabel(roundKey(fc.better.e)))}) 정답과는 <b>${Math.round(fc.better.f)}%</b> 맞아요. 다른 시험 답안일 가능성이 높아요. <button class="btn" data-xasw="${fc.better.e.id}" style="padding:2px 10px;font-size:12px">이 시험으로 바꿔 보기</button>`}
          :{html:`${esc(normGrade(e.grade))} 답안이 고른 시험 정답과 평균 ${Math.round(fc.own)}% 맞아요 (다른 시험 정답보다 잘 맞음).`}); });
      const badN=checks.filter(c=>c.bad).length;
      $('#xaBody').innerHTML=`
        ${checks.length?`<div class="xa-check ${badN?'bad':''}"><b>${badN?`⚠ 확인이 필요해요 (${badN}건)`:'✓ 점검 통과'}</b><ul>${checks.map(c=>`<li class="${c.bad?'mark-x':''}">${c.bad?'⚠':'✓'} ${c.html}</li>`).join('')}</ul></div>`:''}`+`
        ${exs.length?`<p style="margin-top:10px">${exs.map(e=>{ const n=plan.filter(p=>p.ex===e&&p.kind!=='skip').length; return `<b>${esc(e.name)}</b> ${n}명`; }).join(' · ')} 에 나눠서 넣어요.</p>`:''}
        ${offBranch.length||noExam.length?`<p class="muted" style="margin-top:6px">제외: ${offBranch.length?`다른 분원 ${offBranch.length}명 (${[...new Set(offBranch.map(x=>x.branch))].map(esc).join(', ')})`:''}${offBranch.length&&noExam.length?' · ':''}${noExam.length?`이 회차에 시험이 등록되지 않은 학년 ${noExam.length}명 (${[...new Set(noExam.map(x=>x.grade))].map(esc).join(', ')}) — 시험 관리에서 먼저 등록해 주세요`:''}</p>`:''}
        ${!rows.length?`<p class="total bad">${esc(roundLabel(rk))} · ${esc(prefs.branch)}에 넣을 학생이 파일에 없어요.</p>`:''}
        ${keyWarn.length?`<p class="total bad">정답이 비어 있는 문항 — ${keyWarn.join(' / ')} — 이 문항은 모두 오답 처리돼요. 시험 관리에서 정답을 먼저 넣는 걸 권해요.</p>`:''}
        <p style="margin-top:10px">기존 답안 교체 <b>${cnt('replace')}</b> · 명단 연결 새로 입력 <b>${cnt('new')}</b> · 명단에 없음(파일의 이름·코드로 입력) <b>${cnt('nomatch')}</b> · 빈 답안(결시) 제외 <b>${cnt('skip')}</b></p>
        ${diff.length?`<p class="total bad">기존 점수와 달라지는 학생 ${diff.length}명 — OMR 카드와 엑셀을 한번 확인해 주세요.</p>`:''}
        <div style="max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px"><table><thead><tr><th>이름</th>${multi?'<th>시험</th>':''}<th>처리</th><th>반</th><th>점수</th><th>기존 점수</th></tr></thead><tbody>
          ${plan.map(p=>`<tr><td>${esc(p.name)}</td>${multi?`<td>${esc(normGrade(p.ex.grade))}</td>`:''}<td>${{replace:'기존 교체',new:'새로 입력',nomatch:'<span class="mark-x">명단에 없음</span>',skip:'<span class="muted">결시 제외</span>'}[p.kind]}</td>
            <td>${esc(p.old?p.old.class_name:p.st?p.st.class_name:(p.cls||''))}</td><td>${p.kind==='skip'?'':`<b>${p.score}</b>`}</td>
            <td>${p.old?(p.old.score!==p.score?`<b class="mark-x">${p.old.score}</b>`:p.old.score):''}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="row" style="margin-top:12px">${badN?'<label class="ws-item" style="cursor:pointer"><input type="checkbox" id="xaOk"> 점검 내용을 확인했고, 이 시험이 맞아요</label>':''}<button class="btn primary" id="xaGo" ${badN?'disabled':''}>입력하기</button></div>`;
      const ok=$('#xaOk'); if(ok) ok.onchange=()=>{ $('#xaGo').disabled=!ok.checked; };
      document.querySelectorAll('[data-xasw]').forEach(b=>b.onclick=()=>run(f, examById(b.dataset.xasw)));
      $('#xaGo').onclick=async()=>{
        const todo=plan.filter(p=>p.kind!=='skip'); if(!todo.length) return alert('입력할 학생이 없어요.');
        if(!confirm(`${todo.length}명의 답안을 저장할까요?${multi?`\n(${exs.map(e=>e.name).join(', ')})`:''}${cnt('replace')?`\n(기존 ${cnt('replace')}명 답안은 엑셀 내용으로 바뀝니다)`:''}`)) return;
        $('#xaGo').disabled=true; $('#xaGo').textContent='저장 중…';
        try{
          for(const p of todo){
            const rec={id:p.old?p.old.id:uid(), exam_id:p.ex.id, branch:prefs.branch,
              class_name:p.old?p.old.class_name:(p.st?p.st.class_name:(p.cls||'')), student_name:p.old?p.old.student_name:(p.st?p.st.student_name:p.name),
              member_code:p.old?p.old.member_code:(p.st&&p.st.member_code||p.code||null),

            if(!sb) rec.created_at=(p.old&&p.old.created_at)||nowIso();

        }catch(err){ alert('저장 실패: '+err.message); $('#xaGo').disabled=false; $('#xaGo').textContent='입력하기'; }
      };

// 답안 묶음이 그 시험 정답과 얼마나 맞는지 (고른 번호가 있는 답안만, %) — 다른 시험 답안이 잘못 들어갔는지 찾는 데 씀
function keyFit(e, list){
  let ok=0, n=0;
  list.forEach(a=>{ if(!a||/[ox]/.test(a)) return; e.items.forEach((it,i)=>{ const c=+a[i]||0, k=+it.answer||0; if(c&&k){ n++; if(c===k) ok++; } }); });
  return n>=30 ? ok/n*100 : null;
}
function fitCheck(e, list){
  const own=keyFit(e,list); if(own==null) return null;
  let best=null; for(const o of EXAMS){ if(o.id===e.id) continue; const v=keyFit(o,list); if(v!=null && (!best||v>best.f)) best={e:o,f:v}; }
  return {own, better: best && best.f>=own+15 && best.f>=40 ? best : null};
}

/* ===================== 계정·권한 ===================== */
// 본사(hq): 전부 / 분원 관리자(branch): 자기 분원 + 담임 계정 관리 / 담임(teacher): 자기 분원, 기본은 내 담당 학생만
let ME=null;
const ROLE_LABEL={hq:'본사',branch:'분원 관리자',teacher:'담임'};
const LOGIN_DOMAIN='@high-at.app';
const isHq=()=>!ME || ME.role==='hq';   // 로컬 테스트 모드(로그인 없음)는 본사처럼
const canExam=()=>!ME || !!ME.exam_admin;   // 시험 등록·정답 입력: 지정된 계정만
// 전체 분원 비교·오답률용: 본사는 원래 응답, 그 외는 이름 없이 분원·점수·답만 (서버에서 묶어서 줌)
const SUMCACHE={};
async function getExamSummary(examId){
  if(isHq()||!sb) return getResponses(examId);
  if(!SUMCACHE[examId]){ const {data,error}=await sb.rpc('mx_exam_summary',{p_exam_id:String(examId)});
    if(error){ console.warn(error); return getResponses(examId); } SUMCACHE[examId]=data||[]; }
  return SUMCACHE[examId];
}
const myTeacher=()=>ME&&ME.role==='teacher'?(ME.teacher_name||''):'';
async function loadMe(){
  const {data:{user}}=await sb.auth.getUser(); if(!user) return false;
  const {data,error}=await sb.from('mx_profiles').select('*').eq('id',user.id).maybeSingle();
  if(error||!data){ await sb.auth.signOut(); showLogin(error?('계정 정보를 불러오지 못했어요: '+error.message):'이 아이디에 연결된 계정 정보가 없어요. 본사에 문의해 주세요.'); return false; }
  ME=data; return true;
}
function showLogin(msg){
  $('#loginBg').hidden=false; const er=$('#lgErr'); er.hidden=!msg; er.textContent=msg||'';
  $('#loginForm').onsubmit=async e=>{ e.preventDefault();
    const id=$('#lgId').value.trim().toLowerCase(), pw=$('#lgPw').value; if(!id||!pw) return;
    $('#lgGo').disabled=true; $('#lgGo').textContent='확인 중…'; er.hidden=true;
    const {error}=await sb.auth.signInWithPassword({email:id.includes('@')?id:id+LOGIN_DOMAIN, password:pw});
    $('#lgGo').disabled=false; $('#lgGo').textContent='로그인';
    if(error){ er.hidden=false; er.textContent='아이디 또는 비밀번호가 맞지 않아요.'; return; }
    if(!await loadMe()) return;
    $('#loginBg').hidden=true; $('#lgPw').value=''; startApp();
  };
}
function applyRole(){
  if(!ME) return;
  const hq=ME.role==='hq';
  if(!hq){   // 분원 고르는 곳이 모두 내 분원 하나만 보이도록
    BRANCHES.splice(0,BRANCHES.length,ME.branch); prefs.branch=ME.branch; resBranch=ME.branch; admBranch=ME.branch;
  }
  document.querySelector('nav [data-tab="exam"]').hidden=!canExam();   // 시험 등록·정답: 지정된 계정만
  document.querySelector('nav [data-tab="roster"]').hidden=ME.role==='teacher';
  document.querySelector('nav [data-tab="check"]').hidden=ME.role==='teacher';   // 데이터 점검: 본사·분원 관리자   // 명단 올리기: 본사·분원 관리자
  $('#acctBtn').hidden=ME.role==='teacher';
  const w=$('#who'); w.hidden=false;
  w.innerHTML=`<span class="role-tag">${ROLE_LABEL[ME.role]}</span><b>${esc(ME.display_name||ME.teacher_name||ME.username)}</b>${ME.branch?`<span>${esc(ME.branch)}</span>`:''}<button id="myPw">비밀번호 변경</button><button id="logout">로그아웃</button>`;
  $('#logout').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
  $('#myPw').onclick=async()=>{ const pw=prompt('새 비밀번호 (6자 이상)'); if(!pw) return;
    const {error}=await sb.rpc('mx_set_password',{p_id:ME.id,p_password:pw}); alert(error?'바꾸지 못했어요: '+error.message:'비밀번호를 바꿨어요.'); };
}
let appStarted=false;
async function startApp(){
  if(appStarted) return; appStarted=true;
  applyRole(); await loadExams(); showTab('admin');   // 열면 관리자 분석부터 (분원 계정은 자기 분원 기준)
}

// --- 계정 관리 탭 ---
async function renderAcctTab(){
  const box=$('#tab-acct');
  if(!sb||!ME){ box.innerHTML='<div class="card"><p class="muted">로컬 테스트 모드에서는 계정 관리를 쓸 수 없어요.</p></div>'; return; }
  box.innerHTML='<div class="card"><p class="muted">불러오는 중…</p></div>';
  const {data:list,error}=await sb.from('mx_profiles').select('*').order('role').order('branch').order('username');
  if(error){ box.innerHTML=`<div class="card"><p class="total bad">계정 목록을 불러오지 못했어요: ${esc(error.message)}</p></div>`; return; }
  const hq=ME.role==='hq';
  const allBranches=hq?BRANCHES:[ME.branch];
  const roles=hq?[['branch','분원 관리자'],['teacher','담임'],['hq','본사']]:[['teacher','담임']];
  let fRole=roles[0][0], fBranch=allBranches[0];
  const teacherNames=async b=>{ await loadStudents(b); return [...new Set((STU[b]||[]).map(s=>s.teacher).filter(Boolean))].sort(koCmp); };
  const order={hq:0,branch:1,teacher:2};
  const rows=[...list].sort((a,b)=>order[a.role]-order[b.role]||koCmp(a.branch,b.branch)||koCmp(a.username,b.username));
  box.innerHTML=`
  <div class="grid2">
    <div class="card">
      <h2 style="margin-top:0">새 계정 만들기</h2>
      <p class="muted">${hq?'먼저 분원마다 <b>분원 관리자</b> 계정을 만들어 주세요. 각 분원 관리자는 자기 분원의 담임 계정을 직접 만들 수 있어요.':'우리 분원 담임 선생님 계정을 만들 수 있어요.'}</p>
      <div style="display:flex;flex-direction:column;gap:10px;max-width:420px">
        <label class="f">종류<select id="acRole">${roles.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>
        <label class="f" id="acBrWrap">분원<select id="acBr">${allBranches.map(b=>`<option>${esc(b)}</option>`).join('')}</select></label>
        <label class="f" id="acTWrap">명단의 담임 이름 <span class="muted">(학생 명단 '담임' 칸과 똑같이 — 내 담당 학생을 찾을 때 써요)</span><input id="acT" list="acTList" placeholder="예: Sage김소연"><datalist id="acTList"></datalist></label>
        <label class="f">아이디 <span class="muted">(영문 소문자·숫자 3~30자)</span><input id="acId" autocapitalize="off" placeholder="예: namdongtan"></label>
        <label class="f">처음 비밀번호 <span class="muted">(6자 이상 · 로그인 후 본인이 바꿀 수 있어요)</span><input id="acPw"></label>
        <label class="f">표시 이름 <span class="muted">(선택)</span><input id="acName" placeholder="예: 남동탄 원장님"></label>
        <button class="btn primary" id="acGo">계정 만들기</button>
      </div>
    </div>
    <div class="card">
      <h2 style="margin-top:0">${hq?'전체 계정':esc(ME.branch)+' 계정'} (${rows.length})</h2>
      <div style="overflow:auto"><table><thead><tr><th>종류</th><th>분원</th><th>아이디</th><th>이름</th><th>명단 담임 이름</th><th></th></tr></thead><tbody>
      ${rows.map((u,i)=>{ const can=u.id!==ME.id && (hq || (u.role==='teacher'&&u.branch===ME.branch));
        return `<tr><td><span class="role-tag">${ROLE_LABEL[u.role]}</span></td><td>${esc(u.branch||'-')}</td><td><b>${esc(u.username)}</b>${u.id===ME.id?' <span class="muted">(나)</span>':''}</td><td>${esc(u.display_name||'')}</td>
          <td>${esc(u.teacher_name||'')}${u.role==='teacher'&&can?` <button class="btn" data-actn="${i}" style="padding:2px 8px;font-size:12px">고치기</button>`:''}</td>
          <td style="white-space:nowrap">${can?`<button class="btn" data-acpw="${i}" style="padding:4px 10px">비번 재설정</button> <button class="btn danger" data-acdel="${i}" style="padding:4px 10px">삭제</button>`:''}</td></tr>`; }).join('')}
      </tbody></table></div>
      <p class="muted">로그인은 아이디만 입력하면 돼요. 비밀번호를 잊으면 여기서 '비번 재설정'으로 새로 정해주세요.</p>
    </div>
  </div>`;
  const sync=async()=>{ fRole=$('#acRole').value; fBranch=$('#acBr').value;
    $('#acBrWrap').hidden=fRole==='hq'; $('#acTWrap').hidden=fRole!=='teacher';
    if(fRole==='teacher') $('#acTList').innerHTML=(await teacherNames(fBranch)).map(t=>`<option value="${esc(t)}">`).join(''); };
  $('#acRole').onchange=sync; $('#acBr').onchange=sync; sync();
  const rpcErr=e=>(e&&e.message||'').replace(/^.*?:\s*/,'')||'알 수 없는 오류';
  $('#acGo').onclick=async()=>{
    const id=$('#acId').value.trim().toLowerCase(), pw=$('#acPw').value, t=$('#acT').value.trim();
    if(!id||!pw) return alert('아이디와 비밀번호를 넣어주세요.');
    if(fRole==='teacher'&&!t&&!confirm('명단 담임 이름이 비어 있어요. 이대로 만들면 "내 담당 학생만" 보기가 안 돼요. 계속할까요?')) return;
    $('#acGo').disabled=true;
    const {error}=await sb.rpc('mx_create_account',{p_username:id,p_password:pw,p_role:fRole,p_branch:fRole==='hq'?null:fBranch,p_teacher:fRole==='teacher'?t:null,p_display:$('#acName').value.trim()||null});
    $('#acGo').disabled=false;
    if(error) return alert('만들지 못했어요: '+error.message);
    alert(`계정을 만들었어요.\n아이디: ${id}\n비밀번호: ${pw}\n이 정보를 해당 선생님께 전달해 주세요.`); renderAcctTab();
  };
  document.querySelectorAll('[data-acpw]').forEach(b=>b.onclick=async()=>{ const u=rows[+b.dataset.acpw]; const pw=prompt(`${u.username} 의 새 비밀번호 (6자 이상)`); if(!pw) return;
    const {error}=await sb.rpc('mx_set_password',{p_id:u.id,p_password:pw}); alert(error?'바꾸지 못했어요: '+error.message:`${u.username} 비밀번호를 바꿨어요.`); });
  document.querySelectorAll('[data-acdel]').forEach(b=>b.onclick=async()=>{ const u=rows[+b.dataset.acdel]; if(!confirm(`${u.username} 계정을 삭제할까요? (입력된 성적 기록은 그대로 남아요)`)) return;
    const {error}=await sb.rpc('mx_delete_account',{p_id:u.id}); if(error) return alert('삭제하지 못했어요: '+error.message); renderAcctTab(); });
  document.querySelectorAll('[data-actn]').forEach(b=>b.onclick=async()=>{ const u=rows[+b.dataset.actn]; const t=prompt('명단의 담임 이름 (학생 명단 담임 칸과 똑같이)',u.teacher_name||''); if(t===null) return;
    const {error}=await sb.rpc('mx_set_teacher_name',{p_id:u.id,p_teacher:t}); if(error) return alert('고치지 못했어요: '+error.message); renderAcctTab(); });
}

/* ===================== 시작 ===================== */
(async()=>{
  const m=$('#mode');
  if(sb){ m.textContent='Supabase 연결됨'; m.classList.add('on'); } else { m.textContent='로컬 테스트 모드 (이 브라우저에만 저장)'; }
  if(sb){
    const {data:{session}}=await sb.auth.getSession();
    if(!session){ showLogin(); return; }
    if(!await loadMe()) return;
  }
  startApp();
})();
</script>
</body>
</html>
