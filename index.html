<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모의고사 채점</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e6e8ec; --text:#1f2430; --sub:#6b7280; --main:#2f5bea; --main-soft:#eef2ff;
  --ok:#15803d; --ok-bg:#ecfdf3; --ok-line:#a7e3bd;
  --warn:#b45309; --warn-bg:#fff8e6; --warn-line:#f3d38a;
  --bad:#c0262d; --bad-bg:#fff1f1; --bad-line:#f2b0b3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:14px}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
.mode{font-size:12px;padding:3px 10px;border-radius:99px;background:#f1f5f9;color:var(--sub)}
.mode.on{background:var(--ok-bg);color:var(--ok)}
nav{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.navgrp{position:relative}
.grp-btn{border:1px solid var(--line)!important;background:#fff!important;padding:9px 16px!important;border-radius:10px!important;color:var(--text)!important;font-weight:700!important}
.navgrp.on .grp-btn{background:var(--main-soft)!important;border-color:#c7d7fe!important;color:var(--main)!important}
.grp-cur{font-weight:600;margin:0 4px 0 6px}
.grp-cur:not(:empty)::before{content:'· '}
.grp-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.12);padding:6px;min-width:240px;z-index:50}
.navgrp.open .grp-menu{display:block}
.grp-menu button{display:block;width:100%;text-align:left;padding:10px 12px!important;color:var(--text)!important}
.grp-menu button small{display:block;font-weight:400;font-size:12px;color:var(--sub);margin-top:2px}
.grp-menu button:hover{background:#f5f8ff}
.grp-menu button.active{background:var(--main-soft);color:var(--main)!important}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;color:var(--sub);cursor:pointer}
nav button.active{background:var(--main-soft);color:var(--main)}
main{padding:20px 24px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub)}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid var(--main-soft);border-color:var(--main)}
button.btn{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.btn.primary{background:var(--main);border-color:var(--main);color:#fff}
button.btn.danger{color:var(--bad);border-color:var(--bad-line)}
button.btn.sm{padding:4px 10px;font-size:12px}
button.btn:disabled{opacity:.5;cursor:default}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:18px 0 8px}
.muted{color:var(--sub);font-size:12px}
.exam-item{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.exam-item.sel{border-color:var(--main);background:var(--main-soft)}
.exam-item b{display:block}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);background:#fafbfc}
td{padding:6px;border-bottom:1px solid #f0f1f3}
tr.click{cursor:pointer} tr.click:hover td{background:#f8faff}
.pill{display:inline-block;color:#fff;font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;border:1px solid}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.tag.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.qno{display:inline-flex;width:26px;height:24px;align-items:center;justify-content:center;border-radius:5px;border:1px solid var(--line);font-size:12px;color:var(--sub)}
.qno.x{border-color:var(--bad-line);color:var(--bad);background:var(--bad-bg)}
.items-table td input,.items-table td select{padding:4px 6px}
.total{font-weight:700}
.total.bad{color:var(--bad)}
.omr-input{font-family:ui-monospace,Consolas,monospace;font-size:20px;letter-spacing:3px;width:100%}
.omr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:12px}
.omr-cell{border:1px solid var(--line);border-radius:8px;text-align:center;padding:4px 0}
.omr-cell .n{font-size:11px;color:var(--sub)}
.omr-cell .a{font-size:16px;font-weight:700;height:20px}
.omr-cell.o{background:var(--ok-bg);border-color:var(--ok-line)}
.omr-cell.x{background:var(--bad-bg);border-color:var(--bad-line)}
.omr-cell.cur{outline:2px solid var(--main)}
.omr-cell input{width:100%;border:0;background:transparent;text-align:center;font:inherit;font-size:18px;font-weight:700;padding:0 0 2px;color:var(--text);outline:none;caret-color:transparent}
.omr-cell:focus-within{outline:2px solid var(--main)}
.score-big{font-size:28px;font-weight:800}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:110px}
.stat b{display:block;font-size:20px}
.subtabs{display:flex;gap:6px;margin:6px 0 12px}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;font:inherit;cursor:pointer}
.subtabs button.active{background:var(--text);color:#fff;border-color:var(--text)}
.dist{display:flex;gap:4px}
.pick-badge{display:inline-block;background:#fee2e2;color:#b91c1c;font-weight:700;font-size:13px;border-radius:5px;padding:0 6px;line-height:1.6}
.dist span{min-width:38px;text-align:center;font-size:12px;padding:2px 0;border-radius:4px;background:#f3f4f6}
.dist span.c{background:var(--ok-bg);color:var(--ok);font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px;z-index:50}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;width:min(1400px,100%);padding:22px}
.report-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.report-cols{grid-template-columns:1fr}}
.report-cols td,.report-cols th{text-align:center}
.cat-bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:12px 0 18px}
.cat-bar{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bar{height:8px;background:#eef0f3;border-radius:99px;margin-top:6px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.mark-o{color:var(--ok)} .mark-x{color:var(--bad)}
.files li{margin:4px 0}
.stu-row.cur td{background:var(--main-soft);font-weight:700}
.stu-row.done td:nth-child(3){color:var(--ok)}
.cur-name{font-size:22px;font-weight:800}
.done-box{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok);border-radius:10px;padding:12px 14px;margin-top:12px;font-weight:600}
.grid-cls{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.grid-cls td{padding:4px 6px}
table.adm th,table.adm td{text-align:center;white-space:nowrap}
table.adm td:first-child,table.adm th:first-child{text-align:left}
table.adm .gc-n{color:#111827}
table.adm .gc-p{background:#eef4ff;color:#1d4ed8}
.stat.hl{background:#eef4ff;border-color:#1d4ed8}
.stat.hl b{font-size:26px;color:#1d4ed8}
.q-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.q-card summary{cursor:pointer;color:var(--main);font-weight:600;margin-top:6px}
.q-body{margin-top:8px;font-family:"Times New Roman",Pretendard,serif;font-size:14px;line-height:1.6}
.q-body p{margin:2px 0}
.q-tbl{width:auto;margin:4px 0} .q-tbl td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}
.q-pick{background:var(--bad-bg);color:var(--bad);font-weight:700}
.q-ans{background:var(--ok-bg);color:var(--ok);font-weight:700}
.ws-grp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.ws-item{display:flex;gap:6px;align-items:center;padding:3px 0;font-size:13px}
.ws-prev{cursor:pointer;display:inline-flex;gap:6px;align-items:center} .ws-prev:hover b{color:var(--main);text-decoration:underline}
.ws-pv{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 0 8px 22px;background:#fcfcfd;max-height:420px;overflow:auto}
.cat-bar.click{cursor:pointer} .cat-bar.click:hover{border-color:var(--main)}
.hint{background:#f8fafc;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--sub);margin:10px 0}
@media print{
  body *{visibility:hidden}
  .modal,.modal *{visibility:visible}
  .modal-bg{position:absolute;background:none;padding:0}
  .modal{position:absolute;left:0;top:0;width:100%}
  .noprint{display:none!important}
}
</style>
</head>
<body>
<header>
  <h1>모의고사 채점</h1>
  <span id="mode" class="mode"></span>
  <nav>
    <div class="navgrp out" data-grp="out">
      <button class="grp-btn" data-grpbtn="out">분석 리포트<b class="grp-cur"></b> ▾</button>
      <div class="grp-menu">
        <button data-tab="admin" class="active">관리자 분석<small>등급·오답률·담임별 성과</small></button>
        <button data-tab="result">결과·분석<small>시험별 성적·문항·반별 분석</small></button>
        <button data-tab="hist">학생 기록<small>학생별 누적 기록·오답 문제지</small></button>
      </div>
    </div>
    <div class="navgrp in" data-grp="in">
      <button class="grp-btn" data-grpbtn="in">데이터 입력<b class="grp-cur"></b> ▾</button>
      <div class="grp-menu">
        <button data-tab="exam">시험 관리<small>시험 등록·정답·시험지 워드</small></button>
        <button data-tab="roster">학생 명단<small>회차별 명단 올리기</small></button>
        <button data-tab="omr">OMR 입력<small>학생 답안 입력·엑셀 입력</small></button>
      </div>
    </div>
  </nav>
</header>
<main>
  <section id="tab-exam" hidden></section>
  <section id="tab-roster" hidden></section>
  <section id="tab-omr" hidden></section>
  <section id="tab-result" hidden></section>
  <section id="tab-hist" hidden></section>
  <section id="tab-admin"></section>
</main>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
/* ===================== 설정 ===================== */
const SUPABASE_URL = 'https://qprksmuivuknplzugfeg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwcmtzbXVpdnVrbnBsenVnZmVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NzQwMzYsImV4cCI6MjEwNTU1MDAzNn0.lhFr6-1QsqOBbQV80FgM4ROKmP26gDj18s9G_8vvOcY';   // anon public key
const FILE_BUCKET = 'exam-papers';
const BRANCHES = ['남동탄','수원','장안','서수원','운정1','운정2'];

const CATS = ['듣기','대의파악','세부정보','어법·어휘','빈칸추론','간접쓰기','장문독해'];
const CAT_COLORS = {'듣기':'#64748b','대의파악':'#1fa45a','세부정보':'#0f6e8f','어법·어휘':'#d98a0b','빈칸추론':'#7e3fb3','간접쓰기':'#c4700c','장문독해':'#c0262d'};

/* 학평·수능 영어 표준 문항 유형 (45문항) */
const STD_TYPES = [
  ['듣기','목적'],['듣기','의견'],['듣기','관계'],['듣기','그림 불일치'],['듣기','할 일'],
  ['듣기','금액'],['듣기','이유'],['듣기','언급 안 된 것'],['듣기','내용 불일치'],['듣기','도표'],
  ['듣기','짧은 대화 응답'],['듣기','짧은 대화 응답'],['듣기','긴 대화 응답'],['듣기','긴 대화 응답'],['듣기','상황 응답'],
  ['듣기','주제'],['듣기','언급 안 된 것'],
  ['대의파악','글의 목적'],['대의파악','심경 변화'],['대의파악','필자 주장'],['대의파악','함축 의미'],
  ['대의파악','요지'],['대의파악','주제'],['대의파악','제목'],
  ['세부정보','도표'],['세부정보','내용 불일치'],['세부정보','안내문 불일치'],['세부정보','안내문 일치'],
  ['어법·어휘','어법'],['어법·어휘','어휘'],
  ['빈칸추론','빈칸'],['빈칸추론','빈칸'],['빈칸추론','빈칸'],['빈칸추론','빈칸'],
  ['간접쓰기','무관한 문장'],['간접쓰기','글의 순서'],['간접쓰기','글의 순서'],['간접쓰기','문장 삽입'],['간접쓰기','문장 삽입'],
  ['장문독해','요약문'],['장문독해','장문 제목'],['장문독해','장문 어휘'],
  ['장문독해','장문 순서'],['장문독해','장문 지칭'],['장문독해','장문 내용 불일치']
];

/* 이번 시험 (THE PREMIUM 고1 영어) — 시험지·정답표에서 읽은 값 */
const PRESET = {
  name:'THE PREMIUM 고1 영어', grade:'고1', publisher:'대성학력개발연구소',
  answers:'225413145451452131312445453525322144223315554',
  three:[6,13,14,21,30,33,34,37,39,42]
};

/* ===================== 데이터 계층 ===================== */
const sb = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ alert('브라우저 저장에 실패했습니다.'); } }
};
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(16)+Math.random().toString(16).slice(2));
const nowIso = () => new Date().toISOString();

const DB = {
  async exams(){
    if(sb){ const {data,error}=await sb.from('mx_exams').select('*').order('created_at',{ascending:false}); if(error) throw error; return data; }
    return LS.get('mx_exams',[]);
  },
  async saveExam(e){
    if(sb){ const {data,error}=await sb.from('mx_exams').upsert(e).select().single(); if(error) throw error; return data; }
    const all=LS.get('mx_exams',[]); const i=all.findIndex(x=>x.id===e.id);
    if(i>=0) all[i]=e; else all.unshift(e); LS.set('mx_exams',all); return e;
  },
  async deleteExam(id){
    if(sb){
      const fs = await DB.files(id);
      if(fs.length) await sb.storage.from(FILE_BUCKET).remove(fs.map(f=>f.path));
      const {error}=await sb.from('mx_exams').delete().eq('id',id); if(error) throw error; return;
    }
    LS.set('mx_exams',LS.get('mx_exams',[]).filter(x=>x.id!==id));
    LS.set('mx_responses',LS.get('mx_responses',[]).filter(x=>x.exam_id!==id));
  },
  async responsesByMember(code){
    if(sb){ const {data,error}=await sb.from('mx_responses').select('*').eq('member_code',code); if(error) throw error; return data; }
    return LS.get('mx_responses',[]).filter(x=>x.member_code===code);
  },
  async responses(examId){
    if(sb){ const {data,error}=await sb.from('mx_responses').select('*').eq('exam_id',examId); if(error) throw error; return data; }
    return LS.get('mx_responses',[]).filter(x=>x.exam_id===examId);
  },
  async saveResponse(r){
    if(sb){
      let {data,error}=await sb.from('mx_responses').upsert(r).select().single();
      if(error && /teacher/.test(error.message||'') && 'teacher' in r){   // teacher 열을 아직 안 만든 경우: 담임 없이 저장
        if(!window._warnTeacherCol){ window._warnTeacherCol=true; alert('Supabase에 담임 기록 열이 없어 담임 없이 저장해요.\nSQL Editor에서 실행해 주세요:\nalter table mx_responses add column if not exists teacher text;'); }
        const {teacher, ...rest}=r; ({data,error}=await sb.from('mx_responses').upsert(rest).select().single());
      }
      if(error) throw error; return data;
    }
    const all=LS.get('mx_responses',[]); const i=all.findIndex(x=>x.id===r.id);
    if(i>=0) all[i]=r; else all.push(r); LS.set('mx_responses',all); return r;
  },
  async deleteResponse(id){
    if(sb){ const {error}=await sb.from('mx_responses').delete().eq('id',id); if(error) throw error; return; }
    LS.set('mx_responses',LS.get('mx_responses',[]).filter(x=>x.id!==id));
  },
  async students(branch){
    if(sb){ const {data,error}=await sb.from('mx_students').select('*').eq('branch',branch).order('seq').range(0,9999); if(error) throw error; return data; }
    return LS.get('mx_students',[]).filter(x=>x.branch===branch).sort((a,b)=>a.seq-b.seq);
  },
  async replaceStudents(branch, rk, rows){   // 분원 + 회차 단위로 교체
    if(sb){
      const del=await sb.from('mx_students').delete().eq('branch',branch).eq('exam_round',rk);
      if(del.error) throw new Error(/exam_round/.test(del.error.message)?'Supabase에 회차 열이 없어요. SQL Editor에서 실행해 주세요:\nalter table mx_students add column if not exists exam_round text;':del.error.message);
      for(let i=0;i<rows.length;i+=500){ const {error}=await sb.from('mx_students').insert(rows.slice(i,i+500)); if(error) throw error; }
      return;
    }
    LS.set('mx_students',[...LS.get('mx_students',[]).filter(x=>!(x.branch===branch && (x.exam_round||'')===rk)), ...rows.map(r=>({...r,id:uid()}))]);
  },
  async files(examId){
    if(!sb) return [];
    const {data,error}=await sb.from('mx_exam_files').select('*').eq('exam_id',examId).order('created_at'); if(error) throw error; return data;
  },
  async uploadFile(examId,file,idx){
    const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
    const path=`${examId}/${Date.now()}_${idx}.${ext}`;
    const up=await sb.storage.from(FILE_BUCKET).upload(path,file,{contentType:file.type||undefined});
    if(up.error) throw up.error;
    const {error}=await sb.from('mx_exam_files').insert({exam_id:examId,file_name:file.name,path});
    if(error) throw error;
  },
  fileUrl(f){ return sb.storage.from(FILE_BUCKET).getPublicUrl(f.path,{download:f.file_name}).data.publicUrl; },
  async deleteFile(f){
    await sb.storage.from(FILE_BUCKET).remove([f.path]);
    const {error}=await sb.from('mx_exam_files').delete().eq('id',f.id); if(error) throw error;
  }
};

const pct = (a,b) => b ? Math.round(a/b*100) : 0;

/* 문항 하나 정답 여부. 본사 정오표로 가져온 시험은 답 대신 'o'(정답)/'x'(오답)로 저장됨 */
function isOk(ch, it){
  if(ch==='o') return true;
  if(ch===undefined || ch==='x') return false;
  return +it.answer>0 && +ch===+it.answer;
}
const oxOnly = ex => ex.items.every(i=>!+i.answer);   // 정답 번호 없이 정오(O/X)만 있는 시험
function gradeAnswers(ex, answers){
  let score=0, correct=0;
  ex.items.forEach((it,i)=>{ if(isOk(answers[i],it)){ score+=+it.points; correct++; } });
  return {score,correct};
}
function makeItems(n, answers='', three=[], useStd=false){
  return Array.from({length:n},(_,i)=>{
    const t = useStd && n===45 ? STD_TYPES[i] : ['',''];
    return {no:i+1, answer:+answers[i]||0, points:three.includes(i+1)?3:2, cat:t[0], sub:t[1]};
  });
}

/* 학년 표기 통일: '고1', '1학년', '1', '고등1' → '고1' */
function normGrade(s){
  s=String(s??'').replace(/\s/g,'');
  let m=s.match(/(고|중|초)[^0-9]*([1-6])/); if(m) return m[1]+m[2];
  m=s.match(/^([1-3])(학년)?$/); if(m) return '고'+m[1];
  return s;
}
/* 응답 ↔ 명단 학생 매칭: 둘 다 회원코드가 있으면 코드로, 아니면 분원+반+이름으로 */
function sameStudent(r,s){
  if(r.member_code && s.member_code) return r.member_code===s.member_code;
  return r.branch===(s.branch||prefs.branch) && r.class_name===s.class_name && r.student_name===s.student_name;
}
const koCmp=(a,b)=>String(a??'').localeCompare(String(b??''),'ko',{numeric:true});
/* 명단은 회차별로 저장 (exam_round = "2026-3"). STU[분원] = 그 분원의 모든 회차 명단 */
async function loadStudents(branch, force){
  if(force || !STU[branch]){
    try{ STU[branch]=await DB.students(branch); }catch(e){ alert('학생 명단을 불러오지 못했습니다: '+e.message); STU[branch]=[]; }
  }
  return STU[branch];
}
const rosterRounds = branch => [...new Set((STU[branch]||[]).map(s=>s.exam_round||''))].sort(koCmp).reverse();   // 최신 먼저
// 그 회차 명단 → 없으면 그 이전 가장 가까운 회차 → 그래도 없으면 최신 회차
function rosterSync(branch, rk){
  const all=STU[branch]||[]; if(!all.length) return [];
  let l=all.filter(s=>(s.exam_round||'')===(rk||''));
  if(!l.length){ const rs=rosterRounds(branch); const near=rs.find(x=>x&&rk&&x<=rk) ?? rs[0]; l=all.filter(s=>(s.exam_round||'')===near); }
  return l;
}
async function getRoster(branch, rk, force){ await loadStudents(branch,force); return rosterSync(branch, rk); }
async function getStudents(branch, force){ await loadStudents(branch,force); return rosterSync(branch, rosterRounds(branch)[0]); }   // 최신 회차 명단

/* 붙여넣기 형식 해석: '키: 값' 줄 + '번호 대분류 세부유형' 줄 */
function parseExamText(t){
  t=String(t||'').replace(/[①②③④⑤]/g,c=>'①②③④⑤'.indexOf(c)+1);
  const out={types:{}};
  t.split(/\r?\n/).forEach(raw=>{
    const line=raw.trim(); if(!line) return;
    let m=line.match(/^(시험\s*명|학년|시행\s*일|문항\s*수|정답|3점(?:\s*문항)?|유형)\s*[:：]\s*(.*)$/);
    if(m){
      const k=m[1].replace(/\s/g,''), v=m[2].trim();
      if(k==='시험명') out.name=v;
      else if(k==='학년') out.grade=v;
      else if(k==='시행일'){ const d=v.match(/(\d{4})\D+(\d{1,2})/); out.date=d?`${d[1]}-${d[2].padStart(2,'0')}-01`:''; }
      else if(k==='문항수') out.q=+v.replace(/\D/g,'')||0;
      else if(k==='정답') out.answers=v.replace(/[^0-5]/g,'');
      else if(k.startsWith('3점')) out.three=v.split(/[^0-9]+/).filter(Boolean).map(Number);
      return;
    }
    m=line.match(/^(\d{1,3})\s*[.|,\t ]?\s*(듣기|대의\s*파악|세부\s*정보|어법\s*[·ㆍ.\/]?\s*어휘|빈칸\s*추론|간접\s*쓰기|장문\s*독해)\s*[|,\t\/:-]*\s*(.*)$/);
    if(m){
      let cat=m[2].replace(/\s/g,''); if(/^어법/.test(cat)) cat='어법·어휘';
      out.types[+m[1]]={cat, sub:m[3].trim()};
    }
  });
  return out;
}

}

    const n=d.q || (d.answers&&d.answers.length) || e.q_count;

/* ===================== 본사 리포트(달성율 현황 HTML) 가져오기 ===================== */
let importMode=false, IMP=null;
const STD_THREE=[6,13,14,21,30,33,34,37,39,42];

// 리포트 HTML 안의 `const 이름 = {...}` 데이터를 꺼냄 (문자열 안 괄호는 무시)
function extractConst(src,name){
  const m=new RegExp('const\\s+'+name+'\\s*=\\s*').exec(src); if(!m) return undefined;
  let i=m.index+m[0].length; const open=src[i];
  if(open==='"'){ const e=src.indexOf('"',i+1); return JSON.parse(src.slice(i,e+1)); }
  if(open!=='[' && open!=='{') return undefined;
  let depth=0, inStr=false, j=i;
  for(; j<src.length; j++){
    const c=src[j];
    if(inStr){ if(c==='\\') j++; else if(c==='"') inStr=false; continue; }
    if(c==='"') inStr=true;
    else if(c==='['||c==='{') depth++;
    else if(c===']'||c==='}'){ depth--; if(!depth) break; }
  }
  try{ return JSON.parse(src.slice(i,j+1)); }catch(e){ return undefined; }
}

// 본사 점수(듣기·독해)로 3점 문항 추정: 듣기 17문항 중 3개, 독해 28문항 중 7개
function combos(n,k,cb){ const a=[]; (function rec(s){ if(a.length===k){ cb(a); return; } for(let i=s;i<=n-(k-a.length);i++){ a.push(i); rec(i+1); a.pop(); } })(0); }
function solvePart(rows, from, len, k, key){
  const need=rows.map(r=>r[key]-2*r.answers.slice(from,from+len).filter(Boolean).length);
  const out=[];
  combos(len,k,c=>{ if(out.length>5000) return;
    for(let s=0;s<rows.length;s++){ let n=0; for(const q of c) if(rows[s].answers[from+q]) n++; if(n!==need[s]) return; }
    out.push(c.map(q=>q+from+1));
  });
  return out;
}
function inferThree(rows, prior){
  const ok=rows.filter(r=>Number.isFinite(r.lc)&&Number.isFinite(r.rc));
  if(!ok.length) return {three:prior, unique:false, found:false};
  const L=solvePart(ok,0,17,3,'lc'), R=solvePart(ok,17,28,7,'rc');
  if(!L.length||!R.length) return {three:prior, unique:false, found:false};
  const best=list=>list.reduce((b,c)=>{ const sc=c.filter(q=>prior.includes(q)).length; return sc>b.sc?{c,sc}:b; },{c:list[0],sc:-1}).c;
  return {three:[...best(L),...best(R)].sort((a,b)=>a-b), unique:L.length===1&&R.length===1, found:true};
}

function parseReport(src){
  const J=extractConst(src,'JEONGO_DATA');
  if(!J || typeof J!=='object') throw new Error('이 파일에서 학생별 정오표(JEONGO_DATA)를 찾지 못했어요. 본사 달성율 현황 HTML이 맞는지 확인해 주세요.');
  const S=extractConst(src,'STUDENTS')||[];
  const P=extractConst(src,'PERIOD_INFO')||{};
  const branch=matchBranch(extractConst(src,'BRANCH_NAME')||prefs.branch);
  const cats={};
  const tg=src.match(/const\s+TYPE_GROUPS\s*=\s*\[([\s\S]*?)\];/);
  if(tg) for(const m of tg[1].matchAll(/name:'([^']+)'[^}]*?qs:\[([\d,\s]+)\]/g)) m[2].split(',').map(Number).forEach(q=>cats[q]=m[1]);
  const month=((P.label||'').match(/(\d{1,2})월/)||[])[1];
  const grades={};
  Object.entries(J).forEach(([g,list])=>{
    if(!Array.isArray(list)||!list.length) return;
    const st=S.filter(x=>x.t===g), courses=[];
    st.forEach(x=>{ if(!courses.includes(x.c)) courses.push(x.c); });
    const rows=list.map(x=>{
      const course=courses[(+x.cls||0)-1]||'';
      const sc=st.find(y=>y.c===course && String(y.num)===String(x.num));
      return {name:String(x.name||'').trim(), num:String(x.num||''), cls:String(x.cls||''), course,
        answers:(x.answers||[]).map(Boolean), total:sc?+sc.total:NaN, lc:sc?+sc.lc:NaN, rc:sc?+sc.rc:NaN, match:null, note:''};
    });
    grades[g]={rows, missing:Math.max(0, st.length-rows.length), three:[], unique:false, found:false};
  });
  if(!Object.keys(grades).length) throw new Error('정오표에 학생 데이터가 없어요.');
  return {branch, year:P.year||'', label:P.label||'', month:month?month.padStart(2,'0'):'', cats, grades};
}

async function prepareImport(src){
  const d=parseReport(src);
  // 3점 추정: 정답이 하나로 정해지는 학년을 먼저 풀고, 그 결과를 다른 학년의 기준으로 사용
  const order=Object.keys(d.grades).sort((a,b)=>d.grades[b].rows.length-d.grades[a].rows.length);
  let prior=STD_THREE;
  for(const g of order){ const r=inferThree(d.grades[g].rows, prior); Object.assign(d.grades[g],r); if(r.unique) prior=r.three; }
  // 학생 명단과 이름으로 연결 → 회원코드
  const roster=await getRoster(d.branch, d.year&&d.month?`${d.year}-${Math.ceil(+d.month/3)}`:'', true);
  Object.entries(d.grades).forEach(([g,G])=>G.rows.forEach(r=>{
    let c=roster.filter(s=>s.student_name===r.name);
    if(c.length>1) c=c.filter(s=>!s.grade || normGrade(s.grade)===g);
    if(c.length>1){ const byNo=c.filter(s=>String(s.student_no||'')===r.num); if(byNo.length===1) c=byNo; }   // 동명이인은 번호로 구분
    if(c.length===1) r.match=c[0];
    else { r.note = c.length ? '동명이인' : (roster.length ? '명단에 없음' : '');
      // 동명이인이 같은 반·같은 담임이면 반·담임만 가져옴 (회원코드는 구분 불가라 비움)
      if(c.length>1 && c.every(s=>s.class_name===c[0].class_name && s.teacher===c[0].teacher)) r.partial={class_name:c[0].class_name, teacher:c[0].teacher||''}; }
  }));
  d.rosterSize=roster.length;
  return d;
}

const impName=(d,g)=>`정상어학원 ${d.year}년 ${d.label} ${g}`.replace(/\s+/g,' ').trim();
function impScore(G,r){ return r.answers.reduce((s,a,i)=>s+(a?(G.three.includes(i+1)?3:2):0),0); }

        <div class="row" style="margin-top:8px">
          <label class="f" style="flex:1;min-width:260px">3점 문항 ${G.unique?'<span class="mark-o">(본사 점수로 확인됨)</span>':G.found?'<span class="mark-x">(추정 — 시험지로 확인해 주세요)</span>':'<span class="mark-x">(추정 불가 — 직접 입력)</span>'}

/* ===================== 학생 명단 ===================== */
let rosterDraft=null;   // {header, rows, map:{name,cls,grade,branch}}
function matchBranch(v){
  v=String(v??'').trim(); if(BRANCHES.includes(v)) return v;
  const hit=[...BRANCHES].sort((a,b)=>b.length-a.length).find(b=>v.includes(b));  // '서수원'이 '수원'보다 먼저
  return hit||v;
}
async function readSheet(file){
  let wb;
  if(/\.csv$/i.test(file.name)){
    const buf=await file.arrayBuffer(); let text;
    try{ text=new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ text=new TextDecoder('euc-kr').decode(buf); }
    wb=XLSX.read(text.replace(/^﻿/,''),{type:'string'});
  } else wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});
  let hi=aoa.findIndex(r=>r.some(c=>/이름|성명|학생명/.test(String(c)))); if(hi<0) hi=0;
  const header=(aoa[hi]||[]).map(c=>String(c).trim());
  const rows=aoa.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!==''));
  const find=re=>header.findIndex(h=>re.test(h));
  const g1=find(/응시|시험/);
  const code=find(/회원\s*코드|회원\s*번호|코드|code|^id$/i);
  const no=header.findIndex((h,i)=>i!==code && /번호|연락처|전화|휴대/.test(h));
  return {header, rows, map:{code, name:find(/이름|성명|학생명/), cls:find(/반|클래스|class/i), no, grade:g1>=0?g1:find(/학년|레벨/), branch:find(/분원|지점|캠퍼스/), teacher:find(/담임|딤임|담당|선생|강사|teacher/i)}};
}
function draftRows(d){
  const cell=(r,i)=>i>=0?String(r[i]??'').trim():'';
  return d.rows.map(r=>({
    branch: d.map.branch>=0 ? matchBranch(cell(r,d.map.branch)) : prefs.branch,
    class_name: cell(r,d.map.cls), student_name: cell(r,d.map.name),
    grade: d.map.grade>=0 ? normGrade(cell(r,d.map.grade)) : '',
    member_code: cell(r,d.map.code), student_no: cell(r,d.map.no),
    ...(d.map.teacher>=0 ? {teacher: cell(r,d.map.teacher)} : {})   // 담임 열이 있을 때만 저장
  })).filter(x=>x.student_name);
}
let rosterRk=null;
function roundChoices(){   // 올해 기준 앞뒤 회차 + 시험·명단에 있는 회차
  const y=new Date().getFullYear(), set=new Set(allRounds().filter(Boolean));
  for(let yy=y-2; yy<=y+1; yy++) for(let r=1;r<=4;r++) set.add(`${yy}-${r}`);
  BRANCHES.forEach(b=>rosterRounds(b).forEach(k=>k&&set.add(k)));
  return [...set].sort(koCmp).reverse();
}
async function renderRosterTab(){

  if(!rosterRk){ const now=new Date(); rosterRk=rosterRounds(br).find(Boolean) || `${now.getFullYear()}-${Math.ceil((now.getMonth()+1)/3)}`; }

  const byCls={}; list.forEach(s=>(byCls[s.class_name]=byCls[s.class_name]||[]).push(s));
  $('#tab-roster').innerHTML=`
  <div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    <div class="card">
      <h2>명단 올리기</h2>
      <p class="muted">명단은 <b>회차별로</b> 저장돼요. 회차를 고르고 그 시기 명단(엑셀/CSV)을 올리세요. 이름·반·응시 학년·담임 열을 자동으로 찾고, 분원 열이 없으면 고른 분원으로 들어갑니다.<br>
        올리면 <b>그 분원·그 회차</b> 명단만 새 명단으로 교체돼요. 파일에 적힌 순서가 OMR 입력 순서가 됩니다.<br>
        답안을 넣을 때는 그 시험 회차의 명단에서 반·담임을 가져와요. 그 회차 명단이 없으면 가장 가까운 이전 회차 명단을 써요.</p>
      <div class="row"><label class="f">회차<select id="rRound">${roundChoices().map(k=>`<option value="${k}" ${k===rosterRk?'selected':''}>${roundLabel(k)}${saved.includes(k)?' ✓':''}</option>`).join('')}</select></label>
        <label class="f">분원<select id="rBranch">${BRANCHES.map(b=>`<option ${b===br?'selected':''}>${b}</option>`).join('')}</select></label>
        <label class="f">파일<input type="file" id="rFile" accept=".xlsx,.xls,.csv"></label></div>
      <div id="rDraft"></div>
    </div>
    <div class="card">
      <h2>${esc(br)} · ${roundLabel(rosterRk)} 명단 (${list.length}명)</h2>
      <p class="muted" style="margin-top:-6px">명단이 있는 회차: ${saved.map(roundLabel).join(', ')||'없음'}</p>
      ${list.length?`<table><thead><tr><th>반</th><th>담임</th><th>인원</th><th>응시 학년</th><th>학생</th></tr></thead><tbody>
        ${Object.keys(byCls).sort(koCmp).map(c=>{ const ss=byCls[c], gc={}; ss.forEach(s=>gc[s.grade||'-']=(gc[s.grade||'-']||0)+1);
          return `<tr><td><b>${esc(c||'-')}</b></td><td>${esc([...new Set(ss.map(s=>s.teacher).filter(Boolean))].join(', ')||'-')}</td><td>${ss.length}</td><td>${Object.entries(gc).map(([g,n])=>esc(g)+' '+n).join(' · ')}</td><td class="muted">${ss.map(s=>esc(s.student_name)).join(', ')}</td></tr>`; }).join('')}
      </tbody></table>`:'<p class="muted">아직 명단이 없습니다.</p>'}
    </div>
  </div>
`;
  $('#rBranch').onchange=e=>{ prefs.branch=e.target.value; savePrefs(); renderRosterTab(); };
  $('#rRound').onchange=e=>{ rosterRk=e.target.value; renderRosterTab(); };
  $('#rFile').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    if(!window.XLSX) return alert('엑셀 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
    try{ rosterDraft=await readSheet(f); renderDraft(); }catch(err){ alert('파일을 읽지 못했습니다: '+err.message); }
  };
  if(rosterDraft) renderDraft();
}
function renderDraft(){
  const d=rosterDraft, box=$('#rDraft'); if(!box) return;
  const sel=(k,label,optional)=>`<label class="f">${label}<select data-map="${k}">${optional?'<option value="-1">(없음)</option>':''}${d.header.map((h,i)=>`<option value="${i}" ${d.map[k]===i?'selected':''}>${esc(h||('열 '+(i+1)))}</option>`).join('')}</select></label>`;
  const rows=draftRows(d), byBr={}; rows.forEach(r=>byBr[r.branch]=(byBr[r.branch]||0)+1);
  const badBr=Object.keys(byBr).filter(b=>!BRANCHES.includes(b));
  const ok=d.map.name>=0 && d.map.cls>=0;
  box.innerHTML=`
    <h3>열 확인</h3>
    <div class="row">${sel('code','회원코드',true)}${sel('name','이름')}${sel('cls','반')}${sel('no','번호',true)}${sel('grade','응시 학년',true)}${sel('teacher','담임',true)}${sel('branch','분원',true)}</div>
    ${d.map.code<0?'<p class="muted">회원코드 열이 없으면 반+이름으로 학생을 구분하고, 학생 기록(누적 추적)은 쓸 수 없어요.</p>':''}
    ${ok?'':'<p class="total bad">이름과 반 열을 지정해 주세요.</p>'}
    <h3>미리보기 (${rows.length}명 · ${Object.entries(byBr).map(([b,n])=>esc(b)+' '+n+'명').join(', ')})</h3>
    ${badBr.length?`<p class="total bad">등록되지 않은 분원 이름: ${badBr.map(esc).join(', ')}</p>`:''}
    <div style="max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table><thead><tr><th>분원</th><th>회원코드</th><th>반</th><th>이름</th><th>번호</th><th>응시</th><th>담임</th></tr></thead><tbody>
      ${rows.slice(0,50).map(r=>`<tr><td>${esc(r.branch)}</td><td>${esc(r.member_code||'-')}</td><td>${esc(r.class_name)}</td><td>${esc(r.student_name)}</td><td>${esc(r.student_no||'-')}</td><td>${esc(r.grade||'-')}</td><td>${esc(r.teacher||'-')}</td></tr>`).join('')}
      ${rows.length>50?`<tr><td colspan="7" class="muted">… 외 ${rows.length-50}명</td></tr>`:''}
    </tbody></table></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="rSave" ${ok&&rows.length?'':'disabled'}>명단 저장</button><button class="btn" id="rCancel">취소</button></div>`;
  box.querySelectorAll('[data-map]').forEach(s=>s.onchange=()=>{ d.map[s.dataset.map]=+s.value; renderDraft(); });
  $('#rCancel').onclick=()=>{ rosterDraft=null; renderRosterTab(); };
  $('#rSave').onclick=async()=>{
    const groups={};
    rows.forEach(r=>{ const g=groups[r.branch]=groups[r.branch]||new Map(); const k=r.member_code||(r.class_name+'\u0000'+r.student_name); if(!g.has(k)) g.set(k,r); });
    const summary=Object.entries(groups).map(([b,m])=>`${b} ${m.size}명`).join(', ');
    const dupCnt=rows.length-Object.values(groups).reduce((s,m)=>s+m.size,0);
    if(!confirm(`${roundLabel(rosterRk)} 명단으로 저장: ${summary}\n해당 분원의 이 회차 명단을 이 명단으로 교체합니다.${dupCnt?`\n(같은 반·같은 이름 ${dupCnt}건은 하나로 합칩니다)`:''}`)) return;
    try{
      for(const [b,m] of Object.entries(groups)){
        await DB.replaceStudents(b, rosterRk, [...m.values()].map((r,i)=>({...r,exam_round:rosterRk,seq:i+1})));
        delete STU[b];
      }
      rosterDraft=null; renderRosterTab(); alert('명단을 저장했습니다.');
    }catch(err){ alert('저장 실패: '+err.message); }
  };
}

/* ===================== 2. OMR 입력 ===================== */
async function renderOmrTab(){
  if(!EXAMS.length){ $('#tab-omr').innerHTML='<div class="card"><p class="muted">먼저 시험을 등록하세요.</p></div>'; return; }
  if(!omrExamId || !examById(omrExamId)) omrExamId=EXAMS[0].id;
  const ex=examById(omrExamId);
  const rs=await getResponses(ex.id);

  // 명단: 이 분원 학생 중 시험 학년과 응시 학년이 같은 학생 (응시 학년이 비어 있으면 포함)
  const eg=normGrade(ex.grade);
  const branchAll=await getRoster(prefs.branch, roundKey(ex));
  const roster=branchAll.filter(s=>!eg || !s.grade || normGrade(s.grade)===eg);
  const classes=[...new Set(roster.map(s=>s.class_name))].sort(koCmp);
  let cls=prefs.omrClass;
  if(cls!=='__manual' && !classes.includes(cls)) cls = classes.length ? classes[0] : '__manual';
  const manual = cls==='__manual';
  const respOf = s => rs.find(r=>sameStudent(r,s));

  let stuList=[], cur=null, curIdx=-1;
  if(!manual){
    stuList=roster.filter(s=>s.class_name===cls);
    cur=stuList.find(s=>stuKey(s)===omrCur) || stuList.find(s=>!respOf(s)) || stuList[0];
    curIdx=stuList.indexOf(cur); omrCur=cur?stuKey(cur):null;
    editingResp = cur ? (respOf(cur)||null) : null;
  }
  const er=editingResp;
  const doneCnt=stuList.filter(respOf).length;
  const allDone=!manual && stuList.length>0 && doneCnt===stuList.length;
  const list = manual
    ? rs.filter(r=>r.branch===prefs.branch).sort((a,b)=>koCmp(a.class_name,b.class_name)||koCmp(a.student_name,b.student_name))
    : [];
  const rosterHint = manual
    ? (branchAll.length && !roster.length ? `<div class="hint">${esc(prefs.branch)} 명단에 ${esc(eg)} 응시 학생이 없어요. 명단의 응시 학년이나 시험의 학년을 확인하세요.</div>`
       : !branchAll.length ? `<div class="hint">학생 명단 탭에서 명단을 올리면, 반을 고르고 학생별로 이어서 입력할 수 있어요.</div>` : '')
    : '';

  $('#tab-omr').innerHTML=`
  <div class="grid2" style="grid-template-columns:1fr 340px">
    <div class="card">
      <div class="row">
        ${examPicker('omrP',ex.id)}
        <label class="f">분원<select id="omrBranch">${BRANCHES.map(b=>`<option ${b===prefs.branch?'selected':''}>${b}</option>`).join('')}</select></label>
        ${classes.length?`<label class="f">반<select id="omrClsSel">${classes.map(c=>`<option value="${esc(c)}" ${c===cls?'selected':''}>${esc(c)}</option>`).join('')}<option value="__manual" ${manual?'selected':''}>직접 입력</option></select></label>`:''}
        ${manual?`<label class="f">반<input id="omrClass" value="${esc(er?er.class_name:(prefs.lastClass||''))}" style="width:110px"></label>
        <label class="f">이름<input id="omrName" value="${esc(er?er.student_name:'')}" style="width:130px"></label>
        <label class="f">회원코드 (선택)<input id="omrCode" value="${esc(er?er.member_code||'':'')}" style="width:120px"></label>`
        :`<input type="hidden" id="omrClass" value="${esc(cls)}"><input type="hidden" id="omrName" value="${esc(cur?cur.student_name:'')}"><input type="hidden" id="omrCode" value="${esc(cur?cur.member_code||'':'')}">`}
      </div>
      ${rosterHint}
      ${!manual&&cur?`<div class="row" style="margin-top:14px;justify-content:space-between">
        <div><span class="cur-name">${esc(cur.student_name)}</span>
          <span class="muted"> ${curIdx+1}/${stuList.length}번째 · ${er?'입력됨 (다시 저장하면 수정)':'미입력'}</span></div>
        <button class="btn sm" id="omrSkip">건너뛰기 (결시)</button></div>`:''}
      <div class="muted" style="margin-top:12px">답안 (${ex.q_count}칸 · 숫자 1~5, 무응답은 0) — 치면 다음 칸으로 넘어가요. 틀린 칸은 눌러서 고치고, Enter로 저장${manual?'':' 후 다음 학생'}</div>
      <input type="hidden" id="omrAns" value="${er?esc(er.answers):''}">
      <div class="row" style="margin-top:10px;justify-content:space-between">
        <div><span class="score-big" id="omrScore">0</span><span class="muted"> 점 · <span id="omrCnt">0</span>/${ex.q_count} 입력</span></div>
        <div class="row">${manual&&er?'<span class="muted">수정 중: '+esc(er.student_name)+'</span>':''}
          <button class="btn" id="omrXl">엑셀로 한 번에 입력</button>${manual?'<button class="btn" id="omrReset">비우기</button>':''}<button class="btn primary" id="omrSave">저장</button></div>
      </div>
      ${allDone?`<div class="done-box">${esc(cls)} ${stuList.length}명 입력을 모두 마쳤어요. 학생을 눌러 수정하거나 다른 반을 고르세요.</div>`:''}
      <div class="omr-grid" id="omrGrid">${ex.items.map((it,i)=>`<div class="omr-cell" title="${esc(it.cat+' '+it.sub)}"><div class="n">${it.no}</div><input data-q="${i}" inputmode="numeric" autocomplete="off" aria-label="${it.no}번"></div>`).join('')}</div>
    </div>
    <div class="card">
      ${manual?`
      <h2>${esc(prefs.branch)} 입력 현황 (${list.length}명)</h2>
      <div style="max-height:640px;overflow:auto">
      <table><thead><tr><th>반</th><th>이름</th><th>점수</th><th></th></tr></thead><tbody>
      ${list.map(r=>`<tr class="click" data-edit="${r.id}"><td>${esc(r.class_name)}</td><td>${esc(r.student_name)}</td><td><b>${r.score}</b>${r.answers.length<ex.q_count?' <span class="muted">('+r.answers.length+')</span>':''}</td>
        <td><button class="btn sm danger" data-rdel="${r.id}">삭제</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">아직 없습니다.</td></tr>'}
      </tbody></table></div>`
      :`
      <h2>${esc(cls)} (${doneCnt}/${stuList.length} 입력)</h2>
      <div style="max-height:640px;overflow:auto">
      <table><thead><tr><th>#</th><th>이름</th><th>점수</th><th></th></tr></thead><tbody>
      ${stuList.map((s,i)=>{ const r=respOf(s); return `<tr class="click stu-row ${s===cur?'cur':''} ${r?'done':''}" data-stu="${esc(stuKey(s))}"><td>${i+1}</td><td>${esc(s.student_name)}</td>
        <td>${r?`<b>${r.score}</b>${r.answers.length<ex.q_count?' <span class="muted">('+r.answers.length+')</span>':''}`:'<span class="muted">미입력</span>'}</td>
        <td>${r?`<button class="btn sm danger" data-rdel="${r.id}">삭제</button>`:''}</td></tr>`; }).join('')}
      </tbody></table></div>`}
    </div>
  </div>`;

  bindExamPicker('omrP', ex.id, id=>{ omrExamId=id; editingResp=null; omrCur=null; renderOmrTab(); });
  $('#omrBranch').onchange=e=>{ prefs.branch=e.target.value; savePrefs(); editingResp=null; omrCur=null; renderOmrTab(); };
  const cs=$('#omrClsSel'); if(cs) cs.onchange=e=>{ prefs.omrClass=e.target.value; savePrefs(); editingResp=null; omrCur=null; renderOmrTab(); };
  const ans=$('#omrAns');
  const cells=[...document.querySelectorAll('#omrGrid input')];
  // 칸 → 숨은 답안 문자열 (마지막 입력 칸까지, 중간 빈칸은 0=무응답)
  const update=()=>{
    let last=-1; cells.forEach((c,i)=>{ if(c.value) last=i; });
    const v=cells.slice(0,last+1).map(c=>c.value||'0').join('');
    ans.value=v; ans.dataset.gaps=cells.slice(0,last+1).map((c,i)=>c.value?'':i+1).filter(Boolean).join(',');
    const g=gradeAnswers(ex,v); $('#omrScore').textContent=g.score; $('#omrCnt').textContent=cells.filter(c=>c.value).length;
    cells.forEach((c,i)=>{ c.parentNode.classList.toggle('o',!!c.value&&isOk(c.value,ex.items[i])); c.parentNode.classList.toggle('x',!!c.value&&!isOk(c.value,ex.items[i])); });
  };
  const go=i=>{ const c=cells[Math.max(0,Math.min(cells.length-1,i))]; c.focus(); c.select(); };
  const init=(ans.value||'').replace(/[^0-5ox]/g,'');
  cells.forEach((c,i)=>{ const ch=init[i]; c.value = ch===undefined?'':ch==='o'?'':ch==='x'?'':ch; });
  cells.forEach((c,i)=>{
    c.oninput=()=>{
      const d=c.value.replace(/[^0-5]/g,'');
      if(d.length<=1){ c.value=d; update(); if(d) go(i+1); return; }
      [...d].forEach((ch,k)=>{ if(cells[i+k]) cells[i+k].value=ch; });   // 여러 개 붙여넣기 → 이어서 채움
      update(); go(i+d.length);
    };
    c.onkeydown=e=>{
      if(e.key==='Enter'){ e.preventDefault(); saveOmr(ex,onSaved); }
      else if(e.key==='Backspace' && !c.value){ e.preventDefault(); if(i>0){ cells[i-1].value=''; update(); go(i-1); } }
      else if(e.key==='ArrowLeft'){ e.preventDefault(); go(i-1); }
      else if(e.key==='ArrowRight'){ e.preventDefault(); go(i+1); }
      else if(/^[0-5]$/.test(e.key) && c.value){ e.preventDefault(); c.value=e.key; update(); go(i+1); }   // 채워진 칸은 덮어쓰기
    };
    c.onfocus=()=>c.select();
  });
  ans.focus=()=>{ const f=cells.findIndex(c=>!c.value); go(f<0?cells.length-1:f); };
  update();

  // 명단 모드: 저장 후 같은 반에서 아직 입력하지 않은 다음 학생으로
  const nextStudent=(fromIdx, onlyUndone)=>{
    if(!stuList.length) return null;
    const rs2=resCache[ex.id]||[];
    const done=s=>rs2.some(r=>sameStudent(r,s));
    const order=[...stuList.slice(fromIdx+1),...stuList.slice(0,fromIdx+1)];
    return (onlyUndone ? order.find(s=>!done(s)) : null) || stuList[Math.min(fromIdx+1,stuList.length-1)];
  };
  const onSaved = manual ? null : ()=>{ const n=nextStudent(curIdx,true); omrCur=n?stuKey(n):omrCur; };

  if(manual){
    $('#omrName').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); ans.focus(); } };
    $('#omrClass').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#omrName').focus(); } };
    $('#omrReset').onclick=()=>{ editingResp=null; renderOmrTab(); };
  }
  $('#omrSave').onclick=()=>saveOmr(ex,onSaved);
  $('#omrXl').onclick=()=>openAnswerImport(ex);
  const sk=$('#omrSkip'); if(sk) sk.onclick=()=>{ const n=nextStudent(curIdx,false); omrCur=n?stuKey(n):omrCur; renderOmrTab(); };

  document.querySelectorAll('[data-edit]').forEach(tr=>tr.onclick=e=>{
    if(e.target.dataset.rdel) return;
    editingResp=rs.find(r=>r.id===tr.dataset.edit); renderOmrTab(); $('#omrAns').focus();
  });
  document.querySelectorAll('[data-stu]').forEach(tr=>tr.onclick=e=>{
    if(e.target.dataset.rdel) return;
    omrCur=tr.dataset.stu; renderOmrTab();
  });
  document.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation(); const r=rs.find(x=>x.id===b.dataset.rdel);
    if(!confirm(`${r.student_name} 학생의 답안을 삭제할까요?`)) return;
    try{ await DB.deleteResponse(r.id); await getResponses(ex.id,true); if(editingResp&&editingResp.id===r.id) editingResp=null; renderOmrTab(); }
    catch(err){ alert('삭제 실패: '+err.message); }
  });
  if(manual) (er? ans : $('#omrName')).focus();
  else ans.focus();
}

let omrSaving=false;
async function saveOmr(ex, onSaved){
  if(omrSaving) return;
  const code=($('#omrCode')?$('#omrCode').value.trim():'');
  const name=$('#omrName').value.trim(), cls=$('#omrClass').value.trim(), answers=$('#omrAns').value.replace(/[^0-5]/g,'');
  if(!name){ alert('이름을 입력하세요.'); $('#omrName').focus(); return; }
  if(!answers.length){ alert('답안을 입력하세요.'); return; }
  const gaps=$('#omrAns').dataset.gaps||'';
  if(gaps && !confirm(`${gaps}번 칸이 비어 있어요. 무응답(0)으로 저장할까요?`)) return;
  if(answers.length<ex.q_count && !confirm(`${answers.length}문항만 입력됐습니다. 나머지는 무응답으로 저장할까요?`)) return;
  const rs=await getResponses(ex.id);
  let id = editingResp ? editingResp.id : null;
  const dup = rs.find(r=>r.id!==id && (code ? r.member_code===code : (!r.member_code && r.branch===prefs.branch && r.student_name===name && r.class_name===cls)));
  if(dup){
    if(!confirm(`${prefs.branch} ${cls} ${name} 학생 답안이 이미 있습니다. 덮어쓸까요?`)) return;
    id=dup.id;
  }
  const prevRec=id?rs.find(r=>r.id===id):null;
  const rosterNow=await getRoster(prefs.branch, roundKey(ex));
  const teacher=(prevRec&&prevRec.teacher) || ((rosterOf({member_code:code,student_name:name,class_name:cls},rosterNow)||{}).teacher) || '';   // 입력 시점 담임 기록
  const rec={id:id||uid(), exam_id:ex.id, branch:prefs.branch, class_name:cls, student_name:name, member_code:code||null, teacher, answers, score:gradeAnswers(ex,answers).score};
  if(!sb) rec.created_at=nowIso();
  omrSaving=true;
  try{
    await DB.saveResponse(rec); await getResponses(ex.id,true);
    if(onSaved) onSaved();
    prefs.lastClass=cls; savePrefs(); editingResp=null; renderOmrTab();
  }catch(err){ alert('저장 실패: '+err.message); }
  finally{ omrSaving=false; }
}

/* ===================== 3. 결과·분석 ===================== */
let resSub='students', resBranch='전체', resCmp={}, resCls='', resClsTh=40;   // resCmp[시험id] = 비교할 시험 id ('' = 비교 안 함)
const examDateKey = e => (e.exam_date||String(e.created_at||'').slice(0,10)||'');
function cmpCandidates(ex){ const g=normGrade(ex.grade); return EXAMS.filter(e=>e.id!==ex.id && (!g || normGrade(e.grade)===g)).sort((a,b)=>koCmp(examDateKey(b),examDateKey(a))); }
function defaultCmp(ex){ const k=examDateKey(ex); const c=cmpCandidates(ex).find(e=>examDateKey(e)<k); return c?c.id:''; }
const sameResp = (a,b) => (a.member_code && b.member_code) ? a.member_code===b.member_code : (a.branch===b.branch && a.student_name===b.student_name);
// 문항 클릭 → 시험지 문제 + 오답률·선지별 선택 비율
async function openQuestionView(ex, no, rs, label){
  const i=ex.items.findIndex(it=>it.no===no), it=ex.items[i]; if(!it) return;
  const wr=rs.length?Math.round(rs.filter(r=>!isOk(r.answers[i],it)).length/rs.length*100):null;
  const cnt=[0,0,0,0,0,0]; rs.forEach(r=>cnt[+r.answers[i]||0]++);
  const noDist=oxOnly(ex)||rs.some(r=>/[ox]/.test(r.answers));
  $('#modal').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(ex.name)} · ${no}번</h2><button class="btn" id="closeM">닫기</button></div>
    <p style="margin:8px 0">${pill(it.cat)} <b>${esc(it.sub||'')}</b> · 정답 ${circled(+it.answer)} · ${it.points}점 · ${esc(label||'')} 응시 ${rs.length}명 · 오답률 <b class="mark-x">${wr==null?'-':wr+'%'}</b></p>
    ${noDist||!rs.length?'':`<div class="row" style="gap:6px;margin-bottom:8px">${[1,2,3,4,5].map(n=>`<span class="pill" style="${n===+it.answer?'background:#dcfce7;color:#166534':'background:#f1f5f9;color:#334155'}">${'①②③④⑤'[n-1]} ${pct(cnt[n],rs.length)}% (${cnt[n]}명)</span>`).join('')}<span class="pill" style="background:#f1f5f9;color:#334155">무응답 ${pct(cnt[0],rs.length)}%</span></div>`}
    <div id="qvBody"><p class="muted">시험지 불러오는 중…</p></div>`;
  $('#closeM').onclick=()=>$('#modalBg').classList.remove('show');
  $('#modalBg').classList.add('show');
  try{ const Q=await getQbank(ex.id);
    $('#qvBody').innerHTML=Q&&Q.q[no]?`<div class="q-body" style="margin:0">${chunkHtml(Q,qIndexes(Q,no),0,+it.answer||0)}</div>`:'<p class="muted">이 시험은 시험지 워드가 등록되지 않아 문제를 보여줄 수 없어요. (시험 관리에서 워드를 올리면 보여요)</p>';
  }catch(err){ $('#qvBody').innerHTML=`<p class="muted">문제를 불러오지 못했어요: ${esc(err.message)}</p>`; }
}
function wrongRates(ex, rs){
  return ex.items.map((it,i)=>{
    const n=rs.length; if(!n) return null;
    const w=rs.filter(r=>!isOk(r.answers[i],it)).length;
    return Math.round(w/n*100);
  });
}
function catScores(ex, answers){
  const m={};
  ex.items.forEach((it,i)=>{ const c=it.cat||'미지정'; m[c]=m[c]||{got:0,max:0,ok:0,n:0}; m[c].max+=+it.points; m[c].n++; if(isOk(answers[i],it)){ m[c].got+=+it.points; m[c].ok++; } });
  return m;
}
const catsOf = ex => [...new Set(ex.items.map(i=>i.cat||'미지정'))].sort((a,b)=>CATS.indexOf(a)-CATS.indexOf(b));

async function renderResultTab(){
  if(!EXAMS.length){ $('#tab-result').innerHTML='<div class="card"><p class="muted">먼저 시험을 등록하세요.</p></div>'; return; }

  const ex=examById(resExamId);
  const all=await getResponses(ex.id,true);
  const rs = resBranch==='전체' ? all : all.filter(r=>r.branch===resBranch);
  const scores=rs.map(r=>r.score);
  const avg = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : '-';
  const cats=catsOf(ex);

      ${cItems.map(({it,i,w})=>{ const wrongRs=cRs.filter(r=>!isOk(r.answers[i],it)); const cnt=[0,0,0,0,0,0]; wrongRs.forEach(r=>cnt[+r.answers[i]||0]++);

      <div class="row" style="margin-top:8px;gap:10px"><button class="btn primary" id="clsWs">이 문항들로 해설용 문제지 만들기 (워드)</button><label class="ws-item" style="cursor:pointer"><input type="checkbox" id="clsHae" checked> 맨 뒤에 해설 붙이기</label></div>`
    : `<p class="muted">${cRs.length?`오답률 ${resClsTh}% 이상인 문항이 없어요. 기준을 낮춰 보세요.`:'이 반 응답이 없어요.'}</p>`}`;

  $('#tab-result').innerHTML=`

      <label class="f">지난 시험과 비교<select id="resCmp"><option value="">비교 안 함</option>${cmpCandidates(ex).map(e=>`<option value="${e.id}" ${cmpEx&&e.id===cmpEx.id?'selected':''}>${roundLabel(roundKey(e))} · ${esc(e.name)}</option>`).join('')}</select></label>
      <button class="btn" id="csvBtn" style="align-self:flex-end">엑셀 다운로드</button>
    </div>
    <div class="stats">
      <div class="stat"><span class="muted">응시자</span><b>${rs.length}명</b></div>

      <div class="stat"><span class="muted">최고</span><b>${scores.length?Math.max(...scores):'-'}</b></div>
      <div class="stat"><span class="muted">최저</span><b>${scores.length?Math.min(...scores):'-'}</b></div>
      ${cmpEx?`<div class="stat"><span class="muted">지난 시험 평균 (${cmpRs.length}명)</span><b>${cmpAvg==null?'-':cmpAvg.toFixed(1)}</b></div>
      <div class="stat"><span class="muted">평균 변화</span><b>${cmpAvg==null||!scores.length?'-':diffTag(to100(+avg,ex)-to100(cmpAvg,cmpEx))}</b></div>`:''}
    </div>
    ${cmpEx?`<div class="cat-bars" style="margin-top:0">${catsOf(ex).map(c=>{ const a=curCat[c], b=prevCat[c]; const cur=a?pct(a.ok,a.n):0, prev=b?pct(b.ok,b.n):null; return `

        <div class="bar"><i style="width:${cur}%;background:${CAT_COLORS[c]||'#94a3b8'}"></i></div>
        ${prev==null?'':`<div class="bar" style="margin-top:3px;height:5px"><i style="width:${prev}%;background:#cbd5e1"></i></div>`}</div>`; }).join('')}</div>
      <p class="muted" style="margin:-8px 0 12px">유형별 정답률: 진한 막대 = 이번 시험, 회색 막대 = ${esc(cmpEx.name)}</p>`:''}

        ${cats.map(c=>`<td>${cs[c].got}/${cs[c].max}</td>`).join('')}</tr>`; }).join('') || `<tr><td colspan="${5+cats.length+(cmpEx?2:0)}" class="muted">응답이 없습니다.</td></tr>`}

      <table><thead><tr><th>번호</th><th>유형</th><th>세부</th><th>정답</th><th>배점</th><th>오답률</th><th>선지별 선택 비율 (①~⑤ / 무응답)</th></tr></thead><tbody>

      }).join('')}
      </tbody></table><p class="muted">문항을 누르면 바로 아래에 시험지 문제가 펼쳐져요 (정답 초록색). 시험지 워드를 올린 시험만 보여요.</p>`}

  bindExamPicker('resP', ex.id, id=>{ resExamId=id; renderResultTab(); });

  document.querySelectorAll('[data-resq]').forEach(el=>el.onclick=async()=>{

    cw.disabled=false; cw.textContent='이 문항들로 해설용 문제지 만들기 (워드)';
  };
}

function openReport(ex, r, all){
  const branchRs=all.filter(x=>x.branch===r.branch);
  const wrAll=wrongRates(ex,all), wrBr=wrongRates(ex,branchRs);
  const th=prefs.threshold;
  const rankAll=[...all].sort((a,b)=>b.score-a.score).findIndex(x=>x.score===r.score)+1;
  const rankBr=[...branchRs].sort((a,b)=>b.score-a.score).findIndex(x=>x.score===r.score)+1;
  const cs=catScores(ex,r.answers);
  const brCat={}; catsOf(ex).forEach(c=>{ let ok=0,n=0; branchRs.forEach(x=>{ const s=catScores(ex,x.answers)[c]; ok+=s.ok; n+=s.n; }); brCat[c]=pct(ok,n); });
  let hideListen = LS.get('mx_hideListen',false);

  const render=()=>{
    const items=ex.items.map((it,i)=>({it,i})).filter(o=>!(hideListen && o.it.cat==='듣기'));
    const half=Math.ceil(items.length/2);
    const rowHtml=({it,i})=>{
      const a=+r.answers[i]||0, ok=isOk(r.answers[i],it), ox=r.answers[i]==='x';
      const ev= ok ? '<span class="tag ok">양호</span>' : (wrBr[i]!=null && wrBr[i]<th ? '<span class="tag bad">취약</span>' : '<span class="tag warn">주의</span>');
      return `<tr><td><span class="qno ${ok?'':'x'}">${it.no}</span></td><td>${pill(it.cat)}</td><td>${wrAll[i]}%</td><td>${wrBr[i]}%</td>
        <td>${ok?'<span class="mark-o">○ 정답</span>':`<span class="mark-x">✕ 오답</span>${ox?'':` <span class="muted">(${a?circled(a):'무응답'})</span>`}`}</td><td>${ev}</td></tr>`;
    };
    const tbl=(arr)=>`<table><thead><tr><th>문항 (${arr.length?arr[0].it.no:''}–${arr.length?arr[arr.length-1].it.no:''})</th><th>유형</th><th>전체 오답률</th><th>분원 오답률</th><th>내 응답</th><th>평가</th></tr></thead><tbody>${arr.map(rowHtml).join('')}</tbody></table>`;
    $('#modal').innerHTML=`
      <div class="row" style="justify-content:space-between">
        <div><h2 style="margin:0">${esc(r.student_name)} <span class="muted">${esc(r.branch)} ${esc(r.class_name)}</span></h2><span class="muted">${esc(ex.name)}</span></div>
        <div class="row noprint"><label class="muted"><input type="checkbox" id="hideL" ${hideListen?'checked':''}> 듣기 제외</label>
          ${r.member_code?'<button class="btn" id="toHist">누적 기록</button>':''}<button class="btn" onclick="window.print()">인쇄</button><button class="btn" id="closeM">닫기</button></div>
      </div>
      <div class="stats" style="margin-top:14px">
        <div class="stat"><span class="muted">총점</span><b>${r.score} / ${totalPoints(ex)}</b></div>
        <div class="stat"><span class="muted">분원 석차</span><b>${rankBr} / ${branchRs.length}</b></div>
        <div class="stat"><span class="muted">전체 석차</span><b>${rankAll} / ${all.length}</b></div>
      </div>
      <div class="cat-bars">${catsOf(ex).filter(c=>!(hideListen&&c==='듣기')).map(c=>{ const s=cs[c], my=pct(s.ok,s.n); return `
        <div class="cat-bar"><div class="row" style="justify-content:space-between">${pill(c)}<span><b>${s.ok}/${s.n}</b> <span class="muted">(${s.got}/${s.max}점)</span></span></div>
          <div class="bar"><i style="width:${my}%;background:${CAT_COLORS[c]||'#94a3b8'}"></i></div>
          <div class="muted" style="margin-top:4px">내 정답률 ${my}% · 분원 평균 ${brCat[c]}%</div></div>`; }).join('')}</div>
      <div class="report-cols"><div>${tbl(items.slice(0,half))}</div><div>${tbl(items.slice(half))}</div></div>
      <p class="muted" style="margin-top:10px">평가: 정답 → 양호 · 오답 중 분원 오답률 ${th}% 미만(대부분 맞힌 문제) → 취약 · 그 외 오답 → 주의</p>`;
    $('#closeM').onclick=()=>$('#modalBg').classList.remove('show');
    const toH=$('#toHist'); if(toH) toH.onclick=()=>{ histCode=r.member_code; $('#modalBg').classList.remove('show'); showTab('hist'); };
    $('#hideL').onchange=e=>{ hideListen=e.target.checked; LS.set('mx_hideListen',hideListen); render(); };
  };
  render();
  $('#modalBg').classList.add('show');
}
$('#modalBg').onclick=e=>{ if(e.target.id==='modalBg') e.currentTarget.classList.remove('show'); };

/* 엑셀(.xlsx): 성적 / 답안 / 채점 / 문항분석 4개 시트. 엑셀 도구가 없으면 CSV로 */
function exportCsv(ex, rows, cats){
  if(window.XLSX){
    const info=[ex.name, ex.grade||'', roundLabel(roundKey(ex)), '분원: '+resBranch];
    const rank=s=>rows.findIndex(r=>r.score===s)+1;
    const nums=ex.items.map(i=>i.no+'번');
    const s1=[info,[],['순위','회원코드','분원','반','이름','총점',...cats.map(c=>c+' 득점'),...cats.map(c=>c+' 정답률(%)')],
      ...rows.map(r=>{ const cs=catScores(ex,r.answers); return [rank(r.score),r.member_code||'',r.branch,r.class_name,r.student_name,r.score,...cats.map(c=>cs[c].got),...cats.map(c=>pct(cs[c].ok,cs[c].n))]; })];
    const s2=[info,[],['회원코드','분원','반','이름',...nums],['','','','정답',...ex.items.map(i=>+i.answer||'')],
      ...rows.map(r=>[r.member_code||'',r.branch,r.class_name,r.student_name,...ex.items.map((it,i)=>{ const ch=r.answers[i]; return ch==='o'?'O':ch==='x'?'X':(+ch||''); })])];
    const s3=[info,[],['회원코드','분원','반','이름','총점',...nums],['','','','배점','',...ex.items.map(i=>+i.points)],
      ...rows.map(r=>[r.member_code||'',r.branch,r.class_name,r.student_name,r.score,...ex.items.map((it,i)=>isOk(r.answers[i],it)?'O':'X')])];
    const wr=wrongRates(ex,rows);
    const s4=[info,[],['번호','대분류','세부 유형','정답','배점','오답률(%)','①(%)','②(%)','③(%)','④(%)','⑤(%)','무응답(%)'],
      ...ex.items.map((it,i)=>{ const c=[0,0,0,0,0,0]; rows.forEach(r=>c[+r.answers[i]||0]++); return [it.no,it.cat||'',it.sub||'',+it.answer||'',+it.points,wr[i]==null?'':wr[i],...[1,2,3,4,5,0].map(n=>pct(c[n],rows.length))]; })];
    const wb=XLSX.utils.book_new();
    [['성적',s1],['답안',s2],['채점',s3],['문항분석',s4]].forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n));
    XLSX.writeFile(wb, `${ex.name}_${resBranch}.xlsx`.replace(/[\\/:*?"<>|]/g,'_'));
    return;
  }
  const head=['회원코드','분원','반','이름','총점',...cats.map(c=>c+'(득점)'),...ex.items.map(i=>i.no+'번')];
  const lines=[head, ...rows.map(r=>{ const cs=catScores(ex,r.answers); return [r.member_code||'',r.branch,r.class_name,r.student_name,r.score,...cats.map(c=>cs[c].got),...ex.items.map((it,i)=>{ const a=+r.answers[i]||0; return isOk(r.answers[i],it)?'O':(a||(r.answers[i]==='x'?'X':'-')); })]; })];
  const csv='\uFEFF'+lines.map(l=>l.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`${ex.name}_${resBranch}.csv`; a.click();
}

/* ===================== 4. 학생 기록 (회원코드 기준 누적) ===================== */
let histCode=null, histQ='';
let histActiveOnly=true;   // 학생 기록: 기본은 재원생만 (체크 풀면 퇴원생도)
async function renderHistTab(){
  const br=prefs.branch; await loadStudents(br);
  // 재원생 = 가장 최신 회차 명단에 있는 학생. 퇴원생 = 예전 회차 명단에만 있는 학생 (마지막으로 있던 명단 기준)
  const all=STU[br]||[], latest=rosterRounds(br)[0]||'';
  const list=all.filter(s=>(s.exam_round||'')===latest).map(s=>({...s,_out:false}));
  const seen=new Set(list.map(s=>s.member_code).filter(Boolean)), lastOf=new Map();
  all.forEach(s=>{ if(!s.member_code||seen.has(s.member_code)) return; const p=lastOf.get(s.member_code); if(!p||koCmp(s.exam_round||'',p.exam_round||'')>0) lastOf.set(s.member_code,s); });
  list.push(...[...lastOf.values()].map(s=>({...s,_out:true})).sort((a,b)=>koCmp(a.student_name,b.student_name)));
  const q=histQ.trim();
  const withCode=list.filter(s=>s.member_code);
  const match=(s,q)=>(!histActiveOnly || !s._out) && (!q || s.student_name.includes(q) || s.member_code.includes(q) || String(s.class_name||'').includes(q));
  const noCode=list.length && !list.some(s=>s.member_code);
  const nOut=withCode.filter(s=>s._out).length;
  $('#tab-hist').innerHTML=`
  <div class="grid2">
    <div class="card">
      <label class="f">분원<select id="hBranch">${BRANCHES.map(b=>`<option ${b===br?'selected':''}>${b}</option>`).join('')}</select></label>
      <button class="btn" id="hCommon" style="width:100%;margin-top:10px">학년 공통 대비 · 회차 인쇄 (듣기 제외)</button>
      <input id="hQ" placeholder="이름·회원코드·반 검색 (코드 입력 후 Enter)" value="${esc(histQ)}" style="width:100%;margin:10px 0 6px">
      <label class="ws-item" style="cursor:pointer;margin-bottom:8px"><input type="checkbox" id="hActive" ${histActiveOnly?'checked':''}> 재원생만 보기 <span class="muted">(풀면 퇴원생 ${nOut}명도 검색)</span></label>
      <div style="max-height:620px;overflow:auto">
        ${withCode.map(s=>`<div class="exam-item ${s.member_code===histCode?'sel':''}" data-code="${esc(s.member_code)}" ${match(s,q)?'':'hidden'}><b>${esc(s.student_name)}${s._out?' <span class="pill" style="background:#9ca3af">퇴원</span>':''}</b>
          <span class="muted">${esc(s.class_name)} · ${esc(s.member_code)}${s.student_no?' · '+esc(s.student_no):''}${s._out?' · 마지막 명단 '+esc(roundLabel(s.exam_round)):''}</span></div>`).join('')}
        <p class="muted" id="hEmpty" ${withCode.some(s=>match(s,q))?'hidden':''}>${noCode?'이 분원 명단에 회원코드가 없어요. 회원코드 열이 있는 명단을 올려주세요.':list.length?'검색 결과가 없어요.':'학생 명단을 먼저 올려주세요.'}</p>
      </div>
    </div>
    <div class="card" id="hBody">${histCode?'<p class="muted">불러오는 중…</p>':'<p class="muted">왼쪽에서 학생을 고르세요.</p>'}</div>
  </div>`;
  $('#hBranch').onchange=e=>{ prefs.branch=e.target.value; savePrefs(); renderHistTab(); };
  $('#hCommon').onclick=()=>openCommonWorksheet({});
  const hq=$('#hQ');
  // 입력 중에는 화면을 다시 그리지 않고 목록만 숨김/표시 (한글 입력이 ㄱㅣㅁ처럼 풀리지 않도록)
  const applyFilter=()=>{ const q=histQ.trim(); let n=0;
    document.querySelectorAll('#tab-hist [data-code]').forEach(el=>{ const st=withCode.find(s=>s.member_code===el.dataset.code); const ok=!!st&&match(st,q); el.hidden=!ok; if(ok) n++; });
    $('#hEmpty').hidden=n>0; };
  $('#hActive').onchange=e=>{ histActiveOnly=e.target.checked; applyFilter(); };
  hq.oninput=()=>{ histQ=hq.value; applyFilter(); };
  hq.onkeydown=e=>{ if(e.key==='Enter' && !e.isComposing && hq.value.trim()){ const v=hq.value.trim(); const found=withCode.filter(s=>match(s,v)); histCode=found.length===1?found[0].member_code:v; renderHistTab(); } };
  document.querySelectorAll('#tab-hist [data-code]').forEach(el=>el.onclick=()=>{ histCode=el.dataset.code; renderHistTab(); });
  if(histCode) renderHistBody(histCode, list);
}

async function renderHistBody(code, list){
  const box=$('#hBody'); if(!box) return;
  let rs; try{ rs=await DB.responsesByMember(code); }catch(e){ box.innerHTML='<p class="muted">기록을 불러오지 못했습니다: '+esc(e.message)+'</p>'; return; }
  const rows=[];
  for(const r of rs){
    const ex=examById(r.exam_id); if(!ex) continue;
    const all=await getResponses(ex.id);
    const brs=all.filter(x=>x.branch===r.branch);
    rows.push({r, ex, all, date:ex.exam_date||String(r.created_at||'').slice(0,10), tp:totalPoints(ex),
      rankBr:[...brs].sort((a,b)=>b.score-a.score).findIndex(x=>x.score===r.score)+1, nBr:brs.length,
      avgBr:brs.reduce((s,x)=>s+x.score,0)/(brs.length||1), cs:catScores(ex,r.answers)});
  }
  rows.sort((a,b)=>koCmp(a.date,b.date));
  const stu=list.find(s=>s.member_code===code), last=rows.length?rows[rows.length-1].r:null;
  const name=stu?stu.student_name:(last?last.student_name:'');
  const head=`<div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${esc(name||'(이름 없음)')}
      <span class="muted">${esc(stu?stu.class_name:(last?last.class_name:''))} · 회원코드 ${esc(code)}${stu&&stu.student_no?' · '+esc(stu.student_no):''}</span></h2></div>
      ${rows.length?'<button class="btn primary" id="wsOpen">모의고사 대비 문제지 만들기</button>':''}</div>`;
  if(!rows.length){
    box.innerHTML=head+`<p class="muted" style="margin-top:12px">이 회원코드로 입력된 시험이 아직 없어요. (신입생이면 같은 학년 학생들이 많이 틀린 문제로 대비 문제지를 만들 수 있어요.)</p>
      <button class="btn primary" id="wsCommon">학년 공통 대비 문제지 만들기</button>`;
    $('#wsCommon').onclick=()=>openCommonWorksheet({name, grade:stu?normGrade(stu.grade):''});
    return; }

  // 점수 추이 (100점 환산) — 내 점수 실선, 분원 평균 점선
  const W=600,H=200,L=40,Rp=20,T=20,B=40, n=rows.length;
  const X=i=> n===1 ? (L+W-Rp)/2 : L+i*(W-L-Rp)/(n-1);
  const Y=v=> T+(1-v/100)*(H-T-B);
  const my=rows.map(o=>o.r.score/o.tp*100), av=rows.map(o=>o.avgBr/o.tp*100);
  const line=(vals,attr)=>`<polyline fill="none" ${attr} points="${vals.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`;
  const chart=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:760px;margin:14px 0 4px">
    ${[0,50,100].map(v=>`<line x1="${L}" x2="${W-Rp}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e6e8ec"/><text x="${L-8}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="#6b7280">${v}</text>`).join('')}
    ${line(av,'stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"')}
    ${line(my,'stroke="var(--main)" stroke-width="2.5"')}
    ${rows.map((o,i)=>`<circle cx="${X(i)}" cy="${Y(my[i])}" r="4" fill="var(--main)"/><text x="${X(i)}" y="${Y(my[i])-9}" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2430">${o.r.score}</text>
      <text x="${X(i)}" y="${H-B+18}" font-size="11" text-anchor="middle" fill="#6b7280">${esc(fmtYM(o.date)||'-')}</text>`).join('')}
  </svg><div class="muted">— 내 점수 · - - 분원 평균 (100점 환산)</div>`;

  // 시험별 표
  const cats=[...new Set(rows.flatMap(o=>Object.keys(o.cs)))].sort((a,b)=>CATS.indexOf(a)-CATS.indexOf(b));
  const table=`<h3>시험별 기록</h3><div style="overflow:auto"><table><thead><tr><th>시행 연·월</th><th>시험</th><th>담임</th><th>점수</th><th>분원 평균</th><th>분원 석차</th>${cats.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map((o,i)=>`<tr class="click" data-hrep="${i}"><td>${esc(fmtYM(o.date)||'-')}</td><td>${esc(o.ex.name)}</td><td>${esc(teacherOf(o.r,rosterSync(o.r.branch,roundKey(o.ex)))||'-')}</td><td><b>${o.r.score}</b><span class="muted">/${o.tp}</span></td><td>${o.avgBr.toFixed(1)}</td><td>${o.rankBr}/${o.nBr}</td>
      ${cats.map(c=>o.cs[c]?`<td>${pct(o.cs[c].ok,o.cs[c].n)}%</td>`:'<td class="muted">-</td>').join('')}</tr>`).join('')}
  </tbody></table></div><p class="muted">시험을 누르면 그 시험의 개인 리포트가 열립니다.</p>`;

  // 누적 세부 유형 정답률 (낮은 순)
  const agg={};
  rows.forEach(o=>o.ex.items.forEach((it,i)=>{ const k=(it.cat||'미지정')+'|'+(it.sub||''); const a=agg[k]=agg[k]||{cat:it.cat||'미지정',sub:it.sub||'',ok:0,n:0}; a.n++; if(isOk(o.r.answers[i],it)) a.ok++; }));
  const subs=Object.values(agg).sort((a,b)=>pct(a.ok,a.n)-pct(b.ok,b.n)||b.n-a.n);
  const weak=`<h3>누적 세부 유형별 정답률 (낮은 순)</h3>
    <div class="cat-bars">${subs.map((a,si)=>{ const v=pct(a.ok,a.n); return `<div class="cat-bar${a.ok<a.n?' click':''}" ${a.ok<a.n?`data-sub="${si}" title="눌러서 틀린 문제 보기"`:''}><div class="row" style="justify-content:space-between">${pill(a.cat)}<span><b>${a.ok}/${a.n}</b></span></div>
      <div style="margin-top:6px;font-weight:600">${esc(a.sub||'-')}</div>
      <div class="bar"><i style="width:${v}%;background:${v<50?'var(--bad)':v<80?'var(--warn)':'var(--ok)'}"></i></div><div class="muted" style="margin-top:4px">${v}%</div></div>`; }).join('')}</div>`;

  box.innerHTML=head+chart+table+weak;
  box.querySelectorAll('[data-hrep]').forEach(tr=>tr.onclick=()=>{ const o=rows[+tr.dataset.hrep]; openReport(o.ex,o.r,o.all); });
  box.querySelectorAll('[data-sub]').forEach(c=>c.onclick=()=>{ const a=subs[+c.dataset.sub]; openWrongList(name, rows, a.cat, a.sub); });
  const wo=$('#wsOpen'); if(wo) wo.onclick=()=>openWorksheet(name, code, rows);
}

/* ===================== 5. 관리자 분석 ===================== */
const GRADE_COLS=['1등급','2등급','3등급','4등급','5등급 이하'];
const ADM_GRADES=['고1','고2','고3'];
// 수능 영어 절대평가: 90↑ 1등급, 80↑ 2등급 … (100점 환산)
function engGrade(score, ex){ const t=totalPoints(ex)||100, v=score/t*100; return v>=90?1:v>=80?2:v>=70?3:v>=60?4:v>=50?5:v>=40?6:v>=30?7:v>=20?8:9; }
const bucketOf = g => Math.min(g,5)-1;   // 0..4 (5 = 5등급 이하)
let admRound=null, admPick={}, admGrade='고1', admBranch=null;

// 회차: 시행일 기준 — 2월 1회, 5월 2회, 8월 3회, 11월 4회 (1~3월→1회, 4~6월→2회, 7~9월→3회, 10~12월→4회)
const ROUND_MONTH=[2,5,8,11];
function roundKey(ex){ const d=ex&&ex.exam_date; if(!d) return ''; const y=+d.slice(0,4), m=+d.slice(5,7); if(!y||!m) return ''; return `${y}-${Math.ceil(m/3)}`; }
function roundLabel(k){ if(!k) return '시행 연·월 없음'; const [y,r]=k.split('-'); return `${y}년 ${r}회차 (${ROUND_MONTH[r-1]}월)`; }
const allRounds = () => [...new Set(EXAMS.map(roundKey))].sort((a,b)=>koCmp(b,a));   // 최신 회차 먼저
function admExamsOf(g, rk){ return EXAMS.filter(e=>normGrade(e.grade)===g && roundKey(e)===rk).sort((a,b)=>koCmp(examDateKey(b),examDateKey(a))); }
function gradeCounts(list, ex){ const c=[0,0,0,0,0]; list.forEach(r=>c[bucketOf(engGrade(r.score,ex))]++); return c; }
// 행 하나: 응시 + 등급별 (인원 | %)
function gradeRow(label, cnt, n, strong){
  return `<tr${strong?' style="font-weight:700;background:#fafbfc"':''}><td>${label}</td><td>${n||'-'}</td>${cnt.map(v=>`<td class="gc-n">${n?v:'-'}</td><td class="gc-p">${n?pct(v,n)+'%':'-'}</td>`).join('')}</tr>`;
}
const gradeHead = first => `<thead><tr><th rowspan="2">${first}</th><th rowspan="2">응시</th>${GRADE_COLS.map(c=>`<th colspan="2" style="text-align:center">${c}</th>`).join('')}</tr>
  <tr>${GRADE_COLS.map(()=>'<th class="gc-n">인원</th><th class="gc-p">%</th>').join('')}</tr></thead>`;

// 응답 → 현재 명단(반·담임) 연결
function rosterOf(r, roster){
  return roster.find(s=>r.member_code && s.member_code===r.member_code) || roster.find(s=>s.student_name===r.student_name && s.class_name===r.class_name) || null;
}
// 담임: 답안에 기록된 그때 담임 → 없으면 현재 명단
const teacherOf = (r, roster) => r.teacher || ((rosterOf(r,roster||[])||{}).teacher) || '';
const stuIdOf = r => r.member_code || ('n:'+r.branch+'|'+r.student_name);

async function renderAdminTab(){
  if(!admBranch) admBranch=prefs.branch;
  const rounds=allRounds();
  if(!admRound || !rounds.includes(admRound)) admRound=rounds[0]||'';
  const rosters={}; for(const b of BRANCHES) rosters[b]=await getStudents(b);
  const data={};   // 학년 → {ex, all, choices}
  for(const g of ADM_GRADES){
    const choices=admExamsOf(g, admRound);
    let ex=choices.find(e=>e.id===admPick[admRound+'|'+g])||null;
    if(!ex){ // 같은 회차에 같은 학년 시험이 여럿이면 응시자가 많은 시험
      let best=null, bn=-1; for(const e of choices){ const n=(await getResponses(e.id)).length; if(n>bn){ best=e; bn=n; } } ex=best;
    }
    data[g]={ex, all:ex?await getResponses(ex.id):[], choices};
  }
  const to100=(sc,e)=>{ const t=totalPoints(e); return t?sc/t*100:sc; };
  const diffTag=d=>`<b class="${d>0?'mark-o':d<0?'mark-x':''}">${d>0?'▲':d<0?'▼':''}${Math.abs(d).toFixed(1)}</b>`;

  // ① 분원별 등급 분석 (행: 학년)
  const t1=ADM_GRADES.map(g=>{ const {ex,all}=data[g]; const l=ex?all.filter(r=>r.branch===admBranch):[]; return {g,cnt:ex?gradeCounts(l,ex):[0,0,0,0,0],n:l.length}; });
  const t1sum=t1.reduce((a,x)=>({cnt:a.cnt.map((v,i)=>v+x.cnt[i]),n:a.n+x.n}),{cnt:[0,0,0,0,0],n:0});

  // ② 전체 분원 등급 분석 (행: 분원, 선택 학년)
  const G=data[admGrade];
  const t2=BRANCHES.map(b=>{ const l=G.ex?G.all.filter(r=>r.branch===b):[]; return {b,cnt:G.ex?gradeCounts(l,G.ex):[0,0,0,0,0],n:l.length}; });
  const t2sum={cnt:G.ex?gradeCounts(G.all,G.ex):[0,0,0,0,0], n:G.all.length};

  // ③ 오답률 TOP5 (선택 학년, 분원별 + 전체)
  const top3=list=>{ if(!G.ex||!list.length) return []; const wr=wrongRates(G.ex,list); return G.ex.items.map((it,i)=>({it,w:wr[i]})).sort((a,b)=>b.w-a.w||a.it.no-b.it.no).slice(0,5); };
  const topCell=(t,ri)=>t?`<span class="ws-prev" data-topq="${ri}|${t.it.no}" title="눌러서 문제 보기"><b>${t.it.no}번</b> ${pill(t.it.cat)} <span class="muted">${esc(t.it.sub||'')}</span> <b class="mark-x">${t.w}%</b></span>`:'<span class="muted">-</span>';
  const topRows=[...BRANCHES.map(b=>({label:b,l:G.all.filter(r=>r.branch===b)})),{label:'전체',l:G.all,strong:true}].filter(x=>x.l.length||x.strong);

  // ④ 반별 성적 (선택 분원·학년) — 반 최고점 파랑, 최저점 빨강
  const mine=G.ex?G.all.filter(r=>r.branch===admBranch):[];
  const prevEx=G.ex?(()=>{ const id=defaultCmp(G.ex); return id?examById(id):null; })():null;
  const prevAll=prevEx?await getResponses(prevEx.id):[];
  const rowsWithT=mine.map(r=>({r, cls:r.class_name, teacher:teacherOf(r,rosterSync(admBranch,roundKey(G.ex))), prev:prevAll.find(p=>sameResp(p,r))}));
  const byCls={}; rowsWithT.forEach(x=>(byCls[x.cls||'-']=byCls[x.cls||'-']||[]).push(x));

  // ⑤ 담임별 성과 (이번 회차, 선택 분원) — 담임은 그 시험 때 기록된 담임
  const tStat={};
  for(const g of ADM_GRADES){
    const {ex,all}=data[g]; if(!ex) continue;
    const pEx=(()=>{ const id=defaultCmp(ex); return id?examById(id):null; })(); const pAll=pEx?await getResponses(pEx.id):[];
    all.filter(r=>r.branch===admBranch).forEach(r=>{
      const t=teacherOf(r,rosterSync(admBranch,roundKey(ex)))||'(담임 미지정)';
      const o=tStat[t]=tStat[t]||{n:0,sum:0,g1:0,g2:0,grow:0,gn:0,cls:new Set()};
      const gr=engGrade(r.score,ex); o.n++; o.sum+=to100(r.score,ex); if(gr===1) o.g1++; if(gr<=2) o.g2++; o.cls.add(`${g} ${r.class_name}`);
      const p=pAll.find(x=>sameResp(x,r)); if(p){ o.grow+=to100(r.score,ex)-to100(p.score,pEx); o.gn++; }

  }

  // ⑥ 담임 × 회차 (선택 분원, 전체 회차) + 담당 기간 성장
  const allResp=[];   // {r, ex, rk, t}

  const tr={};   // 담임 → 회차 → {n,sum,g1}
  allResp.forEach(x=>{ const o=((tr[x.t]=tr[x.t]||{})[x.rk]=tr[x.t][x.rk]||{n:0,sum:0,g1:0}); o.n++; o.sum+=to100(x.r.score,x.ex); if(engGrade(x.r.score,x.ex)===1) o.g1++; });
