<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모의고사 채점</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e6e8ec; --text:#1f2430; --sub:#6b7280; --main:#2f5bea; --main-soft:#eef2ff;
  --ok:#15803d; --ok-bg:#ecfdf3; --ok-line:#a7e3bd;
  --warn:#b45309; --warn-bg:#fff8e6; --warn-line:#f3d38a;
  --bad:#c0262d; --bad-bg:#fff1f1; --bad-line:#f2b0b3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:14px}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
.mode{font-size:12px;padding:3px 10px;border-radius:99px;background:#f1f5f9;color:var(--sub)}
.mode.on{background:var(--ok-bg);color:var(--ok)}
nav{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.navgrp{position:relative}
.grp-btn{border:1px solid var(--line)!important;background:#fff!important;padding:9px 16px!important;border-radius:10px!important;color:var(--text)!important;font-weight:700!important}
.navgrp.on .grp-btn{background:var(--main-soft)!important;border-color:#c7d7fe!important;color:var(--main)!important}
.grp-cur{font-weight:600;margin:0 4px 0 6px}
.grp-cur:not(:empty)::before{content:'· '}
.grp-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.12);padding:6px;min-width:240px;z-index:50}
.navgrp.open .grp-menu{display:block}
[hidden]{display:none!important}
.grp-menu button{display:block;width:100%;text-align:left;padding:10px 12px!important;color:var(--text)!important}
.grp-menu button small{display:block;font-weight:400;font-size:12px;color:var(--sub);margin-top:2px}
.grp-menu button:hover{background:#f5f8ff}
.grp-menu button.active{background:var(--main-soft);color:var(--main)!important}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;color:var(--sub);cursor:pointer}
nav button.active{background:var(--main-soft);color:var(--main)}
main{padding:20px 24px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub)}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid var(--main-soft);border-color:var(--main)}
button.btn{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.btn.primary{background:var(--main);border-color:var(--main);color:#fff}
button.btn.danger{color:var(--bad);border-color:var(--bad-line)}
button.btn.sm{padding:4px 10px;font-size:12px}
button.btn:disabled{opacity:.5;cursor:default}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:18px 0 8px}
.muted{color:var(--sub);font-size:12px}
.exam-item{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.exam-item.sel{border-color:var(--main);background:var(--main-soft)}
.exam-item b{display:block}
.ex-grp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.ex-grp summary{cursor:pointer;padding:2px 0}
.ex-grp[open] summary{margin-bottom:8px}
.ex-grp .exam-item{margin-bottom:5px;padding:6px 10px;display:flex;align-items:center;gap:6px}
.ex-grp .exam-item b{display:inline;flex:1;font-weight:600;font-size:13px}
.ex-grp .exam-item .muted{font-size:11px;white-space:nowrap}
.ex-grp .pill{font-size:11px;padding:1px 7px}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);background:#fafbfc}
td{padding:6px;border-bottom:1px solid #f0f1f3}
tr.click{cursor:pointer} tr.click:hover td{background:#f8faff}
.pill{display:inline-block;color:#fff;font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;border:1px solid}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.tag.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.qno{display:inline-flex;width:26px;height:24px;align-items:center;justify-content:center;border-radius:5px;border:1px solid var(--line);font-size:12px;color:var(--sub)}
.qno.x{border-color:var(--bad-line);color:var(--bad);background:var(--bad-bg)}
.items-table td input,.items-table td select{padding:4px 6px}
.total{font-weight:700}
.total.bad{color:var(--bad)}
.omr-input{font-family:ui-monospace,Consolas,monospace;font-size:20px;letter-spacing:3px;width:100%}
.omr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:12px}
.omr-cell{border:1px solid var(--line);border-radius:8px;text-align:center;padding:4px 0}
.omr-cell .n{font-size:11px;color:var(--sub)}
.omr-cell .a{font-size:16px;font-weight:700;height:20px}
.omr-cell.o{background:var(--ok-bg);border-color:var(--ok-line)}
.omr-cell.x{background:var(--bad-bg);border-color:var(--bad-line)}
.omr-cell.cur{outline:2px solid var(--main)}
.omr-cell input{width:100%;border:0;background:transparent;text-align:center;font:inherit;font-size:18px;font-weight:700;padding:0 0 2px;color:var(--text);outline:none;caret-color:transparent}
.omr-cell:focus-within{outline:2px solid var(--main)}
.score-big{font-size:28px;font-weight:800}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:110px}
.stat b{display:block;font-size:20px}
.subtabs{display:flex;gap:6px;margin:6px 0 12px}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;font:inherit;cursor:pointer}
.subtabs button.active{background:var(--text);color:#fff;border-color:var(--text)}
.dist{display:flex;gap:4px}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap} th.sortable:hover{color:var(--main)}
.pick-big{display:inline-block;margin-left:4px;padding:0 7px;border-radius:6px;background:#fee2e2;color:#b91c1c;font-size:16px;font-weight:800;line-height:1.5}
.pick-badge{display:inline-block;background:#fee2e2;color:#b91c1c;font-weight:700;font-size:13px;border-radius:5px;padding:0 6px;line-height:1.6}
.dist span{min-width:38px;text-align:center;font-size:12px;padding:2px 0;border-radius:4px;background:#f3f4f6}
.dist span.c{background:var(--ok-bg);color:var(--ok);font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px;z-index:50}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;width:min(1400px,100%);padding:22px}
.report-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.report-cols{grid-template-columns:1fr}}
.report-cols td,.report-cols th{text-align:center}
.cat-bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:12px 0 18px}
.cat-bar{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bar{height:8px;background:#eef0f3;border-radius:99px;margin-top:6px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.mark-o{color:var(--ok)} .mark-x{color:var(--bad)}
.files li{margin:4px 0}
.stu-row.cur td{background:var(--main-soft);font-weight:700}
.stu-row.done td:nth-child(3){color:var(--ok)}
.cur-name{font-size:22px;font-weight:800}
.done-box{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok);border-radius:10px;padding:12px 14px;margin-top:12px;font-weight:600}
.grid-cls{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.grid-cls td{padding:4px 6px}
table.adm th,table.adm td{text-align:center;white-space:nowrap}
table.adm td:first-child,table.adm th:first-child{text-align:left}
table.adm .gc-n{color:#111827}
table.adm .gc-p{background:#eef4ff;color:#1d4ed8}
.stat.hl{background:#eef4ff;border-color:#1d4ed8}
.stat.hl b{font-size:26px;color:#1d4ed8}
.q-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.q-card summary{cursor:pointer;color:var(--main);font-weight:600;margin-top:6px}
.q-body{margin-top:8px;font-family:"Times New Roman",Pretendard,serif;font-size:14px;line-height:1.6}
.q-body p{margin:2px 0}
.q-tbl{width:auto;margin:4px 0} .q-tbl td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}
.q-plain td{border:0!important;padding:2px 28px 2px 0!important}
.q-pick{background:var(--bad-bg);color:var(--bad);font-weight:700}
.q-ans{background:var(--ok-bg);color:var(--ok);font-weight:700}
.q-mk{border-radius:4px;padding:0 3px;font-weight:800}
.q-sent{border-radius:3px;font-weight:600}
u.q-pick,u.q-ans{text-decoration-thickness:2px}
.ws-grp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.ws-item{display:flex;gap:6px;align-items:center;padding:3px 0;font-size:13px}
.ws-prev{cursor:pointer;display:inline-flex;gap:6px;align-items:center} .ws-prev:hover b{color:var(--main);text-decoration:underline}
.ws-pv{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 0 8px 46px;background:#fcfcfd;max-height:420px;overflow:auto}
.cat-bar.click{cursor:pointer}
.qchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.qchip{font-size:11px;padding:2px 7px;border-radius:999px;cursor:pointer;border:1px solid}
.qchip.x{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.qchip.o{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.qchip:hover{filter:brightness(.95);text-decoration:underline} .cat-bar.click:hover{border-color:var(--main)}
.login-bg{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.login{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.login h2{margin:0 0 4px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.who b{color:var(--text)}
.who button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--sub)}
.role-tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--main-soft);color:var(--main)}
.trend th,.trend td{text-align:center;white-space:nowrap;padding:6px 8px}
table.adm.trend td.gname{text-align:center}
.trend td.brname{text-align:left;vertical-align:middle;background:#fff}
.trend .rsep{border-left:2px solid var(--line)}
.trend .cmpcol{background:#f3f6ff}
.trend .cmphead{background:#fff7e6}
.trend tr.brtop td{border-top:2px solid #cbd5e1}
.trend tr.sum td:not(.brname){font-weight:700;background:#fafbfc}
.trend tr.sum td.cmpcol{background:#e8eeff}
.trend tr.all td.brname{background:#fafbfc}
.ck-item{border-left:4px solid #f59e0b}
.ck-item.bad{border-left-color:var(--bad)}
.ck-tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#fef3c7;color:#92400e}
.ck-item.bad .ck-tag{background:#fee2e2;color:#b91c1c}
th.srt{cursor:pointer;user-select:none;white-space:nowrap} th.srt::after{content:'▲▼';font-size:9px;letter-spacing:-2px;margin-left:4px;opacity:.28} th.srt:hover::after{opacity:.6}
th.srt.asc::after{content:'▲';opacity:.95;letter-spacing:0} th.srt.desc::after{content:'▼';opacity:.95;letter-spacing:0}
tr.pv-sub>td{background:#f8fafc!important;padding:4px 8px 8px 18px;text-align:left;white-space:normal}
.pv-subt{width:auto;font-size:12.5px} .pv-subt td{padding:3px 10px 3px 0;border:0;white-space:nowrap;text-align:left}
.pv-purp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.pv-purp button{text-align:left;border:1px solid var(--line);background:#f8fafc;border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px}
.pv-purp button b{font-size:15px;color:var(--text)} .pv-purp button span{font-size:12px;color:var(--sub)}
.pv-purp button.on{border:2px solid var(--main);background:#eef3ff} .pv-purp button:hover{border-color:var(--main)}
.pv-sentence{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700;font-size:15px}
.pv-sentence select{font-weight:700;font-size:14px;padding:6px 10px;border:2px solid var(--main);border-radius:8px;color:var(--main);background:#fff}
.pvt td,.pvt th{white-space:nowrap} .pvt td.pvc{cursor:pointer} .pvt td.pvc:hover{outline:2px solid var(--main);outline-offset:-2px} .pvt td:first-child{position:sticky;left:0;background:#fff;z-index:1} .pvt tr.pvtot td,.pvt td.pvtot{background:#f5f7fb;font-weight:700}
.ws-cond{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fafbfc}
.ws-cond-h{font-weight:800;font-size:13px;margin:10px 0 4px;color:var(--main)} .ws-cond-h:first-child{margin-top:0}
.xa-target{margin:10px 0 4px;padding:10px 14px;border-radius:10px;background:var(--main-soft);font-size:15px}
.xa-check{margin-top:10px;padding:10px 14px;border-radius:10px;border:1px solid #bbf7d0;background:#f0fdf4;font-size:13px}
.xa-check.bad{border-color:#fecaca;background:#fef2f2}
.xa-check ul{margin:6px 0 0;padding-left:4px;list-style:none;line-height:1.8}
.hint{background:#f8fafc;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--sub);margin:10px 0}
@media print{
  body *{visibility:hidden}
  .modal,.modal *{visibility:visible}
  .modal-bg{position:absolute;background:none;padding:0}
  .modal{position:absolute;left:0;top:0;width:100%}
  .noprint{display:none!important}
}
</style>
</head>
<body>
<header>
  <h1>모의고사 채점</h1>
  <span id="mode" class="mode"></span>
  <nav>
    <div class="navgrp out" data-grp="out">
      <button class="grp-btn" data-grpbtn="out">분석 리포트<b class="grp-cur"></b> ▾</button>
      <div class="grp-menu">
        <button data-tab="admin" class="active">관리자 분석<small>등급·오답률·담임별 성과</small></button>
        <button data-tab="result">결과·분석<small>시험별 성적·문항·반별 분석</small></button>
        <button data-tab="hist">학생 기록<small>학생별 누적 기록·오답 문제지</small></button>
      </div>
    </div>
    <div class="navgrp in" data-grp="in">
      <button class="grp-btn" data-grpbtn="in">데이터 입력<b class="grp-cur"></b> ▾</button>
      <div class="grp-menu">
        <button data-tab="exam">시험 관리<small>시험 등록·정답·시험지 워드</small></button>
        <button data-tab="roster">학생 명단<small>회차별 명단 올리기</small></button>
        <button data-tab="omr">OMR 입력<small>학생 답안 입력·엑셀 입력</small></button>
        <button data-tab="check">데이터 점검<small>잘못 들어간 답안·중복 찾기</small></button>
      </div>
    </div>
    <button data-tab="acct" id="acctBtn" hidden>계정 관리</button>
  </nav>
  <div class="who" id="who" hidden></div>
</header>
<main>
  <section id="tab-exam" hidden></section>
  <section id="tab-roster" hidden></section>
  <section id="tab-omr" hidden></section>
  <section id="tab-result" hidden></section>
  <section id="tab-hist" hidden></section>
  <section id="tab-admin"></section>
  <section id="tab-acct" hidden></section>
  <section id="tab-check" hidden></section>
</main>
<div class="login-bg" id="loginBg" hidden>
  <form class="login" id="loginForm" autocomplete="on">
    <h2>모의고사 채점</h2>
    <p class="muted" style="margin:0">받은 아이디와 비밀번호로 로그인하세요.</p>
    <label class="f">아이디<input id="lgId" autocomplete="username" autocapitalize="off" required></label>
    <label class="f">비밀번호<input id="lgPw" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" id="lgGo" type="submit">로그인</button>
    <p class="total bad" id="lgErr" hidden></p>
  </form>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

/* 문항 하나 정답 여부. 본사 정오표로 가져온 시험은 답 대신 'o'(정답)/'x'(오답)로 저장됨 */
function isOk(ch, it){
  if(ch==='o') return true;
  if(ch===undefined || ch==='x') return false;
  return +it.answer>0 && +ch===+it.answer;
}
const oxOnly = ex => ex.items.every(i=>!+i.answer);   // 정답 번호 없이 정오(O/X)만 있는 시험
function gradeAnswers(ex, answers){
  let score=0, correct=0;
  ex.items.forEach((it,i)=>{ if(isOk(answers[i],it)){ score+=+it.points; correct++; } });
  return {score,correct};
}
function makeItems(n, answers='', three=[], useStd=false){
  return Array.from({length:n},(_,i)=>{
    const t = useStd && n===45 ? STD_TYPES[i] : ['',''];
    return {no:i+1, answer:+answers[i]||0, points:three.includes(i+1)?3:2, cat:t[0], sub:t[1]};
  });
}

/* 학년 표기 통일: '고1', '1학년', '1', '고등1' → '고1' */
function normGrade(s){
  s=String(s??'').replace(/\s/g,'');
  let m=s.match(/(고|중|초)[^0-9]*([1-6])/); if(m) return m[1]+m[2];
  m=s.match(/^([1-3])(학년)?$/); if(m) return '고'+m[1];
  return s;
}
// 학생 학년 표시: 실제 학년(명단의 '실제 학년') 우선, 없으면 응시 학년
function gradeLabel(s){ const a=s&&s.school_grade?normGrade(s.school_grade):'', b=s&&s.grade?normGrade(s.grade):''; return a||b; }
/* 응답 ↔ 명단 학생 매칭: 둘 다 회원코드가 있으면 코드로, 아니면 분원+반+이름으로 */
function sameStudent(r,s){
  if(r.member_code && s.member_code) return r.member_code===s.member_code;
  return r.branch===(s.branch||prefs.branch) && r.class_name===s.class_name && r.student_name===s.student_name;
}
const koCmp=(a,b)=>String(a??'').localeCompare(String(b??''),'ko',{numeric:true});
/* 명단은 회차별로 저장 (exam_round = "2026-3"). STU[분원] = 그 분원의 모든 회차 명단 */
async function loadStudents(branch, force){
  if(force || !STU[branch]){
    try{ STU[branch]=await DB.students(branch); }catch(e){ alert('학생 명단을 불러오지 못했습니다: '+e.message); STU[branch]=[]; }
  }
  return STU[branch];
}
const rosterRounds = branch => [...new Set((STU[branch]||[]).map(s=>s.exam_round||''))].sort(koCmp).reverse();   // 최신 먼저
// 그 회차 명단 → 없으면 그 이전 가장 가까운 회차 → 그래도 없으면 최신 회차
function rosterSync(branch, rk){
  const all=STU[branch]||[]; if(!all.length) return [];
  let l=all.filter(s=>(s.exam_round||'')===(rk||''));
  if(!l.length){ const rs=rosterRounds(branch); const near=rs.find(x=>x&&rk&&x<=rk) ?? rs[0]; l=all.filter(s=>(s.exam_round||'')===near); }
  return l;
}
async function getRoster(branch, rk, force){ await loadStudents(branch,force); return rosterSync(branch, rk); }
async function getStudents(branch, force){ await loadStudents(branch,force); return rosterSync(branch, rosterRounds(branch)[0]); }   // 최신 회차 명단

async function pmap(list, fn, n=6){
  const out=new Array(list.length); let i=0;
  await Promise.all(Array.from({length:Math.min(n,list.length)},async()=>{ while(i<list.length){ const k=i++; try{ out[k]=await fn(list[k],k); }catch(e){ console.warn(e); } } }));
  return out;
}

}
function bindExamPicker(id, selId, onPick){
  const ex=examById(selId); if(!ex) return;
  const pick=(rk,g)=>{ const inR=EXAMS.filter(e=>roundKey(e)===rk); const c=inR.filter(e=>gradeKey(e)===g); const e=c[0]||inR.sort((a,b)=>koCmp(gradeKey(a),gradeKey(b)))[0]; if(e) onPick(e.id); };
  const R=$('#'+id+'R'), G=$('#'+id+'G'), E=$('#'+id+'E');
  if(R) R.onchange=()=>pick(R.value, gradeKey(ex));
  if(G) G.onchange=()=>pick(roundKey(ex), G.value);
  if(E) E.onchange=()=>onPick(E.value);
}

/* 붙여넣기 형식 해석: '키: 값' 줄 + '번호 대분류 세부유형' 줄 */
function parseExamText(t){
  t=String(t||'').replace(/[①②③④⑤]/g,c=>'①②③④⑤'.indexOf(c)+1);
  const out={types:{}};
  t.split(/\r?\n/).forEach(raw=>{
    const line=raw.trim(); if(!line) return;
    let m=line.match(/^(시험\s*명|학년|시행\s*일|문항\s*수|정답|3점(?:\s*문항)?|유형|용도)\s*[:：]\s*(.*)$/);
    if(m){
      const k=m[1].replace(/\s/g,''), v=m[2].trim();
      if(k==='시험명') out.name=v;
      else if(k==='학년') out.grade=v;
      else if(k==='시행일'){ const d=v.match(/(\d{4})\D+(\d{1,2})/); out.date=d?`${d[1]}-${d[2].padStart(2,'0')}-01`:''; }
      else if(k==='문항수') out.q=+v.replace(/\D/g,'')||0;
      else if(k==='정답') out.answers=v.replace(/[^0-5]/g,'');
      else if(k.startsWith('3점')) out.three=v.split(/[^0-9]+/).filter(Boolean).map(Number);
      else if(k==='용도') out.bank=/문제\s*은행/.test(v);
      return;
    }
    m=line.match(/^(\d{1,3})\s*[.|,\t ]?\s*(듣기|대의\s*파악|세부\s*정보|어법\s*[·ㆍ.\/]?\s*어휘|빈칸\s*추론|간접\s*쓰기|장문\s*독해)\s*[|,\t\/:-]*\s*(.*)$/);
    if(m){
      let cat=m[2].replace(/\s/g,''); if(/^어법/.test(cat)) cat='어법·어휘';
      out.types[+m[1]]={cat, sub:m[3].trim()};
    }
  });
  return out;
}

/* ===================== 본사 리포트(달성율 현황 HTML) 가져오기 ===================== */
let importMode=false, IMP=null;
const STD_THREE=[6,13,14,21,30,33,34,37,39,42];

// 리포트 HTML 안의 `const 이름 = {...}` 데이터를 꺼냄 (문자열 안 괄호는 무시)
function extractConst(src,name){
  const m=new RegExp('const\\s+'+name+'\\s*=\\s*').exec(src); if(!m) return undefined;
  let i=m.index+m[0].length; const open=src[i];
  if(open==='"'){ const e=src.indexOf('"',i+1); return JSON.parse(src.slice(i,e+1)); }
  if(open!=='[' && open!=='{') return undefined;
  let depth=0, inStr=false, j=i;
  for(; j<src.length; j++){
    const c=src[j];
    if(inStr){ if(c==='\\') j++; else if(c==='"') inStr=false; continue; }
    if(c==='"') inStr=true;
    else if(c==='['||c==='{') depth++;
    else if(c===']'||c==='}'){ depth--; if(!depth) break; }
  }
  try{ return JSON.parse(src.slice(i,j+1)); }catch(e){ return undefined; }
}

// 본사 점수(듣기·독해)로 3점 문항 추정: 듣기 17문항 중 3개, 독해 28문항 중 7개
function combos(n,k,cb){ const a=[]; (function rec(s){ if(a.length===k){ cb(a); return; } for(let i=s;i<=n-(k-a.length);i++){ a.push(i); rec(i+1); a.pop(); } })(0); }
function solvePart(rows, from, len, k, key){
  const need=rows.map(r=>r[key]-2*r.answers.slice(from,from+len).filter(Boolean).length);
  const out=[];
  combos(len,k,c=>{ if(out.length>5000) return;
    for(let s=0;s<rows.length;s++){ let n=0; for(const q of c) if(rows[s].answers[from+q]) n++; if(n!==need[s]) return; }
    out.push(c.map(q=>q+from+1));
  });
  return out;
}
function inferThree(rows, prior){
  const ok=rows.filter(r=>Number.isFinite(r.lc)&&Number.isFinite(r.rc));
  if(!ok.length) return {three:prior, unique:false, found:false};
  const L=solvePart(ok,0,17,3,'lc'), R=solvePart(ok,17,28,7,'rc');
  if(!L.length||!R.length) return {three:prior, unique:false, found:false};
  const best=list=>list.reduce((b,c)=>{ const sc=c.filter(q=>prior.includes(q)).length; return sc>b.sc?{c,sc}:b; },{c:list[0],sc:-1}).c;
  return {three:[...best(L),...best(R)].sort((a,b)=>a-b), unique:L.length===1&&R.length===1, found:true};
}

function parseReport(src){
  const J=extractConst(src,'JEONGO_DATA');
  if(!J || typeof J!=='object') throw new Error('이 파일에서 학생별 정오표(JEONGO_DATA)를 찾지 못했어요. 본사 달성율 현황 HTML이 맞는지 확인해 주세요.');
  const S=extractConst(src,'STUDENTS')||[];
  const P=extractConst(src,'PERIOD_INFO')||{};
  const branch=matchBranch(extractConst(src,'BRANCH_NAME')||prefs.branch);
  const cats={};
  const tg=src.match(/const\s+TYPE_GROUPS\s*=\s*\[([\s\S]*?)\];/);
  if(tg) for(const m of tg[1].matchAll(/name:'([^']+)'[^}]*?qs:\[([\d,\s]+)\]/g)) m[2].split(',').map(Number).forEach(q=>cats[q]=m[1]);
  const month=((P.label||'').match(/(\d{1,2})월/)||[])[1];
  const grades={};
  Object.entries(J).forEach(([g,list])=>{
    if(!Array.isArray(list)||!list.length) return;
    const st=S.filter(x=>x.t===g), courses=[];
    st.forEach(x=>{ if(!courses.includes(x.c)) courses.push(x.c); });
    const rows=list.map(x=>{
      const course=courses[(+x.cls||0)-1]||'';
      const sc=st.find(y=>y.c===course && String(y.num)===String(x.num));
      return {name:String(x.name||'').trim(), num:String(x.num||''), cls:String(x.cls||''), course,
        answers:(x.answers||[]).map(Boolean), total:sc?+sc.total:NaN, lc:sc?+sc.lc:NaN, rc:sc?+sc.rc:NaN, match:null, note:''};
    });
    grades[g]={rows, missing:Math.max(0, st.length-rows.length), three:[], unique:false, found:false};
  });
  if(!Object.keys(grades).length) throw new Error('정오표에 학생 데이터가 없어요.');
  return {branch, year:P.year||'', label:P.label||'', month:month?month.padStart(2,'0'):'', cats, grades};
}

async function prepareImport(src){
  const d=parseReport(src);
  // 3점 추정: 정답이 하나로 정해지는 학년을 먼저 풀고, 그 결과를 다른 학년의 기준으로 사용
  const order=Object.keys(d.grades).sort((a,b)=>d.grades[b].rows.length-d.grades[a].rows.length);
  let prior=STD_THREE;
  for(const g of order){ const r=inferThree(d.grades[g].rows, prior); Object.assign(d.grades[g],r); if(r.unique) prior=r.three; }
  // 학생 명단과 이름으로 연결 → 회원코드
  const roster=await getRoster(d.branch, d.year&&d.month?`${d.year}-${Math.ceil(+d.month/3)}`:'', true);
  Object.entries(d.grades).forEach(([g,G])=>G.rows.forEach(r=>{
    let c=roster.filter(s=>s.student_name===r.name);
    if(c.length>1) c=c.filter(s=>!s.grade || normGrade(s.grade)===g);
    if(c.length>1){ const byNo=c.filter(s=>String(s.student_no||'')===r.num); if(byNo.length===1) c=byNo; }   // 동명이인은 번호로 구분
    if(c.length===1) r.match=c[0];
    else { r.note = c.length ? '동명이인' : (roster.length ? '명단에 없음' : '');
      // 동명이인이 같은 반·같은 담임이면 반·담임만 가져옴 (회원코드는 구분 불가라 비움)
      if(c.length>1 && c.every(s=>s.class_name===c[0].class_name && s.teacher===c[0].teacher)) r.partial={class_name:c[0].class_name, teacher:c[0].teacher||''}; }
  }));
  d.rosterSize=roster.length;
  return d;
}

function matchBranch(v){
  v=String(v??'').trim(); if(BRANCHES.includes(v)) return v;
  const hit=[...BRANCHES].sort((a,b)=>b.length-a.length).find(b=>v.includes(b));  // '서수원'이 '수원'보다 먼저
  return hit||v;
}
async function readSheet(file){
  let wb;
  if(/\.csv$/i.test(file.name)){
    const buf=await file.arrayBuffer(); let text;
    try{ text=new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ text=new TextDecoder('euc-kr').decode(buf); }
    wb=XLSX.read(text.replace(/^﻿/,''),{type:'string'});
  } else wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});
  let hi=aoa.findIndex(r=>r.some(c=>/이름|성명|학생명/.test(String(c)))); if(hi<0) hi=0;
  const header=(aoa[hi]||[]).map(c=>String(c).trim());
  const rows=aoa.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!==''));
  const find=re=>header.findIndex(h=>re.test(h));
  const g1=find(/응시|시험/);
  const code=find(/회원\s*코드|회원\s*번호|코드|code|^id$/i);
  const no=header.findIndex((h,i)=>i!==code && /번호|연락처|전화|휴대/.test(h));
  const sg=g1>=0 ? header.findIndex((h,i)=>i!==g1 && /학년/.test(h) && !/응시|시험/.test(h)) : -1;   // 실제 학년 (응시 학년 열이 따로 있을 때만)
  return {header, rows, map:{code, name:find(/이름|성명|학생명/), cls:find(/반|클래스|class/i), no, grade:g1>=0?g1:find(/학년|레벨/), sgrade:sg, branch:find(/분원|지점|캠퍼스/), teacher:find(/담임|딤임|담당|선생|강사|teacher/i)}};
}
function draftRows(d){

    class_name: cell(r,d.map.cls), student_name: cell(r,d.map.name),

    member_code: cell(r,d.map.code), student_no: cell(r,d.map.no),

    ...(d.map.sgrade>=0 ? {school_grade: (t=>{ const m=t.match(/(고|중|초)[^0-9]*([1-6])/); return m?m[1]+m[2]:t; })(cell(r,d.map.sgrade).replace(/\s/g,''))} : {})   // 실제 학년 열이 있을 때만
  })).filter(x=>x.student_name);
}

    try{ rosterDraft=await readSheet(f); renderDraft(); }catch(err){ alert('파일을 읽지 못했습니다: '+err.message); }
  };
  if(rosterDraft) renderDraft();
}
